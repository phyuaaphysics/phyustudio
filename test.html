
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fundamental Exercise - Lumina Studio</title>
    
    <!-- iOS PWA 狀態列修正 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        :root {
            --mint-deep: #064e3b;
            --mint-primary: #10b981; 
            --mint-bg: #f0fdf4;
            --anim-slow: 1.4s cubic-bezier(0.4, 0, 0.2, 1);
            --anim-item: 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        html, body { 
            height: 100%;
            margin: 0;
            overflow: hidden; 
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .hero-full {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 100;
        }

        #hero-bg {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            filter: saturate(1) brightness(1.1);
            transition: transform var(--anim-slow), filter 0.8s;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.4); 
            z-index: 5;
        }

        /* Lower blur and higher transparency for the main panel */
        .hero-glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            padding: 3.5rem 2.5rem;
            box-shadow: 0 15px 45px -10px rgba(0, 0, 0, 0.04);
            max-width: 90%;
            width: 540px;
            display: flex; flex-direction: column; align-items: center;
            transition: opacity var(--anim-slow), transform var(--anim-slow), visibility var(--anim-slow);
            z-index: 20;
        }

        .hero-content-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding-top: env(safe-area-inset-top);
        }

        .fade-exit-up { 
            opacity: 0;
            transform: translateY(-80px) scale(0.95);
            visibility: hidden; 
        }

        .capsule-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s;
            padding-top: calc(80px + env(safe-area-inset-top));
            padding-bottom: calc(140px + env(safe-area-inset-bottom));
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        .fade-in { opacity: 1; visibility: visible; pointer-events: auto; }

        .capsule-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 85vw;
            pointer-events: auto;
            margin: auto;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .capsule-grid { 
                grid-template-columns: 1fr;
                gap: 16px; 
                width: 85vw; 
                max-width: 340px;
            }
        }

        .hw-capsule {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #1e293b; 
            padding: 18px 28px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 3px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02), inset 0 0 15px rgba(255,255,255,0.1);
            white-space: nowrap;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity var(--anim-item), transform var(--anim-item), background 0.4s, border 0.4s, color 0.4s;
        }

        .hw-capsule.revealed { opacity: 1; transform: translateY(0); }

        .hw-capsule:hover {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transform: translateY(-8px) scale(1.05) !important;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .hw-capsule.back {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--mint-deep);
        }

        #page-loader {
            position: fixed;
            inset: 0; background-color: #ffffff; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }

        .sync-spinning { animation: spin 1s linear infinite; }
        .sync-success { color: #10b981 !important; animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .dock-wrapper {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 25px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 210;
        }

        .dock-nav {
            background-color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            height: 58px; 
            padding: 0 24px;
            border-radius: 40px;
            display: flex; 
            align-items: center;
            gap: 18px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
        }

        .dock-item { color: rgba(0,0,0,0.4); font-size: 1.15rem; transition: 0.4s; cursor: pointer; display: flex; align-items: center; justify-content: center;}
        .dock-item:hover, .dock-item.active { color: var(--mint-deep); transform: scale(1.15); }
        .dock-item.pro-active { color: #10b981; }
        .dock-divider { width: 1px; height: 24px; background: rgba(0,0,0,0.1); margin: 0 4px; flex-shrink: 0; }
        
        #minimized-apps-container { display: flex; align-items: center; gap: 10px; }

        .dock-active-app { 
            position: relative;
            width: 38px; height: 38px; 
            background: rgba(0,0,0,0.05); 
            border-radius: 12px; 
            display: flex; align-items: center; justify-content: center;
            color: #1e293b; font-size: 10px; font-weight: 800;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.05);
            overflow: hidden;
            text-align: center;
            line-height: 1;
            flex-shrink: 0;
        }
        .dock-active-app:hover { transform: translateY(-5px); background: rgba(0,0,0,0.1); }
        .dock-active-app.is-minimized::after {
            content: '';
            position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            width: 3px; height: 3px; background: #64748b; border-radius: 50%;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #1e293b;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.02);
        }

        .glass-btn:hover { 
            background: rgba(255, 255, 255, 0.2); 
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06); 
        }
        .glass-btn:active { transform: scale(0.97); }

        #modal-overlay {
            position: fixed;
            inset: 0; background: rgba(0, 0, 0, 0.08); z-index: 300;
            display: none; opacity: 0; transition: opacity 0.5s ease;
        }

        .modal-window {
            position: fixed;
            top: 50%; left: 50%; width: 85%; height: 75%;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 24px;
            transform: translate(-50%, -50%) scale(0.9);
            box-shadow: 0 30px 90px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
            z-index: 310;
            display: none; opacity: 0; overflow: hidden;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), width 0.4s, height 0.4s, border-radius 0.4s;
            user-select: none;
        }

        .modal-window.open { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal-window.minimized { opacity: 0; transform: translate(-50%, 100%) scale(0.1); pointer-events: none; }
        .modal-window.fullscreen { width: 100vw !important; height: 100vh !important; top: 50% !important; left: 50% !important; border-radius: 0; }

        .window-header {
            padding: 8px 18px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(250, 250, 250, 0.3); border-bottom: 1px solid rgba(0,0,0,0.04);
            cursor: move; height: 48px;
        }

        .window-title { color: #1c1c1e; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; pointer-events: none; }
        .window-controls { display: flex; gap: 8px; }
        .control-btn {
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: center;
            color: #3a3a3c; font-size: 10px; cursor: pointer; transition: 0.2s;
        }
        .control-btn:hover { background: rgba(0,0,0,0.07); }
        .control-btn.close:hover { background: #ff3b30; color: white; }
        .control-btn.minimize:hover { background: #ffcc00; color: white; }

        .window-body { height: calc(100% - 48px); width: 100%; background: transparent; position: relative; overflow-y: auto; }
        .empty-hint { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 200px; color: #9ca3af; font-weight: 500; letter-spacing: 1px; }

        #custom-alert {
            position: fixed;
            top: calc(40px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(30px);
            padding: 14px 28px; border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); z-index: 1000;
            display: flex; align-items: center; gap: 12px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #custom-alert.show { transform: translateX(-50%) translateY(0); }

        #hero-title, #hero-subtitle { color: #1e293b; text-shadow: none; margin-bottom: 1rem; }

        #passcode-screen {
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(70px); -webkit-backdrop-filter: blur(70px);
            z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s;
            padding-bottom: env(safe-area-inset-bottom);
        }
        #passcode-screen.active { opacity: 1; visibility: visible; }
        .passcode-title { color: #1e293b; font-size: 18px; font-weight: 600; letter-spacing: 1px; margin-bottom: 20px; }
        .dots-container { display: flex; gap: 20px; margin-bottom: 60px; }
        .dot { width: 12px; height: 12px; border: 1.5px solid #1e293b; border-radius: 50%; transition: background 0.2s; }
        .dot.filled { background: #1e293b; }
        .dot.error { border-color: #ef4444; background: #ef4444; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; width: 280px; }
        .key {
            width: 75px; height: 75px; border-radius: 50%; background: rgba(0,0,0,0.04);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s; user-select: none;
        }
        .key:active { background: rgba(0,0,0,0.12); }
        .key-num { font-size: 28px; font-weight: 400; color: #1e293b; line-height: 1; }
        .key-letters { font-size: 9px; font-weight: 700; color: #1e293b; letter-spacing: 1px; margin-top: 2px; }
        .passcode-footer { margin-top: 50px; width: 280px; display: flex; justify-content: flex-end; }
        .cancel-btn { color: #1e293b; font-size: 15px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>

    <div id="page-loader">
        <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-16 h-16 mb-4">
        <p class="text-xs tracking-[0.2em] text-gray-400 font-medium uppercase animate-pulse">正在與雲端同步數據...</p>
    </div>

    <!-- Passcode Interface -->
    <div id="passcode-screen">
        <div class="passcode-title">輸入密碼</div>
        <div class="dots-container" id="dots-container">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="keypad">
            <div class="key" onclick="pressKey('1')"><span class="key-num">1</span><span class="key-letters">&nbsp;</span></div>
            <div class="key" onclick="pressKey('2')"><span class="key-num">2</span><span class="key-letters">ABC</span></div>
            <div class="key" onclick="pressKey('3')"><span class="key-num">3</span><span class="key-letters">DEF</span></div>
            <div class="key" onclick="pressKey('4')"><span class="key-num">4</span><span class="key-letters">GHI</span></div>
            <div class="key" onclick="pressKey('5')"><span class="key-num">5</span><span class="key-letters">JKL</span></div>
            <div class="key" onclick="pressKey('6')"><span class="key-num">6</span><span class="key-letters">MNO</span></div>
            <div class="key" onclick="pressKey('7')"><span class="key-num">7</span><span class="key-letters">PQRS</span></div>
            <div class="key" onclick="pressKey('8')"><span class="key-num">8</span><span class="key-letters">TUV</span></div>
            <div class="key" onclick="pressKey('9')"><span class="key-num">9</span><span class="key-letters">WXYZ</span></div>
            <div class="key" style="visibility: hidden;"></div>
            <div class="key" onclick="pressKey('0')"><span class="key-num">0</span><span class="key-letters">&nbsp;</span></div>
            <div class="key" onclick="deleteKey()"><span class="key-num" style="font-size: 18px;"><i class="fas fa-backspace"></i></span></div>
        </div>
        <div class="passcode-footer"><div class="cancel-btn" onclick="hidePasscodeScreen()">取消</div></div>
    </div>

    <div id="custom-alert">
        <i class="fas fa-info-circle text-emerald-500"></i>
        <span id="alert-text" class="text-xs font-bold text-gray-600 uppercase tracking-widest"></span>
    </div>

    <div id="modal-overlay" onclick="closeAllWindows()"></div>
    <div id="window-container"></div>

    <section class="hero-full">
        <img id="hero-bg" src="">
        <div class="hero-overlay"></div>
        <div class="hero-content-wrapper text-center">
            <div id="hero-main-content" class="hero-glass-panel">
                <div class="mb-8 flex flex-col items-center gap-4">
                    <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="Lumina" class="h-14 w-14 drop-shadow-sm">
                    <div class="h-[1px] w-10 bg-emerald-500/20"></div>
                </div>
                <h1 id="hero-title" class="text-3xl md:text-4xl tracking-[0.3em] uppercase" style="font-family: 'Cinzel', serif;"></h1>
                <p id="hero-subtitle" class="text-xl md:text-xl font-bold tracking-[1em] mb-10 uppercase pl-[1em] opacity-80"></p>
                <div class="flex flex-col gap-4">
                    <button onclick="showCapsules()" class="glass-btn px-14 py-4 font-black rounded-full text-[10px] tracking-[0.5em] uppercase shadow-sm transition-all transform active:scale-95">
                        BROWSE ALL
                    </button>
                </div>
            </div>
        </div>
        <div id="hw-capsule-container" class="capsule-container fade-out"><div id="capsule-grid" class="capsule-grid"></div></div>
    </section>

    <div class="dock-wrapper">
        <nav class="dock-nav">
            <div class="dock-item" onclick="showCapsules()"><i class="fas fa-bars"></i></div>
            <div class="dock-item" onclick="manualRefresh()"><i id="cloud-icon" class="fas fa-cloud"></i></div>
            <div class="dock-item" id="dock-pro-lock" onclick="showPasscodeScreen()"><i class="fas fa-lock"></i></div>
            <div id="dock-dyn-divider" class="dock-divider hidden"></div>
            <div id="minimized-apps-container"></div>
        </nav>
    </div>

    <script>
        const SPREADSHEET_ID = '1MeEEF8xVR2Sq-uqqshG-XLnf2hpeoElBNQTJnynP110';
        const FETCH_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=VOL1A`;

        let hwList = [];
        let rawDataRows = [];
        let isSyncing = false;
        let activeWindows = {}; 
        let isProUnlocked = false; 
        let currentPasscode = "";
        let TARGET_PASSCODE = "666666"; 

        async function loadSheetData(isManual = false) {
            if (isSyncing) return;
            isSyncing = true;
            const cloudIcon = document.getElementById('cloud-icon');
            if (isManual) cloudIcon.className = 'fas fa-spinner sync-spinning';
            try {
                const response = await fetch(FETCH_URL);
                const data = await response.text();
                const rows = data.split('\n').map(row => {
                    const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    return matches ? matches.map(m => m.replace(/^"|"$/g, '')) : [];
                });
                rawDataRows = rows;
                const tempHW = new Set();
                rows.forEach(row => {
                    if (row[0] === 'PASSCODE') {
                        TARGET_PASSCODE = row[4] || TARGET_PASSCODE;
                    }
                    if (row[0] === 'HEROSECTION') {
                        if (row[1] === 'CONTENT_1') document.getElementById('hero-title').innerText = row[4];
                        if (row[1] === 'CONTENT_2') document.getElementById('hero-subtitle').innerText = row[4];
                        if (row[1] === 'PHOTO') document.getElementById('hero-bg').src = row[4];
                    } else if (row[0] && row[0].startsWith('HW')) tempHW.add(row[0]);
                });
                hwList = Array.from(tempHW).sort();
                if (isManual) {
                    cloudIcon.className = 'fas fa-check sync-success';
                    setTimeout(() => { cloudIcon.className = 'fas fa-cloud'; isSyncing = false; }, 2000);
                } else {
                    setTimeout(() => {
                        document.getElementById('page-loader').style.opacity = '0';
                        setTimeout(() => { document.getElementById('page-loader').style.display = 'none'; isSyncing = false; }, 1000);
                    }, 800);
                }
            } catch (error) { isSyncing = false; }
        }

        function manualRefresh() { loadSheetData(true); }

        function showCapsules() {
            document.getElementById('hero-main-content').classList.add('fade-exit-up');
            const grid = document.getElementById('capsule-grid');
            grid.innerHTML = '';
            
            hwList.forEach((hw, index) => {
                const btn = document.createElement('div');
                btn.className = 'hw-capsule';
                btn.innerText = hw;
                btn.onclick = () => openHW(hw);
                grid.appendChild(btn);
                setTimeout(() => btn.classList.add('revealed'), 100 + (index * 60));
            });

            const backBtn = document.createElement('div');
            backBtn.className = 'hw-capsule back';
            backBtn.innerHTML = '<i class="fas fa-arrow-left mr-3"></i>BACK';
            backBtn.onclick = hideCapsules;
            grid.appendChild(backBtn);
            setTimeout(() => backBtn.classList.add('revealed'), 100 + ((hwList.length) * 60));

            const container = document.getElementById('hw-capsule-container');
            container.classList.remove('fade-out'); container.classList.add('fade-in');
            document.getElementById('hero-bg').style.transform = 'scale(1.05)';
        }

        function hideCapsules() {
            const container = document.getElementById('hw-capsule-container');
            const capsules = document.querySelectorAll('.hw-capsule');
            capsules.forEach((cap, i) => setTimeout(() => cap.classList.remove('revealed'), (capsules.length - i) * 30));
            setTimeout(() => {
                container.classList.remove('fade-in'); container.classList.add('fade-out');
                document.getElementById('hero-main-content').classList.remove('fade-exit-up');
                document.getElementById('hero-bg').style.transform = 'scale(1)';
            }, 300);
        }

        function showPasscodeScreen() {
            if (isProUnlocked) { showAlert("高級權限已啟用"); return; }
            document.getElementById('passcode-screen').classList.add('active');
            currentPasscode = ""; updatePasscodeDots();
        }

        function hidePasscodeScreen() { document.getElementById('passcode-screen').classList.remove('active'); }

        function pressKey(num) {
            if (currentPasscode.length < 6) {
                currentPasscode += num; updatePasscodeDots();
                if (currentPasscode.length === 6) setTimeout(verifyPasscode, 300);
            }
        }

        function deleteKey() { if (currentPasscode.length > 0) { currentPasscode = currentPasscode.slice(0, -1); updatePasscodeDots(); } }

        function updatePasscodeDots() {
            const dots = document.getElementById('dots-container').children;
            for (let i = 0; i < dots.length; i++) dots[i].className = i < currentPasscode.length ? 'dot filled' : 'dot';
        }

        function verifyPasscode() {
            if (currentPasscode === TARGET_PASSCODE) {
                isProUnlocked = true; 
                showAlert("密碼正確，高級溫習模式啟動");
                document.getElementById('dock-pro-lock').classList.add('pro-active');
                document.getElementById('dock-pro-lock').innerHTML = '<i class="fas fa-unlock"></i>';
                hidePasscodeScreen();
                if (document.getElementById('hw-capsule-container').classList.contains('fade-in')) showCapsules();
            } else {
                const dots = document.getElementById('dots-container').children;
                for (let dot of dots) dot.classList.add('error');
                setTimeout(() => { currentPasscode = ""; updatePasscodeDots(); for (let dot of dots) dot.classList.remove('error'); }, 500);
            }
        }

        function createWinElement(instanceId, title, type = 'HW') {
            const win = document.createElement('div');
            win.id = `win-${instanceId}`;
            win.className = 'modal-window';
            win.innerHTML = `
                <div class="window-header" id="header-${instanceId}">
                    <div class="window-title">${title}</div>
                    <div class="window-controls">
                        <div class="control-btn minimize" onclick="minimizeWindow('${instanceId}')"><i class="fas fa-minus"></i></div>
                        <div class="control-btn" onclick="toggleFullscreen('${instanceId}')"><i class="fas fa-expand-alt"></i></div>
                        <div class="control-btn close" onclick="closeWindow('${instanceId}')"><i class="fas fa-times"></i></div>
                    </div>
                </div>
                <div class="window-body" id="body-${instanceId}" style="${type === 'VID' ? 'background:#000;' : ''}">
                    ${type === 'VID' ? `<iframe id="iframe-${instanceId}" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>` : `<div id="content-${instanceId}" class="w-full h-full flex flex-col p-4 md:p-6 overflow-y-auto"></div>`}
                </div>
            `;
            document.getElementById('window-container').appendChild(win);
            makeDraggable(`win-${instanceId}`, `header-${instanceId}`);
            return win;
        }

        function openHW(hwName) {
            const instanceId = `HW_${hwName}`;
            if (activeWindows[instanceId]) { restoreWindow(instanceId); return; }
            const win = createWinElement(instanceId, hwName, 'HW');
            renderHWContent(hwName, `content-${instanceId}`);
            activeWindows[instanceId] = { minimized: false, title: hwName, type: 'HW' };
            showWin(instanceId);
        }

        function renderHWContent(hwName, containerId) {
            const body = document.getElementById(containerId);
            const hwData = rawDataRows.filter(row => row[0] === hwName);
            if (!hwData.length) { body.innerHTML = `<div class="empty-hint">等待內容更新</div>`; return; }
            const qRow = hwData.find(row => row[1] === 'QUESTION');
            if (qRow && qRow[3] === 'ACTIVE' && qRow[4]) {
                body.innerHTML += `<div class="w-full aspect-video bg-gray-100 rounded-2xl overflow-hidden mb-8"><img src="${qRow[4]}" class="w-full h-full object-cover"></div>`;
            }
            const list = document.createElement('div');
            list.className = 'flex flex-col gap-4';
            hwData.filter(row => row[1] === 'VIDEOS').forEach(row => {
                const tag = row[2] || 'UNIT';
                const isUnlocked = row[3] === 'ACTIVE' || isProUnlocked;
                const videoUrl = row[4] || '';
                const rowEl = document.createElement('div');
                rowEl.className = 'flex items-center justify-between p-4 bg-white/40 backdrop-blur-md rounded-2xl border border-white/60';
                
                // Fixed: More robust external link handling
                const openExternal = () => {
                    if (isUnlocked && videoUrl) window.open(videoUrl, '_blank');
                    else showAlert('解鎖後即可觀看');
                };

                const openInternal = () => {
                    if (isUnlocked && videoUrl) openVideoPlayer(tag, videoUrl);
                    else showAlert('解鎖後即可觀看');
                };

                rowEl.innerHTML = `
                    <div class="flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full bg-emerald-500"></div><span class="text-[11px] font-extrabold text-gray-500 uppercase tracking-widest">${tag}</span></div>
                    <div class="flex items-center gap-3">
                        <button class="w-9 h-9 rounded-full flex items-center justify-center shadow-md ${isUnlocked ? 'bg-white/80 text-emerald-600 border border-white' : 'bg-gray-300 text-gray-500'}" id="ext-${tag.replace(/\s+/g, '')}">
                            <span class="fa-layers fa-fw" style="font-size: 14px;">
                                <i class="fas ${isUnlocked ? 'fa-mobile-alt' : 'fa-lock'}"></i>
                                ${isUnlocked ? '<i class="fas fa-play" style="font-size: 6px; position: absolute; top: 50%; left: 50%; transform: translate(-40%, -50%);"></i>' : ''}
                            </span>
                        </button>
                        <button class="w-9 h-9 rounded-full flex items-center justify-center shadow-md ${isUnlocked ? 'bg-emerald-500 text-white' : 'bg-gray-300 text-gray-500'}" id="int-${tag.replace(/\s+/g, '')}">
                            <i class="fas ${isUnlocked ? 'fa-play ml-0.5' : 'fa-lock'} text-[10px]"></i>
                        </button>
                    </div>`;
                list.appendChild(rowEl);
                body.appendChild(list);
                
                // Assign events after appending to DOM for reliability
                document.getElementById(`ext-${tag.replace(/\s+/g, '')}`).onclick = openExternal;
                document.getElementById(`int-${tag.replace(/\s+/g, '')}`).onclick = openInternal;
            });
        }

        function openVideoPlayer(tag, url) {
            const instanceId = `VID_${tag.replace(/\s+/g, '_')}`;
            if (activeWindows[instanceId]) { restoreWindow(instanceId); return; }
            const win = createWinElement(instanceId, `播放: ${tag}`, 'VID');
            const iframe = document.getElementById(`iframe-${instanceId}`);
            let embed = url.includes('watch?v=') ? url.replace('watch?v=', 'embed/') : url.replace('youtu.be/', 'youtube.com/embed/');
            iframe.src = `${embed}${embed.includes('?') ? '&' : '?'}playsinline=1`;
            activeWindows[instanceId] = { minimized: false, title: tag, type: 'VID' };
            showWin(instanceId);
        }

        function showWin(instanceId) {
            const win = document.getElementById(`win-${instanceId}`);
            document.getElementById('modal-overlay').style.display = 'block';
            win.style.display = 'block';
            setTimeout(() => { document.getElementById('modal-overlay').style.opacity = '1'; win.classList.add('open'); updateDockApps(); }, 10);
        }

        function closeWindow(instanceId) {
            const win = document.getElementById(`win-${instanceId}`);
            win.classList.remove('open'); 
            delete activeWindows[instanceId];
            setTimeout(() => { 
                win.remove(); 
                if (!Object.keys(activeWindows).length) { 
                    document.getElementById('modal-overlay').style.display = 'none'; 
                    document.getElementById('modal-overlay').style.opacity = '0'; 
                } 
                updateDockApps(); 
            }, 500);
        }

        function minimizeWindow(instanceId) {
            document.getElementById(`win-${instanceId}`).classList.add('minimized');
            activeWindows[instanceId].minimized = true; 
            updateDockApps();
            if (Object.values(activeWindows).every(w => w.minimized)) { 
                document.getElementById('modal-overlay').style.opacity = '0'; 
                setTimeout(() => document.getElementById('modal-overlay').style.display = 'none', 500); 
            }
        }

        function restoreWindow(instanceId) {
            activeWindows[instanceId].minimized = false;
            document.getElementById('modal-overlay').style.display = 'block';
            document.getElementById(`win-${instanceId}`).classList.remove('minimized');
            setTimeout(() => { document.getElementById('modal-overlay').style.opacity = '1'; updateDockApps(); }, 10);
        }

        function closeAllWindows() { Object.keys(activeWindows).forEach(id => closeWindow(id)); }

        function updateDockApps() {
            const container = document.getElementById('minimized-apps-container');
            const divider = document.getElementById('dock-dyn-divider');
            container.innerHTML = '';
            const ids = Object.keys(activeWindows);
            ids.length ? divider.classList.remove('hidden') : divider.classList.add('hidden');
            ids.forEach(id => {
                const app = activeWindows[id];
                const btn = document.createElement('div');
                btn.className = 'dock-active-app' + (app.minimized ? ' is-minimized' : ' opacity-50');
                let display = app.title.match(/\d+/) ? app.title.match(/\d+/)[0] : app.title.charAt(0);
                btn.innerHTML = `<span>${display}</span>`;
                btn.onclick = () => restoreWindow(id);
                container.appendChild(btn);
            });
        }

        function toggleFullscreen(instanceId) { document.getElementById(`win-${instanceId}`).classList.toggle('fullscreen'); }
        function showAlert(text) { const alert = document.getElementById('custom-alert'); document.getElementById('alert-text').innerText = text; alert.classList.add('show'); setTimeout(() => alert.classList.remove('show'), 3000); }

        function makeDraggable(winId, headerId) {
            const win = document.getElementById(winId); const header = document.getElementById(headerId);
            let isDragging = false, startX, startY, winL, winT;
            const start = (e) => {
                if (win.classList.contains('fullscreen')) return;
                isDragging = true; win.style.transition = 'none';
                const rect = win.getBoundingClientRect();
                startX = e.clientX || (e.touches ? e.touches[0].clientX : 0); 
                startY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                winL = rect.left + rect.width/2; winT = rect.top + rect.height/2;
                document.onmousemove = move; document.ontouchmove = (ev) => move(ev.touches[0]);
                document.onmouseup = stop; document.ontouchend = stop;
            };
            const move = (e) => { if (isDragging) { win.style.left = (winL + ((e.clientX || (e.touches ? e.touches[0].clientX : 0)) - startX)) + 'px'; win.style.top = (winT + ((e.clientY || (e.touches ? e.touches[0].clientY : 0)) - startY)) + 'px'; } };
            const stop = () => { isDragging = false; win.style.transition = ''; document.onmousemove = null; document.ontouchmove = null; };
            header.onmousedown = start; header.ontouchstart = start;
        }

        document.addEventListener('DOMContentLoaded', () => loadSheetData(false));
    </script>
</body>
</html>
