<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fundamental Exercise - Lumina Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

        :root {
            --mint-deep: #064e3b;
            --mint-primary: #10b981;
            --mint-bg: #f0fdf4;
            --anim-os: 1.2s cubic-bezier(0.25, 1, 0.3, 1);
            --anim-slow: 1.6s cubic-bezier(0.4, 0, 0.2, 1);
            --tab-anim: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            --os-curve: cubic-bezier(0.25, 1, 0.3, 1);
            --os-speed: 0.8s;
        }

        html, body {
            height: 100dvh;
            width: 100%;
            margin: 0;
            overflow: hidden;
            position: fixed;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .hero-full { position: absolute; inset: 0; width: 100%; height: 100dvh; overflow: hidden; z-index: 100; }
        #hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.2) brightness(1.05); transition: transform var(--anim-slow), filter 0.8s; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%); z-index: 5; }
        .hero-glass-panel { 
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px); 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            border-radius: 40px; 
            padding: 3.5rem 2.5rem; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); 
            max-width: 90%; 
            width: 540px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: opacity var(--anim-os), transform var(--anim-os); 
            z-index: 20; 
        }
        .hero-content-wrapper { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; }
        .fade-exit-up { opacity: 0; transform: translateY(-150px) scale(0.9); visibility: hidden; }

        .modal-window { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #fff; transform: translateY(110vh); z-index: 310; display: none; opacity: 0; overflow: hidden; transition: opacity var(--anim-os), transform var(--anim-os); }
        .modal-window.open { display: flex; flex-direction: column; opacity: 1; transform: translateY(0); }
        
        .window-header { padding: 0 12px; display: flex; align-items: center; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; height: 54px; gap: 8px; flex-shrink: 0; }
        .tab-strip { display: flex; align-items: flex-end; gap: 4px; flex: 1; overflow-x: auto; height: 100%; scrollbar-width: none; }
        .browser-tab { height: 38px; min-width: 100px; max-width: 180px; background: #e2e8f0; border-radius: 12px 12px 0 0; display: flex; align-items: center; padding: 0 15px; gap: 8px; cursor: pointer; transition: all var(--tab-anim); position: relative; margin-bottom: -1px; }
        .browser-tab.active { background: #fff; z-index: 2; transform: scale(1.02); }
        .tab-title { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #475569; }

        .window-body { flex: 1; width: 100%; background: #f8fafc; position: relative; overflow: hidden; }
        .win-content-page { display: none; width: 100%; height: 100%; opacity: 0; transform: translateY(10px); transition: opacity 0.5s ease, transform 0.5s ease; }
        .win-content-page.active { display: block; opacity: 1; transform: translateY(0); }

        .lms-classic-layout { display: flex; height: 100%; width: 100%; overflow: hidden; position: relative; }
        
        .lms-sidebar { 
            width: 320px; 
            flex-shrink: 0; 
            border-right: 1px solid #eee; 
            background: #fff; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            transition: width var(--os-speed) var(--os-curve), transform var(--os-speed) var(--os-curve), opacity var(--os-speed) var(--os-curve);
        }
        .lms-sidebar.hidden-os { width: 0; transform: translateX(-50px); opacity: 0; pointer-events: none; }

        .lms-md-reader { 
            width: 0; 
            flex-shrink: 0; 
            background: #fef9c3; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateX(-20px);
            transition: width 0.4s var(--os-curve), transform var(--os-speed) var(--os-curve), opacity var(--os-speed) var(--os-curve);
        }
        .lms-md-reader.active { width: 50%; opacity: 1; transform: translateX(0); border-right: 1px solid rgba(0,0,0,0.05); }

        .lms-width-cycle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            background: rgba(0,0,0,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 50;
        }

        .lms-stage { flex: 1; background: #fff; overflow-y: auto; display: flex; flex-direction: column; }

        .lms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding: 40px; position: relative; z-index: 10; }
        .lms-card { position: relative; height: 200px; border-radius: 20px; overflow: hidden; cursor: pointer; transition: 0.3s; background: #fff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .lms-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .lms-card-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .lms-card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; color: white; }

        .auth-input { width: 100%; background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; outline: none; transition: 0.3s; }

        @media (max-width: 768px) {
            .lms-classic-layout { flex-direction: column; }
            .lms-sidebar { position: absolute; top: 0; left: 0; height: 100%; z-index: 100; width: 100% !important; transform: translateX(0); }
            .lms-sidebar.collapsed-mobile { transform: translateX(-100%); }
            
            .lms-stage { flex: none; height: auto; }
            .lms-md-reader { width: 100% !important; flex: 1; transform: none; border-top: 1px solid rgba(0,0,0,0.05); }
            .lms-md-reader:not(.active) { display: none; }
            .lms-width-cycle-btn { display: none !important; }

            .compact-video-container { margin: 0 !important; border-radius: 0 !important; }
        }

        .sync-spinning { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="page-loader" class="fixed inset-0 bg-white z-[1000] flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-16 h-16 border-4 border-emerald-100 border-t-emerald-500 rounded-full sync-spinning mb-4"></div>
        <p class="text-xs tracking-widest text-gray-400 font-bold uppercase">載入系統中...</p>
    </div>

    <div id="main-browser-window" class="modal-window">
        <div class="window-header">
            <div id="browser-tab-strip" class="tab-strip"></div>
            <div class="flex items-center gap-3 px-4">
                <div class="w-8 h-8 flex items-center justify-center cursor-pointer text-gray-500" onclick="manualRefresh()"><i id="window-cloud-icon" class="fas fa-sync-alt"></i></div>
                <div class="w-8 h-8 flex items-center justify-center cursor-pointer text-gray-500 md:hidden" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
                <div class="w-8 h-8 flex items-center justify-center cursor-pointer text-gray-500" onclick="openHomeFolder()"><i class="fas fa-home"></i></div>
                <div class="w-8 h-8 flex items-center justify-center cursor-pointer text-red-400" onclick="closeAllTabs()"><i class="fas fa-times"></i></div>
            </div>
        </div>
        <div id="browser-window-body" class="window-body"></div>
    </div>

    <section class="hero-full">
        <img id="hero-bg" src="" alt="背景">
        <div class="hero-overlay"></div>
        <div class="hero-content-wrapper">
            <div id="hero-main-content" class="hero-glass-panel">
                <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="h-14 w-14 mb-6" alt="Logo">
                <h1 id="hero-title" class="text-3xl tracking-[0.3em] uppercase mb-2" style="font-family: 'Cinzel', serif;">Lumina</h1>
                <p id="hero-subtitle" class="text-xl font-bold tracking-[0.5em] mb-8 uppercase opacity-80 text-center">數位學習平台</p>
                <div class="w-full">
                    <input type="text" id="auth-username" class="auth-input" placeholder="使用者名稱">
                    <input type="password" id="auth-password" class="auth-input" placeholder="密碼">
                    <div id="auth-error" class="hidden text-red-500 text-xs font-bold text-center mb-4">驗證失敗，請重試</div>
                </div>
                <button id="btn-start" onclick="handleAuth()" class="w-full py-4 rounded-full text-[11px] tracking-[0.3em] font-black uppercase bg-white/30 backdrop-blur-md border border-white/50 hover:bg-white/40 transition-all">進入系統</button>
            </div>
        </div>
    </section>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbw7tpjyEH-gwzBdBjbitfxN4chAF-hm7JAk79ySE_kiywi2uR5m4KQQ9r7oxN0nt8A/exec';
        let openTabs = [];
        let activeTabId = null;
        let courseList = [];
        let catalogBgUrl = "";

        async function fetchWithRetry(url, options = {}, retries = 5, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                return await response.json();
            } catch (error) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw error;
            }
        }

        async function loadSheetData(isManual = false) {
            const syncIcon = document.getElementById('window-cloud-icon');
            if (isManual && syncIcon) syncIcon.classList.add('sync-spinning');
            try {
                const result = await fetchWithRetry(`${GAS_URL}?action=getLand`);
                if (result.result === 'success') {
                    const rows = result.data;
                    courseList = [];
                    rows.forEach(row => {
                        if (row[0] === 'HEROSECTION') {
                            if (row[1] === 'CONTENT_1') document.getElementById('hero-title').innerText = row[4];
                            if (row[1] === 'CONTENT_2') document.getElementById('hero-subtitle').innerText = row[4];
                            if (row[1] === 'PHOTO') document.getElementById('hero-bg').src = row[4];
                        }
                        if (row[0] === 'CATALOG_BG') catalogBgUrl = row[4];
                        if (row[0] && row[0].toString().startsWith('TOPIC')) courseList.push({ id: row[0], title: row[1], image: row[4] });
                    });
                    if (isManual) refreshCurrentView();
                }
            } catch (e) { console.error("Sync Error:", e); } finally {
                if (syncIcon) syncIcon.classList.remove('sync-spinning');
                document.getElementById('page-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('page-loader').classList.add('hidden'), 700);
            }
        }

        async function handleAuth() {
            const user = document.getElementById('auth-username').value;
            const pass = document.getElementById('auth-password').value;
            if(!user || !pass) return;
            try {
                const data = await fetchWithRetry(`${GAS_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
                if(data.result === 'success') openHomeFolder();
                else document.getElementById('auth-error').classList.remove('hidden');
            } catch (e) { document.getElementById('auth-error').classList.remove('hidden'); }
        }

        function openHomeFolder() { openTab("課程目錄", "FOLDER"); }

        function openTab(title, type, topicId = null) {
            const id = topicId || `TAB_${Date.now()}`;
            if (openTabs.find(t => t.id === id)) { switchTab(id); return; }
            const tab = { id, title, type, topicId };
            openTabs.push(tab);
            const page = document.createElement('div');
            page.id = `page-${id}`;
            page.className = 'win-content-page';
            page.innerHTML = `<div id="canvas-${id}" class="h-full w-full"></div>`;
            document.getElementById('browser-window-body').appendChild(page);
            if (type === 'FOLDER') renderGrid(`canvas-${id}`);
            else renderVersionSelector(topicId, title, `canvas-${id}`);
            switchTab(id);
            document.getElementById('hero-main-content').classList.add('fade-exit-up');
            document.getElementById('main-browser-window').style.display = 'flex';
            setTimeout(() => document.getElementById('main-browser-window').classList.add('open'), 50);
        }

        function switchTab(id) {
            activeTabId = id;
            document.querySelectorAll('.win-content-page').forEach(p => { p.classList.remove('active'); p.style.display = 'none'; });
            const activePage = document.getElementById(`page-${id}`);
            activePage.style.display = 'block';
            setTimeout(() => activePage.classList.add('active'), 10);
            renderTabs();
        }

        function renderTabs() {
            const strip = document.getElementById('browser-tab-strip');
            strip.innerHTML = '';
            openTabs.forEach(t => {
                const el = document.createElement('div');
                el.className = `browser-tab ${activeTabId === t.id ? 'active' : ''}`;
                el.onclick = () => switchTab(t.id);
                el.innerHTML = `<i class="fas ${t.type === 'FOLDER' ? 'fa-th' : 'fa-play'} text-[10px] text-emerald-500"></i><span class="tab-title">${t.title}</span><i class="fas fa-times text-[9px] opacity-30 hover:opacity-100 ml-2" onclick="event.stopPropagation(); closeTab('${t.id}')"></i>`;
                strip.appendChild(el);
            });
        }

        function closeTab(id) {
            const idx = openTabs.findIndex(t => t.id === id);
            document.getElementById(`page-${id}`).remove();
            openTabs.splice(idx, 1);
            if (openTabs.length === 0) closeAllTabs();
            else switchTab(openTabs[Math.max(0, idx - 1)].id);
        }

        function closeAllTabs() {
            openTabs = []; activeTabId = null;
            document.getElementById('main-browser-window').classList.remove('open');
            document.getElementById('hero-main-content').classList.remove('fade-exit-up');
            setTimeout(() => { document.getElementById('main-browser-window').style.display = 'none'; document.getElementById('browser-window-body').innerHTML = ''; }, 800);
        }

        function renderGrid(cid) {
            const container = document.getElementById(cid);
            let html = `<div class="h-full overflow-y-auto relative">`;
            if(catalogBgUrl) html += `<img src="${catalogBgUrl}" class="fixed inset-0 w-full h-full object-cover opacity-10 pointer-events-none">`;
            html += `<div class="lms-grid">`;
            courseList.forEach(c => {
                html += `<div class="lms-card" onclick="openTab('${c.title}', 'SELECTOR', '${c.id}')"><img src="${c.image}" class="lms-card-bg" onerror="this.src='https://via.placeholder.com/400x200?text=Course'"><div class="lms-card-overlay"><span class="text-[9px] font-black tracking-widest opacity-60">${c.id}</span><h3 class="font-bold text-lg">${c.title}</h3></div></div>`;
            });
            container.innerHTML = html + `</div></div>`;
        }

        async function renderVersionSelector(tid, title, cid) {
            const container = document.getElementById(cid);
            container.innerHTML = `<div class="flex items-center justify-center h-full text-xs text-gray-400 animate-pulse">正在獲取章節資訊...</div>`;
            try {
                const result = await fetchWithRetry(`${GAS_URL}?action=getTopic&topicId=${tid}`);
                const versions = [...new Set(result.data.slice(1).map(r => r[0]))].filter(v => v && v !== 'VERSION');
                let btns = versions.map(v => `<button onclick="renderLMS('${tid}', '${title}', '${cid}', '${v}')" class="w-full p-4 mb-3 rounded-xl bg-slate-50 border border-slate-100 flex justify-between items-center hover:bg-emerald-500 hover:text-white transition-all font-bold">${v} <i class="fas fa-chevron-right text-[10px]"></i></button>`).join('');
                container.innerHTML = `<div class="flex items-center justify-center h-full p-6"><div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-sm border border-slate-100 text-center"><h2 class="text-2xl font-black mb-2">${title}</h2><p class="text-xs text-gray-400 uppercase tracking-widest mb-8">選擇學習版本</p>${btns}<button onclick="renderGrid('${cid}')" class="mt-4 text-xs text-slate-300 hover:text-slate-500">返回課程目錄</button></div></div>`;
            } catch(e) { container.innerHTML = `<div class="p-10 text-center">無法載入</div>`; }
        }

        async function renderLMS(tid, title, cid, version) {
            const container = document.getElementById(cid);
            try {
                const result = await fetchWithRetry(`${GAS_URL}?action=getTopic&topicId=${tid}`);
                const rows = result.data.filter(r => r[0] === version);
                const sections = {};
                rows.forEach(r => {
                    if(!sections[r[1]]) sections[r[1]] = [];
                    sections[r[1]].push({ topic: r[3], type: r[4].toLowerCase(), content: r[5], md: r[6] || "" });
                });

                let sidebarHtml = '';
                for(let sec in sections) {
                    sidebarHtml += `<div class="px-6 py-3 bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">${sec}</div>`;
                    sections[sec].forEach((item, i) => {
                        sidebarHtml += `<div class="lms-nav-item flex items-center gap-4 px-6 py-4 cursor-pointer hover:bg-emerald-50 transition-colors border-b border-slate-50" onclick="handleItemClick('${tid}', '${item.topic}', '${item.type}', '${item.content}', '${item.md}', this)"><div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-500 text-xs"><i class="fas ${item.type === 'video' ? 'fa-play' : 'fa-image'}"></i></div><div class="text-sm font-bold text-slate-700">${item.topic}</div>${item.md ? '<i class="fas fa-book text-emerald-400 text-[12px] ml-auto"></i>' : ''}</div>`;
                    });
                }

                container.innerHTML = `
                    <div class="lms-classic-layout h-full">
                        <div class="lms-sidebar collapsed-mobile h-full" id="sidebar-${tid}">
                            <div class="p-6 border-b"><div class="text-[9px] font-black text-emerald-500 mb-1 uppercase">${version}</div><div class="text-lg font-black">${title}</div></div>
                            <div class="flex-1 overflow-y-auto">${sidebarHtml}</div>
                        </div>
                        <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
                            <div class="lms-stage" id="stage-${tid}">
                                <div class="flex items-center justify-center h-full text-slate-300">請選擇單元</div>
                            </div>
                            <div class="lms-md-reader" id="md-reader-${tid}">
                                <div class="p-4 border-b border-black/5 flex items-center bg-black/5 relative z-10">
                                    <button onclick="closeMDReader('${tid}')" class="w-8 h-8 rounded-full bg-black/10 flex items-center justify-center hover:bg-black/20 transition-colors"><i class="fas fa-chevron-left text-xs"></i></button>
                                    <span class="ml-4 text-[10px] font-black uppercase tracking-widest opacity-40">筆記內容</span>
                                    <div class="lms-width-cycle-btn" onclick="cycleReaderWidth('${tid}')">
                                        <i class="fas fa-arrows-left-right text-[10px] text-gray-500"></i>
                                    </div>
                                </div>
                                <div class="p-8 flex-1 overflow-y-auto relative z-10" id="md-content-${tid}"></div>
                            </div>
                        </div>
                    </div>
                `;
            } catch(e) { container.innerHTML = `<div class="p-10 text-center">載入錯誤</div>`; }
        }

        function handleItemClick(tid, topic, type, content, mdData, el) {
            updateStage(tid, topic, type, content, el);
            if(mdData) openMDReader(tid, mdData);
            else closeMDReader(tid);
        }

        function cycleReaderWidth(tid) {
            const reader = document.getElementById(`md-reader-${tid}`);
            if (!reader || window.innerWidth <= 768) return;
            const widths = ['33%', '50%', '75%'];
            let currentWidth = reader.style.width || '50%';
            let nextIndex = (widths.indexOf(currentWidth) + 1) % widths.length;
            reader.style.width = widths[nextIndex];
            reader.dataset.lastWidth = widths[nextIndex];
        }

        function openMDReader(tid, mdData) {
            const sidebar = document.getElementById(`sidebar-${tid}`);
            const reader = document.getElementById(`md-reader-${tid}`);
            const content = document.getElementById(`md-content-${tid}`);
            if (!reader) return;

            if (window.innerWidth > 768) {
                if (sidebar) sidebar.classList.add('hidden-os');
                reader.style.width = reader.dataset.lastWidth || '50%';
            } else {
                reader.style.width = '100%';
            }
            reader.classList.add('active');
            content.innerHTML = `<div class="prose prose-slate max-w-none text-sm leading-relaxed">${mdData || '暫無內容'}</div>`;
        }

        function closeMDReader(tid) {
            const sidebar = document.getElementById(`sidebar-${tid}`);
            const reader = document.getElementById(`md-reader-${tid}`);
            if (!reader) return;
            reader.classList.remove('active');
            if (sidebar) sidebar.classList.remove('hidden-os');
            if (window.innerWidth > 768) reader.style.width = '0';
        }

        function updateStage(tid, topic, type, content, el) {
            const stage = document.getElementById(`stage-${tid}`);
            if (!stage) return;
            document.querySelectorAll(`#page-${activeTabId} .lms-nav-item`).forEach(i => i.classList.remove('bg-emerald-50', 'border-emerald-100'));
            el.classList.add('bg-emerald-50', 'border-emerald-100');
            
            if(window.innerWidth <= 768) toggleSidebar();

            let media = '';
            if(type === 'video') {
                const vidId = extractYoutubeId(content);
                media = `<div class="compact-video-container aspect-video bg-black md:rounded-2xl overflow-hidden shadow-2xl md:mb-8"><iframe src="https://www.youtube.com/embed/${vidId}?autoplay=1" class="w-full h-full" frameborder="0" allowfullscreen></iframe></div>`;
            } else {
                media = `<div class="md:rounded-2xl overflow-hidden shadow-lg md:mb-8 border border-slate-100"><img src="${content}" class="w-full h-auto"></div>`;
            }

            // 手機版隱藏標題和描述，直接顯示 Player
            if(window.innerWidth <= 768) {
                stage.innerHTML = `<div class="w-full">${media}</div>`;
            } else {
                stage.innerHTML = `<div class="p-12 max-w-4xl mx-auto w-full">${media}<h2 class="text-3xl font-black text-slate-800 mb-4">${topic}</h2><p class="text-slate-500 leading-relaxed">請根據素材進行學習。</p></div>`;
            }
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('.win-content-page.active .lms-sidebar');
            if(sidebar) sidebar.classList.toggle('collapsed-mobile');
        }

        function extractYoutubeId(url) {
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function manualRefresh() { loadSheetData(true); }
        function refreshCurrentView() { openTabs.forEach(t => { if(t.type === 'FOLDER') renderGrid(`canvas-${t.id}`); }); }
        window.onload = () => loadSheetData();
    </script>
</body>
</html>
