<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fundamental Exercise - Lumina Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- 引入 Markdown 渲染庫 & LaTeX 渲染引擎 (MathJax) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* 保持原有的 UI 視覺設計與動畫 */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        :root {
            --mint-deep: #064e3b;
            --mint-primary: #10b981;
            --mint-bg: #f0fdf4;
            --anim-os: 1.2s cubic-bezier(0.25, 1, 0.3, 1);
            --anim-slow: 1.6s cubic-bezier(0.4, 0, 0.2, 1);
            --tab-anim: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            /* Light Mode Variables */
            --bg-main: #f8fafc;
            --bg-window: #ffffff;
            --bg-header: #f1f5f9;
            --bg-sidebar: #ffffff;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --border-color: #e2e8f0;
        }

        /* Dark Mode Variables */
        .dark {
            --bg-main: #0f172a;
            --bg-window: #1e293b;
            --bg-header: #0f172a;
            --bg-sidebar: #1e293b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border-color: #334155;
        }

        html, body {
            height: 100dvh;
            width: 100%; margin: 0; overflow: hidden; position: fixed;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .hero-full { position: absolute; inset: 0; width: 100%; height: 100dvh; overflow: hidden;
            z-index: 100; }
        #hero-bg { position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; filter: saturate(1.2) brightness(1.05); transition: transform var(--anim-slow), filter 0.8s;
        }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            z-index: 5; }
        .dark .hero-overlay { background: linear-gradient(135deg, rgba(15,23,42,0.6) 0%, rgba(15,23,42,0.3) 100%);
        }
        
        .hero-glass-panel { background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 40px; padding: 3.5rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); max-width: 90%; width: 540px; display: flex; flex-direction: column; align-items: center;
            transition: opacity var(--anim-os), transform var(--anim-os); z-index: 20; }
        .dark .hero-glass-panel { background: rgba(30, 41, 59, 0.4);
            border-color: rgba(255, 255, 255, 0.1); }
        
        .hero-content-wrapper { position: absolute;
            inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; padding-top: env(safe-area-inset-top);
        }
        .fade-exit-up { opacity: 0; transform: translateY(-150px) scale(0.9); visibility: hidden;
        }

        /* Security UI Elements */
        .auth-input { width: 100%;
            background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
            outline: none; font-size: 14px; transition: 0.3s; color: #1e293b; }
        .dark .auth-input { background: rgba(15, 23, 42, 0.3);
            color: #fff; border-color: rgba(255,255,255,0.1); }
        .auth-input:focus { background: rgba(255, 255, 255, 0.6);
            border-color: #10b981; }
        .dark .auth-input:focus { background: rgba(15, 23, 42, 0.6);
        }
        .error-msg { color: #ef4444; font-size: 11px; font-weight: bold; margin-bottom: 10px; display: none;
        }
        
        /* Auth Loading Indicator */
        #auth-loading { display: none;
            align-items: center; gap: 8px; margin-top: 15px; color: #10b981; font-size: 10px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
        }

        /* Window & LMS Layouts */
        .modal-window { position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh; background: var(--bg-window); transform: translateY(110vh); z-index: 310; display: none; opacity: 0; overflow: hidden;
            transition: opacity var(--anim-os), transform var(--anim-os), background-color 0.3s; }
        .modal-window.open { display: flex;
            flex-direction: column; opacity: 1; transform: translateY(0); }
        .window-header { padding: 0 12px;
            display: flex; align-items: center; background: var(--bg-header); border-bottom: 1px solid var(--border-color); height: 54px; gap: 8px; flex-shrink: 0; padding-top: env(safe-area-inset-top); box-sizing: content-box;
            transition: background-color 0.3s, border-color 0.3s; }
        .tab-strip { display: flex; align-items: flex-end;
            gap: 4px; flex: 1; overflow-x: auto; height: 100%; scrollbar-width: none;
        }
        .browser-tab { height: 38px; min-width: 100px; max-width: 180px; background: #e2e8f0;
            border-radius: 12px 12px 0 0; display: flex; align-items: center; padding: 0 15px; gap: 8px; cursor: pointer; transition: all var(--tab-anim);
            position: relative; margin-bottom: -1px; border: 1px solid transparent; }
        .dark .browser-tab { background: #334155;
        }
        .browser-tab.active { background: var(--bg-window); z-index: 2; transform: scale(1.02);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03); }
        .tab-title { font-size: 11px; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); }
        .browser-tab.active .tab-title { color: var(--text-main);
        }
        .tab-close { font-size: 10px; opacity: 0.4; padding: 4px; transition: 0.2s; color: var(--text-dim);
        }
        .window-body { flex: 1; width: 100%; background: var(--bg-main); position: relative; overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom); transition: background-color 0.3s; }
        .win-content-page { display: none; width: 100%;
            height: 100%; opacity: 0; transform: translateY(10px); transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .win-content-page.active { display: block; opacity: 1; transform: translateY(0);
        }
        .toolbar-item { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: var(--text-dim); font-size: 14px; transition: 0.3s; cursor: pointer;
        }
        .toolbar-item:hover { background: rgba(0,0,0,0.05); color: var(--text-main);
        }
        .dark .toolbar-item:hover { background: rgba(255,255,255,0.1);
        }

        /* LMS Elements */
        .lms-classic-layout { display: flex;
            height: 100%; width: 100%; overflow: hidden; background: var(--bg-window); position: relative;
        }
        .lms-sidebar { width: 320px; flex-shrink: 0; border-right: 1px solid var(--border-color); background: var(--bg-sidebar);
            overflow-y: auto; display: flex; flex-direction: column; transition: width 0.3s ease, background-color 0.3s, border-color 0.3s;
        }
        .lms-sidebar-header { padding: 24px; border-bottom: 1px solid var(--border-color);
        }
        .lms-sidebar-header-title { font-size: 18px; font-weight: 800; color: var(--text-main);
        }
        .lms-section-title { padding: 12px 24px; background: var(--bg-header); font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; border-bottom: 1px solid var(--border-color);
        }
        .lms-item-link { padding: 16px 24px; display: flex; align-items: center; gap: 12px;
            cursor: pointer; transition: 0.2s; border-bottom: 1px solid var(--border-color); position: relative; color: var(--text-dim);
        }
        .lms-item-link:hover { background: rgba(0,0,0,0.02);
        }
        .dark .lms-item-link:hover { background: rgba(255,255,255,0.02);
        }
        .lms-item-link.active { background: #ecfdf5; color: #059669;
        }
        .dark .lms-item-link.active { background: rgba(16, 185, 129, 0.1); color: #10b981;
        }
        .lms-item-link.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 4px; background: #10b981; }
        .lms-item-icon { width: 28px; height: 28px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 12px; background: #f1f5f9;
        }
        .dark .lms-item-icon { background: #334155;
        }
        .lms-item-link.active .lms-item-icon { background: #10b981; color: white;
        }
        .lms-stage { flex: 1; background: var(--bg-window); overflow-y: auto; display: flex; flex-direction: column;
            position: relative; transition: background-color 0.3s; }
        .lms-stage-content { max-width: 1100px; margin: 0 auto;
            width: 100%; padding: 40px; }
        .media-box { width: 100%; aspect-ratio: 16/9; background: #000;
            border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1); margin-bottom: 30px;
        }
        .lms-stage-title { font-size: 28px; font-weight: 800; color: var(--text-main); margin-bottom: 8px;
        }

        /* Markdown Reader Elements */
        .markdown-reader-container { display: none;
            width: 50%; height: 100%; background: #fffdf5; border-right: 1px solid #eee6d3; position: relative; flex-direction: column; overflow: visible; color: #3f3324;
        }
        .dark .markdown-reader-container { background: #1f1a14; border-color: #3d3326; color: #f4ead8;
        }
        .markdown-header { height: 50px; background: #fbf3df;
            border-bottom: 1px solid #eee1c8; display: flex; align-items: center; justify-content: space-between; padding: 0 15px;
        }
        .dark .markdown-header { background: #2a2118; border-bottom-color: #3d3326;
        }
        .reader-split-controls { display: none;
        }
        .reader-split-btn { width: 34px; height: 28px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #8a6f46; background: rgba(255,255,255,0.55); border: 1px solid rgba(138,111,70,0.16); transition: 0.2s;
        }
        .reader-split-btn:hover, .reader-split-btn.active { background: #ffffff; color: #10b981; border-color: rgba(16,185,129,0.35);
        }
        .dark .reader-split-btn { color: #d7c6ac; background: rgba(255,255,255,0.06); border-color: rgba(244,234,216,0.12);
        }
        .dark .reader-split-btn:hover, .dark .reader-split-btn.active { background: rgba(16,185,129,0.18); color: #6ee7b7; border-color: rgba(110,231,183,0.35);
        }
        .markdown-body { flex: 1; padding: 30px; overflow-y: auto; scroll-behavior: smooth; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #d8cbb6 transparent;
        }
        .markdown-body::-webkit-scrollbar { width: 8px;
        }
        .markdown-body::-webkit-scrollbar-track { background: transparent;
        }
        .markdown-body::-webkit-scrollbar-thumb { background: #d8cbb6; border-radius: 999px; border: 2px solid transparent; background-clip: content-box;
        }
        .dark .markdown-body { scrollbar-color: #6b5a43 transparent;
        }
        .dark .markdown-body::-webkit-scrollbar-thumb { background: #6b5a43; border: 2px solid transparent; background-clip: content-box;
        }

        /* Markdown 解析排版優化 */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-weight: 800;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .markdown-body h1 { font-size: 1.5rem; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 0.25rem; }
        .markdown-body h2 { font-size: 1.25rem; }
        .markdown-body h3 { font-size: 1.1rem; }
        .markdown-body p { margin-bottom: 1rem; line-height: 1.6; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body code { background: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
        .dark .markdown-body code { background: rgba(255,255,255,0.1); }
        .markdown-body pre { background: rgba(0,0,0,0.05); padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1rem; }
        .dark .markdown-body pre { background: rgba(255,255,255,0.05); }
        .markdown-body blockquote { border-left: 4px solid #10b981; padding-left: 1rem; color: #64748b; margin-bottom: 1rem; }
        .dark .markdown-body blockquote { color: #94a3b8; }
        
        /* 圖片自適應渲染排版 */
        .markdown-body img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 1.5rem auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* Updated Resizer: Guaranteed visibility over both layers */
        .resizer-handle { 
            width: 8px;
            height: 100%; cursor: col-resize; background: transparent; 
            position: absolute; right: -4px; top: 0; z-index: 999;
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 60px; pointer-events: none;
        }
        .resizer-knob {
            width: 48px;
            height: 48px; 
            background: rgba(120, 130, 150, 0.7);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center; 
            color: white; font-size: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(0,0,0,0.05);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s;
            pointer-events: auto;
            flex-shrink: 0;
        }
        .resizer-knob:hover {
            background: rgba(120, 130, 150, 0.9);
            transform: scale(1.1);
        }
        .resizer-knob:active {
            background: #10b981;
            transform: scale(0.95);
        }

        /* Grid & Cards */
        .catalog-container { position: relative;
            width: 100%; height: 100%; overflow-y: auto; }
        .page-bg-img { position: absolute; inset: 0;
            width: 100%; height: 100%; object-fit: cover; opacity: 0.15; pointer-events: none; z-index: 0;
        }
        .dark .page-bg-img { opacity: 0.1;
        }
        .lms-grid { position: relative; z-index: 10; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px; padding: 40px; background: transparent; }
        .lms-card { position: relative; height: 200px;
            border-radius: 25px; overflow: hidden; cursor: pointer; transition: 0.4s; box-shadow: 0 10px 20px rgba(0,0,0,0.05); background: var(--bg-window); border: 1px solid var(--border-color);
        }
        .lms-card:hover { transform: translateY(-5px); box-shadow: 0 20px 30px rgba(0,0,0,0.1);
        }
        .lms-card-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
            transition: 0.8s; }
        .lms-card:hover .lms-card-bg { transform: scale(1.05);
        }
        .lms-card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; color: white;
        }

        /* Loader */
        #page-loader { position: fixed;
            inset: 0; background-color: var(--bg-window); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background-color 0.3s;
        }
        .sync-spinning { animation: spin 1s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg);
        } }

        /* Version Selector */
        .version-selector-container { position: relative;
            height: 100%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; background: transparent;
        }
        .version-card { position: relative; z-index: 10; background: var(--bg-window); border-radius: 30px; padding: 40px;
            width: 100%; max-width: 450px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.05); border: 1px solid var(--border-color); transition: background-color 0.3s, border-color 0.3s;
        }
        .version-btn { width: 100%; padding: 18px; margin-top: 12px; border-radius: 16px; background: var(--bg-header);
            border: 1px solid var(--border-color); font-weight: 700; display: flex; align-items: center; justify-content: space-between; transition: 0.3s; cursor: pointer; color: var(--text-main);
        }
        .version-btn:hover { background: #10b981; color: #fff; transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16,185,129,0.2); }
        .version-btn .badge { font-size: 10px;
            padding: 2px 8px; border-radius: 100px; background: rgba(0,0,0,0.05); }

        @media (max-width: 768px) {
            .lms-classic-layout { flex-direction: column;
            }
            .lms-sidebar { width: 100%; height: 100%; border-right: none;
                border-bottom: 1px solid var(--border-color); }
            .lms-sidebar.collapsed-mobile { height: 60px;
                overflow: hidden; }
            .lms-stage-content { padding: 20px;
            }
            .mobile-back-btn { display: flex; align-items: center; gap: 8px;
                padding: 10px 16px; background: var(--bg-header); color: var(--text-dim); border-radius: 12px; font-size: 11px; font-weight: 800; margin-bottom: 20px; border: 1px solid var(--border-color);
            }
            .markdown-reader-container { width: 100% !important; height: 50%;
                border-bottom: 2px solid #eee1c8; }
            .dark .markdown-reader-container { border-bottom-color: #3d3326;
            }
            .reader-split-controls { display: flex; align-items: center; gap: 6px;
            }
            .resizer-handle { display: none;
            }
        }
    </style>
</head>
<body>

    <div id="page-loader">
        <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-16 h-16 mb-4">
        <p class="text-xs tracking-[0.2em] text-gray-400 font-medium uppercase animate-pulse">Initializing Gatekeeper...</p>
    </div>

    <div id="main-browser-window" class="modal-window">
        <div class="window-header">
            <div id="browser-tab-strip" class="tab-strip"></div>
            <div class="flex items-center gap-3 px-4">
                 <div class="toolbar-item" onclick="manualRefresh()"><i id="window-cloud-icon" class="fas fa-cloud"></i></div>
                <!-- Night Mode Toggle Button -->
                <div class="toolbar-item" onclick="toggleNightMode()">
                    <i id="night-mode-icon" class="fas fa-moon"></i>
                </div>
                <div class="toolbar-item" id="sidebar-toggle-btn" style="display: none;" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
                <div class="toolbar-item" onclick="openHomeFolder()"><i class="fas fa-th-list"></i></div>
                <div class="toolbar-item" onclick="closeAllTabs()"><i class="fas fa-times"></i></div>
            </div>
        </div>
        <div id="browser-window-body" class="window-body"></div>
    </div>

    <section class="hero-full">
        <img id="hero-bg" src="">
        <div class="hero-overlay"></div>
        <div class="hero-content-wrapper">
            <div id="hero-main-content" class="hero-glass-panel">
                <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="h-14 w-14 mb-6">
                <h1 id="hero-title" class="text-3xl tracking-[0.3em] uppercase mb-2" style="font-family: 'Cinzel', serif;">Lumina</h1>
                <p id="hero-subtitle" class="text-xl font-bold tracking-[1em] mb-8 uppercase opacity-80"></p>
          
                <div class="w-full mb-2">
                    <input type="text" id="auth-username" class="auth-input" placeholder="USERNAME">
                    <input type="password" id="auth-password" class="auth-input" placeholder="PASSWORD">
                    <div id="auth-error" class="error-msg text-center">Unauthorized Access</div>
                </div>
    
                <button id="btn-start" onclick="handleAuth()" class="px-12 py-4 rounded-full text-[10px] tracking-[0.5em] font-black uppercase bg-white/20 backdrop-blur-md border border-white/40 shadow-xl active:scale-95 transition-all">
                    START LEARNING
                </button>
                <div id="auth-loading">
                    <i class="fas fa-spinner sync-spinning"></i>
                    <span>Verifying Identity...</span>
                </div>
                <div class="flex items-center gap-4 mt-8">
                    <button onclick="manualRefresh()" class="text-emerald-600/60 hover:text-emerald-600 transition-colors">
                        <i id="hero-cloud-icon" class="fas fa-cloud"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 目標試算表 ID
        const SPREADSHEET_ID = '1hEVxH23xd7dlxizftifdqvxS0mtpnGonL_G8hjkCaXQ';
        
        // 密碼驗證中心 GS 網址（保持不變）
        const AUTH_GAS_URL = 'https://script.google.com/macros/s/AKfycbyDzxZDfiymvnfYGAuW7_ltPvosZjHOhYOL1zAYU0cZhgN7061zK7wbzukAu014muZu/exec';
        
        let openTabs = [];
        let activeTabId = null;
        
        // 優先從本地快取載入舊資料，確保載入期間畫面不會空白
        const cachedData = localStorage.getItem('LUMINA_DATA');
        let courseList = cachedData ? JSON.parse(cachedData) : [];
        let catalogBgUrl = "";
        
        // 輔助函式：逸出單引號防止屬性報錯
        function escapeQuote(str) {
            return str ? str.replace(/\\/g, '\\\\').replace(/'/g, "\\'") : '';
        }

        // 強固型字串清理器：徹底移除一切零寬度空白 (BOM, Zero-width space) 與前後空白，確保 url 判定不會因隱形字元而失敗
        function cleanUrlString(str) {
            if (!str) return '';
            return str.toString()
                .replace(/[\u200B-\u200D\uFEFF]/g, '')
                .trim();
        }

        // 轉換 Google Drive 分享連結為直接可外鏈的影像下載連結
        // （此處保留供 courseList 等其他元件使用）
        function convertDriveUrl(url) {
            const cleaned = cleanUrlString(url);
            if (!cleaned) return '';
            if (cleaned.includes('drive.google.com')) {
                let id = '';
                const fileDMatch = cleaned.match(/\/file\/d\/([^\/]+)/);
                const idParamMatch = cleaned.match(/[?&]id=([^&]+)/);
                if (fileDMatch) {
                    id = fileDMatch[1];
                } else if (idParamMatch) {
                    id = idParamMatch[1];
                }
                if (id) {
                    return `https://docs.google.com/uc?export=download&id=${id}`;
                }
            }
            return cleaned;
        }

        // 智慧 URL 提取器：若輸入值包含 Markdown 或 HTML 格式圖片，將其網址過濾還原為純直鏈
        function extractUrlFromString(str) {
            if (!str) return '';
            const mdMatch = str.match(/!\[.*?\]\((.*?)\)/);
            if (mdMatch && mdMatch[1]) {
                return mdMatch[1].trim();
            }
            const htmlMatch = str.match(/<img\s+[^>]*src=["'](.*?)["']/i);
            if (htmlMatch && htmlMatch[1]) {
                return htmlMatch[1].trim();
            }
            const urlMatch = str.match(/(https?:\/\/[^\s"'()<>]+)/);
            if (urlMatch && urlMatch[1]) {
                return urlMatch[1].trim();
            }
            return str.trim();
        }

        /**
         * 核心：直接從公開 Google 試算表載入特定分頁的純資料 (免 Apps Script 代理)
         * 完美相容：優先讀取格式化顯示值（cell.f），確保如 "2425" 等儲存格內容 100% 正確還原。
         */
        async function fetchSheetRows(sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
            const response = await fetch(url);
            const text = await response.text();
            // 解析 Google GViz API 的 JSONP 回傳格式
            const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
            if (!match) throw new Error("無法解析試算表格式");
            const json = JSON.parse(match[1]);
            
            // 將結構化 JSON 轉換為一維陣列
            return json.table.rows.map(row => {
                if (!row || !row.c) return [];
                return row.c.map(cell => {
                    if (!cell) return '';
                    // 優先使用顯示的格式化值 (cell.f)，若無則使用原始值 (cell.v)
                    if (cell.f !== null && cell.f !== undefined) return cell.f.toString().trim();
                    if (cell.v !== null && cell.v !== undefined) return cell.v.toString().trim();
                    return '';
                });
            });
        }

        async function loadSheetData(isManual = false) {
            const heroCloudIcon = document.getElementById('hero-cloud-icon');
            const windowCloudIcon = document.getElementById('window-cloud-icon');
            const spinClasses = 'fas fa-spinner sync-spinning';
            if (isManual) {
                if(heroCloudIcon) heroCloudIcon.className = spinClasses;
                if(windowCloudIcon) windowCloudIcon.className = spinClasses;
            }
            try {
                // 直接讀取 menu 分頁
                const rows = await fetchSheetRows('menu');
                courseList = [];
                rows.forEach(row => {
                    if (!row || row.length === 0) return;
                    
                    const colA = row[0] ? row[0].toString().trim() : '';
                    const colB = row[1] ? row[1].toString().trim() : '';
                    const colC = row[2] ? row[2].toString().trim() : '';
                    const colD = row[3] ? row[3].toString().trim() : '';
                    const colE = row[4] ? row[4].toString().trim() : '';

                    if (colA.toUpperCase() === 'HEROSECTION') {
                        const val = colE || colD;
                        if (colB === 'CONTENT_1') document.getElementById('hero-title').innerText = val;
                        if (colB === 'CONTENT_2') document.getElementById('hero-subtitle').innerText = val;
                        if (colB === 'PHOTO') document.getElementById('hero-bg').src = convertDriveUrl(val);
                    }
                    if (colA.toUpperCase() === 'CATALOG_BG') { 
                        catalogBgUrl = convertDriveUrl(colE || colD); 
                    }
     
                    if (colA.toUpperCase() === 'MECHANICS') {
                        let imgUrl = colD;
                        if (colE && colE.startsWith('http')) {
                            imgUrl = colE;
                        } else if (colD && colD.startsWith('http')) {
                            imgUrl = colD;
                        } else {
                            imgUrl = colE || colD;
                        }

                        courseList.push({ 
                            id: colB,      // 欄 B: courseid 
                            title: colC,   // 欄 C: topic
                            image: convertDriveUrl(imgUrl)  // 圖片網址
                        });
                    }
                });
                localStorage.setItem('LUMINA_DATA', JSON.stringify(courseList));
                if (isManual) refreshCurrentView();
                setStatusIcon(true);
            } catch (e) { 
                setStatusIcon(false);
            }
            finally {
                document.getElementById('page-loader').style.opacity = '0';
                setTimeout(() => { document.getElementById('page-loader').style.display = 'none'; }, 800);
            }
        }

        async function verifyStoredToken() {
            const savedToken = localStorage.getItem('LUMINA_JWT');
            if (!savedToken) return false;

            const startBtn = document.getElementById('btn-start');
            const loadingEl = document.getElementById('auth-loading');
            if (startBtn) {
                startBtn.innerText = "WAITING...";
                startBtn.disabled = true;
            }
            if (loadingEl) loadingEl.style.display = 'flex';

            try {
                const tokenRes = await fetch(AUTH_GAS_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({
                        token: savedToken
                    })
                });

                const tokenData = await tokenRes.json();
                if (tokenData.success === true) {
                    if (tokenData.identity_tag) {
                        localStorage.setItem('LUMINA_IDENTITY', JSON.stringify(tokenData.identity_tag));
                    }
                    openHomeFolder();
                    return true;
                }
            } catch (e) {
                localStorage.removeItem('LUMINA_JWT');
                localStorage.removeItem('LUMINA_IDENTITY');
            } finally {
                if (startBtn) {
                    startBtn.innerText = "START LEARNING";
                    startBtn.disabled = false;
                }
                if (loadingEl) loadingEl.style.display = 'none';
            }

            localStorage.removeItem('LUMINA_JWT');
            localStorage.removeItem('LUMINA_IDENTITY');
            return false;
        }

        async function handleAuth() {
            const user = document.getElementById('auth-username').value.trim();
            const pass = document.getElementById('auth-password').value.trim();
            const errorEl = document.getElementById('auth-error');
            const startBtn = document.getElementById('btn-start');
            const loadingEl = document.getElementById('auth-loading');
            if (!user || !pass) return;
            
            startBtn.innerText = "WAITING...";
            startBtn.disabled = true;
            errorEl.style.display = 'none';
            loadingEl.style.display = 'flex';
            
            try {
                const loginRes = await fetch(AUTH_GAS_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({
                        username: user,
                        password: pass
                    })
                });
                
                const loginData = await loginRes.json();
                
                if (loginData.success === true) { 
                    localStorage.setItem('LUMINA_JWT', loginData.token);
                    if (loginData.identity_tag) {
                        localStorage.setItem('LUMINA_IDENTITY', JSON.stringify(loginData.identity_tag));
                    }
                    openHomeFolder();
                } else { 
                    errorEl.innerText = loginData.message || "Unauthorized Access";
                    throw new Error(loginData.message || "Invalid credentials");
                }
            } catch (e) {
                errorEl.style.display = 'block';
                document.getElementById('hero-main-content').animate([
                    { transform: 'translateX(0px)' }, 
                    { transform: 'translateX(-10px)' }, 
                    { transform: 'translateX(10px)' }, 
                    { transform: 'translateX(0px)' }
                ], { duration: 300 });
            } finally {
                startBtn.innerText = "START LEARNING";
                startBtn.disabled = false;
                loadingEl.style.display = 'none';
            }
        }

        // 開啟首頁 (目錄)
        function openHomeFolder() { 
            openTab("Course Catalog", "FOLDER");
        }

        function openTab(title, type, topicId = null) {
            const id = topicId || `TAB_${title.replace(/\s/g, '_')}`;
            if (openTabs.find(t => t.id === id)) { switchTab(id); return;
            }
            const tab = { id, title, type, topicId };
            openTabs.push(tab);
            const page = document.createElement('div');
            page.id = `page-${id}`;
            page.className = 'win-content-page';
            page.innerHTML = `<div id="canvas-${id}" class="h-full w-full"></div>`;
            document.getElementById('browser-window-body').appendChild(page);
            if (type === 'FOLDER') renderGrid(`canvas-${id}`);
            else renderVersionSelector(topicId, title, `canvas-${id}`);
            switchTab(id);
            document.getElementById('hero-main-content').classList.add('fade-exit-up');
            document.getElementById('main-browser-window').style.display = 'flex';
            setTimeout(() => document.getElementById('main-browser-window').classList.add('open'), 50);
        }

        // 切換頁籤
        function switchTab(id) {
            activeTabId = id;
            document.querySelectorAll('.win-content-page').forEach(p => {
                if (p.id === `page-${id}`) {
                    p.style.display = 'block';
                    setTimeout(() => p.classList.add('active'), 10);
                } else {
                     p.classList.remove('active');
                    setTimeout(() => { if (!p.classList.contains('active')) p.style.display = 'none'; }, 500);
                }
            });
            const currentTab = openTabs.find(t => t.id === id);
            const toggleBtn = document.getElementById('sidebar-toggle-btn');
            toggleBtn.style.display = (currentTab && (currentTab.type === 'SELECTOR' || currentTab.type === 'FOLDER')) ? 'none' : 'flex';
            renderTabs();
        }

        function renderGrid(cid) {
            let bgHtml = catalogBgUrl ? `<img src="${catalogBgUrl}" class="page-bg-img">` : '';

            courseList.forEach(c => {
                html += `<div class="lms-card" onclick="openTab('${c.title}', 'SELECTOR', '${c.id}')">

                    <div class="lms-card-overlay">

                        <h3 class="font-bold text-lg">${c.title}</h3>
                    </div>
                </div>`;
            });

        async function renderVersionSelector(tid, title, cid) {
            const container = document.getElementById(cid);
            container.innerHTML = `<div class="flex items-center justify-center h-full opacity-30 animate-pulse text-xs uppercase tracking-widest">Identifying Options...</div>`;
            const course = courseList.find(c => c.id === tid);
            const bgHtml = course ? `<img src="${course.image}" class="page-bg-img">` : '';
            try {
                // 直接讀取對應的單獨 CourseID 分頁 (如 MECH01)
                const rows = await fetchSheetRows(tid);
                
                // 分析欄 A (r[0]) 的年份版本，過濾掉標頭和無效空列
                const versions = [...new Set(
                    rows.map(r => r[0] ? r[0].toString().trim() : '')
                        .filter(v => v && v !== 'VERSION' && v !== '年份版本' && v !== 'A' && v !== 'version')
                )].sort();
                
                let versionBtns = '';
                versions.forEach(v => { 
                    // 前端匯出顯示時加上「學年版本」後綴
                    versionBtns += `<div class="version-btn" onclick="renderLMS('${tid}', '${title}', '${cid}', '${v}')"><span>${v}學年版本</span><span class="badge">Open</span></div>`; 
                });
                
                container.innerHTML = `<div class="version-selector-container">${bgHtml}<div class="version-card"><div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6"><i class="fas fa-layer-group"></i></div><h2 class="text-xl font-black text-slate-800 mb-2">${title}</h2><p class="text-xs text-slate-400 uppercase tracking-widest mb-8">Please Select to Continue</p><div class="space-y-3">${versionBtns}</div><button onclick="renderGrid('${cid}')" class="mt-8 text-[10px] font-bold text-slate-300 uppercase hover:text-slate-500 transition-colors">Back to Catalog</button></div></div>`;
            } catch (e) { 
                container.innerHTML = `<div class="p-20 text-center text-xs opacity-40">COULD NOT LOCATE MODULE: ${tid}</div>`;
            }
        }

        async function renderLMS(tid, title, cid, vFilter) {
            const container = document.getElementById(cid);
            container.innerHTML = `<div class="flex items-center justify-center h-full opacity-30 animate-pulse text-xs uppercase tracking-widest">Configuring ${vFilter}學年版本...</div>`;
            try {
                // 直接讀取對應的單獨 CourseID 分頁 (如 MECH01)
                const rows = await fetchSheetRows(tid);
                const sections = {};
                
                // 新型結構：將同樣的 itemId 資料在載入時就進行整合
                const itemsMap = {};
                const itemIdsInOrder = []; // 保留試算表原本的項目排序
                
                // 智慧安全向下繼承追蹤器（防止 A 欄留白導致後續子行無法匯入）
                let lastSeenVersion = '';

                rows.forEach((r, i) => {
                    // 安全過濾非數據行 (如標題行或極短無效行)
                    if (!r || r.length < 3) return;
                    
                    const colA_raw = r[0] ? r[0].toString().trim() : '';
                    const colB_raw = r[1] ? r[1].toString().trim() : '';
                    const colC_raw = r[2] ? r[2].toString().trim() : '';
                    const colE_raw = r[4] ? r[4].toString().trim() : '';

                    // 檢查是否為欄位名稱列 (如果是則直接略過)
                    if (colA_raw.toUpperCase() === 'VERSION' || 
                        colB_raw === '種類' || colB_raw.toUpperCase() === 'TYPE' || 
                        colC_raw === '項目id' || colC_raw.toUpperCase() === 'ITEMID' || 
                        colA_raw === '年份版本') {
                        return;
                    }

                    // 應用向下繼承：若當前行 A 欄為空，則沿用最近一次遇到的有效版本
                    let rowVersion = colA_raw;
                    if (rowVersion) {
                        lastSeenVersion = rowVersion;
                    } else {
                        rowVersion = lastSeenVersion;
                    }

                    // 如果有指定版本過濾器，且不匹配，則略過該行
                    if (vFilter && rowVersion !== vFilter) return;
                    
                    // 欄 B 為種類, 欄 C 為項目id, 欄 D 為 subid, 欄 E 為title, 欄 F 為 md code (或description), 欄 G 為youtube link
                    let itemType = colB_raw.toLowerCase();
                    
                    // 支援：當欄 E（Title）為 'pic' 時，自動視為 'pic' 種類 (若 B 欄本就為 'ebook'，則排除此劫持，以免相片與電子書主體割裂)
                    if (itemType !== 'ebook' && colE_raw.toLowerCase() === 'pic') {
                        itemType = 'pic';
                    }

                    const itemId = colC_raw; 
                    const subId = r[3] ? parseFloat(r[3]) : 0;        
                    const itemTitle = r[4] ? r[4].toString().trim() : itemId; 
                    const itemDesc = r[5] ? r[5].toString().trim() : '';      
                    const itemUrl = r[6] ? r[6].toString().trim() : '';       
                    
                    // 若在 Map 中尚無此項目，進行初始化
                    if (!itemsMap[itemId]) {
                        itemsMap[itemId] = {
                            version: rowVersion,
                            itemId: itemId,
                            type: itemType, // 首選預設種類
                            topic: itemTitle,
                            videoUrl: '',
                            videoDesc: '',
                            subitemsGroup: {}, // 用於儲存各種非影片內容(如 ebook, mc, pic)的子行列表
                            hasVideo: false,
                            hasOther: false,
                            otherType: '',
                            otherUrl: '',
                            otherDesc: ''
                        };
                        itemIdsInOrder.push(itemId);
                    }
                    
                    const item = itemsMap[itemId];
                    if (itemType === 'video') {
                        item.hasVideo = true;
                        item.videoUrl = itemUrl;
                        item.videoDesc = itemDesc;
                        if (itemTitle && itemTitle !== itemId) {
                            item.topic = itemTitle;
                        }
                    } else {
                        // 所有非影片種類 (如 ebook, mc, pdf, pic) 都歸類至對應種類的子群組，全面支援多個 subid 排序與拼接
                        if (!item.subitemsGroup[itemType]) {
                            item.subitemsGroup[itemType] = [];
                        }
                        item.subitemsGroup[itemType].push({
                            subId: subId,
                            mdCode: itemDesc,     // 欄 F (Description / md code / pic url)
                            title: itemTitle,     // 欄 E (Title)
                            content: itemUrl,     // 欄 G (YouTube Link 或其他非影片連結)
                            originalType: colB_raw.toLowerCase() // 記錄原始 B 欄種類以利後續特判
                        });
                    }
                });

                // 按項目順序進行排版與分群
                itemIdsInOrder.forEach(itemId => {
                    const item = itemsMap[itemId];
                    
                    // 處理所有非影片子群組 (如 ebook, mc, pic 等)，依 subid 排序並按順序完美拼接
                    const processedGroups = {};
                    for (const type in item.subitemsGroup) {
                        const subList = item.subitemsGroup[type];
                        
                        // 依照 subId 由小到大排序 (D欄為內容順序)
                        subList.sort((a, b) => a.subId - b.subId);
                        
                        processedGroups[type] = {
                            subitems: subList, // 扁平排列子清單，供閱讀器一口氣循序展示
                            title: subList[0]?.title || item.topic,
                            firstUrl: subList[0]?.content
                        };
                    }
                    
                    // 決定如何將教材加入對應的側邊欄區域
                    if (item.hasVideo) {
                        const secName = '線上影片';
                        if (!sections[secName]) sections[secName] = [];
                        
                        // 當此項目同時擁有影片與其他電子書/測驗/圖片教材時，優雅找出可用於「平行閱讀」的教材內容
                        let hasEbook = false;
                        let ebookTypeLabel = '電子書';
                        let subitems = [];

                        // 優先選擇 ebook，如果沒有則選擇 mc (精選測驗)，再沒有就選 pic (圖片教材)，最後為其他
                        const preferredDocType = Object.keys(processedGroups).find(t => t === 'ebook') || 
                                                 Object.keys(processedGroups).find(t => t === 'mc') || 
                                                 Object.keys(processedGroups).find(t => t === 'pic') ||
                                                 Object.keys(processedGroups)[0];
                        
                        if (preferredDocType) {
                            hasEbook = true;
                            subitems = processedGroups[preferredDocType].subitems;
                            if (preferredDocType === 'mc') ebookTypeLabel = '精選測驗';
                            else if (preferredDocType === 'pic') ebookTypeLabel = '圖片';
                            else ebookTypeLabel = '電子書';
                        }
                        
                        sections[secName].push({
                            version: item.version,
                            itemId: item.itemId,
                            type: 'video',
                            topic: item.topic,
                            description: item.videoDesc,
                            content: item.videoUrl,
                            hasEbook: hasEbook,
                            subitems: subitems,
                            ebookTypeLabel: ebookTypeLabel
                        });
                    } else {
                        // 如果此項目沒有關聯的影片，則直接按各個非影片種類在側邊欄生成對應教材單元
                        for (const type in processedGroups) {
                            const group = processedGroups[type];
                            let secName = '單元項目';
                            if (type === 'ebook') secName = '電子書教材';
                            else if (type === 'mc') secName = '精選測驗';
                            else if (type === 'pic') secName = '圖片教材';
                            
                            if (!sections[secName]) sections[secName] = [];
                            sections[secName].push({
                                version: item.version,
                                itemId: item.itemId,
                                type: type, // ebook, mc, pic, etc.
                                topic: group.title,
                                description: `${type === 'pic' ? '圖片' : type.toUpperCase()} 教材（包含 ${group.subitems.length} 個子頁面）。`,
                                content: type, // 將型態寫入為內容佔位符
                                hasEbook: true,
                                subitems: group.subitems,
                                ebookTypeLabel: type === 'mc' ? '精選測驗' : (type === 'pic' ? '圖片' : '電子書')
                            });
                        }
                    }
                });
                
                let sidebarHtml = ''; let firstItem = null;
                // 初始化全域數據登錄表，清空上一個分頁的資料
                window.lmsItemsRegistry = {};

                for (const sec in sections) {
                    sidebarHtml += `<div class="lms-section-title">${sec}</div>`;
                    sections[sec].forEach((item, idx) => {
                        const itemId = `item_${tid}_${sec.replace(/\s/g, '')}_${idx}`;
                        const registryKey = `${tid}_${sec.replace(/\s/g, '')}_${idx}`;
                        
                        // 註冊單元項目資料至全域物件，避開所有特殊字元或 HTML inline onClick 解析產生的語法錯誤
                        window.lmsItemsRegistry[registryKey] = {
                            topic: item.topic,
                            type: item.type,
                            content: item.content,
                            description: item.description,
                            subitems: item.subitems || [],
                            ebookTypeLabel: item.ebookTypeLabel || ''
                        };

                        if (!firstItem) {
                            firstItem = { ...item, id: itemId, section: sec, registryKey: registryKey };
                        }
                        
                        // 當此項目同時擁有影片與電子書/測驗/圖片時，在側邊欄加入一鍵開啟的平行面板按鈕
                        let ebookBtnHtml = '';
                        if (item.hasEbook && item.type === 'video') {
                            let iconClass = 'fa-book';
                            if (item.ebookTypeLabel === '精選測驗') iconClass = 'fa-clipboard-list';
                            else if (item.ebookTypeLabel === '圖片') iconClass = 'fa-image';

                            ebookBtnHtml = `
                                <button onclick="event.stopPropagation(); openMarkdownReaderParallelFromRegistry('${tid}', '${registryKey}')" 
                                        class="ml-2 w-8 h-8 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-500 dark:hover:text-white transition-all flex items-center justify-center flex-shrink-0"
                                        title="閱讀${item.ebookTypeLabel}">
                                    <i class="fas ${iconClass} text-xs"></i>
                                </button>
                            `;
                        }
                        
                        sidebarHtml += `
                            <div id="btn-${itemId}" class="lms-item-link flex items-center justify-between" 
                                 onclick="handleLmsItemClick('${tid}', '${escapeQuote(sec)}', '${registryKey}', '${itemId}')">
                                <div class="flex items-center gap-3 overflow-hidden flex-1">
                                    <div class="lms-item-icon flex-shrink-0"><i class="fas ${item.type === 'video' ? 'fa-play' : (item.type === 'ebook' ? 'fa-book' : (item.type === 'mc' ? 'fa-clipboard-list' : (item.type === 'pic' ? 'fa-image' : 'fa-file-alt')))}"></i></div>
                                    <div class="overflow-hidden">
                                        <div class="text-[13px] font-bold leading-tight truncate">${item.topic}</div>
                                        <div class="text-[9px] opacity-40 uppercase font-black mt-1">${item.itemId}</div>
                                    </div>
                                </div>
                                ${ebookBtnHtml}
                            </div>
                        `;
                    });
                }
                
                // 在頂部側邊欄標籤內顯示時也套用 formatted 樣式
                container.innerHTML = `<div class="lms-classic-layout">
                    <div class="lms-sidebar" id="sidebar-${tid}"><div class="lms-sidebar-header"><div class="flex justify-between items-center mb-1"><div class="text-[10px] font-black text-emerald-500 uppercase tracking-widest">${tid}</div><div class="text-[9px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-400 font-black">${vFilter}學年版本</div></div><div class="text-lg font-black text-slate-800">${title}</div></div><div class="flex-1">${sidebarHtml}</div><div class="p-4 border-t"><button onclick="renderVersionSelector('${tid}', '${title}', '${cid}')" class="w-full py-2 text-[10px] font-black text-slate-400 uppercase bg-slate-50 rounded-lg">Switch Selection</button></div></div>
                    <div id="md-reader-${tid}" class="markdown-reader-container">
                      <div class="markdown-header"><div class="flex items-center gap-2"><i class="fas fa-book text-yellow-600"></i><span class="text-[10px] font-black uppercase tracking-widest opacity-60">Reading Mode</span></div><div class="flex items-center gap-2"><div class="reader-split-controls"><button class="reader-split-btn" onclick="setReaderSplit('${tid}', 1/3, this)">1/3</button><button class="reader-split-btn active" onclick="setReaderSplit('${tid}', 1/2, this)">1/2</button><button class="reader-split-btn" onclick="setReaderSplit('${tid}', 2/3, this)">2/3</button></div><button onclick="closeMarkdownReader('${tid}')" class="w-8 h-8 flex items-center justify-center hover:bg-yellow-200 rounded-full transition-colors"><i class="fas fa-chevron-left text-xs"></i></button></div></div>
                        <!-- 智慧 Session 頁籤切換器 (一口氣渲染模式中不顯示，保留結構與原本一致) -->
                        <div id="md-tabs-${tid}" class="flex gap-2 px-4 py-2 bg-yellow-100/60 dark:bg-yellow-950/20 border-b border-black/5 overflow-x-auto scrollbar-none" style="display:none;"></div>
                        <div class="markdown-body"><div class="flex flex-col items-center justify-center h-full text-yellow-800/40 uppercase tracking-[0.2em] font-black"><i class="fas fa-file-alt text-4xl mb-4"></i><span>Markdown Content Loader</span><div class="mt-2 text-[8px]" id="md-tag-display-${tid}"></div></div></div>
                        <div class="resizer-handle"><div class="resizer-knob" onmousedown="initMdResize(event, '${tid}')"><i class="fas fa-arrows-alt-h"></i></div></div>
                    </div>
                    <div class="lms-stage" id="stage-${tid}"></div>
                </div>`;
                if (firstItem) updateLMSStage(tid, firstItem.section, firstItem.topic, firstItem.type, firstItem.content, firstItem.id, true, firstItem.description, firstItem.registryKey);
            } catch (e) { 
                container.innerHTML = `<div class="p-20 text-center text-xs opacity-40">ERROR LOADING COURSE: ${tid}</div>`;
            }
        }

        // 登錄表調用：處理列表項目的點擊事件
        function handleLmsItemClick(tid, section, registryKey, itemId) {
            const item = window.lmsItemsRegistry[registryKey];
            if (!item) return;
            updateLMSStage(tid, section, item.topic, item.type, item.content, itemId, false, item.description, registryKey);
        }

        // 登錄表調用：平行閱讀模式的開啟邏輯（不干擾右側已載入/播放中的 YouTube 舞台）
        function openMarkdownReaderParallelFromRegistry(tid, registryKey) {
            openMarkdownReaderParallel(tid, registryKey);
        }

        // 重構後的閱讀模式核心渲染邏輯 (一口氣順序演示)
        function openMarkdownReader(tid, registryKey) {
            const sidebar = document.getElementById(`sidebar-${tid}`);
            const reader = document.getElementById(`md-reader-${tid}`);
            const tagDisplay = document.getElementById(`md-tag-display-${tid}`);
            const item = window.lmsItemsRegistry[registryKey];
            if (!item) return;

            if (sidebar) sidebar.style.width = '0px'; 
            if (reader) { 
                reader.style.display = 'flex';
                if (tagDisplay) tagDisplay.innerText = `${item.ebookTypeLabel || '電子書'} - ${item.topic}`; 
                
                // 隱藏分頁頁籤
                const tabsContainer = document.getElementById(`md-tabs-${tid}`);
                if (tabsContainer) tabsContainer.style.display = 'none';

                const body = reader.querySelector('.markdown-body');
                if (body) {
                    let htmlContent = '';
                    const subitems = item.subitems || [];
                    
                    // 已在載入處按 D 欄 (subId 順序) 進行排序，此處依序連續渲染
                    subitems.forEach((sub, idx) => {
                        const colE = sub.title ? sub.title.toString().trim().toLowerCase() : '';
                        
                        // 判斷是否為圖片展示（當 E 欄為 pic / 圖片 / image / photo 等變體時）
                        const isPicType = (colE === 'pic' || colE === '圖片' || colE === 'image' || colE === 'photo' || colE === 'img' || colE === 'picture' || colE.includes('pic') || colE.includes('img') || colE.includes('圖片'));
                        
                        if (isPicType) {
                            let rawUrl = '';
                            const fCode = sub.mdCode ? sub.mdCode.toString().trim() : '';
                            const gContent = sub.content ? sub.content.toString().trim() : '';

                            if (fCode.includes('http')) {
                                rawUrl = extractUrlFromString(fCode);
                            } else if (gContent.includes('http')) {
                                rawUrl = extractUrlFromString(gContent);
                            } else {
                                rawUrl = extractUrlFromString(fCode || gContent);
                            }

                            const imgUrl = convertDriveUrl(rawUrl);

                            // 判斷 F 欄是否包含說明文字 (若 F 欄不為純 URL，則過濾 URL 及圖片語法後作為圖說渲染)
                            let cleanDescText = fCode;
                            cleanDescText = cleanDescText.replace(/!\[.*?\]\(.*?\)/g, '');
                            cleanDescText = cleanDescText.replace(/<img[^>]*>/ig, '');
                            cleanDescText = cleanDescText.replace(/https?:\/\/[^\s"'()<>]+/g, '');
                            cleanDescText = cleanDescText.trim();

                            const hasDescText = cleanDescText.length > 0;
                            const descHtml = hasDescText ? `<div class="mt-4 p-3 bg-black/5 dark:bg-white/5 rounded-lg text-sm">${typeof marked !== 'undefined' ? marked.parse(cleanDescText) : cleanDescText}</div>` : '';

                            htmlContent += `
                                <div class="pic-render-session mb-6 flex flex-col items-center justify-center p-4 bg-white/40 dark:bg-black/10 rounded-2xl border border-black/5 shadow-inner w-full">
                                    <img src="${imgUrl}" class="max-w-full h-auto rounded-xl shadow-lg border border-black/10 hover:scale-[1.01] transition-transform duration-300" 
                                         onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'; this.onerror=null;" />
                                    ${descHtml}
                                </div>
                            `;
                        } else {
                            // 當 E 欄為 md（或預設其他非圖片文字）時，以 markdown 形式放入內容 (F 欄)
                            const mdCode = sub.mdCode || '';
                            if (mdCode) {
                                htmlContent += `
                                    <div class="md-render-session mb-6 w-full">
                                        ${typeof marked !== 'undefined' ? marked.parse(mdCode) : `<pre style="white-space: pre-wrap;">${mdCode}</pre>`}
                                    </div>
                                `;
                            }
                        }
                    });

                    // 更新容器 HTML
                    body.innerHTML = htmlContent || `<div class="text-center opacity-40 text-xs py-10">尚無教材內容</div>`;

                    // 重新載入 MathJax 動態方程式
                    if (window.MathJax) {
                        MathJax.typesetPromise([body]).catch((err) => console.log("MathJax Error: ", err));
                    }
                }
            }
        }

        // 專門用於平行閱讀模式的開啟邏輯 (復用 openMarkdownReader)
        function openMarkdownReaderParallel(tid, registryKey) {
            openMarkdownReader(tid, registryKey);
        }

        function closeMarkdownReader(tid) {
            const sidebar = document.getElementById(`sidebar-${tid}`);
            const reader = document.getElementById(`md-reader-${tid}`);
            if (sidebar) sidebar.style.width = '320px';
            if (reader) reader.style.display = 'none';
        }

        function setReaderSplit(tid, ratio, btn) {
            const reader = document.getElementById(`md-reader-${tid}`);
            if (!reader || window.innerWidth > 768) return;
            reader.style.height = `${ratio * 100}%`;
            reader.querySelectorAll('.reader-split-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function initMdResize(e, tid) {
            e.preventDefault();
            const reader = document.getElementById(`md-reader-${tid}`);
            const startX = e.clientX;
            const startWidth = reader.offsetWidth;
            document.body.style.cursor = 'col-resize';
            function doDrag(ev) {
                const newWidth = startWidth + (ev.clientX - startX);
                const containerWidth = reader.parentElement.offsetWidth;
                if (newWidth > 150 && newWidth < containerWidth - 100) { reader.style.width = newWidth + 'px';
                }
            }
            function stopDrag() { document.body.style.cursor = '';
            window.removeEventListener('mousemove', doDrag); window.removeEventListener('mouseup', stopDrag); }
            window.addEventListener('mousemove', doDrag);
            window.addEventListener('mouseup', stopDrag);
        }

        // 狀態指示燈
        function setStatusIcon(success) {
            const h = document.getElementById('hero-cloud-icon');
            const w = document.getElementById('window-cloud-icon');
            const col = success ? '#10b981' : '#ef4444';
            if(h) { h.className = success ? 'fas fa-check' : 'fas fa-times'; h.style.color = col; }
            if(w) { w.className = success ? 'fas fa-check' : 'fas fa-times'; w.style.color = col; }
            setTimeout(() => { if(h) { h.className = 'fas fa-cloud'; h.style.color = ""; } if(w) { w.className = 'fas fa-cloud'; w.style.color = ""; } }, 2000);
        }

        function toggleSidebar(forceShow = false) { 
            const activePage = document.querySelector('.win-content-page.active');
            if (!activePage) return;
            const sidebar = activePage.querySelector('.lms-sidebar');
            if (sidebar) { if (forceShow) sidebar.classList.remove('collapsed-mobile'); else sidebar.classList.toggle('collapsed-mobile');
            }
        }

        // 渲染頂部標籤頁
        function renderTabs() {
            const strip = document.getElementById('browser-tab-strip');
            strip.innerHTML = '';
            openTabs.forEach(t => {
                const el = document.createElement('div');
                el.className = `browser-tab ${activeTabId === t.id ? 'active' : ''}`;
                el.onclick = () => switchTab(t.id);
                el.innerHTML = `<i class="fas ${t.type === 'FOLDER' ? 'fa-th' : 'fa-play'} text-[10px] text-emerald-500"></i><span class="tab-title">${t.title}</span><i class="fas fa-times tab-close" onclick="event.stopPropagation(); closeTab('${t.id}')"></i>`;
                strip.appendChild(el);
            });
        }

        function closeTab(id) {
            const idx = openTabs.findIndex(t => t.id === id);
            const targetPage = document.getElementById(`page-${id}`);
            if (targetPage) { targetPage.classList.remove('active'); setTimeout(() => targetPage.remove(), 500);
            }
            openTabs.splice(idx, 1);
            if (openTabs.length === 0) closeAllTabs();
            else switchTab(openTabs[Math.max(0, idx - 1)].id);
        }

        function closeAllTabs() {
            openTabs = [];
            activeTabId = null;
            document.getElementById('main-browser-window').classList.remove('open');
            document.getElementById('hero-main-content').classList.remove('fade-exit-up');
            setTimeout(() => { document.getElementById('main-browser-window').style.display = 'none'; document.getElementById('browser-window-body').innerHTML = ''; }, 800);
        }

        function updateLMSStage(tid, section, topic, type, content, itemId, isInitialLoad = false, description = '', registryKey = '') {
            const stage = document.getElementById(`stage-${tid}`);
            document.querySelectorAll(`.lms-item-link`).forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${itemId}`);
            if (activeBtn) activeBtn.classList.add('active');
            if (window.innerWidth <= 768 && !isInitialLoad) { document.getElementById(`sidebar-${tid}`)?.classList.add('collapsed-mobile');
            }
            
            // 對於獨立無影片關聯的 ebook/mc/pic，一鍵展開左側黃色閱讀器
            if (type === 'ebook' || type === 'mc' || type === 'pic') {
                openMarkdownReader(tid, registryKey);
                
                // 右側主顯示區展示一個優美的導引介面
                stage.innerHTML = `
                    <div class="lms-stage-content">
                        <button class="mobile-back-btn" onclick="toggleSidebar(true)"><i class="fas fa-chevron-left"></i> 返回資源選單</button>
                        <div class="flex flex-col items-center justify-center p-12 bg-emerald-50/50 dark:bg-emerald-950/10 border border-emerald-100/50 dark:border-emerald-900/30 rounded-3xl text-center">
                            <div class="w-16 h-16 bg-emerald-100 dark:bg-emerald-900 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mb-4 text-xl">
                                <i class="fas ${type === 'mc' ? 'fa-clipboard-list' : (type === 'pic' ? 'fa-image' : 'fa-book')}"></i>
                            </div>
                            <h2 class="text-xl font-black text-slate-800 dark:text-slate-100 mb-2">${topic}</h2>
                            <p class="text-xs text-emerald-600 dark:text-emerald-400 font-bold uppercase tracking-widest mb-4">${type === 'mc' ? '測驗' : (type === 'pic' ? '圖片' : '電子書')}閱讀模式已開啟</p>
                            <p class="text-sm text-slate-400 max-w-md">請閱讀左側的黃色電子書面板。您可以拖曳面板間距以調整至最適合您的字體與版面寬度。</p>
                        </div>
                    </div>
                `;
            } else {
                // 若點擊的是單純的影片/或非電子書，自動關閉 Markdown 閱讀器，並還原雙欄
                closeMarkdownReader(tid);
                
                let mediaHtml = type === 'video' ?
                `<div class="media-box"><iframe src="https://www.youtube.com/embed/${extractYoutubeId(content)}?autoplay=${isInitialLoad ? '0' : '1'}" class="w-full h-full" frameborder="0" allow="autoplay; fullscreen"></iframe></div>` : `<div class="media-box bg-white"><img src="${content}" class="w-full h-full object-contain"></div>`;
                let externalButton = type === 'video' ? `<button onclick="window.open('${content}', '_blank')" class="px-3 py-1 rounded bg-slate-100 text-slate-600 hover:bg-emerald-500 hover:text-white transition-all text-[11px] font-black flex items-center gap-1.5"><i class="fas fa-mobile-alt"></i> OPEN IN APP</button>` : '';
                stage.innerHTML = `<div class="lms-stage-content"><button class="mobile-back-btn" onclick="toggleSidebar(true)"><i class="fas fa-chevron-left"></i> 返回資源選單</button>${mediaHtml}<div class="flex items-center justify-between mb-4"><div class="flex items-center gap-2"><span class="text-[10px] font-black bg-slate-100 px-2 py-0.5 rounded text-slate-500 uppercase">${section}</span><span class="text-[10px] font-black bg-emerald-100 px-2 py-0.5 rounded text-emerald-600 uppercase">${type}</span></div>${externalButton}</div><h2 class="lms-stage-title">${topic}</h2><p class="lms-stage-subtitle">${description || 'Focus on the key concepts presented in this session.'}</p></div>`;
            }
            
            stage.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function extractYoutubeId(url) { const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }
        function manualRefresh() { loadSheetData(true);
        }
        function refreshCurrentView() { openTabs.forEach(tab => { if (tab.type === 'FOLDER') renderGrid(`canvas-${tab.id}`); });
        }
        async function initializeApp() {
            await loadSheetData(false);
            await verifyStoredToken();
        }
        window.onload = () => initializeApp();
    </script>
</body>
</html>
