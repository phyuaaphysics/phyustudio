<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumina Studio</title>
    
    <!-- iOS PWA 狀態列修正 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 jsQR 解析庫 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&display=swap');
        :root {
            --glacier-deep: #0f172a;
            --glacier-primary: #0284c7; 
            --glacier-ice: #38bdf8;
            --glacier-bg: #eef2f6;
            --glacier-glass: rgba(224, 242, 254, 0.85); 
            --glacier-nav-glass: rgba(255, 255, 255, 0.75);
        }

        /* ダークモード時の変数定義 */
        body.dark-mode {
            --glacier-deep: #f8fafc;
            --glacier-primary: #38bdf8; 
            --glacier-ice: #0284c7;
            --glacier-bg: #090d16; 
            --glacier-glass: rgba(15, 23, 42, 0.85); 
            --glacier-nav-glass: rgba(15, 23, 42, 0.75);
            color: #cbd5e1;
        }

        /* テーマ切り替え用のトグルスイッチアニメーション */
        #dark-mode-toggle:checked + .theme-track {
            background-color: #1e293b;
            border-color: #0f172a;
        }
        #dark-mode-toggle:checked + .theme-track .theme-stars {
            opacity: 1 !important;
        }
        #dark-mode-toggle:checked + .theme-track .theme-knob {
            transform: translateX(0px) !important;
        }
        #dark-mode-toggle:checked + .theme-track .theme-sun {
            transform: scale(0) !important;
        }
        #dark-mode-toggle:checked + .theme-track .theme-moon {
            transform: scale(1) !important;
        }
        #dark-mode-toggle:checked + .theme-track .theme-cloud {
            transform: translateX(48px) !important;
            opacity: 0 !important;
        }

        /* スムーズなテーマ移行用トランジション */
        body, .logo-bar, .filter-bar, .hero-container-framed, #page-content, .dock-nav, .filter-capsule, .nav-btn, .sync-btn {
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, backdrop-filter 0.4s ease, -webkit-backdrop-filter 0.4s ease;
        }

        /* ダークモード用スタイル修正 */
        body.dark-mode .hero-container-framed {
            background-color: #1e293b;
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .hero-gradient-overlay {
            background: linear-gradient(to bottom, rgba(15,23,42,0) 0%, rgba(15,23,42,0.2) 40%, rgba(9,13,22,0.95) 95%);
        }

        body.dark-mode .filter-capsule {
            background: rgba(30, 41, 59, 0.5);
            border-color: rgba(56, 189, 248, 0.1);
            color: #cbd5e1;
        }

        body.dark-mode .filter-capsule.active {
            background: var(--glacier-primary);
            color: #fff;
            border-color: var(--glacier-primary);
        }

        body.dark-mode .nav-btn {
            background: rgba(30, 41, 59, 0.95);
            border-color: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .sync-btn {
            background: rgba(15, 23, 42, 0.4);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .dock-nav {
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .logo-bar .text-sky-800 {
            color: #38bdf8 !important;
        }

        body.dark-mode .logo-bar .bg-white {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }

        html { 
            scroll-behavior: smooth;
            height: 100%;
            overflow: hidden; 
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--glacier-bg);
            color: #334155;
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            overflow-y: auto;
            padding-top: 0;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none;
        }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none;
        }

        .logo-bar {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 120;
            background-color: var(--glacier-glass);
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(14, 165, 233, 0.1);
            padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
            padding-bottom: 12px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #main-logo {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: left center;
            will-change: transform;
        }

        .scrolled #main-logo { transform: scale(0.75);
        }

        .filter-bar {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 68px);
            left: 0;
            width: 100%;
            z-index: 110;
            background-color: var(--glacier-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-bottom: 1px solid rgba(14, 165, 233, 0.05);
        }

        .filter-bar.collapsed {
            transform: translateY(-56px);
            opacity: 0.9;
        }

        .filter-capsule {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(14, 165, 233, 0.1);
            color: var(--glacier-deep);
        }

        .filter-capsule.active {
            background: var(--glacier-primary);
            color: #fff;
            border-color: var(--glacier-primary);
        }

        .filter-toggle-trigger {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: var(--glacier-glass);
            backdrop-filter: blur(20px);
            border-radius: 0 0 14px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(14, 165, 233, 0.05);
            border-top: none;
            color: var(--glacier-primary);
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .filter-bar.collapsed .filter-toggle-trigger i {
            transform: rotate(180deg);
        }

        /* 検索パネル関連スタイル */
        #search-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.4s ease;
        }
        #search-panel.open {
            max-height: 80px;
            padding-bottom: 12px;
        }

        /* メインコンテンツ配置 */
        #page-content { padding-top: calc(env(safe-area-inset-top, 0px) + 130px);
        }

        .slider-wrapper { position: relative; width: 100%;
        }

        .slider-container { 
            display: flex;
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            gap: 6px; /* 原為 12px / 調整為 6px，使欄與欄的空間更緊密 */
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s, transform 0.2s;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.03);
        }
        
        .slider-wrapper:hover .nav-btn { opacity: 1;
        }
        .nav-btn.prev { left: -12px;
        }
        .nav-btn.next { right: -12px;
        }

        .slider-item { scroll-snap-align: start; flex: 0 0 auto;
        }

        .poster-card { 
            aspect-ratio: 2/3;
            border-radius: 6px; overflow: hidden; background: #cbd5e1; 
            position: relative; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 12px -4px rgba(15, 23, 42, 0.05);
            will-change: transform;
        }

        .poster-card:active {
            transform: scale(0.94);
            filter: brightness(0.9);
        }

        /* 網格緊密無圓角、無間隙覆寫樣式 */
        .grid-tight-pack .poster-card {
            border-radius: 0px !important;
            border: none !important;
            box-shadow: none !important;
        }

        .hero-container-framed {
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.1);
            overflow: hidden; position: relative; background-color: #fff;
            transition: all 0.4s ease;
        }

        .hero-gradient-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 40%, rgba(238,242,246,0.9) 95%);
            pointer-events: none;
        }

        .section-hidden { display: none !important;
        }

        .dock-wrapper {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
            width: auto;
            min-width: 340px;
        }

        .dock-wrapper.collapsed { transform: translateX(-50%) translateY(200px); opacity: 0;
        }

        .dock-nav {
            background-color: var(--glacier-nav-glass);
            backdrop-filter: blur(28px) saturate(210%);
            -webkit-backdrop-filter: blur(28px) saturate(210%);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            padding: 12px 14px;
            border-radius: 42px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
            display: flex; align-items: center; justify-content: center; gap: 14px;
        }

        .dock-toggle-btn {
            width: 32px;
            height: 32px; display: flex; align-items: center; justify-content: center;
            color: #94a3b8; cursor: pointer; font-size: 14px; transition: color 0.3s;
        }

        .dock-content { display: flex; align-items: center; gap: 14px;
        }

        .dock-item {
            display: flex;
            flex-direction: column; align-items: center; gap: 5px;
            color: #94a3b8; transition: all 0.3s; min-width: 58px;
        }

        .dock-item i { font-size: 1.6rem;
        }
        .dock-item span { font-size: 9px; font-weight: 500; opacity: 0.7;
        }
        .dock-item.active { color: var(--glacier-primary);
        }

        .dock-trigger-bar {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 5px;
            background: rgba(15, 23, 42, 0.2);
            border-radius: 10px;
            z-index: 199; cursor: pointer; display: none;
        }
        .dock-wrapper.collapsed + .dock-trigger-bar { display: block;
        }

        .section-title { font-size: 1.15rem; font-weight: 800; color: var(--glacier-deep); margin-bottom: 8px;
        }

        /* 同期ボタンのスタイリング */
        .sync-btn {
            position: absolute;
            right: 24px;
            bottom: 24px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 18px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .sync-btn:hover { background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px); }
        .sync-btn:active { transform: scale(0.95);
        }
        .sync-btn.loading i { animation: spin 1s linear infinite;
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg);
        } }

        /* ロードアニメーション */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 12px;
            color: var(--glacier-primary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* Windows 風格 Modal */
        .win-modal {
            background: rgba(243, 243, 243, 0.98);
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }
        .win-titlebar {
            background: linear-gradient(180deg, #f0f0f0 0%, #e1e1e1 100%);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        body.dark-mode .win-modal {
            background: rgba(30, 30, 30, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e5e7eb;
        }
        body.dark-mode .win-titlebar {
            background: linear-gradient(180deg, #2d2d2d 0%, #252525 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .win-btn {
            background: linear-gradient(180deg, #fafafa 0%, #e8e8e8 100%);
            border: 1px solid rgba(0, 0, 0, 0.2);
            transition: all 0.15s;
        }
        .win-btn:hover {
            background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 100%);
            border-color: rgba(0, 0, 0, 0.3);
        }
        .win-btn:active { transform: translateY(1px); }
        body.dark-mode .win-btn {
            background: linear-gradient(180deg, #3a3a3a 0%, #2c2c2c 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e5e7eb;
        }
        body.dark-mode .win-btn:hover {
            background: linear-gradient(180deg, #454545 0%, #353535 100%);
        }

        /* 漸進式瀑布流（Staggered Fade & Rise）卡片登場動畫 - 物理阻尼微彈效果 */
        @keyframes fadeRise {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-rise {
            opacity: 0;
            animation: fadeRise 1.1s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
            animation-delay: calc(var(--row-m) * 0.08s);
        }
        @media (min-width: 768px) {
            .animate-fade-rise {
                animation-delay: calc(var(--row-d) * 0.08s);
            }
        }

        /* QRスキャナーエフェクト */
        @keyframes qr-scan-line {
            0% { transform: translateY(-130px);
            }
            50% { transform: translateY(130px);
            }
            100% { transform: translateY(-130px);
            }
        }

        @media (max-width: 768px) {
            .hero-container-framed { border-radius: 0;
            }
            .dock-wrapper { width: 92%; max-width: 400px;
            }
            #page-content { padding-top: calc(env(safe-area-inset-top, 0px) + 120px);
            }
            .nav-btn { display: none !important;
            }
            .sync-btn { right: 16px; bottom: 16px;
            padding: 8px 14px; }
        }
    </style>
</head>
<body class="pb-40 hide-scrollbar">

    <header id="header-root">
        <div class="logo-bar px-6" id="logo-nav-bar"> 
            <div class="max-w-screen-2xl mx-auto flex items-center justify-between">
                <div class="cursor-pointer" onclick="scrollToHome()" id="main-logo">
                    <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="Lumina" class="h-12 w-auto">
                </div>
                
                <!-- 控制按鈕與日夜切換開關 -->
                <div class="flex items-center gap-4 md:gap-6">
                    
                    <!-- 日夜切換開關 -->
                    <div class="flex items-center">
                        <label class="relative inline-flex items-center cursor-pointer select-none scale-90 md:scale-100">
                            <input type="checkbox" id="dark-mode-toggle" class="sr-only" onchange="toggleTheme(this.checked)">
  
                            <!-- Pill Track -->
                            <div class="theme-track w-[72px] h-[38px] bg-[#93c5fd] rounded-full relative transition-all duration-500 overflow-hidden shadow-inner border-2 border-[#60a5fa]">
                               
                                <!-- 星空背景 (夜間模式專用) -->
                                <div class="theme-stars absolute inset-0 opacity-0 transition-opacity duration-500 pointer-events-none">
                      
                                    <!-- Tiny Star 1 -->
                                    <svg class="absolute w-2 h-2 text-slate-300 top-2 right-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.136 9.21l8.2-1.192z"/></svg>
                       
                                    <!-- Tiny Star 2 -->
                                    <svg class="absolute w-1.5 h-1.5 text-slate-400 top-6 right-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.136 9.21l8.2-1.192z"/></svg>
                        
                                    <!-- Tiny Star 3 -->
                                    <svg class="absolute w-1.5 h-1.5 text-slate-300 top-4 right-10" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.136 9.21l8.2-1.192z"/></svg>
                         
                                    <!-- Tiny Star 4 -->
                                    <svg class="absolute w-1.5 h-1.5 text-slate-400 bottom-2 right-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.787 1.4 8.168L12 18.896l-7.334 3.857 1.4-8.168L.136 9.21l8.2-1.192z"/></svg>
                                </div>

                                <!-- 太陽/月亮滑塊 -->
                                <div class="theme-knob absolute top-[2px] left-[2px] w-[30px] h-[30px] rounded-full transition-all duration-500 transform translate-x-[36px] flex items-center justify-center z-10">
          
                                    <!-- 太陽 (日間模式) -->
                                    <div class="theme-sun absolute inset-0 bg-[#fde047] border-2 border-[#eab308] rounded-full transition-all duration-500 scale-100 shadow-[0_0_8px_rgba(253,224,71,0.6)]"></div>
                     
                                    <!-- 月亮 (夜間模式) -->
                                    <div class="theme-moon absolute inset-0 bg-[#cbd5e1] border-2 border-[#94a3b8] rounded-full transition-all duration-500 scale-0 flex items-center justify-center overflow-hidden">
                             
                                        <!-- 月面隕石坑 -->
                                        <div class="absolute w-1.5 h-1.5 bg-[#94a3b8] rounded-full top-1.5 left-2.5 opacity-60"></div>
                                      
                                        <div class="absolute w-2.5 h-2.5 bg-[#94a3b8] rounded-full bottom-1 right-2 opacity-60"></div>
                                        <div class="absolute w-1.5 h-1.5 bg-[#94a3b8] rounded-full top-3 right-1.5 opacity-60"></div>
                                        <div class="absolute w-1.5 h-1 bg-[#94a3b8] rounded-full bottom-3 left-1 opacity-40"></div>
                                    </div>
                                </div>

                                <!-- 雲朵 (日間模式背景裝飾) -->
                                <div class="theme-cloud absolute bottom-[-1px] left-2 transition-all duration-500 transform translate-x-0 z-20 pointer-events-none">
                                    <svg class="w-[32px] h-[20px]" viewBox="0 0 24 16" fill="white" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
                                    </svg>
                                </div>

                            </div>
                        </label>
                    </div>

                    <!-- 格狀排版切換 Icon：已更換為 fa-border-all (放置於開關與搜尋放大鏡之間) -->
                    <div class="flex items-center text-sky-800 opacity-60 hover:opacity-100 transition-opacity">
                        <i id="grid-view-toggle" class="fas fa-border-all text-xl cursor-pointer" onclick="toggleGridView()"></i>
                    </div>

                    <div class="flex items-center gap-6 text-sky-800 opacity-60">
                        <i class="fas fa-search text-xl cursor-pointer" onclick="toggleSearchInput()"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="filter-bar px-6" id="filter-bar">
            <!-- 搜尋面板，包含輸入框與清除按鈕 -->
            <div id="search-panel" class="max-w-screen-2xl mx-auto px-1">
                <div class="relative w-full">
                    <input type="text" id="tag-search-input" oninput="handleSearch(this.value)" placeholder="輸入關鍵字以標籤 (Tag) 篩選相關卡片..." class="w-full bg-white/60 dark:bg-slate-800/60 border border-sky-400/30 rounded-full py-2 px-10 text-sm focus:outline-none focus:border-sky-500 transition-colors dark:text-slate-200">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <button onclick="clearSearch()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-500 transition-colors">

    <script>
        // 安全 LocalStorage 沙盒防禦封裝物件
        const storage = {
            getItem(key) {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    console.warn("Storage read blocked:", e);
                    return null;
                }
            },
            setItem(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    console.warn("Storage write blocked:", e);
                }
            },
            removeItem(key) {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    console.warn("Storage remove blocked:", e);
                }
            }
        };

        // Google Sheet CSV URL (針對 FRONT_NEW 分頁)
        const SPREADSHEET_ID = '1Xfl7-SvKai2j6rg1ZnICJFENaLOSurD0Tg_OIO_PTGU';
        // FRONT_NEW 核心分頁預設 GID
        const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=442351806`;

        let rawData = [];
        let lastScrollY = window.scrollY;
        
        // QRスキャナー関連の変数
        let qrStream = null;
        let qrAnimationId = null;
        
        // フィルターおよび検索ステータス
        let currentFilter = 'all';
        let searchQuery = '';
        
        // 全域網格排版 (Grid View) 狀態旗標
        let isGridView = false;

        // 日夜モード切り替え処理
        function toggleTheme(isDark) {
            if (isDark) {
                document.body.classList.add('dark-mode');
                storage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                storage.setItem('theme', 'light');
            }
        }

        // 読み込み時に初期テーマを適用 (安全沙盒相容)
        (function() {
            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem('theme');
            } catch (e) {
                console.warn("Theme storage access denied", e);
            }
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);
            
            if (isDark) {
                document.body.classList.add('dark-mode');
                document.addEventListener('DOMContentLoaded', () => {
                    const toggleInput = document.getElementById('dark-mode-toggle');
                    if (toggleInput) toggleInput.checked = true;
                });
            }
        })();

        // 優化後的載入流程：先用 localstorage 匯出第一瞬資料（Cache-First），然後才在背景檢查版本數目是否改變
        async function initData() {
            // 1. 第一瞬：立即載入並渲染 LocalStorage 快取，讓用戶秒開
            const cachedVer = storage.getItem('lumina_data_ver');
            const cachedData = storage.getItem('lumina_data_payload');
            let hasRenderedCache = false;

            if (cachedData) {
                try {
                    rawData = JSON.parse(cachedData);
                    if (rawData && rawData.length > 0) {
                        console.log("第一瞬載入：已從 LocalStorage 恢復快取數據，版本號:", cachedVer);
                        renderFilters();
                        renderContent();
                        hasRenderedCache = true;
                    }
                } catch (jsonErr) {
                    console.warn("LocalStorage 快取受損，清理重設:", jsonErr);
                    storage.removeItem('lumina_data_ver');
                    storage.removeItem('lumina_data_payload');
                }
            }

            // 2. 第二步：在背景發起網路請求，確認線上版本是否改變
            try {
                let csvText = '';
                let response;
                
                // 第一嘗試階段：使用預設標準 GID 連結
                try {
                    response = await fetch(`${SHEET_CSV_URL}&cachebust=${Date.now()}&t=${Date.now()}`);
                    csvText = await response.text();
                    
                    // 偵測是否返回 HTML 登入牆 or 404 (Google Sheets 常見拒絕連線網頁)
                    if (csvText.trim().startsWith('<!DOCTYPE html') || csvText.trim().startsWith('<html')) {
                        throw new Error("返回格式非 CSV (可能是 GID 無效或需要權限設定)");
                    }
                } catch (firstErr) {
                    console.warn("標準 GID 導出失敗，啟動備用分頁名稱解析器 (FRONT_NEW):", firstErr);
                    
                    // 第二後備階段：使用 Google Visualization API 依「分頁名稱」拉取，防禦 GID 被使用者重建變更
                    const fallbackUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=FRONT_NEW&cachebust=${Date.now()}`;
                    response = await fetch(fallbackUrl);
                    csvText = await response.text();
                    
                    if (csvText.trim().startsWith('<!DOCTYPE html') || csvText.trim().startsWith('<html')) {
                        throw new Error("備用管道仍返回網頁 HTML (請確定試算表權限已設定為『知道連結的任何人均可檢視』)");
                    }
                }
                
                const lines = parseCSVRows(csvText);
                
                if (lines.length > 1) {
                    // C2 (row[1][2]) 取得版本號
                    const currentOnlineVer = (lines[1][2] || '').trim();

                    // 判斷：線上版本號改變，或是先前未能成功渲染快取
                    if (currentOnlineVer !== cachedVer || !hasRenderedCache) {
                        console.log("偵測到線上版本改變或無快取，正在背景重新匯入最新數據...", "舊版本:", cachedVer, "新版本:", currentOnlineVer);
                        rawData = processRawRows(lines);

                        // 重新寫入快取
                        storage.setItem('lumina_data_ver', currentOnlineVer);
                        storage.setItem('lumina_data_payload', JSON.stringify(rawData));

                        // 更新渲染畫面
                        renderFilters();
                        renderContent();
                    } else {
                        console.log("背景版本檢查完成：線上版本與快取一致 (", cachedVer, ")，無須更新。");
                    }
                }
            } catch (error) {
                console.error("背景同步失敗:", error);
                // 若一開始沒能加載快取（新安裝用戶），且背景更新也失敗，則顯示錯誤提示
                if (!hasRenderedCache) {
                    document.getElementById('main-content-area').innerHTML = `<div class="loader">載入失敗，請確認試算表分享權限並保持網路連線。</div>`;
                }
            }
        }

        // 手動同期ボタン用
        async function manualSync() {
            const btn = document.getElementById('sync-button');
            btn.classList.add('loading');
            btn.querySelector('span').innerText = '同步中...';
            
            storage.removeItem('lumina_data_ver');
            storage.removeItem('lumina_data_payload');
            
            await initData();
            
            setTimeout(() => {
                btn.classList.remove('loading');
                btn.querySelector('span').innerText = '與雲端同步';
            }, 800);
        }

        // CSV 行分割パーサー
        function parseCSVRows(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') {
                lines.push(row);
            }
            return lines;
        }

        // FRONT_NEW 分頁欄位映射
        // A=row[0]: order, B=row[1]: id, C=row[2]: type, D=row[3]: cn, E=row[4]: en
        // F=row[5]: section, G=row[6]: size_hint, H=row[7]: bg/img, I=row[8]: link/url
        // J=row[9]: quote_text, K=row[10]: quote_author, L=row[11]: active
        function processRawRows(lines) {
            return lines
                .filter((row, idx) => {
                    if (idx <= 1) return false; // 跳過標題列(0)及版本列(1)
                    const type = (row[2] || '').trim().toLowerCase();
                    const active = (row[11] || '').trim().toLowerCase();
                    // 只取 active=TRUE 且 type 有效的列
                    return active === 'true' && ['head', 'hero', 'oldsys', 'coursesys', 'mathsys'].includes(type);
                })
                .map(row => ({
                    type: (row[2] || '').trim(),
                    cn: (row[3] || '').trim(),
                    en: (row[4] || '').trim(),
                    section: (row[5] || '').trim(),
                    sizeHint: (row[6] || '').trim(),
                    img: (row[7] || '').trim(),
                    url: (row[8] || '').trim()
                }));
        }

        // フィルターボタンレンダリング (以 section 分組)
        function renderFilters() {
            // 從 hero 類型中提取不重複的 section
            const sections = ['all', ...new Set(rawData
                .filter(d => d.type === 'hero' && d.section)
                .map(d => d.section))];
            const container = document.getElementById('filter-container');
            container.innerHTML = sections.map(f => `
                <button class="filter-capsule ${f === currentFilter ? 'active' : ''}" 
                        data-filter="${f}" 
                        onclick="setFilter('${f}')">
                    ${f === 'all' ? '全部' : f}
                </button>
            `).join('');
        }

        // 關閉/開啟格狀網格排版 (Grid View) 狀態
        function toggleGridView() {
            isGridView = !isGridView;
            const btn = document.getElementById('grid-view-toggle');
            if (isGridView) {
                btn.classList.add('text-sky-500');
                btn.classList.remove('opacity-60');
            } else {
                btn.classList.remove('text-sky-500');
                btn.classList.add('opacity-60');
            }
            renderContent();
        }

        // 動態渲染 Hero 區塊 (根據 type=head 的資料：H=圖片，I=連結；D=中文標題；E=英文標題)
        function renderHero() {
            const headRow = rawData.find(d => d.type === 'head');
            if (!headRow) return;
            const bgImg = document.getElementById('hero-bg-img');
            const startBtn = document.getElementById('hero-start-btn');
            const titleCn = document.getElementById('hero-title-cn');
            const titleEn = document.getElementById('hero-title-en');
            if (bgImg && headRow.img) bgImg.src = headRow.img;
            if (startBtn && headRow.url) startBtn.onclick = () => handleNavigation(headRow.url);
            if (titleCn && headRow.cn) titleCn.textContent = headRow.cn;
            if (titleEn && headRow.en) titleEn.textContent = headRow.en;
        }

        // 開啟 Hero 詳細說明 (Windows 風格 Modal)
        function openHeroDetail() {
            const modal = document.getElementById('hero-detail-modal');
            if (modal) modal.classList.remove('pointer-events-none', 'opacity-0');
        }

        function closeHeroDetail() {
            const modal = document.getElementById('hero-detail-modal');
            if (modal) modal.classList.add('pointer-events-none', 'opacity-0');
        }

        // コンテンツレンダリング (使用 FRONT_NEW type 邏輯)
        function renderContent() {
            const mainArea = document.getElementById('main-content-area');
            mainArea.innerHTML = '';

            const heroSection = document.getElementById('hero-section');
            const archiveSection = document.getElementById('sec-archive');

            // 渲染 Hero 動態內容
            renderHero();

            // 過濾 hero 類型的卡片（排除 head/quote）
            let heroItems = rawData.filter(d => d.type === 'hero');

            // 分類篩選 (section)
            if (currentFilter !== 'all') {
                heroItems = heroItems.filter(item => item.section === currentFilter);
            }

            // 標籤篩選 (cn)
            if (searchQuery.trim() !== '') {
                const query = searchQuery.toLowerCase().trim();
                heroItems = heroItems.filter(item => item.cn && item.cn.toLowerCase().includes(query));
            }

            // Grid View 模式
            if (isGridView) {
                heroSection.classList.add('section-hidden');
                archiveSection.classList.add('section-hidden');

                if (heroItems.length === 0) {
                    mainArea.innerHTML = `<div class="loader">找不到符合該標籤的相關卡片。</div>`;
                    return;
                }

                const gridHtml = `
                    <section class="max-w-screen-2xl mx-auto py-4">
                        <div class="grid grid-cols-3 md:grid-cols-6 gap-0 grid-tight-pack">
                            ${heroItems.map((item, index) => {
                                const rowMobile = Math.floor(index / 3);
                                const rowDesktop = Math.floor(index / 6);
                                return `
                                <div class="cursor-pointer animate-fade-rise" style="--row-m: ${rowMobile}; --row-d: ${rowDesktop};" onclick="handleNavigation('${item.url}')">
                                    <div class="poster-card" title="${item.cn || ''}">
                                        <img src="${item.img}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                                        ${item.section ? `<span class="absolute top-2 right-2 px-2 py-0.5 bg-black/50 backdrop-blur-sm text-white text-[10px] font-semibold rounded-full" style="font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em;">${item.section}</span>` : ''}
                                        <div class="absolute bottom-0 left-0 right-0 p-2 md:p-3 bg-gradient-to-t from-black/80 via-black/40 to-transparent">
                                            <p class="text-white font-black leading-tight drop-shadow-lg" style="font-family: 'Noto Serif TC', serif; font-size: clamp(17px, 5.2vw, 29px); letter-spacing: 0.04em;">${item.cn || ''}</p>
                                            <p class="text-white/85 italic leading-tight drop-shadow mt-0.5" style="font-family: 'Playfair Display', Georgia, serif; font-size: clamp(13px, 3.3vw, 18px);">${item.en || ''}</p>
                                        </div>
                                    </div>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    </section>
                `;
                mainArea.innerHTML = gridHtml;

            } else {
                // Slider 分區排版模式
                if (currentFilter === 'all') {
                    heroSection.classList.remove('section-hidden');
                    archiveSection.classList.remove('section-hidden');
                } else {
                    heroSection.classList.add('section-hidden');
                    archiveSection.classList.add('section-hidden');
                }

                const sections = [...new Set(heroItems.map(d => d.section).filter(Boolean))];
                let hasVisibleCards = false;

                sections.forEach(secName => {
                    let itemsInSec = heroItems.filter(d => d.section === secName);

                    if (itemsInSec.length === 0) return;
                    hasVisibleCards = true;

                    const sectionId = `sec-${Math.random().toString(36).substr(2, 9)}`;
                    const sliderId = `slider-${Math.random().toString(36).substr(2, 9)}`;

                    const sectionHtml = `
                        <section id="${sectionId}" data-group="${secName}" class="dynamic-section">
                            <h2 class="section-title">${secName}</h2>
                            <div class="slider-wrapper">
                                <button class="nav-btn prev" onclick="scrollSlider('${sliderId}', -400)">
                                    <i class="fas fa-chevron-left text-xs text-slate-400"></i>
                                </button>
                                <div class="slider-container hide-scrollbar" id="${sliderId}">
                                    ${itemsInSec.map(item => `
                                        <div class="slider-item w-32 md:w-56" onclick="handleNavigation('${item.url}')">
                                            <div class="poster-card" title="${item.cn || ''}">
                                                <img src="${item.img}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                                                ${item.section ? `<span class="absolute top-2 right-2 px-2 py-0.5 bg-black/50 backdrop-blur-sm text-white text-[10px] font-semibold rounded-full" style="font-family: 'Noto Serif TC', serif; letter-spacing: 0.05em;">${item.section}</span>` : ''}
                                                <div class="absolute bottom-0 left-0 right-0 p-2 md:p-3 bg-gradient-to-t from-black/80 via-black/40 to-transparent">
                                                    <p class="text-white font-black leading-tight drop-shadow-lg" style="font-family: 'Noto Serif TC', serif; font-size: clamp(17px, 5.2vw, 29px); letter-spacing: 0.04em;">${item.cn || ''}</p>
                                                    <p class="text-white/85 italic leading-tight drop-shadow mt-0.5" style="font-family: 'Playfair Display', Georgia, serif; font-size: clamp(13px, 3.3vw, 18px);">${item.en || ''}</p>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                                <button class="nav-btn next" onclick="scrollSlider('${sliderId}', 400)">
                                    <i class="fas fa-chevron-right text-xs text-slate-400"></i>
                                </button>
                            </div>
                        </section>
                    `;
                    mainArea.insertAdjacentHTML('beforeend', sectionHtml);
                });

                if (!hasVisibleCards) {
                    mainArea.innerHTML = `<div class="loader">找不到符合該標籤的相關卡片。</div>`;
                }
            }
        }

        // 検索窓トグル処理
        function toggleSearchInput() {
            const panel = document.getElementById('search-panel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                document.getElementById('tag-search-input').focus();
            } else {
                clearSearch();
            }
        }

        // 検索文字入力処理
        function handleSearch(val) {
            searchQuery = val;
            renderContent();
        }

        // 検索クリア処理
        function clearSearch() {
            const input = document.getElementById('tag-search-input');
            if (input) input.value = '';
            searchQuery = '';
            renderContent();
        }

        // 導航欄與 Dock 選單切換
        function toggleDock() { document.getElementById('dock-nav-wrapper').classList.toggle('collapsed');
        }
        
        function toggleFilter() {
            const bar = document.getElementById('filter-bar');
            bar.classList.toggle('collapsed');
        }

        function scrollSlider(id, offset) {
            const el = document.getElementById(id);
            if (el) el.scrollBy({ left: offset, behavior: 'smooth' });
        }

        // ホームスクロールとフィルターの完全初期化
        function scrollToHome() {
            setFilter('all');
            clearSearch();
            // 還原為預設 slider 排版
            if (isGridView) {
                toggleGridView();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleNavigation(url) {
            if (!url || url === '#' || url === 'no link' || url === 'undefined') return;
            window.location.href = url;
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            const buttons = document.querySelectorAll('.filter-capsule');
            buttons.forEach(btn => {
                if(btn.dataset.filter === filterType) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            
            const heroSection = document.getElementById('hero-section');
            const archiveSection = document.getElementById('sec-archive');
            
            // 只有在非 Grid View 的狀態下，才依照 filterType 隱藏/顯示 Hero
            if (!isGridView) {
                if (filterType === 'all') {
                    heroSection.classList.remove('section-hidden');
                    archiveSection.classList.remove('section-hidden');
                } else {
                    heroSection.classList.add('section-hidden');
                    archiveSection.classList.add('section-hidden');
                }
            }
            renderContent();
        }

        // QRコードスキャナーコントロール
        async function openQRScanner() {
            const modal = document.getElementById('qr-scanner-modal');
            const video = document.getElementById('qr-video');
            const errMsg = document.getElementById('qr-error-msg');
            
            errMsg.classList.add('hidden');
            errMsg.innerText = "";
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                qrStream = stream;
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                
                try {
                    await video.play();
                } catch(playErr) {
                    console.warn("Video play interrupted, attempting fallback options", playErr);
                }
                
                qrAnimationId = requestAnimationFrame(tickQRScanner);
            } catch (err) {
                console.error("Camera access failed:", err);
                errMsg.innerText = "相機不可用（可能被瀏覽器安全政策限制、未授權， or 未在 HTTPS 環境下）。請使用上方「選擇照片 / 上傳條碼圖」按碼。";
                errMsg.classList.remove('hidden');
            }
        }

        function closeQRScanner() {
            const modal = document.getElementById('qr-scanner-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.classList.remove('opacity-100');

            if (qrStream) {
                qrStream.getTracks().forEach(track => track.stop());
                qrStream = null;
            }
            if (qrAnimationId) {
                cancelAnimationFrame(qrAnimationId);
                qrAnimationId = null;
            }
            
            document.getElementById('qr-file-input').value = "";
        }

        function tickQRScanner() {
            const video = document.getElementById('qr-video');
            const canvasElement = document.getElementById('qr-canvas');
            if (!video || !canvasElement) return;
            const canvas = canvasElement.getContext('2d', { willReadFrequently: true });
            if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                
                try {
                    const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "attemptBoth",
                    });
                    if (code) {
                        let resultText = code.data.trim();
                        let finalUrl = '';

                        if (resultText.startsWith('http://') || resultText.startsWith('https://')) {
                            finalUrl = resultText;
                        } else {
                            if (resultText.startsWith('/')) {
                                resultText = resultText.substring(1);
                            }
                            finalUrl = `http://phyuaaphysics.github.io/phyustudio/${resultText}`;
                        }

                        closeQRScanner();
                        window.location.href = finalUrl;
                        return;
                    }
                } catch (e) {
                    console.error("Error drawing or extracting canvas pixels", e);
                }
            }
            if (qrStream) {
                qrAnimationId = requestAnimationFrame(tickQRScanner);
            }
        }

        // アップロード画像によるQRコードデコード
        function handleQRFile(input) {
            const file = input.files[0];
            if (!file) return;

            const errMsg = document.getElementById('qr-error-msg');
            errMsg.classList.add('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvasElement = document.getElementById('qr-canvas');
                    const canvas = canvasElement.getContext('2d');
                    canvasElement.width = img.width;
                    canvasElement.height = img.height;
                    canvas.drawImage(img, 0, 0);
                    try {
                        const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height, {
                            inversionAttempts: "attemptBoth",
                        });
                        if (code) {
                            let resultText = code.data.trim();
                            let finalUrl = '';
                            if (resultText.startsWith('http://') || resultText.startsWith('https://')) {
                                finalUrl = resultText;
                            } else {
                                if (resultText.startsWith('/')) {
                                    resultText = resultText.substring(1);
                                }
                                finalUrl = `http://phyuaaphysics.github.io/phyustudio/${resultText}`;
                            }
                            closeQRScanner();
                            window.location.href = finalUrl;
                        } else {
                            errMsg.innerText = "無法解析此圖中的條碼。請確認照片清晰無陰影，條碼居中未變形。";
                            errMsg.classList.remove('hidden');
                        }
                    } catch (err) {
                        console.error("Manual QR decode error:", err);
                        errMsg.innerText = "相片讀取失敗，請重新嘗試。";
                        errMsg.classList.remove('hidden');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY || document.documentElement.scrollTop;
            if (currentScrollY > 30) document.body.classList.add('scrolled');
            else document.body.classList.remove('scrolled');
            
            const filterBar = document.getElementById('filter-bar');
            if (currentScrollY > lastScrollY && currentScrollY > 150) {
                if (!filterBar.classList.contains('collapsed')) filterBar.classList.add('collapsed');
            } else if (currentScrollY < lastScrollY) {
                if (filterBar.classList.contains('collapsed')) filterBar.classList.remove('collapsed');
            }
            lastScrollY = currentScrollY;
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
