<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumina Studio</title>
    
    <!-- iOS PWA 狀態列修正 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        
        :root {
            --glacier-deep: #0f172a;
            --glacier-primary: #0284c7; 
            --glacier-ice: #38bdf8;
            --glacier-bg: #eef2f6;
            --glacier-glass: rgba(224, 242, 254, 0.85); 
            --glacier-nav-glass: rgba(255, 255, 255, 0.75); 
        }

        html { 
            scroll-behavior: smooth; 
            height: 100%;
            overflow: hidden; 
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--glacier-bg);
            color: #334155;
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            overflow-y: auto;
            padding-top: 0;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .logo-bar {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 120;
            background-color: var(--glacier-glass);
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(14, 165, 233, 0.1);
            padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
            padding-bottom: 12px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #main-logo {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: left center;
            will-change: transform;
        }

        .scrolled #main-logo { transform: scale(0.75); }

        .filter-bar {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 68px);
            left: 0;
            width: 100%;
            z-index: 110;
            background-color: var(--glacier-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-bottom: 1px solid rgba(14, 165, 233, 0.05);
        }

        .filter-bar.collapsed {
            transform: translateY(-56px); 
            opacity: 0.9;
        }

        .filter-capsule {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(14, 165, 233, 0.1);
            color: var(--glacier-deep);
        }

        .filter-capsule.active {
            background: var(--glacier-primary);
            color: #fff;
            border-color: var(--glacier-primary);
        }

        .filter-toggle-trigger {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: var(--glacier-glass);
            backdrop-filter: blur(20px);
            border-radius: 0 0 14px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(14, 165, 233, 0.05);
            border-top: none;
            color: var(--glacier-primary);
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .filter-bar.collapsed .filter-toggle-trigger i {
            transform: rotate(180deg);
        }

        /* 頁面內容容器 */
        #page-content { padding-top: calc(env(safe-area-inset-top, 0px) + 130px); }

        .slider-wrapper { position: relative; width: 100%; }

        .slider-container { 
            display: flex; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            gap: 2px; 
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s, transform 0.2s;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.03);
        }
        
        .slider-wrapper:hover .nav-btn { opacity: 1; }
        .nav-btn.prev { left: -12px; }
        .nav-btn.next { right: -12px; }

        .slider-item { scroll-snap-align: start; flex: 0 0 auto; }

        .poster-card { 
            aspect-ratio: 2/3; border-radius: 4px; overflow: hidden; background: #cbd5e1; 
            position: relative; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 12px -4px rgba(15, 23, 42, 0.05);
            will-change: transform;
        }

        .poster-card:active {
            transform: scale(0.94);
            filter: brightness(0.9);
        }

        .hero-container-framed {
            border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.1);
            overflow: hidden; position: relative; background-color: #fff; 
            transition: all 0.4s ease;
        }

        .hero-gradient-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 40%, rgba(238,242,246,0.9) 95%);
            pointer-events: none;
        }

        .section-hidden { display: none !important; }

        .dock-wrapper {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
            width: auto;
            min-width: 340px;
        }

        .dock-wrapper.collapsed { transform: translateX(-50%) translateY(200px); opacity: 0; }

        .dock-nav {
            background-color: var(--glacier-nav-glass);
            backdrop-filter: blur(28px) saturate(210%);
            -webkit-backdrop-filter: blur(28px) saturate(210%);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            padding: 12px 14px;
            border-radius: 42px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
            display: flex; align-items: center; justify-content: center; gap: 14px;
        }

        .dock-toggle-btn {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: #94a3b8; cursor: pointer; font-size: 14px; transition: color 0.3s;
        }

        .dock-content { display: flex; align-items: center; gap: 14px; }

        .dock-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: #94a3b8; transition: all 0.3s; min-width: 58px;
        }

        .dock-item i { font-size: 1.6rem; }
        .dock-item span { font-size: 9px; font-weight: 500; opacity: 0.7; }
        .dock-item.active { color: var(--glacier-primary); }

        .dock-trigger-bar {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 5px;
            background: rgba(15, 23, 42, 0.2);
            border-radius: 10px; z-index: 199; cursor: pointer; display: none;
        }
        .dock-wrapper.collapsed + .dock-trigger-bar { display: block; }

        .section-title { font-size: 1.15rem; font-weight: 800; color: var(--glacier-deep); margin-bottom: 8px; }

        @media (max-width: 768px) {
            .hero-container-framed { border-radius: 0; }
            .dock-wrapper { width: 92%; max-width: 400px; }
            #page-content { padding-top: calc(env(safe-area-inset-top, 0px) + 120px); }
            .nav-btn { display: none !important; }
        }
    </style>
</head>
<body class="pb-40 hide-scrollbar">

    <header id="header-root">
        <div class="logo-bar px-6" id="logo-nav-bar"> 
            <div class="max-w-screen-2xl mx-auto flex items-center justify-between">
                <div class="cursor-pointer" onclick="scrollToHome()" id="main-logo">
                    <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="Lumina" class="h-12 w-auto">
                </div>
                <div class="flex items-center gap-6 text-sky-800 opacity-60">
                    <i class="fas fa-search text-xl"></i>
                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-slate-900 text-[10px] font-bold">U</div>
                </div>
            </div>
        </div>
        
        <div class="filter-bar px-6" id="filter-bar">
            <div class="max-w-screen-2xl mx-auto flex items-center gap-3 overflow-x-auto hide-scrollbar pr-12">
                <button class="filter-capsule active" data-filter="all" onclick="setFilter('all')">全部</button>
                <button class="filter-capsule" data-filter="course" onclick="setFilter('course')">核心課程全庫</button>
                <button class="filter-capsule" data-filter="funda" onclick="setFilter('funda')">基礎練習冊</button>
                <button class="filter-capsule" data-filter="other" onclick="setFilter('other')">其他分類</button>
            </div>
            <div class="filter-toggle-trigger" onclick="toggleFilter()">
                <i class="fas fa-chevron-up text-[10px]" id="filter-chevron"></i>
            </div>
        </div>
    </header>

    <div id="page-content">
        <!-- 錄影庫首頁 -->
        <div id="view-home">
            <section id="hero-section" class="px-4 md:px-12 max-w-screen-2xl mx-auto mb-12">
                <div class="hero-container-framed relative w-full h-[65vh] md:h-[75vh]">
                    <img src="https://phyuaaphysics.github.io/phyustudio/topcover.png" class="absolute inset-0 w-full h-full object-cover object-top">
                    <div class="hero-gradient-overlay"></div>
                    <div class="absolute inset-0 flex flex-col items-center justify-end pb-16 px-6 text-center">
                        <img src="https://phyuaaphysics.github.io/phyustudio/banner.png" class="w-full max-w-[260px] md:max-w-[450px] mb-12 relative z-10">
                        <button onclick="handleNavigation(config.heroUrl)" class="bg-slate-900 text-white px-16 py-4 font-black rounded-full text-[11px] tracking-[0.3em] uppercase shadow-2xl relative z-10 hover:scale-105 transition-transform active:scale-95">
                            馬上開始
                        </button>
                    </div>
                </div>
            </section>

            <main class="space-y-12 max-w-screen-2xl mx-auto px-6">
                <section id="sec-course" data-group="course">
                    <h2 class="section-title">核心課程全庫</h2>
                    <div class="slider-wrapper">
                        <button class="nav-btn prev" onclick="scrollSlider('course-slider', -400)"><i class="fas fa-chevron-left text-xs text-slate-400"></i></button>
                        <div class="slider-container hide-scrollbar" id="course-slider"></div>
                        <button class="nav-btn next" onclick="scrollSlider('course-slider', 400)"><i class="fas fa-chevron-right text-xs text-slate-400"></i></button>
                    </div>
                </section>
                
                <section id="sec-funda-01-10" data-group="funda">
                    <h2 class="section-title">基礎練習冊 01-10</h2>
                    <div class="slider-wrapper">
                        <button class="nav-btn prev" onclick="scrollSlider('funda-01-10-slider', -400)"><i class="fas fa-chevron-left text-xs text-slate-400"></i></button>
                        <div class="slider-container hide-scrollbar" id="funda-01-10-slider"></div>
                        <button class="nav-btn next" onclick="scrollSlider('funda-01-10-slider', 400)"><i class="fas fa-chevron-right text-xs text-slate-400"></i></button>
                    </div>
                </section>

                <section id="sec-funda-11-20" data-group="funda">
                    <h2 class="section-title">基礎練習冊 11-20</h2>
                    <div class="slider-wrapper">
                        <button class="nav-btn prev" onclick="scrollSlider('funda-11-20-slider', -400)"><i class="fas fa-chevron-left text-xs text-slate-400"></i></button>
                        <div class="slider-container hide-scrollbar" id="funda-11-20-slider"></div>
                        <button class="nav-btn next" onclick="scrollSlider('funda-11-20-slider', 400)"><i class="fas fa-chevron-right text-xs text-slate-400"></i></button>
                    </div>
                </section>

                <!-- Pastpaper Archive 英雄卡片 (更新視覺設計) -->
                <section id="sec-archive" class="mt-20 pb-16">
                    <div class="hero-container-framed relative w-full h-[30vh] md:h-[40vh] max-w-5xl mx-auto group cursor-pointer overflow-hidden" onclick="handleNavigation('https://sites.google.com/np2c.edu.hk/physicspp-archive/pp?pli=1&authuser=2')">
                        <!-- 背景圖片 -->
                        <img src="https://phyuaaphysics.github.io/phyustudio/pastpaper.png" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                        <!-- 高級感漸層遮罩 (由下往上變黑) -->
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-black/20 opacity-90"></div>
                        
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6">
                            <!-- 高級海報字體風格標題 -->
                            <h2 style="font-weight: 900;" class="text-white text-3xl md:text-5xl tracking-tighter uppercase mb-2 drop-shadow-2xl italic">
                                Pastpaper Archive
                            </h2>
                            <div class="h-1 w-12 bg-sky-500 mb-4 rounded-full transition-all duration-500 group-hover:w-24"></div>
                            <p class="text-sky-100 text-[10px] md:text-xs tracking-[0.4em] uppercase font-light opacity-80 mb-8">
                                Detailed Examination Resource Collections
                            </p>
                            <button class="bg-white text-black px-10 py-3 font-black rounded-sm text-[9px] tracking-[0.3em] uppercase hover:bg-sky-400 hover:text-white transition-all active:scale-95">
                                Enter Archive
                            </button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="dock-nav-wrapper" class="dock-wrapper">
        <nav class="dock-nav">
            <div class="dock-toggle-btn" onclick="toggleDock()"><i class="fas fa-chevron-down"></i></div>
            <div class="dock-content">
                <button onclick="scrollToHome()" id="dock-home" class="dock-item active">
                    <i class="fas fa-home"></i><span class="uppercase">錄影庫</span>
                </button>
                <button onclick="handleNavigation(config.simUrl)" class="dock-item">
                    <i class="fas fa-cube"></i><span class="uppercase">模擬器</span>
                </button>
                <button onclick="handleNavigation('https://phyuaaphysics.github.io/phyustudio/functionhub.html')" class="dock-item">
                    <i class="fas fa-shapes"></i><span class="uppercase">功能區</span>
                </button>
                <button onclick="handleNavigation(config.googleUrl)" class="dock-item">
                    <i class="fab fa-google"></i><span class="uppercase">郵箱</span>
                </button>
            </div>
            <div class="dock-toggle-btn" onclick="toggleDock()"><i class="fas fa-chevron-down"></i></div>
        </nav>
    </div>
    <div id="dock-handle" onclick="toggleDock()" class="dock-trigger-bar"></div>

    <script>
        const config = {
            heroUrl: 'https://sites.google.com/np2c.edu.hk/2526physicslessonrecordingsem2/home',
            googleUrl: 'https://mail.google.com/mail/u/0/#inbox',
            simUrl: 'https://phyuaaphysics.github.io/phyustudio/simulation.html',
            data: [
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-1-heat.jpg', url: 'https://sites.google.com/np2c.edu.hk/heatcourse/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-2-mech.jpg', url: 'https://sites.google.com/np2c.edu.hk/mechanics-all/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-3-wave.jpg', url: 'https://sites.google.com/np2c.edu.hk/wave/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-4-ennm.jpg', url: 'https://sites.google.com/np2c.edu.hk/emcourse/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-5-nu.jpg', url: 'https://sites.google.com/np2c.edu.hk/nuclearandradioactivity/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-6-atomic.jpg', url: 'https://sites.google.com/np2c.edu.hk/atomic-world/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-7-medic.jpg', url: 'https://sites.google.com/np2c.edu.hk/medicalphysics/home' },
                
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/fundaS301.png', url: 'https://phyuphysics.com/video-fundamental-s3-bk01/' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/fundaS302.png', url: 'https://sites.google.com/np2c.edu.hk/vols3ii/home' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda01A.png', url: 'https://sites.google.com/np2c.edu.hk/vol01a/home' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda01B.png', url: 'https://phyuphysics.com/video-fundamental-01b/' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda02.png', url: 'https://sites.google.com/np2c.edu.hk/vol02/home' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda03.png', url: 'https://sites.google.com/np2c.edu.hk/vol03/home' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda04.png', url: 'https://sites.google.com/np2c.edu.hk/vol04/home' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda05.png', url: 'https://sites.google.com/np2c.edu.hk/vol05/home' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda06.png', url: 'https://phyuphysics.com/video-fundamental-06-oppenheimer/' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda07.png', url: 'https://sites.google.com/np2c.edu.hk/hw-vol-07/home?authuser=1' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda08.png', url: 'https://phyuphysics.com/video-fundamental-06-oppenheimer/' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda09.png', url: 'no link' },
                { category: 'funda-01-10', img: 'https://phyuaaphysics.github.io/phyustudio/funda10.png', url: 'no link' },

                { category: 'funda-11-20', img: 'https://phyuaaphysics.github.io/phyustudio/funda11.png', url: 'https://sites.google.com/np2c.edu.hk/vol11/home' },
                { category: 'funda-11-20', img: 'https://phyuaaphysics.github.io/phyustudio/funda12.png', url: 'https://phyuphysics.com/video-fundamental-012/' },
                { category: 'funda-11-20', img: 'https://phyuaaphysics.github.io/phyustudio/funda13.png', url: 'https://sites.google.com/np2c.edu.hk/vol-13/?pli=1&authuser=1' },
                { category: 'funda-11-20', img: 'https://phyuaaphysics.github.io/phyustudio/funda14.png', url: 'https://sites.google.com/np2c.edu.hk/vol-14/home' },
                { category: 'funda-11-20', img: 'https://phyuaaphysics.github.io/phyustudio/funda15.png', url: 'https://sites.google.com/np2c.edu.hk/vol-15/home' },
                { category: 'funda-11-20', img: 'https://phyuaaphysics.github.io/phyustudio/funda16.png', url: 'https://sites.google.com/np2c.edu.hk/vol-16/home' },
                { category: 'funda-11-20', img: 'https://phyuaaphysics.github.io/phyustudio/funda17.png', url: 'https://sites.google.com/np2c.edu.hk/vol-17/home' },
                { category: 'funda-11-20', img: 'https://phyuaaphysics.github.io/phyustudio/funda18.png', url: 'https://sites.google.com/np2c.edu.hk/vol-18/home' },
                { category: 'funda-11-20', img: 'https://phyuaaphysics.github.io/phyustudio/funda19.png', url: 'https://sites.google.com/np2c.edu.hk/vol-19/home' },
                { category: 'funda-11-20', img: 'https://phyuaaphysics.github.io/phyustudio/funda20.png', url: 'https://sites.google.com/np2c.edu.hk/vol-20/home' }
            ]
        };

        let lastScrollY = window.scrollY;

        function toggleDock() { document.getElementById('dock-nav-wrapper').classList.toggle('collapsed'); }

        function toggleFilter() {
            const bar = document.getElementById('filter-bar');
            bar.classList.toggle('collapsed');
        }

        function scrollSlider(id, offset) {
            const el = document.getElementById(id);
            if (el) el.scrollBy({ left: offset, behavior: 'smooth' });
        }

        function scrollToHome() {
            setFilter('all');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleNavigation(url) {
            if (!url || url === '#' || url === 'no link') return;
            window.location.href = url;
        }

        function setFilter(filterType) {
            const buttons = document.querySelectorAll('.filter-capsule');
            buttons.forEach(btn => {
                if(btn.dataset.filter === filterType) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            const heroSection = document.getElementById('hero-section');
            const archiveSection = document.getElementById('sec-archive');
            const sections = document.querySelectorAll('#view-home main section:not(#sec-archive)');
            
            if (filterType === 'all') {
                heroSection.classList.remove('section-hidden');
                archiveSection.classList.remove('section-hidden');
                sections.forEach(sec => sec.classList.remove('section-hidden'));
            } else {
                heroSection.classList.add('section-hidden');
                archiveSection.classList.add('section-hidden');
                sections.forEach(sec => {
                    if (sec.dataset.group === filterType) sec.classList.remove('section-hidden');
                    else sec.classList.add('section-hidden');
                });
            }
        }

        function render() {
            const containers = { 
                'course': document.getElementById('course-slider'), 
                'funda-01-10': document.getElementById('funda-01-10-slider'),
                'funda-11-20': document.getElementById('funda-11-20-slider')
            };
            Object.values(containers).forEach(c => { if(c) c.innerHTML = ''; });
            config.data.forEach(item => {
                const div = document.createElement('div');
                div.className = `slider-item w-32 md:w-56`;
                div.innerHTML = `<div class="poster-card"><img src="${item.img}" class="w-full h-full object-cover"></div>`;
                div.onclick = () => handleNavigation(item.url);
                let containerKey = item.category;
                if (containers[containerKey]) containers[containerKey].appendChild(div);
            });
        }

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY || document.documentElement.scrollTop;
            if (currentScrollY > 30) document.body.classList.add('scrolled');
            else document.body.classList.remove('scrolled');
            const filterBar = document.getElementById('filter-bar');
            if (currentScrollY > lastScrollY && currentScrollY > 150) {
                if (!filterBar.classList.contains('collapsed')) filterBar.classList.add('collapsed');
            } else if (currentScrollY < lastScrollY) {
                if (filterBar.classList.contains('collapsed')) filterBar.classList.remove('collapsed');
            }
            lastScrollY = currentScrollY;
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
