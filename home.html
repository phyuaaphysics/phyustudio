<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumina Studio</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --glacier-bg: #f2f4f7;
            --glacier-card-bg: rgba(255, 255, 255, 0.85);
            --glacier-text: #1d1d1f;
            --glacier-subtext: #86868b;
            --glacier-border: rgba(0, 0, 0, 0.08);
            --glacier-primary: #0071e3;
            --glacier-primary-hover: #0077ed;
            --glacier-dock-bg: rgba(255, 255, 255, 0.72);
            --glacier-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --radius-xl: 22px;
            --radius-md: 12px;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-top: env(safe-area-inset-top, 0px);
        }

        body.dark-mode {
            --glacier-bg: #000000;
            --glacier-card-bg: rgba(28, 28, 30, 0.85);
            --glacier-text: #f5f5f7;
            --glacier-subtext: #86868b;
            --glacier-border: rgba(255, 255, 255, 0.12);
            --glacier-primary: #2997ff;
            --glacier-primary-hover: #3ca0ff;
            --glacier-dock-bg: rgba(28, 28, 30, 0.72);
            --glacier-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* -------------------------------------------------------------
           SCROLL FIX 1: Root Layout & Smooth Touch Scrolling
        ------------------------------------------------------------- */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            overflow-x: hidden;
            overflow-y: scroll; /* Force vertical scrollbar track to prevent width shifts */
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100%;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--glacier-bg);
            color: var(--glacier-text);
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-top: var(--safe-area-top);
        }

        /* Prevent background scroll when modal/overlay is open */
        body.scroll-locked {
            overflow: hidden !important;
            touch-action: none;
        }

        /* Top Header Sticky Wrapper */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glacier-dock-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glacier-border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--glacier-text);
            font-size: 18px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: rgba(128, 128, 128, 0.15);
        }

        /* -------------------------------------------------------------
           SCROLL FIX 2: Content Container Scroll Performance
        ------------------------------------------------------------- */
        .app-main {
            flex: 1 0 auto;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 20px calc(100px + var(--safe-area-bottom)) 20px;
            box-sizing: border-box;
            will-change: transform;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card-grid.list-view {
            grid-template-columns: 1fr;
        }

        .card {
            background: var(--glacier-card-bg);
            border: 1px solid var(--glacier-border);
            border-radius: var(--radius-xl);
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--glacier-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 14px;
            color: var(--glacier-subtext);
            line-height: 1.5;
        }

        .loader {
            text-align: center;
            padding: 50px 0;
            color: var(--glacier-subtext);
        }

        /* Bottom Floating Dock */
        .dock-wrapper {
            position: fixed;
            bottom: calc(20px + var(--safe-area-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .dock-wrapper.collapsed {
            transform: translate(-50%, 150%);
        }

        .dock {
            background: var(--glacier-dock-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glacier-border);
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--glacier-shadow);
        }

        .dock-item {
            color: var(--glacier-text);
            font-size: 18px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dock-item.active, .dock-item:hover {
            background: var(--glacier-primary);
            color: #ffffff;
        }

        /* -------------------------------------------------------------
           SCROLL FIX 3: Fully Isolated Overlay & Modal Panels
        ------------------------------------------------------------- */
        .nf-overlay-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: calc(60px + var(--safe-area-top));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .nf-overlay-panel.nf-search-panel-show {
            opacity: 1;
            pointer-events: auto;
        }

        .search-box-container {
            background: var(--glacier-card-bg);
            border: 1px solid var(--glacier-border);
            width: 90%;
            max-width: 600px;
            border-radius: var(--radius-xl);
            padding: 16px;
            box-shadow: var(--glacier-shadow);
        }

        .search-input-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-input-group input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-size: 16px;
            color: var(--glacier-text);
        }

        /* iOS Style System Dialog Modal */
        .nf-dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .nf-dialog-overlay.nf-dialog-show {
            opacity: 1;
            pointer-events: auto;
        }

        .nf-dialog-box {
            background: var(--glacier-card-bg);
            border: 1px solid var(--glacier-border);
            border-radius: var(--radius-xl);
            width: 280px;
            text-align: center;
            padding: 20px;
            box-shadow: var(--glacier-shadow);
        }

        .nf-dialog-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .nf-icon-warn { color: #ff9500; }
        .nf-icon-info { color: var(--glacier-primary); }
        .nf-icon-success { color: #34c759; }

        .nf-dialog-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .nf-dialog-message {
            font-size: 13px;
            color: var(--glacier-subtext);
            margin-bottom: 20px;
        }

        .nf-dialog-buttons {
            display: flex;
            gap: 8px;
        }

        .nf-dialog-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: rgba(128, 128, 128, 0.12);
            color: var(--glacier-text);
        }

        .nf-dialog-btn-confirm {
            background: var(--glacier-primary);
            color: #ffffff;
        }

        /* More Menu Overlay */
        .nf-more-menu {
            position: absolute;
            top: 50px;
            right: 20px;
            background: var(--glacier-card-bg);
            border: 1px solid var(--glacier-border);
            border-radius: var(--radius-md);
            box-shadow: var(--glacier-shadow);
            display: none;
            flex-direction: column;
            width: 160px;
            overflow: hidden;
            z-index: 101;
        }

        .nf-more-menu-show {
            display: flex;
        }

        .nf-more-menu-item {
            padding: 12px 16px;
            font-size: 14px;
            color: var(--glacier-text);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .nf-more-menu-item:hover {
            background: rgba(128, 128, 128, 0.1);
        }

        /* Theme Toggle Checkbox Hide */
        #dark-mode-toggle {
            display: none;
        }
    </style>
</head>
<body>

    <!-- App Header -->
    <header class="app-header">
        <div class="app-title" onclick="scrollToHome()">
            <i class="fas fa-cube" style="color: var(--glacier-primary)"></i>
            <span>Lumina Studio</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="grid-view-toggle" onclick="toggleGridView()" title="切換檢視模式">
                <i class="fas fa-th-large"></i>
            </button>
            <button class="icon-btn" onclick="openSearchPanel()" title="搜尋">
                <i class="fas fa-search"></i>
            </button>
            <div id="nf-more-wrap" style="position: relative;">
                <button class="icon-btn" onclick="toggleMoreMenu(event)" title="更多選單">
                    <i class="fas fa-ellipsis-h"></i>
                </button>
                <div id="nf-more-menu" class="nf-more-menu" aria-hidden="true">
                    <div class="nf-more-menu-item" onclick="openQRScanner()">
                        <i class="fas fa-qrcode"></i> 掃描 QR
                    </div>
                    <div class="nf-more-menu-item" onclick="manualReload()">
                        <i class="fas fa-sync-alt"></i> 重新整理
                    </div>
                    <div class="nf-more-menu-item" onclick="toggleTheme(!document.body.classList.contains('dark-mode'))">
                        <i class="fas fa-moon"></i> 切換深色
                    </div>
                    <div class="nf-more-menu-item" onclick="handleLogout()" style="color: #ff3b30;">
                        <i class="fas fa-sign-out-alt"></i> 登出
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main" id="main-content-area">
        <div class="loader"><i class="fas fa-spinner fa-spin"></i> 載入資料中...</div>
    </main>

    <!-- Floating Navigation Dock -->
    <div class="dock-wrapper" id="dock-nav-wrapper">
        <nav class="dock">
            <a class="dock-item active" id="dock-home" onclick="scrollToHome()" title="首頁">
                <i class="fas fa-home"></i>
            </a>
            <a class="dock-item" id="dock-search" onclick="openSearchPanel()" title="搜尋">
                <i class="fas fa-search"></i>
            </a>
            <a class="dock-item" id="dock-qr" onclick="openQRScanner()" title="QR Scanner">
                <i class="fas fa-qrcode"></i>
            </a>
            <a class="dock-item" id="dock-toggle" onclick="toggleDock()" title="收合選單">
                <i class="fas fa-chevron-down"></i>
            </a>
        </nav>
    </div>

    <!-- Search Overlay Panel -->
    <div id="nf-search-panel" class="nf-overlay-panel" aria-hidden="true">
        <div class="search-box-container">
            <div class="search-input-group">
                <i class="fas fa-search" style="color: var(--glacier-subtext)"></i>
                <input type="text" id="search-input" placeholder="搜尋卡片標題與內容..." oninput="handleSearch(this.value)">
                <button class="icon-btn" onclick="closeSearchPanel()"><i class="fas fa-times"></i></button>
            </div>
        </div>
    </div>

    <!-- iOS Style System Dialog Modal -->
    <div id="nf-dialog-overlay" class="nf-dialog-overlay">
        <div class="nf-dialog-box">
            <div id="nf-dialog-icon" class="nf-dialog-icon"></div>
            <div id="nf-dialog-title" class="nf-dialog-title"></div>
            <div id="nf-dialog-message" class="nf-dialog-message"></div>
            <div id="nf-dialog-buttons" class="nf-dialog-buttons"></div>
        </div>
    </div>

    <!-- Hidden Dark Mode Switch State -->
    <input type="checkbox" id="dark-mode-toggle" onchange="toggleTheme(this.checked)">

    <script>
        // =========== 1. 常數與全域狀態 ===========
        const LS = {
            cards: 'lumina_cards_cache',
            ver: 'lumina_cards_ver'
        };
        const META_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR-fS0fJ0Yn6eF7A_meta/pub?output=csv';
        const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR-fS0fJ0Yn6eF7A_sheet/pub?output=csv';

        let allCardsCache = null;
        let isGridView = true;
        let searchQuery = '';
        let currentTab = null;

        const storage = {
            getItem: (k) => { try { return localStorage.getItem(k); } catch(e) { return null; } },
            setItem: (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} },
            removeItem: (k) => { try { localStorage.removeItem(k); } catch(e) {} },
            clear: () => { try { localStorage.clear(); } catch(e) {} }
        };

        // =========== 2. 安全 Escape & CSV 解析 ===========
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function parseCSV(text) {
            if (!text) return [];
            let p = '', c = '', r = [];
            let q = false;
            let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                p = i > 0 ? text[i - 1] : '';
                if (c === '"') {
                    if (q && text[i + 1] === '"') { row[row.length - 1] += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',' && !q) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && text[i + 1] === '\n') { i++; }
                    r.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') r.push(row);
            return r;
        }

        function sheetToCards(rows) {
            if (!rows || rows.length < 2) return [];
            const headers = rows[0].map(h => h.trim().toLowerCase());
            const cards = [];
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if (!r || r.length === 0) continue;
                let card = {};
                headers.forEach((h, idx) => {
                    card[h] = r[idx] ? r[idx].trim() : '';
                });
                if (card.title || card.desc || card.name) {
                    cards.push({
                        title: card.title || card.name || '無標題',
                        desc: card.desc || card.description || card.content || '',
                        url: card.url || card.link || ''
                    });
                }
            }
            return cards;
        }

        // =========== 3. SCROLL FIX: Smooth Scrolling & Body Locking ===========
        function scrollPageToTop(behavior = 'smooth') {
            window.scrollTo({
                top: 0,
                left: 0,
                behavior: behavior
            });
            document.body.scrollTop = 0; // iOS Fallback
            document.documentElement.scrollTop = 0;
        }

        function setScrollLock(locked) {
            if (locked) {
                document.body.classList.add('scroll-locked');
            } else {
                document.body.classList.remove('scroll-locked');
            }
        }

        // =========== 4. 卡片渲染邏輯 ===========
        function renderCards(container, cards) {
            if (!container) return;
            allCardsCache = cards;

            let filtered = cards;
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filtered = cards.filter(c => c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q));
            }

            if (!filtered || filtered.length === 0) {
                container.innerHTML = `<div class="loader">沒有找到相符的卡片</div>`;
                return;
            }

            const gridClass = isGridView ? 'card-grid' : 'card-grid list-view';
            let html = `<div class="${gridClass}">`;

            filtered.forEach(c => {
                html += `
                    <div class="card" ${c.url ? `onclick="handleNavigation('${escapeHTML(c.url)}')" style="cursor:pointer;"` : ''}>
                        <div class="card-title">${escapeHTML(c.title)}</div>
                        <div class="card-desc">${escapeHTML(c.desc)}</div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // =========== 5. Dock & Tab 狀態管理 ===========
        function updateDockForTab() {
            const homeBtn = document.getElementById('dock-home');
            if (homeBtn) {
                if (currentTab === null) {
                    homeBtn.classList.add('active');
                } else {
                    homeBtn.classList.remove('active');
                }
            }
        }

        function goBackToHome() {
            currentTab = null;
            if (allCardsCache) renderCards(document.getElementById('main-content-area'), allCardsCache);
            updateDockForTab();
            scrollPageToTop('smooth');
        }

        // =========== 6. 資料加載邏輯 ===========
        function fetchCardsData() {
            const container = document.getElementById('main-content-area');
            const cachedCards = storage.getItem(LS.cards);
            const cachedVer = storage.getItem(LS.ver);

            if (cachedCards) {
                try {
                    const parsed = JSON.parse(cachedCards);
                    if (Array.isArray(parsed) && parsed.length) {
                        renderCards(container, parsed);
                    }
                } catch (e) {}
            }

            fetch(META_CSV)
                .then(r => r.text())
                .then(metaText => {
                    const rows = parseCSV(metaText);
                    const remoteVer = (rows[0] && rows[0][0]) ? rows[0][0].trim() : Date.now().toString();

                    if (cachedCards && cachedVer === remoteVer) {
                        return;
                    }

                    return fetch(SHEET_CSV)
                        .then(r => r.text())
                        .then(csvText => {
                            const parsedRows = parseCSV(csvText);
                            const cards = sheetToCards(parsedRows);
                            if (cards && cards.length) {
                                storage.setItem(LS.cards, JSON.stringify(cards));
                                storage.setItem(LS.ver, remoteVer);
                                renderCards(container, cards);
                            }
                        });
                })
                .catch(err => {
                    console.warn('網路加載失敗，維持現有狀態:', err);
                    if (!cachedCards) {
                        // 範例備用展示卡片
                        const mockData = [
                            { title: 'Lumina Studio', desc: '歡迎使用 Lumina Studio 應用程式介面。', url: '' },
                            { title: 'Physics Engine', desc: '物理模擬與互動教學模組資源庫。', url: '' },
                            { title: 'QR Scanner', desc: '快速掃描 QR Code 取得即時實驗數據。', url: '' }
                        ];
                        renderCards(container, mockData);
                    }
                });
        }

        // =========== 7. UI 互動 & 控制器 ===========
        function toggleTheme(isDark) {
            if (isDark) {
                document.body.classList.add('dark-mode');
                storage.setItem('lumina_theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                storage.setItem('lumina_theme', 'light');
            }
            closeMoreMenu();
        }

        function initTheme() {
            const savedTheme = storage.getItem('lumina_theme');
            const toggleBtn = document.getElementById('dark-mode-toggle');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
                if (toggleBtn) toggleBtn.checked = true;
            } else {
                document.body.classList.remove('dark-mode');
                if (toggleBtn) toggleBtn.checked = false;
            }
        }

        function toggleGridView() {
            isGridView = !isGridView;
            const btn = document.getElementById('grid-view-toggle');
            if (btn) {
                btn.style.opacity = isGridView ? '1' : '0.6';
                btn.style.color = isGridView ? 'var(--glacier-primary)' : 'var(--glacier-text)';
            }
            if (allCardsCache) renderCards(document.getElementById('main-content-area'), allCardsCache);
        }

        function scrollToHome() {
            if (currentTab) {
                goBackToHome();
            } else {
                scrollPageToTop('smooth');
            }
        }

        function handleNavigation(url) {
            if (!url) return;
            window.location.href = url;
        }

        function manualReload() {
            storage.removeItem(LS.cards);
            storage.removeItem(LS.ver);
            location.reload();
        }

        function handleLogout() {
            closeMoreMenu();
            nfShowConfirm({
                title: '確認登出',
                message: '您確定要登出 Lumina Studio 嗎？',
                icon: 'warn',
                confirmText: '登出',
                cancelText: '取消',
                onConfirm: () => {
                    storage.clear();
                    window.location.href = 'https://phyuaaphysics.github.io/phyustudio/';
                }
            });
        }

        function toggleDock() {
            const dock = document.getElementById('dock-nav-wrapper');
            if (dock) dock.classList.toggle('collapsed');
        }

        function toggleMoreMenu(e) {
            if (e) e.stopPropagation();
            const menu = document.getElementById('nf-more-menu');
            if (!menu) return;
            const isShow = menu.classList.contains('nf-more-menu-show');
            if (isShow) {
                closeMoreMenu();
            } else {
                menu.classList.add('nf-more-menu-show');
                menu.setAttribute('aria-hidden', 'false');
            }
        }

        function closeMoreMenu() {
            const menu = document.getElementById('nf-more-menu');
            if (menu) {
                menu.classList.remove('nf-more-menu-show');
                menu.setAttribute('aria-hidden', 'true');
            }
        }

        function openSearchPanel() {
            closeMoreMenu();
            const panel = document.getElementById('nf-search-panel');
            const input = document.getElementById('search-input');
            if (panel) {
                setScrollLock(true);
                panel.classList.add('nf-search-panel-show');
                panel.setAttribute('aria-hidden', 'false');
                if (input) setTimeout(() => input.focus(), 150);
            }
        }

        function closeSearchPanel() {
            const panel = document.getElementById('nf-search-panel');
            if (panel) {
                panel.classList.remove('nf-search-panel-show');
                panel.setAttribute('aria-hidden', 'true');
                setScrollLock(false);
            }
            clearSearch();
        }

        function handleSearch(val) {
            searchQuery = val.trim();
            if (allCardsCache) {
                renderCards(document.getElementById('main-content-area'), allCardsCache);
            }
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            if (input) input.value = '';
            handleSearch('');
        }

        function openQRScanner() {
            closeMoreMenu();
            window.location.href = 'https://phyuaaphysics.github.io/phyustudio/qrscanner.html';
        }

        // =========== 8. iOS 風格 Dialog 元件 ===========
        let dialogConfirmHandler = null;
        let dialogCancelHandler = null;

        function nfShowStatus(opts = {}) {
            const overlay = document.getElementById('nf-dialog-overlay');
            const iconEl = document.getElementById('nf-dialog-icon');
            const titleEl = document.getElementById('nf-dialog-title');
            const msgEl = document.getElementById('nf-dialog-message');
            const buttonsEl = document.getElementById('nf-dialog-buttons');

            if (!overlay) return;

            setScrollLock(true);

            const type = opts.icon || 'info';
            iconEl.className = `nf-dialog-icon nf-icon-${type}`;
            const iconMap = {
                warn: 'fa-exclamation-triangle',
                info: 'fa-info-circle',
                success: 'fa-check-circle'
            };
            iconEl.innerHTML = `<i class="fas ${iconMap[type] || 'fa-info-circle'}"></i>`;

            titleEl.textContent = opts.title || '提示';
            msgEl.innerHTML = opts.message || '';

            buttonsEl.className = 'nf-dialog-buttons';
            buttonsEl.innerHTML = `
                <button class="nf-dialog-btn" onclick="nfDialogConfirm()">${escapeHTML(opts.confirmText || '好')}</button>
            `;

            dialogConfirmHandler = opts.onConfirm || null;
            dialogCancelHandler = opts.onDismiss || null;

            overlay.classList.add('nf-dialog-show');
        }

        function nfShowConfirm(opts = {}) {
            const overlay = document.getElementById('nf-dialog-overlay');
            const iconEl = document.getElementById('nf-dialog-icon');
            const titleEl = document.getElementById('nf-dialog-title');
            const msgEl = document.getElementById('nf-dialog-message');
            const buttonsEl = document.getElementById('nf-dialog-buttons');

            if (!overlay) return;

            setScrollLock(true);

            const type = opts.icon || 'warn';
            iconEl.className = `nf-dialog-icon nf-icon-${type}`;
            const iconMap = {
                warn: 'fa-exclamation-triangle',
                info: 'fa-info-circle',
                success: 'fa-check-circle'
            };
            iconEl.innerHTML = `<i class="fas ${iconMap[type] || 'fa-exclamation-triangle'}"></i>`;

            titleEl.textContent = opts.title || '確認操作';
            msgEl.innerHTML = opts.message || '您確定要執行此操作嗎？';

            buttonsEl.className = 'nf-dialog-buttons';
            buttonsEl.innerHTML = `
                <button class="nf-dialog-btn" onclick="nfDialogCancel()">${escapeHTML(opts.cancelText || '取消')}</button>
                <button class="nf-dialog-btn nf-dialog-btn-confirm" onclick="nfDialogConfirm()">${escapeHTML(opts.confirmText || '確認')}</button>
            `;

            dialogConfirmHandler = opts.onConfirm || null;
            dialogCancelHandler = opts.onCancel || null;

            overlay.classList.add('nf-dialog-show');
        }

        function nfDialogConfirm() {
            const overlay = document.getElementById('nf-dialog-overlay');
            if (overlay) overlay.classList.remove('nf-dialog-show');
            setScrollLock(false);
            if (typeof dialogConfirmHandler === 'function') {
                dialogConfirmHandler();
            }
            dialogConfirmHandler = null;
            dialogCancelHandler = null;
        }

        function nfDialogCancel(e) {
            if (e) e.stopPropagation();
            const overlay = document.getElementById('nf-dialog-overlay');
            if (overlay) overlay.classList.remove('nf-dialog-show');
            setScrollLock(false);
            if (typeof dialogCancelHandler === 'function') {
                dialogCancelHandler();
            }
            dialogConfirmHandler = null;
            dialogCancelHandler = null;
        }

        // 全局事件監聽
        document.addEventListener('click', function (e) {
            const moreWrap = document.getElementById('nf-more-wrap');
            if (moreWrap && !moreWrap.contains(e.target)) {
                closeMoreMenu();
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeMoreMenu();
                closeSearchPanel();
                nfDialogCancel();
            }
        });

        // =========== 9. 初始化 ===========
        document.addEventListener('DOMContentLoaded', function () {
            initTheme();
            updateDockForTab();
            fetchCardsData();
        });
    </script>
</body>
</html>
