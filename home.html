<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        :root {
            --primary-blue: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.85);
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #fafafa;
            color: #111;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 全螢幕載入 */
        #page-loader {
            position: fixed; inset: 0; background-color: white; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
        }
        #page-loader.active { opacity: 1; visibility: visible; }
        
        /* 導航欄樣式 */
        .nav-blur { backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); background-color: var(--glass-bg); }

        /* 分頁切換動畫 */
        .page-fade { transition: opacity 0.3s ease, transform 0.3s ease; }
        .hidden-page { display: none; opacity: 0; transform: translateY(15px); }

        /* 卡片動畫 */
        .card-animate { opacity: 0; transform: translateY(15px); transition: all 0.5s ease-out; }
        .card-animate.visible { opacity: 1; transform: translateY(0); }

        /* 卡片樣式 */
        .poster-card { aspect-ratio: 2/3; border-radius: 12px; overflow: hidden; background: #eee; position: relative; transition: all 0.3s ease; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s ease; }
        .card-clicking { transform: scale(0.92) !important; filter: brightness(0.8); transition: transform 0.1s ease !important; }

        @media (min-width: 1024px) {
            .poster-card:hover { transform: translateY(-8px); box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.12); }
            .poster-card:hover .card-img { transform: scale(1.05); }
        }

        .hero-gradient-overlay { background: linear-gradient(to top, #fafafa 0%, rgba(250,250,250,0.4) 40%, transparent 100%); }
        .slider-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; padding: 5px 0 30px 0; }
        .slider-item { scroll-snap-align: start; flex: 0 0 auto; }

        /* 模擬器卡片專屬樣式 */
        .sim-card {
            background: white; border: 1px solid #eee; border-radius: 16px; padding: 16px;
            transition: all 0.3s ease; display: flex; flex-direction: column; gap: 12px;
        }
        .sim-card:hover { border-color: #2563eb; transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        /* 彈出層 (Simulator Overlay) */
        #sim-overlay {
            position: fixed; inset: 0; background: white; z-index: 2000;
            display: none; flex-direction: column; opacity: 0; transition: opacity 0.4s ease;
        }
        #sim-overlay.active { display: flex; opacity: 1; }
        .close-btn {
            position: absolute; top: 20px; right: 20px; width: 44px; height: 44px;
            background: rgba(0,0,0,0.1); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            z-index: 2100; transition: all 0.2s;
        }
        .close-btn:hover { background: rgba(0,0,0,0.8); color: white; transform: rotate(90deg); }
        .sim-iframe { width: 100%; height: 100%; border: none; }

        .btn-press:active { transform: scale(0.95); transition: transform 0.1s; }
    </style>
</head>
<body class="pb-24">

    <!-- 載入層 -->
    <div id="page-loader">
        <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-12 h-12 animate-pulse" alt="Loading">
    </div>

    <!-- 模擬器彈出層 -->
    <div id="sim-overlay">
        <div class="close-btn" onclick="closeSimulator()">
            <i class="fas fa-times text-xl"></i>
        </div>
        <iframe id="sim-frame" class="sim-iframe" src=""></iframe>
    </div>

    <!-- Header -->
    <header id="main-header" class="fixed top-0 w-full z-50 nav-blur">
        <div class="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between relative">
            <div class="z-10 cursor-pointer btn-press" onclick="switchPage('home.html')">
                <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="Lumina" class="h-8 w-auto">
            </div>
            
            <nav class="absolute inset-x-0 flex justify-center pointer-events-none">
                <div class="flex items-center space-x-6 md:space-x-12 text-[10px] md:text-xs font-black text-gray-800 pointer-events-auto tracking-[0.15em] uppercase">
                    <button onclick="switchPage('home.html'); setTimeout(() => scrollToHero(), 100)" class="hover:text-blue-600 transition-colors">録影</button>
                    <button onclick="switchPage('home.html'); setTimeout(() => scrollToSection('course-library'), 100)" class="hover:text-blue-600 transition-colors">全庫</button>
                    <button onclick="switchPage('home.html'); setTimeout(() => scrollToSection('practice-1'), 100)" class="hover:text-blue-600 transition-colors">練習</button>
                    <button onclick="switchPage('simulator.html')" class="hover:text-blue-600 transition-colors" id="nav-sim-text">模擬</button>
                </div>
            </nav>
        </div>
    </header>

    <!-- 分頁: home.html -->
    <div id="page-home" class="page-fade">
        <section id="hero" class="pt-20 px-0 md:px-8 max-w-screen-2xl mx-auto">
            <div class="relative w-full h-[55vh] md:h-[70vh] overflow-hidden md:rounded-2xl shadow-sm border-b border-gray-100">
                <img src="https://phyuaaphysics.github.io/phyustudio/topcover.png" class="absolute inset-0 w-full h-full object-cover object-top" alt="Hero">
                <div class="absolute inset-0 hero-gradient-overlay"></div>
                <div class="absolute inset-0 flex flex-col items-center justify-end pb-12 px-6 text-center">
                    <span class="text-[10px] md:text-xs font-black tracking-[0.5em] text-blue-700 uppercase mb-5">Live Streaming & Archive</span>
                    <img src="https://phyuaaphysics.github.io/phyustudio/banner.png" alt="課堂錄影" class="w-full max-w-[280px] md:max-w-[500px] h-auto mb-10 object-contain">
                    <button onclick="openLink('hero')" class="btn-press bg-black text-white px-10 py-4 font-bold rounded-full text-xs tracking-widest uppercase hover:bg-gray-800 transition shadow-lg">
                        <i class="fas fa-play mr-3 text-[10px]"></i> 即刻進入
                    </button>
                </div>
            </div>
        </section>

        <main class="mt-12 space-y-16 max-w-screen-2xl mx-auto px-6">
            <section id="course-library" class="scroll-mt-24">
                <div class="mb-2">
                    <h2 class="text-xl md:text-2xl font-black tracking-tight">課程全庫</h2>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Comprehensive Archives</p>
                </div>
                <div class="slider-container hide-scrollbar" id="course-slider"></div>
            </section>

            <section id="practice-1" class="scroll-mt-24">
                <h2 class="text-xl md:text-2xl font-black tracking-tight mb-2">基礎練習冊 01-10</h2>
                <div class="slider-container hide-scrollbar" id="funda-1-slider"></div>
            </section>
        </main>
    </div>

    <!-- 分頁: simulator.html -->
    <div id="page-simulator" class="page-fade hidden-page pt-28 px-6 max-w-screen-2xl mx-auto">
        <header class="mb-10 text-center md:text-left">
            <h1 class="text-3xl md:text-4xl font-black tracking-tight mb-2">物理互動模擬器庫</h1>
            <p class="text-gray-400 text-sm md:text-base max-w-2xl font-medium">
                點擊下方卡片開啟專業物理模擬工具。
            </p>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="simulator-grid">
            <div class="sim-card card-animate visible">
                <div class="aspect-video bg-gray-100 rounded-xl overflow-hidden relative group">
                    <img src="https://phyuaaphysics.github.io/phyustudio/vb-6-atomic.jpg" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="Simulator">
                    <div class="absolute top-3 left-3 bg-blue-600 text-white text-[9px] font-black px-2 py-1 rounded-md tracking-wider uppercase">Atomic Physics</div>
                </div>
                <div>
                    <h3 class="font-bold text-lg mb-1">原子氫能階模擬器 v1.0</h3>
                    <p class="text-xs text-gray-500 leading-relaxed mb-4">視覺化展示玻爾模型的電子躍遷與對應光譜發射線。</p>
                    <button onclick="openSimulator('https://phyuaaphysics.github.io/simulatorbank/atomic-hydrogen-1.html')" class="w-full py-3 bg-black text-white rounded-xl text-[10px] font-black tracking-[0.2em] uppercase hover:bg-blue-600 transition btn-press">
                        啟動互動介面
                    </button>
                </div>
            </div>

            <!-- 更多項目可以比照辦理 -->
        </div>
    </div>

    <!-- 底部導航 -->
    <nav class="fixed bottom-0 w-full z-50 nav-blur border-t border-gray-100 px-10 py-3 pb-8 md:pb-3">
        <div class="flex items-center justify-between max-w-lg mx-auto">
            <button onclick="switchPage('home.html')" id="tab-home" class="flex flex-col items-center gap-1 text-blue-600 transition-all scale-110">
                <i class="fas fa-home text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-tighter">録影</span>
            </button>
            <button onclick="switchPage('simulator.html')" id="tab-sim" class="flex flex-col items-center gap-1 text-gray-400 transition-all">
                <i class="fas fa-cube text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-tighter">模擬器</span>
            </button>
            <button onclick="openLink('func6')" class="flex flex-col items-center gap-1 text-gray-400 transition-all">
                <i class="fas fa-bolt text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-tighter">更新</span>
            </button>
            <button onclick="openLink('google')" class="flex flex-col items-center gap-1 text-gray-400 transition-all">
                <i class="fab fa-google text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-tighter">信箱</span>
            </button>
        </div>
    </nav>

    <script>
        const config = {
            heroUrl: 'https://sites.google.com/np2c.edu.hk/2526physicslessonrecordingsem2/home',
            googleUrl: 'https://mail.google.com/mail/u/0/#inbox',
            data: [
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-1-heat.jpg', url: 'https://sites.google.com/np2c.edu.hk/heatcourse/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-2-mech.jpg', url: 'https://sites.google.com/np2c.edu.hk/mechanics-all/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-3-wave.jpg', url: 'https://sites.google.com/np2c.edu.hk/wave/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-4-ennm.jpg', url: 'https://sites.google.com/np2c.edu.hk/emcourse/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-5-nu.jpg', url: 'https://sites.google.com/np2c.edu.hk/nuclearandradioactivity/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-6-atomic.jpg', url: 'https://sites.google.com/np2c.edu.hk/atomic-world/home' },
                { category: 'course', img: 'https://phyuaaphysics.github.io/phyustudio/vb-7-medic.jpg', url: 'https://sites.google.com/np2c.edu.hk/medicalphysics/home' },
                ...Array.from({length: 10}, (_, i) => ({ 
                    category: 'funda-1', 
                    img: `https://phyuaaphysics.github.io/phyustudio/funda${(i+1).toString().padStart(2, '0')}.png`, 
                    url: 'no link' 
                }))
            ]
        };

        const loader = document.getElementById('page-loader');

        // 打開彈出式模擬器
        function openSimulator(url) {
            const overlay = document.getElementById('sim-overlay');
            const frame = document.getElementById('sim-frame');
            loader.classList.add('active'); // 顯示載入動畫
            
            setTimeout(() => {
                frame.src = url;
                overlay.style.display = 'flex';
                setTimeout(() => {
                    overlay.classList.add('active');
                    loader.classList.remove('active');
                }, 100);
            }, 500);
        }

        // 關閉彈出式模擬器
        function closeSimulator() {
            const overlay = document.getElementById('sim-overlay');
            const frame = document.getElementById('sim-frame');
            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
                frame.src = ""; // 清空 src 以節省資源並停止模擬器運作
            }, 400);
        }

        function switchPage(pageFileName) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            const isSimulator = (pageFileName === 'simulator.html');
            const homePage = document.getElementById('page-home');
            const simPage = document.getElementById('page-simulator');
            const tabHome = document.getElementById('tab-home');
            const tabSim = document.getElementById('tab-sim');
            const navSimText = document.getElementById('nav-sim-text');
            
            if (isSimulator) {
                homePage.style.opacity = '0';
                homePage.classList.add('hidden-page');
                simPage.classList.remove('hidden-page');
                setTimeout(() => simPage.style.opacity = '1', 10);
                tabHome.classList.replace('text-blue-600', 'text-gray-400');
                tabHome.classList.remove('scale-110');
                tabSim.classList.replace('text-gray-400', 'text-blue-600');
                tabSim.classList.add('scale-110');
                navSimText.classList.add('text-blue-600');
            } else {
                simPage.style.opacity = '0';
                simPage.classList.add('hidden-page');
                homePage.classList.remove('hidden-page');
                setTimeout(() => homePage.style.opacity = '1', 10);
                tabSim.classList.replace('text-blue-600', 'text-gray-400');
                tabSim.classList.remove('scale-110');
                tabHome.classList.replace('text-gray-400', 'text-blue-600');
                tabHome.classList.add('scale-110');
                navSimText.classList.remove('text-blue-600');
            }
        }

        function handleNavigation(url, element) {
            if (!url || url === 'no link') return;
            if (element) element.classList.add('card-clicking');
            loader.classList.add('active');
            setTimeout(() => {
                window.open(url, '_blank');
                setTimeout(() => {
                    loader.classList.remove('active');
                    if (element) element.classList.remove('card-clicking');
                }, 500);
            }, 600);
        }

        function render() {
            const courseSlider = document.getElementById('course-slider');
            const funda1Slider = document.getElementById('funda-1-slider');
            config.data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'slider-item w-40 md:w-60 card-animate';
                div.innerHTML = `<div class="poster-card shadow-sm"><img src="${item.img}" class="card-img" alt="Content" loading="lazy"></div>`;
                const card = div.querySelector('.poster-card');
                card.onclick = () => handleNavigation(item.url, card);
                if(item.category === 'course') courseSlider.appendChild(div);
                else if(item.category === 'funda-1') funda1Slider.appendChild(div);
            });
        }

        function scrollToHero() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function scrollToSection(id) { 
            const el = document.getElementById(id);
            if(el) el.scrollIntoView({ behavior: 'smooth' });
        }

        function openLink(type) {
            if(type === 'hero') handleNavigation(config.heroUrl);
            if(type === 'google') handleNavigation(config.googleUrl);
            if(type === 'func6') handleNavigation('https://sites.google.com/np2c.edu.hk/dse-physics-update/home');
        }

        document.addEventListener('DOMContentLoaded', () => {
            render();
            if (window.location.hash === '#simulator') switchPage('simulator.html');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
            }, { threshold: 0.1 });
            setTimeout(() => { document.querySelectorAll('.card-animate').forEach(card => observer.observe(card)); }, 300);
        });
    </script>
</body>
</html>
