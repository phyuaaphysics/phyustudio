<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumina Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        :root {
            --glacier-deep: #0f172a;
            --glacier-primary: #0284c7; 
            --glacier-ice: #38bdf8;
            --glacier-bg: #eef2f6;
            --glacier-glass: rgba(238, 242, 246, 0.85);
            --glacier-nav-glass: rgba(255, 255, 255, 0.75);
        }

        html { 
            scroll-behavior: smooth; 
            height: 100%;
            overflow: hidden; 
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--glacier-bg);
            color: #334155;
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            overflow-y: auto;
            /* 頂部預留靈動島空間 */
            padding-top: env(safe-area-inset-top, 20px);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #page-loader {
            position: fixed; inset: 0; background-color: var(--glacier-bg); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
        }
        #page-loader.active { opacity: 1; visibility: visible; }
        
        /* Logo 欄位設置為 Sticky Menu */
        .logo-bar {
            position: sticky; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 110;
            background-color: var(--glacier-glass);
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(15, 23, 42, 0.05);
            padding-top: 8px;
            padding-bottom: 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #main-logo {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left center;
            will-change: transform;
        }

        /* 滾動時縮放 Logo (透過 JS 切換 scrolled class) */
        .scrolled #main-logo {
            transform: scale(0.75);
        }

        /* 分類欄也保持 Sticky，緊接在 logo-bar 之後 */
        .filter-bar {
            position: sticky; 
            top: 68px; /* 初始位置 */
            z-index: 100; 
            background-color: var(--glacier-bg);
            transition: top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 滾動時，因為 Logo 縮小了，分類欄也要向上微調位置以保持緊貼 */
        .scrolled .filter-bar {
            top: 56px; 
        }

        .filter-capsule {
            padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
            white-space: nowrap; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(15, 23, 42, 0.08); background: rgba(255, 255, 255, 0.5); color: #64748b;
        }
        .filter-capsule.active {
            background-color: var(--glacier-deep); color: #fff; border-color: var(--glacier-deep);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        .poster-card { 
            aspect-ratio: 2/3; border-radius: 12px; overflow: hidden; background: #cbd5e1; 
            position: relative; transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 8px 20px -8px rgba(15, 23, 42, 0.1);
        }

        .hero-container-framed {
            border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.1);
            overflow: hidden; position: relative; background-color: #fff; 
        }

        /* iOS Docking */
        .dock-wrapper {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
            width: auto;
            min-width: 340px;
        }

        .dock-wrapper.collapsed {
            transform: translateX(-50%) translateY(200px);
            opacity: 0;
        }

        .dock-nav {
            background-color: var(--glacier-nav-glass);
            backdrop-filter: blur(28px) saturate(210%);
            -webkit-backdrop-filter: blur(28px) saturate(210%);
            border: 1.5px solid rgba(255, 255, 255, 0.65);
            padding: 12px 14px;
            border-radius: 42px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        /* 觸控條位置 */
        .dock-trigger-bar {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 5px;
            background: rgba(15, 23, 42, 0.2);
            border-radius: 10px;
            z-index: 199;
            cursor: pointer;
            display: none;
        }
        .dock-wrapper.collapsed + .dock-trigger-bar {
            display: block;
        }

        .dock-toggle-btn {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            color: #cbd5e1; font-size: 11px; cursor: pointer; border-radius: 50%;
        }

        .dock-content { display: flex; align-items: center; gap: 20px; padding: 0 4px; }

        .dock-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: #94a3b8; transition: all 0.3s cubic-bezier(0.2, 0, 0.2, 1);
            position: relative; min-width: 58px;
        }

        .dock-item i { font-size: 1.6rem; transition: transform 0.3s, color 0.3s; }
        .dock-item span { font-size: 9px; font-weight: 500; opacity: 0.7; transition: all 0.3s; }

        .dock-item.active { color: var(--glacier-primary); }
        .dock-item.active i { transform: translateY(-3px); }
        .dock-item.active span { font-weight: 700; opacity: 1; }
        .dock-item.active::after {
            content: ''; position: absolute; bottom: -6px; width: 4px; height: 4px;
            background: var(--glacier-primary); border-radius: 50%;
        }

        .slider-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; padding-bottom: 20px; }
        .slider-item { scroll-snap-align: start; flex: 0 0 auto; }
        .section-title { font-size: 1.15rem; font-weight: 800; color: var(--glacier-deep); margin-bottom: 8px; }

        @media (max-width: 768px) {
            .hero-container-framed { border-radius: 0; }
            .dock-wrapper { width: 92%; max-width: 400px; }
        }
    </style>
</head>
<body class="pb-40 hide-scrollbar">

    <!-- Page Loader -->
    <div id="page-loader">
        <div class="flex flex-col items-center">
            <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-12 h-12 animate-pulse mb-4">
            <p class="text-[10px] font-black tracking-[0.3em] text-slate-400 uppercase">Glacier Stream</p>
        </div>
    </div>

    <!-- Header -->
    <header id="header-root">
        <!-- Sticky Logo Menu -->
        <div class="logo-bar px-6" id="logo-nav-bar"> 
            <div class="max-w-screen-2xl mx-auto flex items-center justify-between">
                <div class="cursor-pointer" onclick="scrollToHero()" id="main-logo">
                    <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="Lumina" class="h-12 w-auto">
                </div>
                <div class="flex items-center gap-6 text-slate-500">
                    <i class="fas fa-search text-xl opacity-60"></i>
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-white text-[10px] font-bold">U</div>
                </div>
            </div>
        </div>

        <div id="dynamic-filter-bar" class="filter-bar"> 
            <div class="max-w-screen-2xl mx-auto px-6 py-4">
                <div class="flex items-center gap-3 overflow-x-auto hide-scrollbar">
                    <button onclick="setFilter('all')" id="filter-all" class="filter-capsule active">全部項目</button>
                    <button onclick="setFilter('course')" id="filter-course" class="filter-capsule">課程全庫</button>
                    <button onclick="setFilter('practice')" id="filter-practice" class="filter-capsule">基礎練習</button>
                    <button onclick="toggleGenreMenu()" id="filter-genre" class="filter-capsule flex items-center gap-2">
                        分類 <i class="fas fa-caret-down text-[10px]"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div id="page-home">
        <section id="hero" class="px-4 md:px-12 max-w-screen-2xl mx-auto">
            <div class="hero-container-framed relative w-full h-[65vh] md:h-[75vh]">
                <img src="https://phyuaaphysics.github.io/phyustudio/topcover.png" class="absolute inset-0 w-full h-full object-cover object-top">
                <div class="absolute inset-0 flex flex-col items-center justify-end pb-16 px-6 text-center">
                    <img src="https://phyuaaphysics.github.io/phyustudio/banner.png" class="w-full max-w-[260px] md:max-w-[450px] mb-12">
                    <button onclick="openLink('hero')" class="bg-slate-900 text-white px-16 py-4 font-black rounded-full text-[11px] tracking-[0.3em] uppercase shadow-2xl">
                        進入録影庫
                    </button>
                </div>
            </div>
        </section>

        <main class="mt-12 space-y-12 max-w-screen-2xl mx-auto px-6">
            <section id="sec-course">
                <h2 class="section-title">核心課程全庫</h2>
                <div class="slider-container hide-scrollbar" id="course-slider"></div>
            </section>
            <section id="sec-practice-1">
                <h2 class="section-title">基礎練習冊 01-10</h2>
                <div class="slider-container hide-scrollbar" id="funda-1-slider"></div>
            </section>
        </main>
    </div>

    <!-- iOS Docking Navigation -->
    <div id="dock-nav-wrapper" class="dock-wrapper">
        <nav class="dock-nav">
            <div class="dock-toggle-btn" onclick="toggleDock()">
                <i class="fas fa-chevron-down"></i>
            </div>
            
            <div class="dock-content">
                <button onclick="scrollToHero()" class="dock-item active">
                    <i class="fas fa-home"></i>
                    <span class="uppercase">錄影庫</span>
                </button>
                <button onclick="handleNavigation('https://phyuaaphysics.github.io/phyustudio/simulation.html')" class="dock-item">
                    <i class="fas fa-cube"></i>
                    <span class="uppercase">模擬器</span>
                </button>
                <button onclick="handleNavigation('https://phyuaaphysics.github.io/phyustudio/functionhub.html')" class="dock-item">
                    <i class="fas fa-shapes"></i>
                    <span class="uppercase">功能區</span>
                </button>
                <button onclick="openLink('google')" class="dock-item">
                    <i class="fab fa-google"></i>
                    <span class="uppercase">郵箱</span>
                </button>
            </div>

            <div class="dock-toggle-btn" onclick="toggleDock()">
                <i class="fas fa-chevron-down"></i>
            </div>
        </nav>
    </div>

    <!-- Device Handle -->
    <div id="dock-handle" onclick="toggleDock()" class="dock-trigger-bar"></div>

    <script>
        const config = {
            heroUrl: 'https://sites.google.com/np2c.edu.hk/2526physicslessonrecordingsem2/home',
            googleUrl: 'https://mail.google.com/mail/u/0/#inbox',
            data: [
                { category: 'course', genre: 'heat', img: 'https://phyuaaphysics.github.io/phyustudio/vb-1-heat.jpg', url: 'https://sites.google.com/np2c.edu.hk/heatcourse/home' },
                { category: 'course', genre: 'mech', img: 'https://phyuaaphysics.github.io/phyustudio/vb-2-mech.jpg', url: 'https://sites.google.com/np2c.edu.hk/mechanics-all/home' },
                { category: 'course', genre: 'wave', img: 'https://phyuaaphysics.github.io/phyustudio/vb-3-wave.jpg', url: 'https://sites.google.com/np2c.edu.hk/wave/home' },
                { category: 'funda-1', genre: 'mech', img: 'https://phyuaaphysics.github.io/phyustudio/fundaS301.png', url: '#' },
                { category: 'funda-1', genre: 'mech', img: 'https://phyuaaphysics.github.io/phyustudio/fundaS302.png', url: '#' }
            ]
        };

        const loader = document.getElementById('page-loader');

        function toggleDock() {
            document.getElementById('dock-nav-wrapper').classList.toggle('collapsed');
        }

        function setFilter(type) {
            document.querySelectorAll('.filter-capsule').forEach(b => b.classList.remove('active'));
            document.getElementById(`filter-${type}`).classList.add('active');
            render(type);
        }

        function handleNavigation(url, element) {
            if (!url || url === '#') return;
            if (element) element.classList.add('card-clicking');
            loader.classList.add('active');
            setTimeout(() => { window.location.href = url; }, 400);
        }

        function render(filterType = 'all') {
            const containers = { 
                'course': document.getElementById('course-slider'), 
                'funda-1': document.getElementById('funda-1-slider')
            };
            Object.values(containers).forEach(c => { if(c) c.innerHTML = ''; });

            config.data.forEach(item => {
                if (filterType !== 'all' && item.category !== filterType && !(filterType === 'practice' && item.category.startsWith('funda'))) return;
                
                const div = document.createElement('div');
                div.className = `slider-item w-32 md:w-56`;
                div.innerHTML = `<div class="poster-card"><img src="${item.img}" class="w-full h-full object-cover"></div>`;
                div.onclick = () => handleNavigation(item.url, div.firstChild);
                if (containers[item.category]) containers[item.category].appendChild(div);
            });
        }

        // 監聽滾動邏輯 - 修正監聽對象為 window 以確保滾動事件被捕捉
        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY || document.documentElement.scrollTop;
            const logoNavBar = document.getElementById('logo-nav-bar');
            
            if (scrollPos > 30) {
                document.body.classList.add('scrolled');
            } else {
                document.body.classList.remove('scrolled');
            }
        }, { passive: true });

        function scrollToHero() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        
        function openLink(type) {
            if(type === 'hero') handleNavigation(config.heroUrl);
            if(type === 'google') handleNavigation(config.googleUrl);
        }

        document.addEventListener('DOMContentLoaded', () => {
            render();
            setTimeout(() => loader.classList.remove('active'), 500);
        });
    </script>
</body>
</html>
