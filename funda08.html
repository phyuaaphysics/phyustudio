<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumina Studio - ${volId}</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        :root { --mint-primary: #10b981; --anim-os: 1.2s cubic-bezier(0.25, 1, 0.3, 1); }
        html, body { height: 100dvh; width: 100%; margin: 0; overflow: hidden; position: fixed; font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f8fafc; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
        .hero-full { position: absolute; inset: 0; z-index: 100; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s; }
        #hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.2) brightness(1.05); }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%); z-index: 5; }
        .hero-glass-panel { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 40px; padding: 3.5rem 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); width: min(90%, 540px); display: flex; flex-direction: column; align-items: center; z-index: 20; }
        .hero-content-wrapper { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; }
        .fade-exit-up { opacity: 0; transform: translateY(-150px) scale(0.9); visibility: hidden; }
        .modal-window { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(60px); -webkit-backdrop-filter: blur(60px); transform: translateY(110vh); z-index: 310; display: none; opacity: 0; transition: all var(--anim-os); }
        .modal-window.open { display: flex; flex-direction: column; opacity: 1; transform: translateY(0); }
        .window-header { height: 54px; display: flex; align-items: center; padding: 0 12px; background: rgba(255, 255, 255, 0.4); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .tab-strip { flex: 1; display: flex; gap: 4px; overflow-x: auto; align-items: flex-end; scrollbar-width: none; }
        .browser-tab { height: 38px; min-width: 130px; background: rgba(0, 0, 0, 0.05); border-radius: 12px 12px 0 0; display: flex; align-items: center; padding: 0 12px; gap: 8px; cursor: pointer; font-size: 11px; font-weight: 700; color: #4b5563; }
        .browser-tab.active { background: rgba(255, 255, 255, 0.7); }
        .list-item-row { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid rgba(0, 0, 0, 0.05); cursor: pointer; }
        .list-item-row.locked { opacity: 0.5; background: rgba(0,0,0,0.02); }
        .resource-drawer { max-height: 0; overflow: hidden; background: #f1f5f9; transition: max-height 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
        .resource-drawer.expanded { max-height: 3000px; }
        .resource-iframe { width: 100%; height: 75vh; border: none; }
        .login-input { width: 100%; background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 15px; padding: 12px; margin-bottom: 12px; text-align: center; }
        #page-loader { position: fixed; inset: 0; background: #fff; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #custom-alert { position: fixed; top: 40px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); padding: 12px 24px; border-radius: 30px; z-index: 2000; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid rgba(16, 185, 129, 0.2); }
        #custom-alert.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="page-loader"><img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-16 h-16 animate-pulse"></div>
    <div id="custom-alert"><i class="fas fa-shield-alt text-emerald-500 mr-2"></i><span id="alert-text" class="text-xs font-bold text-gray-700 uppercase"></span></div>
    
    <div id="main-browser-window" class="modal-window">
        <div class="window-header">
            <div id="browser-tab-strip" class="tab-strip"></div>
            <div class="flex items-center gap-3 px-4">
                <div id="user-role-display" class="bg-emerald-500 text-white text-[9px] px-3 py-1 rounded-full font-black tracking-tighter uppercase"></div>
                <button onclick="location.reload()" class="w-8 h-8 rounded-full hover:bg-red-50 text-gray-400 hover:text-red-500"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
        <div id="browser-window-body" class="overflow-y-auto flex-1"></div>
    </div>

    <section class="hero-full">
        <img id="hero-bg" src="">
        <div class="hero-overlay"></div>
        <div class="hero-content-wrapper">
            <div id="hero-main-content" class="hero-glass-panel">
                <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="h-14 w-14 mb-6">
                <h1 id="hero-title" class="text-3xl md:text-4xl tracking-[0.3em] uppercase mb-2 text-gray-800" style="font-family: 'Cinzel', serif;">LUMINA</h1>
                <p id="hero-subtitle" class="text-xl font-bold tracking-[0.8em] mb-10 opacity-80 uppercase text-gray-600 pl-[0.8em]"></p>
                <div class="w-full max-w-[300px] mb-6">
                    <input type="text" id="login-username" class="login-input" placeholder="USERNAME">
                    <input type="password" id="login-password" class="login-input" placeholder="PASSWORD">
                </div>
                <button id="login-btn" onclick="handleLoginAndBrowse()" class="px-16 py-4 font-black rounded-full text-[10px] tracking-[0.5em] uppercase shadow-sm transition-all transform active:scale-95 bg-white/20 backdrop-blur-md border border-white/40">Verify & Browse</button>
                <p id="client-ver" class="mt-8 text-[8px] font-black tracking-[0.5em] opacity-20">V.CLIENT.03</p>
            </div>
        </div>
    </section>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwzPY88-wGNC0GMVxh3jljqrxYzsa2dW4IK2iNDXpQxpaPgcgNffH4VqNXd6Z3CO9I/exec";
        const HERO_CSV_URL = "https://docs.google.com/spreadsheets/d/1IgDOw4tg-PqlqtzugwbtuPj3NrrLOJY9h428ntLDCxg/gviz/tq?tqx=out:csv&sheet=${volId}";
        let courseData = []; let openTabs = []; let activeTabId = null; let currentUser = null; 

        async function initHero() {
            try {
                const response = await fetch(HERO_CSV_URL); 
                const text = await response.text(); 
                const rows = parseCSV(text);
                let heroInfo = { title: "Lumina", subtitle: "Studio", bg: "" };
                rows.forEach(row => {
                    if (row[0] === 'HEROSECTION') {
                        if (row[1] === 'CONTENT_1') heroInfo.title = row[4];
                        if (row[1] === 'CONTENT_2') heroInfo.subtitle = row[4];
                        if (row[1] === 'PHOTO') heroInfo.bg = row[4];
                    }
                });
                document.getElementById('hero-title').innerText = heroInfo.title;
                document.getElementById('hero-subtitle').innerText = heroInfo.subtitle;
                document.getElementById('hero-bg').src = heroInfo.bg;
                setTimeout(() => { document.getElementById('page-loader').style.opacity = '0'; setTimeout(()=>document.getElementById('page-loader').style.display='none',500); }, 800);
            } catch (e) { document.getElementById('page-loader').style.display='none'; }
        }

        async function handleLoginAndBrowse() {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const btn = document.getElementById('login-btn');
            if (!u || !p) { showAlert("請輸入憑據"); return; }
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> CONNECTING...';
            
            try {
                const params = new URLSearchParams({ action: 'loginAndFetch', u: u, p: p, sheet: '${volId}', _t: Date.now() });
                const res = await fetch(`${GAS_URL}?${params.toString()}`, { method: 'GET', mode: 'cors' });
                if (!res.ok) throw new Error("Network Error");
                const result = await res.json();
                if (result.error) { showAlert("驗證失敗"); btn.disabled = false; btn.innerText = 'Verify & Browse'; return; }
                currentUser = result.user; courseData = result.courseData;
                document.getElementById('user-role-display').innerText = currentUser.role.toUpperCase();
                openTab("Browse ALL", "FOLDER");
            } catch (e) {
                showAlert("無法連接中繼站");
                btn.disabled = false; btn.innerText = 'Verify & Browse';
            }
        }

        function openTab(title, type) {
            const id = type === 'FOLDER' ? 'ROOT' : type + "_" + title.replace(/\s+/g, '');
            if (openTabs.find(t => t.id === id)) { switchTab(id); return; }
            openTabs.push({ id, title, type });
            const page = document.createElement('div'); page.id = `page-${id}`; page.className = 'win-content-page h-full w-full hidden';
            document.getElementById('browser-window-body').appendChild(page);
            if (type === 'FOLDER') renderFolderView(page.id); else renderHWView(title, page.id);
            switchTab(id);
            const win = document.getElementById('main-browser-window');
            win.style.display = 'flex'; document.getElementById('hero-main-content').classList.add('fade-exit-up');
            setTimeout(() => win.classList.add('open'), 50);
        }

        function switchTab(id) {
            activeTabId = id;
            document.querySelectorAll('.win-content-page').forEach(p => p.classList.add('hidden'));
            const target = document.getElementById(`page-${id}`); if(target) target.classList.remove('hidden');
            renderTabStrip();
        }

        function renderTabStrip() {
            const strip = document.getElementById('browser-tab-strip'); strip.innerHTML = '';
            openTabs.forEach(t => {
                const el = document.createElement('div'); el.className = `browser-tab ${activeTabId === t.id ? 'active' : ''}`;
                el.innerHTML = `<div class="flex items-center gap-2 flex-1 overflow-hidden" onclick="switchTab('${t.id}')"><i class="fas ${t.type==='FOLDER'?'fa-th-list':'fa-file-alt'} text-emerald-500"></i><span class="truncate uppercase">${t.title}</span></div>`;
                strip.appendChild(el);
            });
        }

        function renderFolderView(pid) {
            const hwIDs = [...new Set(courseData.filter(r => String(r[0]).startsWith('HW')).map(r => r[0]))].sort();
            let html = '<div class="max-w-4xl mx-auto py-6">';
            hwIDs.forEach(id => {
                html += `<div class="list-item-row" onclick="openTab('${id}', 'HW')"><div class="flex items-center gap-4"><div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center"><i class="fas fa-folder"></i></div><span class="font-black text-gray-800">${id}</span></div><i class="fas fa-chevron-right text-emerald-300 text-xs"></i></div>`;
            });
            document.getElementById(pid).innerHTML = html + '</div>';
        }

        function renderHWView(hwName, pid) {
            const records = courseData.filter(r => r[0] === hwName);
            const userRole = currentUser.role.toLowerCase();
            let html = '<div class="max-w-4xl mx-auto py-4">';
            records.forEach((row, idx) => {
                const type = row[1], label = row[2], access = String(row[3]), url = row[4];
                const isLocked = !(userRole === 'teacher' || access === 'ACTIVE' || access.toLowerCase().split(',').includes(userRole));
                const sid = hwName.replace(/\W/g,'') + idx;
                html += `<div class="border-b border-gray-50"><div class="list-item-row ${isLocked ? 'locked' : ''}" onclick="toggleD('${sid}', ${isLocked})"><div class="flex items-center gap-4"><i class="fas ${isLocked?'fa-lock text-gray-300':'fa-play-circle text-emerald-500'}"></i><span class="text-xs font-bold text-gray-700">${label}</span></div></div>${!isLocked ? `<div id="d-${sid}" class="resource-drawer"><iframe src="${url}" class="resource-iframe"></iframe></div>` : ''}</div>`;
            });
            document.getElementById(pid).innerHTML = html + '</div>';
        }

        function toggleD(id, L) { if(L) { showAlert("權限不足"); return; } document.getElementById(`d-${id}`).classList.toggle('expanded'); }
        function parseCSV(t) { const rows = []; let cur = [], f = '', q = false; for (let i = 0; i < t.length; i++) { const c = t[i]; if (q) { if (c === '"' && t[i+1] === '"') { f += '"'; i++; } else if (c === '"') q = false; else f += c; } else { if (c === '"') q = true; else if (c === ',') { cur.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (f || cur.length > 0) { cur.push(f); rows.push(cur); cur = []; f = ''; } if (c === '\r' && t[i+1] === '\n') i++; } else f += c; } } if (f || cur.length > 0) { cur.push(f); rows.push(cur); } return rows; }
        function showAlert(t) { const el = document.getElementById('custom-alert'); document.getElementById('alert-text').innerText = t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3000); }
        window.onload = initHero;
    </script>
</body>
</html>
