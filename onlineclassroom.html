<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PH Studio - 學生登入系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- Lucide Icons for responsive elements -->
    <script src="https://unpkg.com/lucide@latest">
    </script>
    <!-- jsPDF + AutoTable for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <!-- html2canvas for capturing rendered HTML (preserves Chinese fonts) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* 引入 Cinzel、Inter、Shippori Mincho 與 Sofia Sans 字型 */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Shippori+Mincho:wght@700&family=Sofia+Sans:wght@700;800;900&display=swap');

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-image: url('https://i.ibb.co/yn7JJ8yy/classroom.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .cinzel-title {
            font-family: 'Cinzel', serif;
        }

        .shippori-title {
            font-family: 'Shippori Mincho', serif;
            font-weight: 700;
        }

        .sofia-font {
            font-family: 'Sofia Sans', sans-serif;
        }

        /* 減少玻璃透明度，提高遮罩實色（更清晰易讀） */
        .crystal-panel {
            background: rgba(255, 255, 255, 0.78);
            /* 淡白色重度磨砂 */
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        /* 对称淺色膠囊型輸入框 */
        .pill-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(15, 23, 42, 0.12);
            color: #0f172a;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pill-input:focus {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(16, 185, 129, 0.5);
            /* 薄荷綠邊框 */
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
            outline: none;
        }

        .pill-input::placeholder {
            color: rgba(15, 23, 42, 0.5);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        /* 漸進式淡入動畫 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* OS 風格擬真彈性阻尼進場動畫 */
        @keyframes osDamping {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
                filter: blur(8px);
            }
            55% {
                opacity: 0.9;
                transform: translateY(-6px) scale(1.01);
                filter: blur(0px);
            }
            75% {
                transform: translateY(2px) scale(0.997);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }
        .animate-os-damping {
            animation: osDamping 1.1s cubic-bezier(0.25, 1, 0.2, 1) forwards;
        }

        /* iOS 級別阻尼淡入動畫 (用於 Menu Card 展開) */
        @keyframes iosMenuEntrance {
            0% {
                opacity: 0;
                transform: translateY(35px) scale(0.96);
                filter: blur(10px);
            }
            60% {
                transform: translateY(-3px) scale(1.006);
                filter: blur(0px);
            }
            80% {
                transform: translateY(1px) scale(0.998);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }
        .animate-ios-menu {
            animation: iosMenuEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* iOS 級別阻尼淡出動畫 (用於 Login Section 退出) */
        @keyframes iosLoginExit {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(0.94) translateY(-30px);
                filter: blur(12px);
            }
        }
        .animate-ios-exit {
            animation: iosLoginExit 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* iOS 級別超慢阻尼影音遮罩進場動畫 (淡入與優雅縮小回彈) */
        @keyframes iosOverlayEntrance {
            0% {
                opacity: 0;
                transform: scale(1.08);
                backdrop-filter: blur(0px) saturate(100%);
                -webkit-backdrop-filter: blur(0px) saturate(100%);
                background-color: rgba(255, 255, 255, 0);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                backdrop-filter: blur(30px) saturate(160%);
                -webkit-backdrop-filter: blur(30px) saturate(160%);
                background-color: rgba(255, 255, 255, 0.85);
            }
        }
        .animate-ios-overlay-enter {
            animation: iosOverlayEntrance 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* iOS 級別超慢阻尼影音遮罩退場動畫 (淡入與優雅放大消散) */
        @keyframes iosOverlayExit {
            0% {
                opacity: 1;
                transform: scale(1);
                backdrop-filter: blur(30px) saturate(160%);
                -webkit-backdrop-filter: blur(30px) saturate(160%);
                background-color: rgba(255, 255, 255, 0.85);
            }
            100% {
                opacity: 0;
                transform: scale(1.08);
                backdrop-filter: blur(0px) saturate(100%);
                -webkit-backdrop-filter: blur(0px) saturate(100%);
                background-color: rgba(255, 255, 255, 0);
            }
        }
        .animate-ios-overlay-exit {
            animation: iosOverlayExit 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* iOS 級別阻尼彈簧動畫 (學生個人檔案專用) */
        @keyframes iosProfileEntrance {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes iosProfileExit {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.92);
            }
        }
        .animate-profile-enter {
            animation: iosProfileEntrance 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .animate-profile-exit {
            animation: iosProfileExit 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* iOS 級別日曆展開／收合動畫 */
        #calendar-panel {
            transition: all 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .calendar-collapsed {
            max-height: 0 !important;
            transform: scale-y(0) !important;
            opacity: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            border-top-width: 0 !important;
            border-bottom-width: 0 !important;
            pointer-events: none !important;
        }

        .calendar-day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* profile iframe 满版适配 */
        #profile-iframe, #membership-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* 🆕 呼吸灯泡闪烁动画 (仅光影闪烁，不缩放) */
        @keyframes sparkle {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 0px currentColor;
            }
            50% {
                opacity: 0.4;
                text-shadow: 0 0 12px currentColor, 0 0 24px currentColor;
            }
        }
        .sparkle-text {
            display: inline-block;
            animation: sparkle 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-6 text-slate-800 relative">

    <!-- 頂部磨砂背景裝飾，確保邊角美觀 -->
    <div class="absolute inset-0 bg-black/5 pointer-events-none"></div>

    <!-- Header Brand (置頂，在登入狀態下顯現，非登入時隱性融入) -->
    <header class="w-full max-w-4xl flex justify-end items-center py-2 z-10 shrink-0">
        <div id="secure-badge" class="text-[10px] tracking-widest text-slate-800/80 bg-white/20 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/20 shadow-sm">
            SECURE CHANNEL
        </div>
    </header>

    <!-- Main Portal Section (置頂排版，極大化空間利用率) -->
    <main class="w-full max-w-4xl flex-1 flex flex-col items-center justify-start mt-2 mb-6 z-10">

        <!-- ========================================== -->
        <!-- SECTION 1: 極致美學登入面板 (預設隱藏以防 token 驗證時閃爍) -->
        <!-- ========================================== -->
        <div id="login-section" class="crystal-panel w-full max-w-[440px] p-10 md:p-12 text-center rounded-[2.5rem] animate-os-damping mt-6 shadow-2xl hidden">

            <!-- 官方 APP ICON (直角矩形置中，不使用圓角) -->
            <div class="flex justify-center mb-8">
                <div class="w-14 h-14 bg-white/30 p-0.5 border border-white/40 shadow-inner flex items-center justify-center">
                    <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="PH Logo" class="w-full h-full" />
                </div>
            </div>

            <!-- 標題：Shippori Mincho 襯線字型與優雅寬字距 -->
            <div class="mb-10">
                <h2 class="text-2xl md:text-[2rem] font-bold tracking-[0.15em] text-slate-900 shippori-title leading-tight">
                    線上補課系統
                </h2>
                <h3 class="text-xs tracking-[0.4em] text-slate-300/70 cinzel-title mt-3.5 uppercase">
                    Student Portal
                </h3>

                <div class="w-6 h-[1px] bg-white/30 mx-auto mt-4"></div>
            </div>

            <!-- 登入表單 -->
            <form id="login-form" class="space-y-5">

                <!-- 帳號輸入膠囊 -->
                <div class="relative">
                    <input type="text" id="username" required placeholder="Username" class="pill-input w-full px-6 py-3.5 rounded-full text-sm font-light tracking-wide" />
                </div>

                <!-- 密碼輸入膠囊 -->
                <div class="relative">
                    <input type="password" id="password" required placeholder="Password" class="pill-input w-full px-6 py-3.5 rounded-full text-sm font-light tracking-wide" />
                    <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-800/45 hover:text-slate-900 transition">
                        <i data-lucide="eye" id="pw-icon" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- 錯誤訊息提示區 -->
                <div id="error-msg" class="hidden bg-rose-50/70 border border-rose-300 text-rose-800 p-3.5 rounded-2xl text-xs text-left flex items-start space-x-2 animate-fadeIn shadow-sm">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5 text-rose-400"></i>
                    <span id="error-text" class="leading-relaxed font-medium"></span>
                </div>

                <!-- 登入按鈕膠囊 (對稱高質感深色對比按鈕) -->
                <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs tracking-[0.25em] uppercase py-4 rounded-full shadow-md hover:shadow-lg transition duration-300 transform active:scale-98 flex items-center justify-center space-x-2">
                    <span>Login & Verify</span>
                </button>

            </form>

            <!-- 底部安全圖示 -->
            <div class="flex justify-center mt-10">
                <div class="w-10 h-10 rounded-full bg-emerald-500/10 border border-emerald-400/20 flex items-center justify-center text-emerald-600 shadow-sm">
                    <i data-lucide="cloud" class="w-4 h-4"></i>
                </div>
            </div>

        </div>

        <!-- ========================================== -->
        <!-- SECTION 2: 學生學籍資料卡片 & 課室版面 (登入成功) -->
        <!-- ========================================== -->
        <div id="card-section" class="w-full hidden space-y-4">

            <!-- 頂部高質感導航工具列 -->
            <div class="flex justify-end items-center px-1">
                <!-- 右側：精簡功能快捷按鈕 (僅保留登出與關機重定向功能) -->
                <div class="flex items-center space-x-2">
                    <!-- 登出/返回系統按鈕 -->
                    <button id="logout-btn" class="w-7 h-7 rounded-full bg-white/50 hover:bg-rose-500/20 hover:border-rose-500/30 border border-slate-900/[0.08] flex items-center justify-center text-slate-800 hover:text-rose-600 transition" title="登出系統">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    </button>

                    <!-- 系統關機符號 (重定向回首頁) -->
                    <button id="power-btn" class="w-7 h-7 rounded-full bg-white/40 hover:bg-white/60 border border-slate-900/[0.08] flex items-center justify-center text-slate-500 hover:text-slate-800 transition" title="返回主頁面">
                        <i data-lucide="power" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <!-- 核心面板一：學生帳戶資訊卡（會員狀態置於底部新行） -->
            <div class="crystal-panel rounded-2xl p-4 flex flex-col gap-3">

                <!-- 第一行：左側（學生資訊） + 右側（班別、學號、日曆） -->
                <div class="flex flex-row justify-between items-center gap-4">
                    <!-- 左側：帳戶名稱與身份標誌 — 點擊整個區域開啟學生檔案 iframe -->
                    <div id="student-profile-trigger" class="flex items-center space-x-4 cursor-pointer select-none">
                        <!-- 薄荷綠圓形學士帽圖示 -->
                        <div class="w-11 h-11 bg-emerald-500/10 border border-emerald-400/20 rounded-full flex items-center justify-center text-emerald-700 shadow-sm shrink-0">
                            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                        </div>
                        <div class="text-left">
                            <h3 id="card-real-name" class="text-xl font-bold tracking-wide text-slate-900 shippori-title">--</h3>
                            <p class="text-[9px] text-slate-500 font-medium tracking-widest uppercase">學生個人帳戶</p>
                        </div>
                    </div>

                    <!-- 右側：班級、學號、日曆按鈕（不含會員狀態） -->
                    <div class="flex items-center gap-3 md:gap-4 text-right pr-1 shrink-0 flex-wrap justify-end">
                        <!-- 班別 -->
                        <div>
                            <p class="text-[9px] tracking-wider text-slate-500 uppercase font-medium">班別</p>
                            <p id="card-class" class="text-base font-extrabold text-emerald-800 tracking-wide">--</p>
                        </div>

                        <!-- 垂直精細分割線 -->
                        <div class="w-[1px] h-6 bg-slate-900/10 hidden sm:block"></div>

                        <!-- 學號 -->
                        <div>
                            <p class="text-[9px] tracking-wider text-slate-500 uppercase font-medium">學號</p>
                            <p id="card-class-no" class="text-base font-extrabold text-emerald-800 tracking-wide">--</p>
                        </div>

                        <!-- 垂直精細分割線 -->
                        <div class="w-[1px] h-6 bg-slate-900/10 hidden sm:block"></div>

                        <!-- 日曆展開/收合按鈕 -->
                        <button id="calendar-toggle-btn" class="w-9 h-9 rounded-full bg-white/60 hover:bg-emerald-50/80 hover:text-emerald-700 border border-slate-900/[0.08] flex items-center justify-center text-slate-700 transition duration-300 active:scale-90 shadow-sm" title="開啟補課日曆">
                            <i data-lucide="calendar" class="w-4.5 h-4.5"></i>
                        </button>
                    </div>
                </div>

                <!-- 第二行：會員狀態（右對齊） -->
                <!-- 修改：將 items-start 改為 items-end，內部元素添加 text-right 實現右對齊 -->
                <div class="flex flex-col items-end w-full pt-2 border-t border-slate-900/10 mt-1">
                    <div class="flex items-center gap-1 text-right">
                        <p class="text-[9px] tracking-wider text-slate-500 uppercase font-medium">會員狀態</p>
                        <button id="membership-info-trigger" class="w-3.5 h-3.5 rounded-full bg-slate-200 hover:bg-emerald-500 hover:text-white flex items-center justify-center text-[9px] font-bold text-slate-600 transition" title="點擊了解更多">?</button>
                    </div>
                    <p id="card-membership" class="text-2xl md:text-3xl font-black text-slate-850 tracking-wide sofia-font text-right">--</p>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- iOS 風格折疊日曆主面板 -->
            <!-- ========================================== -->
            <div id="calendar-panel" class="crystal-panel rounded-2xl p-4 origin-top calendar-collapsed overflow-hidden space-y-4">
                <div class="flex items-center justify-between border-b border-slate-900/5 pb-2">
                    <button id="cal-prev-month" class="p-1.5 hover:bg-slate-200/50 rounded-full text-slate-600 transition active:scale-90">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    <h4 id="cal-month-year" class="text-sm font-bold text-slate-800 shippori-title tracking-wide">--</h4>
                    <button id="cal-next-month" class="p-1.5 hover:bg-slate-200/50 rounded-full text-slate-600 transition active:scale-90">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendar-days" class="grid grid-cols-7 gap-1">
                    <!-- JS 動態寫入 -->
                </div>
                <!-- 狀態圖例與重設按鈕 -->
                <div class="flex justify-between items-center text-[11px] text-slate-500 pt-2 border-t border-slate-900/5">
                    <span class="flex items-center gap-1.5 font-medium text-slate-600">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block shadow-sm"></span>
                        有補課課堂日期
                    </span>
                    <button id="cal-reset-btn" class="px-3 py-1 rounded-full bg-white hover:bg-rose-50 text-slate-700 hover:text-rose-600 bord
</body>
</html>
