<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PH Studio - 學生登入系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 引入 Cinzel (優雅古典襯線體) 與 Inter (極簡現代無襯線體) */
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-image: url('https://i.ibb.co/bgLYLMKs/image.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .cinzel-title {
      font-family: 'Cinzel', serif;
    }

    /* 極致輕盈的淡白色磨砂卡片（高度還原物理高光質感） */
    .crystal-panel {
      background: rgba(255, 255, 255, 0.45);
      /* 淡白色重度磨砂 */
      backdrop-filter: blur(40px) saturate(160%);
      -webkit-backdrop-filter: blur(40px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 30px 60px rgba(15, 23, 42, 0.1), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    /* 對稱淺色膠囊型輸入框 */
    .pill-input {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(15, 23, 42, 0.12);
      color: #0f172a;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .pill-input:focus {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(16, 185, 129, 0.5); /* 薄荷綠邊框 */
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
      outline: none;
    }

    .pill-input::placeholder {
      color: rgba(15, 23, 42, 0.5);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    /* 漸進式淡入動畫 */
    @keyframes fadeIn {
      from { 
        opacity: 0;
        transform: translateY(10px); 
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in {
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-6 text-slate-800 relative">

  <div class="absolute inset-0 bg-black/5 pointer-events-none"></div>

  <header class="w-full max-w-4xl flex justify-end items-center py-2 z-10 shrink-0">
    <div id="secure-badge" class="text-[10px] tracking-widest text-slate-800/80 bg-white/20 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/20 shadow-sm">
      SECURE CHANNEL
    </div>
  </header>

  <main class="w-full max-w-4xl flex-1 flex flex-col items-center justify-start mt-2 mb-6 z-10">

    <div id="login-section" class="crystal-panel w-full max-w-[440px] p-10 md:p-12 text-center rounded-[2.5rem] animate-fade-in mt-6 shadow-2xl hidden">
      
      <div class="flex justify-center mb-8">
        <div class="w-14 h-14 bg-white/30 p-0.5 border border-white/40 shadow-inner flex items-center justify-center">
          <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="PH Logo" class="w-full h-full">
        </div>
      </div>

      <div class="mb-10">
        <h2 class="text-2xl md:text-[2rem] font-semibold tracking-[0.15em] text-slate-900 cinzel-title leading-tight">
          ONLINE CLASSROOM
        </h2>
        <h3 class="text-xs tracking-[0.4em] text-slate-300/70 cinzel-title mt-3.5 uppercase">
          Student Portal
        </h3>
        
        <div class="w-6 h-[1px] bg-white/30 mx-auto mt-4"></div>
      </div>

      <form id="login-form" class="space-y-5">
        
        <div class="relative">
          <input type="text" id="username" required placeholder="Username"
                 class="pill-input w-full px-6 py-3.5 rounded-full text-sm font-light tracking-wide">
        </div>

        <div class="relative">
          <input type="password" id="password" required placeholder="Password"
                 class="pill-input w-full px-6 py-3.5 rounded-full text-sm font-light tracking-wide">
          <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-800/45 hover:text-slate-900 transition">
            <i data-lucide="eye" id="pw-icon" class="w-4 h-4"></i>
          </button>
        </div>

        <div id="error-msg" class="hidden bg-rose-50/70 border border-rose-300 text-rose-800 p-3.5 rounded-2xl text-xs text-left flex items-start space-x-2 animate-fadeIn shadow-sm">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5 text-rose-400"></i>
          <span id="error-text" class="leading-relaxed font-medium"></span>
        </div>

        <button type="submit" id="submit-btn"
                class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs tracking-[0.25em] uppercase py-4 rounded-full shadow-md hover:shadow-lg transition duration-300 transform active:scale-98 flex items-center justify-center space-x-2">
          <span>Login & Verify</span>
        </button>

      </form>

      <div class="flex justify-center mt-10">
        <div class="w-10 h-10 rounded-full bg-emerald-500/10 border border-emerald-400/20 flex items-center justify-center text-emerald-600 shadow-sm">
          <i data-lucide="cloud" class="w-4 h-4"></i>
        </div>
      </div>

    </div>

    <div id="card-section" class="w-full hidden animate-fade-in space-y-4">
      
      <div class="flex justify-end items-center px-1">
        <div class="flex items-center space-x-2">
          <span class="w-7 h-7 rounded-full bg-emerald-500 text-slate-950 font-bold text-[11px] flex items-center justify-center shadow-md shadow-emerald-500/20">
            S4
          </span>
          
          <button class="w-7 h-7 rounded-full bg-white/40 hover:bg-white/60 border border-slate-900/[0.08] flex items-center justify-center text-slate-800 transition">
            <i data-lucide="list" class="w-3.5 h-3.5"></i>
          </button>

          <button class="w-7 h-7 rounded-full bg-white/40 hover:bg-white/60 border border-slate-900/[0.08] flex items-center justify-center text-slate-800 transition">
            <i data-lucide="cloud" class="w-3.5 h-3.5"></i>
          </button>

          <button id="logout-btn" class="w-7 h-7 rounded-full bg-white/50 hover:bg-rose-500/20 hover:border-rose-500/30 border border-slate-900/[0.08] flex items-center justify-center text-slate-800 hover:text-rose-600 transition" title="登出系統">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          </button>

          <button class="w-7 h-7 rounded-full bg-white/40 hover:bg-white/60 border border-slate-900/[0.08] flex items-center justify-center text-slate-500 hover:text-slate-800 transition">
            <i data-lucide="power" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <div class="crystal-panel rounded-2xl p-4 flex flex-row justify-between items-center gap-4">
        
        <div class="flex items-center space-x-4">
          <div class="w-11 h-11 bg-emerald-500/10 border border-emerald-400/20 rounded-full flex items-center justify-center text-emerald-700 shadow-sm shrink-0">
            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
          </div>
          <div class="text-left">
            <h3 id="card-real-name" class="text-xl font-bold tracking-wide text-slate-900 cinzel-title">--</h3>
            <p class="text-[9px] text-slate-500 font-medium tracking-widest uppercase">學生個人帳戶</p>
          </div>
        </div>

        <div class="flex items-center gap-8 text-right pr-1 shrink-0">
          <div>
            <p class="text-[9px] tracking-wider text-slate-500 uppercase font-medium">班別</p>
            <p id="card-class" class="text-base font-extrabold text-emerald-800 tracking-wide">--</p>
          </div>

          <div class="w-[1px] h-6 bg-slate-900/10"></div>

          <div>
            <p class="text-[9px] tracking-wider text-slate-500 uppercase font-medium">學號</p>
            <p id="card-class-no" class="text-base font-extrabold text-emerald-800 tracking-wide">--</p>
          </div>
        </div>

      </div>

      <div id="topics-container" class="crystal-panel rounded-2xl overflow-hidden divide-y divide-slate-900/[0.05]">
        <div class="p-8 text-center text-sm text-slate-500/80">
          <svg class="animate-spin h-5 w-5 mx-auto mb-3 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>正在為您構建個人專屬課堂清單...</span>
        </div>
      </div>

      <div class="flex justify-between items-center px-4 text-[10px] text-slate-500/70 uppercase tracking-widest">
        <span>學員代碼識別: <span id="card-student-id" class="font-mono bg-white/40 px-2 py-0.5 rounded ml-1 text-slate-800 border border-white/50">--</span></span>
        <span>Verified Secure Node</span>
      </div>

    </div>

  </main>

  <div id="video-overlay" class="fixed inset-0 z-50 hidden bg-white/75 backdrop-blur-2xl flex flex-col justify-between animate-fade-in text-slate-900">
    <header class="p-4 bg-slate-100/80 backdrop-blur border-b border-slate-200/80 flex justify-between items-center shadow-sm">
      <div class="flex items-center space-x-3">
        <span class="text-xs tracking-widest text-emerald-700 font-bold bg-emerald-500/10 px-2.5 py-1 rounded border border-emerald-400/20 shadow-sm">ONLINE STREAM</span>
        <h1 id="video-overlay-title" class="text-sm font-bold tracking-wide text-slate-950 truncate max-w-xs sm:max-w-md">--</h1>
      </div>
      <button id="close-video-btn" class="w-8 h-8 flex items-center justify-center text-sm font-bold text-slate-700 hover:text-white bg-slate-200/50 hover:bg-rose-500/80 hover:border-rose-500/30 border border-slate-300 rounded-lg transition duration-200">
        ✕
      </button>
    </header>

    <main class="w-full max-w-4xl aspect-video relative flex items-center justify-center p-4 space-y-4">
      <div class="w-full max-w-4xl aspect-video relative flex items-center justify-center">
        <div id="video-overlay-player" class="w-full h-full rounded-2xl shadow-2xl border border-slate-300 bg-black"></div>
      </div>

      <div class="w-full max-w-4xl flex flex-col sm:flex-row items-center justify-between gap-4 px-2">
        <div class="flex items-center space-x-3">
          <button id="custom-play-btn" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-md transition duration-200 transform active:scale-95">
            <i data-lucide="play-circle" class="w-4 h-4"></i>
            <span>播放 (Play)</span>
          </button>
          <button id="custom-pause-btn" class="px-5 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-md transition duration-200 transform active:scale-95">
            <i data-lucide="pause-circle" class="w-4 h-4"></i>
            <span>暫停 (Pause)</span>
          </button>
        </div>

        <button id="attendance-btn" class="hidden px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-lg transition duration-300 transform active:scale-95 animate-pulse">
          <i data-lucide="check-circle" class="w-4 h-4"></i>
          <span>完成簽到 (Finish & Take Attendance)</span>
        </button>
      </div>
    </main>

    <footer class="p-3 bg-slate-50/80 text-center text-[10px] text-slate-400 tracking-wider uppercase border-t border-slate-200/50">
      &copy; 2026 PH Studio. All rights reserved.
    </footer>
  </div>

  <footer class="w-full max-w-6xl text-center py-2 text-[10px] tracking-[0.2em] uppercase text-slate-500/60 z-10 shrink-0">
    <p>&copy; 2026 PH Studio. All rights reserved.</p>
  </footer>

  <script>
    // =======================================================
    // ⚙️ Google Apps Script 部署正式網址
    // =======================================================
    const GAS_AUTH_URL = "https://script.google.com/macros/s/AKfycbyD7xFaKkDT00Nbh13hw2OdyO0QxcUxbcLR_DuIlcHxTeifT1U5WR3Rb_Ks0n8mJqkX/exec";
    const GAS_LOADER_URL = "https://script.google.com/macros/s/AKfycby0FWs-1C-zee5s9P4QLe8__FuR7Zr3G0fIbjMtCGv61hqcpk68XlaQANzKb3h7JxI/exec";
    const GAS_ATTENDANCE_URL = "https://script.google.com/macros/s/AKfycbyNWqspNXwi4Rj6EpFYNwg5mgtUAOXR_1lKpxjDK62JIaJohQ0h-jPcVQDV2YyDiQ/exec";

    // DOM Elements
    const loginSection = document.getElementById('login-section');
    const cardSection = document.getElementById('card-section');
    const loginForm = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');
    const submitBtn = document.getElementById('submit-btn');
    const togglePwBtn = document.getElementById('toggle-pw');
    const passwordInput = document.getElementById('password');
    const pwIcon = document.getElementById('pw-icon');
    const secureBadge = document.getElementById('secure-badge');
    const topicsContainer = document.getElementById('topics-container');

    // YouTube API 播放器與保安變數
    let ytPlayer = null;
    let isYtApiReady = false;
    let maxWatchedTime = 0;
    let timeCheckInterval = null;
    let attendanceTimer = null;

    // 當前播放影音資訊追蹤
    let currentSession = "";
    let currentTitle = "";
    let currentVideoWatched = false; 

    // 非同步加載 YouTube Iframe API 
    (function() {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    })();

    window.onYouTubeIframeAPIReady = function() {
      isYtApiReady = true;
    };

    // Page Load Setup: 兼容驗證來自 Index Portal 或是本頁原生的 Token 機制
    document.addEventListener("DOMContentLoaded", async () => {
      lucide.createIcons();
      
      const savedUser = localStorage.getItem("userInfo");
      const savedToken = localStorage.getItem("userToken");
      const savedRole = localStorage.getItem("userRole");
      
      if (savedToken) {
        // 建立安全驗證載入狀態
        const tempLoader = document.createElement('div');
        tempLoader.id = 'temp-loader';
        tempLoader.className = 'crystal-panel w-full max-w-[440px] p-10 md:p-12 text-center rounded-[2.5rem] animate-fade-in mt-6 shadow-2xl flex flex-col items-center justify-center';
        tempLoader.innerHTML = `
          <svg class="animate-spin h-10 w-10 text-emerald-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span class="text-slate-800 font-medium text-sm tracking-wider">安全驗證中，請稍候...</span>
        `;
        document.querySelector('main').appendChild(tempLoader);

        try {
          // 透過 loader Web App 驗證傳遞進來的 Token
          const url = `${GAS_LOADER_URL}?action=getTopic&token=${encodeURIComponent(savedToken)}`;
          const response = await fetch(url, {
            method: "GET",
            mode: "cors"
          });
          const resData = await response.json();

          if (resData.result === 'success') {
            tempLoader.remove();
            
            // 🚀 核心相容性修復：如果來自 Index Portal，userInfo 物件欄位可能有些許結構差異，此處進行安全解構防禦
            let parsedUser = {};
            if (savedUser) {
              try { parsedUser = JSON.parse(savedUser); } catch(e) { parsedUser = {}; }
            }
            showStudentCard(parsedUser, savedRole);
          } else {
            throw new Error("Token 驗證失效");
          }
        } catch (e) {
          localStorage.clear();
          tempLoader.remove();
          loginSection.classList.remove('hidden');
          if (secureBadge) secureBadge.classList.remove('hidden');
          showError("驗證已過期或失效，請重新登入！");
        }
      } else {
        loginSection.classList.remove('hidden');
      }
    });

    togglePwBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        pwIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passwordInput.type = 'password';
        pwIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons(); 
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Checking Credentials...</span>
      `;

      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value;

      try {
        const response = await fetch(GAS_AUTH_URL, {
          method: "POST",
          mode: "cors",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (data.success) {
          localStorage.setItem("userToken", data.token);
          localStorage.setItem("userRole", data.role);
          localStorage.setItem("userInfo", JSON.stringify(data.local_storage_data));

          showStudentCard(data.local_storage_data, data.role);
          loginForm.reset();
        } else {
          showError(data.message || "驗證失敗，請檢查輸入帳號或密碼");
        }
      } catch (err) {
        console.error("Fetch error details:", err);
        showError("無法連線至安全性認證端點。請確認您的 GAS 專案已正確部署。");
      } finally {
        resetSubmitBtn();
      }
    });

    function resetSubmitBtn() {
      submitBtn.disabled = false;
      submitBtn.innerHTML = `
        <span>Login & Verify</span>
      `;
      lucide.createIcons();
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.clear();
      cardSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
      if (secureBadge) secureBadge.classList.remove('hidden');
    });

    // 渲染學生學籍面板與多欄位Fallback機制相容
    function showStudentCard(userInfo, role) {
      // 🚀 兼容彈性處理：Index 與 Classroom 的名稱儲存欄位可能為 real_name 或 username / name 
      const realName = userInfo.real_name || userInfo.username || userInfo.name || '已驗證學員';
      const studentClass = userInfo.class || 'S4';
      const classNo = userInfo.class_no || '--';
      const studentId = userInfo.student_id || 'PH-USER';

      document.getElementById('card-real-name').innerText = realName;
      document.getElementById('card-class').innerText = studentClass;
      document.getElementById('card-class-no').innerText = classNo;
      document.getElementById('card-student-id').innerText = studentId;

      loginSection.classList.add('hidden');
      cardSection.classList.remove('hidden');
      if (secureBadge) secureBadge.classList.add('hidden');

      fetchTopics();
    }

    // 動態課程載入與權限比對 (GS Loader Integration)
    async function fetchTopics() {
      const token = localStorage.getItem("userToken");
      const userRole = (localStorage.getItem("userRole") || "student").toLowerCase();

      if (!token) {
        showError("Token 遺失，請重新登入。");
        return;
      }

      topicsContainer.innerHTML = `
        <div class="p-8 text-center text-sm text-slate-500/80">
          <svg class="animate-spin h-5 w-5 mx-auto mb-3 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>安全通道建立中，正在為您構建個人專屬課堂清單...</span>
        </div>
      `;

      try {
        const url = `${GAS_LOADER_URL}?action=getTopic&token=${encodeURIComponent(token)}`;
        const response = await fetch(url, {
          method: "GET",
          mode: "cors"
        });
        const resData = await response.json();

        if (resData.result === 'success') {
          let topicRows = [];
          let records = [];

          if (resData.data) {
            if (Array.isArray(resData.data)) {
              topicRows = resData.data;
            } else if (resData.data.front && Array.isArray(resData.data.front)) {
              topicRows = resData.data.front;
            }

            if (resData.data.record && Array.isArray(resData.data.record)) {
              records = resData.data.record;
            }
          }

          if (records.length === 0) {
            records = resData.records || resData.record || [];
          }

          renderTopics(topicRows, userRole, records);
        } else {
          if (resData.requireLogin) {
            localStorage.clear();
            cardSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            if (secureBadge) secureBadge.classList.remove('hidden');
            showError("認證已過期，請重新登入！");
          } else {
            topicsContainer.innerHTML = `<div class="p-8 text-center text-sm text-rose-800 font-medium">數據加載失敗: ${resData.msg}</div>`;
          }
        }
      } catch (err) {
        console.error("Fetch topics error:", err);
        topicsContainer.innerHTML = `<div class="p-8 text-center text-sm text-rose-800 font-medium">連線異常，無法與課室資料庫同步。</div>`;
      }
    }

    function renderTopics(rows, userRole, records = []) {
      let finalRows = rows;
      if (rows && !Array.isArray(rows) && Array.isArray(rows.front)) {
        finalRows = rows.front;
      }

      if (!Array.isArray(finalRows)) {
        console.error("rows is not an array:", rows);
        topicsContainer.innerHTML = `<div class="p-8 text-center text-sm text-slate-500">課程資料讀取異常，請重新登入或聯繫管理員。</div>`;
        return;
      }

      if (finalRows.length <= 1) {
        topicsContainer.innerHTML = `<div class="p-8 text-center text-sm text-slate-500">當前沒有可用的課堂主題。</div>`;
        return;
      }

      const dataRows = finalRows.slice(1);
      const allowedRows = dataRows.filter(row => {
        const rowRole = String(row[0] || "").trim().toLowerCase();
        return (userRole === "teacher" || userRole === "admin" || (rowRole === userRole));
      });

      allowedRows.sort((a, b) => {
        const numA = parseFloat(a[1]) || 0;
        const numB = parseFloat(b[1]) || 0;
        return numA - numB;
      });

      if (allowedRows.length === 0) {
        topicsContainer.innerHTML = `<div class="p-8 text-center text-sm text-slate-500 font-medium">您的權限無法存取目前的課程。</div>`;
        return;
      }

      // 🚀 兼容彈性比對觀看紀錄
      const userInfo = JSON.parse(localStorage.getItem("userInfo") || "{}");
      const currentStudentName = (userInfo.real_name || userInfo.username || userInfo.name || "").trim();
      const watchedSessions = new Set();

      let finalRecords = records;
      if (records && !Array.isArray(records) && Array.isArray(records.record)) {
        finalRecords = records.record;
      }

      if (Array.isArray(finalRecords)) {
        finalRecords.forEach((row, idx) => {
          if (idx === 0) return; 
          const rowName = String(row[4] || "").trim(); 
          const rowSession = String(row[5] || "").trim(); 
          if (rowName === currentStudentName && rowSession) {
            watchedSessions.add(rowSession);
          }
        });
      }

      topicsContainer.innerHTML = "";

      allowedRows.forEach(row => {
        const session = String(row[1] || "").trim();
        const title = String(row[2] || "").trim();
        const ytLink = String(row[3] || "").trim();
        const status = String(row[4] || "").trim().toLowerCase(); 

        const isActive = (status === "active");
        const isWatched = watchedSessions.has(session);
        const isClickable = isActive || isWatched;

        let rowBgClass = "";
        if (isWatched) {
          rowBgClass = "bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-950 border-l-4 border-emerald-500 cursor-pointer";
        } else if (isActive) {
          rowBgClass = "hover:bg-white/45 bg-transparent cursor-pointer";
        } else {
          rowBgClass = "opacity-40 cursor-not-allowed bg-slate-900/[0.04] text-slate-500";
        }

        const rowEl = document.createElement("div");
        rowEl.className = `group flex justify-between items-center px-5 py-3 transition duration-300 ${rowBgClass}`;

        let iconName = "lock";
        let iconCircleClass = "border-slate-400/20 text-slate-500 bg-slate-400/10";
        if (isWatched) {
          iconName = "check-circle-2";
          iconCircleClass = "border-emerald-500/30 text-emerald-600 bg-emerald-500/20";
        } else if (isActive) {
          iconName = "layers";
          iconCircleClass = "border-emerald-500/20 text-emerald-700 bg-emerald-500/10";
        }

        let statusText = "LOCKED";
        let rightIcon = "lock";
        let textClass = "text-slate-500";
        if (isWatched) {
          statusText = "COMPLETED";
          rightIcon = "check";
          textClass = "text-emerald-700 font-bold";
        } else if (isActive) {
          statusText = "ENTER";
          rightIcon = "chevron-right";
          textClass = "text-emerald-700";
        }

        rowEl.innerHTML = `
          <div class="flex items-center space-x-4 text-left flex-1 min-w-0">
            <span class="w-8 h-8 rounded-lg border ${iconCircleClass} flex items-center justify-center shrink-0">
              <i data-lucide="${iconName}" class="w-3.5 h-3.5"></i>
            </span>
            <div class="flex items-center space-x-3 flex-1 min-w-0">
              <span class="text-sm font-bold text-emerald-800 tracking-wide shrink-0 min-w-[55px]">${session}</span>
              <span class="text-slate-400/30 select-none text-xs shrink-0">|</span>
              <span class="text-sm text-slate-800 font-medium truncate flex-1">${title}</span>
            </div>
          </div>
          <div class="flex items-center space-x-2 shrink-0 ml-4">
            <span class="text-[10px] font-bold tracking-widest ${textClass} hidden sm:inline">${statusText}</span>
            <i data-lucide="${rightIcon}" class="w-4 h-4 ${isWatched ? 'text-emerald-600' : 'text-slate-400'} group-hover:translate-x-0.5 transition-transform"></i>
          </div>
        `;

        if (isClickable) {
          rowEl.addEventListener("click", () => {
            openVideoWindow(session, title, ytLink, isWatched);
          });
        }

        topicsContainer.appendChild(rowEl);
      });

      lucide.createIcons();
    }

    function openVideoWindow(session, title, url, isWatched) {
      currentSession = session;
      currentTitle = title;
      currentVideoWatched = isWatched;

      let videoId = "";
      try {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        if (match && match[2].length === 11) {
          videoId = match[2];
        } else {
          videoId = url;
        }
      } catch (e) {
        videoId = url;
      }

      document.getElementById('video-overlay-title').innerText = title;
      document.getElementById('video-overlay').classList.remove('hidden');

      const btn = document.getElementById('attendance-btn');
      const playBtnSpan = document.querySelector('#custom-play-btn span');
      if (playBtnSpan) {
        playBtnSpan.innerText = "播放 (Play)";
      }

      maxWatchedTime = 0;
      if (timeCheckInterval) clearInterval(timeCheckInterval);
      if (attendanceTimer) clearInterval(attendanceTimer);

      if (isWatched) {
        btn.classList.remove('hidden');
        btn.disabled = true;
        btn.className = "px-6 py-2.5 bg-emerald-600 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-md cursor-not-allowed";
        btn.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4"></i><span>已完成報到 (Completed)</span>`;
      } else {
        btn.classList.add('hidden');
      }

      if (isYtApiReady) {
        if (ytPlayer) {
          try { ytPlayer.destroy(); } catch(e) { console.error("Destroy failed", e); }
        }
        ytPlayer = new YT.Player('video-overlay-player', {
          height: '100%',
          width: '100%',
          videoId: videoId,
          playerVars: {
            autoplay: 1,
            controls: 1, 
            disablekb: 1, 
            rel: 0,
            modestbranding: 1,
            fs: 1 
          },
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      }

      setTimeout(() => { lucide.createIcons(); }, 50);
    }

    function startTimeTracking() {
      if (timeCheckInterval) clearInterval(timeCheckInterval);
      timeCheckInterval = setInterval(() => {
        if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
          const currentTime = ytPlayer.getCurrentTime();

          if (currentVideoWatched) {
            return;
          }

          if (typeof ytPlayer.getPlaybackRate === 'function' && ytPlayer.getPlaybackRate() !== 1) {
            ytPlayer.setPlaybackRate(1);
          }

          if (currentTime > maxWatchedTime + 2.5) {
            ytPlayer.seekTo(maxWatchedTime, true);
          } else {
            maxWatchedTime = Math.max(maxWatchedTime, currentTime);
          }
        }
      }, 500);
    }

    function stopTimeTracking() {
      if (timeCheckInterval) {
        clearInterval(timeCheckInterval);
        timeCheckInterval = null;
      }
    }

    // YouTube 播放狀態偵測
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        startTimeTracking();
      } else if (event.data === YT.PlayerState.ENDED) {
        stopTimeTracking();
        if (!currentVideoWatched) {
          triggerAttendanceCountdown();
        }
      } else {
        stopTimeTracking();
      }
    }

    function triggerAttendanceCountdown() {
      let timeLeft = 120; 
      const btn = document.getElementById('attendance-btn');
      
      btn.classList.remove('hidden');
      btn.disabled = false;
      btn.className = "px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-lg transition duration-300 transform active:scale-95 animate-pulse";
      btn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i><span>完成簽到 (剩餘 2分00秒)</span>`;
      lucide.createIcons();

      if (attendanceTimer) clearInterval(attendanceTimer);
      attendanceTimer = setInterval(() => {
        timeLeft--;

        if (timeLeft <= 0) {
          clearInterval(attendanceTimer);
          btn.disabled = true;
          btn.className = "px-6 py-2.5 bg-rose-600 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-md cursor-not-allowed";
          btn.innerHTML = `<i data-lucide="alert-triangle" class="w-4 h-4"></i><span>超時，請勿掛機，請重新播放</span>`;
          lucide.createIcons();

          const playBtnSpan = document.querySelector('#custom-play-btn span');
          if (playBtnSpan) {
            playBtnSpan.innerText = "重新播放";
          }
        } else {
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          const paddedSeconds = seconds < 10 ? '0' + seconds : seconds;
          btn.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i><span>完成簽到 (剩餘 ${minutes}分${paddedSeconds}秒)</span>`;
          lucide.createIcons();
        }
      }, 1000);
    }

    document.getElementById('custom-play-btn').addEventListener('click', () => {
      if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
        const playBtnSpan = document.querySelector('#custom-play-btn span');
        if (playBtnSpan && playBtnSpan.innerText === "重新播放") {
          maxWatchedTime = 0;
          if (attendanceTimer) clearInterval(attendanceTimer);

          if (currentVideoWatched) {
            const btn = document.getElementById('attendance-btn');
            btn.classList.remove('hidden');
            btn.disabled = true;
            btn.className = "px-6 py-2.5 bg-emerald-600 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-md cursor-not-allowed";
            btn.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4"></i><span>已完成報到 (Completed)</span>`;
          } else {
            document.getElementById('attendance-btn').classList.add('hidden');
          }
          playBtnSpan.innerText = "播放 (Play)";
          ytPlayer.seekTo(0, true);
        }
        ytPlayer.playVideo();
      }
    });

    document.getElementById('custom-pause-btn').addEventListener('click', () => {
      if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
        ytPlayer.pauseVideo();
      }
    });

    document.getElementById('close-video-btn').addEventListener('click', () => {
      if (ytPlayer) {
        try {
          ytPlayer.stopVideo();
          ytPlayer.destroy();
          ytPlayer = null;
        } catch(e) { console.error("Stop/Destroy failed on close", e); }
      }
      stopTimeTracking();
      if (attendanceTimer) clearInterval(attendanceTimer);
      document.getElementById('video-overlay').classList.add('hidden');
    });

    // 提交簽到數據紀錄 (GAS Attendance Integration)
    document.getElementById('attendance-btn').addEventListener('click', async () => {
      if (attendanceTimer) clearInterval(attendanceTimer);

      const btn = document.getElementById('attendance-btn');
      btn.disabled = true;
      btn.className = "px-6 py-2.5 bg-slate-400 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-md cursor-not-allowed";
      btn.innerHTML = `
        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>正在儲存紀錄 (Saving...)</span>
      `;

      const token = localStorage.getItem("userToken");
      const userRole = localStorage.getItem("userRole") || "student";
      const userInfo = JSON.parse(localStorage.getItem("userInfo") || "{}");

      if (!token) {
        btn.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4"></i><span>簽到失敗：未登入</span>`;
        btn.className = "px-6 py-2.5 bg-rose-600 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-md";
        lucide.createIcons();
        return;
      }

      // 🚀 簽到欄位與對接相容性回退防禦
      const finalRealName = userInfo.real_name || userInfo.username || userInfo.name || '已驗證學員';

      try {
        const response = await fetch(GAS_ATTENDANCE_URL, {
          method: "POST",
          mode: "cors",
          redirect: "follow",
          headers: {
            "Content-Type": "text/plain" // 標準 Text/plain 簡單請求繞過預檢 CORS 阻擋
          },
          body: JSON.stringify({
            action: "submitAttendance",
            token: token,
            session: currentSession,
            title: currentTitle,
            student_id: userInfo.student_id || 'PH-USER',
            real_name: finalRealName,
            class: userInfo.class || 'S4',
            class_no: userInfo.class_no || '--',
            role: userRole
          })
        });

        const resData = await response.json();

        if (resData.success) {
          btn.innerHTML = `
            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
            <span>簽到紀錄已提交 (Saved)</span>
          `;
          btn.className = "px-6 py-2.5 bg-slate-500 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-md cursor-not-allowed";
          
          fetchTopics();
        } else {
          btn.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4"></i><span>簽到失敗：${resData.message}</span>`;
          btn.className = "px-6 py-2.5 bg-rose-600 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-md cursor-not-allowed";
        }
      } catch (err) {
        console.error("Attendance submission error:", err);
        btn.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4"></i><span>網路連線錯誤，請重試</span>`;
        btn.className = "px-6 py-2.5 bg-rose-600 text-white rounded-full flex items-center space-x-2 text-xs font-bold shadow-md cursor-not-allowed";
      }
      lucide.createIcons();
    });

    function showError(msg) {
      errorText.innerText = msg;
      errorMsg.classList.remove('hidden');
      lucide.createIcons();
    }
  </script>
</body>
</html>
