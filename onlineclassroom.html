<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PH Studio - 學生登入系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- Lucide Icons for responsive elements -->
    <script src="https://unpkg.com/lucide@latest">
    </script>
    <style>
        /* 引入 Cinzel (優雅古典襯線體)、Inter (極簡現代無襯線體) 與 Shippori Mincho (優雅日系明體 BOLD) */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Shippori+Mincho:wght@700[...]

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-image: url('https://i.ibb.co/yn7JJ8yy/classroom.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .cinzel-title {
            font-family: 'Cinzel', serif;
        }

        .shippori-title {
            font-family: 'Shippori Mincho', serif;
            font-weight: 700;
        }

        /* 減少玻璃透明度，提高遮罩實色（更清晰易讀） */
        .crystal-panel {
            background: rgba(255, 255, 255, 0.78);
            /* 淡白色重度磨砂 */
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        /* 对称淺色膠囊型輸入框 */
        .pill-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(15, 23, 42, 0.12);
            color: #0f172a;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pill-input:focus {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(16, 185, 129, 0.5);
            /* 薄荷綠邊框 */
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
            outline: none;
        }

        .pill-input::placeholder {
            color: rgba(15, 23, 42, 0.5);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        /* 漸進式淡入動畫 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* OS 風格擬真彈性阻尼進場動畫 */
        @keyframes osDamping {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.95);
                filter: blur(8px);
            }
            55% {
                opacity: 0.9;
                transform: translateY(-6px) scale(1.01);
                filter: blur(0px);
            }
            75% {
                transform: translateY(2px) scale(0.997);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }
        .animate-os-damping {
            animation: osDamping 1.1s cubic-bezier(0.25, 1, 0.2, 1) forwards;
        }

        /* iOS 級別阻尼淡入動畫 (用於 Menu Card 展開) */
        @keyframes iosMenuEntrance {
            0% {
                opacity: 0;
                transform: translateY(35px) scale(0.96);
                filter: blur(10px);
            }
            60% {
                transform: translateY(-3px) scale(1.006);
                filter: blur(0px);
            }
            80% {
                transform: translateY(1px) scale(0.998);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0px);
            }
        }
        .animate-ios-menu {
            animation: iosMenuEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* iOS 級別阻尼淡出動畫 (用於 Login Section 退出) */
        @keyframes iosLoginExit {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(0.94) translateY(-30px);
                filter: blur(12px);
            }
        }
        .animate-ios-exit {
            animation: iosLoginExit 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* iOS 級別超慢阻尼影音遮罩進場動畫 (淡入與優雅縮小回彈) */
        @keyframes iosOverlayEntrance {
            0% {
                opacity: 0;
                transform: scale(1.08);
                backdrop-filter: blur(0px) saturate(100%);
                -webkit-backdrop-filter: blur(0px) saturate(100%);
                background-color: rgba(255, 255, 255, 0);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                backdrop-filter: blur(30px) saturate(160%);
                -webkit-backdrop-filter: blur(30px) saturate(160%);
                background-color: rgba(255, 255, 255, 0.85);
            }
        }
        .animate-ios-overlay-enter {
            animation: iosOverlayEntrance 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* iOS 級別超慢阻尼影音遮罩退場動畫 (淡入與優雅放大消散) */
        @keyframes iosOverlayExit {
            0% {
                opacity: 1;
                transform: scale(1);
                backdrop-filter: blur(30px) saturate(160%);
                -webkit-backdrop-filter: blur(30px) saturate(160%);
                background-color: rgba(255, 255, 255, 0.85);
            }
            100% {
                opacity: 0;
                transform: scale(1.08);
                backdrop-filter: blur(0px) saturate(100%);
                -webkit-backdrop-filter: blur(0px) saturate(100%);
                background-color: rgba(255, 255, 255, 0);
            }
        }
        .animate-ios-overlay-exit {
            animation: iosOverlayExit 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* iOS 級別阻尼彈簧動畫 (學生個人檔案專用) */
        @keyframes iosProfileEntrance {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes iosProfileExit {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.92);
            }
        }
        .animate-profile-enter {
            animation: iosProfileEntrance 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .animate-profile-exit {
            animation: iosProfileExit 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* iOS 級別日曆展開／收合動畫 */
        #calendar-panel {
            transition: all 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .calendar-collapsed {
            max-height: 0 !important;
            transform: scale-y(0) !important;
            opacity: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            border-top-width: 0 !important;
            border-bottom-width: 0 !important;
            pointer-events: none !important;
        }

        .calendar-day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 🆕 profile iframe 满版适配 */
        #profile-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-6 text-slate-800 relative">

    <!-- 頂部磨砂背景裝飾，確保邊角美觀 -->
    <div class="absolute inset-0 bg-black/5 pointer-events-none"></div>

    <!-- Header Brand (置頂，在登入狀態下顯現，非登入時隱性融入) -->
    <header class="w-full max-w-4xl flex justify-end items-center py-2 z-10 shrink-0">
        <div id="secure-badge" class="text-[10px] tracking-widest text-slate-800/80 bg-white/20 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/20 shadow-sm">
            SECURE CHANNEL
        </div>
    </header>

    <!-- Main Portal Section (置頂排版，極大化空間利用率) -->
    <main class="w-full max-w-4xl flex-1 flex flex-col items-center justify-start mt-2 mb-6 z-10">

        <!-- ========================================== -->
        <!-- SECTION 1: 極致美學登入面板 (預設隱藏以防 token 驗證時閃爍) -->
        <!-- ========================================== -->
        <div id="login-section" class="crystal-panel w-full max-w-[440px] p-10 md:p-12 text-center rounded-[2.5rem] animate-os-damping mt-6 shadow-2xl hidden">

            <!-- 官方 APP ICON (直角矩形置中，不使用圓角) -->
            <div class="flex justify-center mb-8">
                <div class="w-14 h-14 bg-white/30 p-0.5 border border-white/40 shadow-inner flex items-center justify-center">
                    <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="PH Logo" class="w-full h-full" />
                </div>
            </div>

            <!-- 標題：Shippori Mincho 襯線字型與優雅寬字距 -->
            <div class="mb-10">
                <h2 class="text-2xl md:text-[2rem] font-bold tracking-[0.15em] text-slate-900 shippori-title leading-tight">
                    線上補課系統
                </h2>
                <h3 class="text-xs tracking-[0.4em] text-slate-300/70 cinzel-title mt-3.5 uppercase">
                    Student Portal
                </h3>

                <div class="w-6 h-[1px] bg-white/30 mx-auto mt-4"></div>
            </div>

            <!-- 登入表單 -->
            <form id="login-form" class="space-y-5">

                <!-- 帳號輸入膠囊 -->
                <div class="relative">
                    <input type="text" id="username" required placeholder="Username" class="pill-input w-full px-6 py-3.5 rounded-full text-sm font-light tracking-wide" />
                </div>

                <!-- 密碼輸入膠囊 -->
                <div class="relative">
                    <input type="password" id="password" required placeholder="Password" class="pill-input w-full px-6 py-3.5 rounded-full text-sm font-light tracking-wide" />
                    <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-800/45 hover:text-slate-900 transition">
                        <i data-lucide="eye" id="pw-icon" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- 錯誤訊息提示區 -->
                <div id="error-msg" class="hidden bg-rose-50/70 border border-rose-300 text-rose-800 p-3.5 rounded-2xl text-xs text-left flex items-start space-x-2 animate-fadeIn shadow-sm">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5 text-rose-400"></i>
                    <span id="error-text" class="leading-relaxed font-medium"></span>
                </div>

                <!-- 登入按鈕膠囊 (對稱高質感深色對比按鈕) -->
                <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs tracking-[0.25em] uppercase py-4 rounded-full shadow-md hover:shad[...]
                    <span>Login & Verify</span>
                </button>

            </form>

            <!-- 底部安全圖示 -->
            <div class="flex justify-center mt-10">
                <div class="w-10 h-10 rounded-full bg-emerald-500/10 border border-emerald-400/20 flex items-center justify-center text-emerald-600 shadow-sm">
                    <i data-lucide="cloud" class="w-4 h-4"></i>
                </div>
            </div>

        </div>

        <!-- ========================================== -->
        <!-- SECTION 2: 學生學籍資料卡片 & 課室版面 (登入成功) -->
        <!-- ========================================== -->
        <div id="card-section" class="w-full hidden space-y-4">

            <!-- 頂部高質感導航工具列 -->
            <div class="flex justify-end items-center px-1">
                <!-- 右側：精簡功能快捷按鈕 (僅保留登出與關機重定向功能) -->
                <div class="flex items-center space-x-2">
                    <!-- 登出/返回系統按鈕 -->
                    <button id="logout-btn" class="w-7 h-7 rounded-full bg-white/50 hover:bg-rose-500/20 hover:border-rose-500/30 border border-slate-900/[0.08] flex items-center justify-center t[...]
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    </button>

                    <!-- 系統關機符號 (重定向回首頁) -->
                    <button id="power-btn" class="w-7 h-7 rounded-full bg-white/40 hover:bg-white/60 border border-slate-900/[0.08] flex items-center justify-center text-slate-500 hover:text-slat[...]
                        <i data-lucide="power" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>

            <!-- 核心面板一：學生帳戶資訊卡 -->
            <div class="crystal-panel rounded-2xl p-4 flex flex-row justify-between items-center gap-4">

                <!-- 🆕 左側：帳戶名稱與身份標誌 — 點擊整個區域開啟學生檔案 iframe -->
                <div id="student-profile-trigger" class="flex items-center space-x-4 cursor-pointer select-none">

                    <!-- 薄荷綠圓形學士帽圖示 -->
                    <div class="w-11 h-11 bg-emerald-500/10 border border-emerald-400/20 rounded-full flex items-center justify-center text-emerald-700 shadow-sm shrink-0">
                        <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                    </div>
                    <div class="text-left">
                        <h3 id="card-real-name" class="text-xl font-bold tracking-wide text-slate-900 shippori-title">--</h3>
                        <p class="text-[9px] text-slate-500 font-medium tracking-widest uppercase">學生個人帳戶</p>
                    </div>

                </div>

                <!-- 右側：班級與學號對稱卡區 + 日曆圖示按鈕 -->
                <div class="flex items-center gap-4 text-right pr-1 shrink-0">
                    <!-- 班別 -->
                    <div>
                        <p class="text-[9px] tracking-wider text-slate-500 uppercase font-medium">班別</p>
                        <p id="card-class" class="text-base font-extrabold text-emerald-800 tracking-wide">--</p>
                    </div>

                    <!-- 垂直精細分割線 -->
                    <div class="w-[1px] h-6 bg-slate-900/10"></div>

                    <!-- 學號 -->
                    <div>
                        <p class="text-[9px] tracking-wider text-slate-500 uppercase font-medium">學號</p>
                        <p id="card-class-no" class="text-base font-extrabold text-emerald-800 tracking-wide">--</p>
                    </div>

                    <!-- 垂直精細分割線 -->
                    <div class="w-[1px] h-6 bg-slate-900/10"></div>

                    <!-- 日曆展開/收合按鈕 (iOS風，帶點按縮放與自訂高亮) -->
                    <button id="calendar-toggle-btn" class="w-9 h-9 rounded-full bg-white/60 hover:bg-emerald-50/80 hover:text-emerald-700 border border-slate-900/[0.08] flex items-center justify[...]
                        <i data-lucide="calendar" class="w-4.5 h-4.5"></i>
                    </button>
                </div>

            </div>

            <!-- ========================================== -->
            <!-- iOS 風格折疊日曆主面板 -->
            <!-- ========================================== -->
            <div id="calendar-panel" class="crystal-panel rounded-2xl p-4 origin-top calendar-collapsed overflow-hidden space-y-4">
                <div class="flex items-center justify-between border-b border-slate-900/5 pb-2">
                    <button id="cal-prev-month" class="p-1.5 hover:bg-slate-200/50 rounded-full text-slate-600 transition active:scale-90">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    <h4 id="cal-month-year" class="text-sm font-bold text-slate-800 shippori-title tracking-wide">--</h4>
                    <button id="cal-next-month" class="p-1.5 hover:bg-slate-200/50 rounded-full text-slate-600 transition active:scale-90">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">
                    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                </div>
                <div id="calendar-days" class="grid grid-cols-7 gap-1">
                    <!-- JS 動態寫入 -->
                </div>
                <!-- 狀態圖例與重設按鈕 -->
                <div class="flex justify-between items-center text-[11px] text-slate-500 pt-2 border-t border-slate-900/5">
                    <span class="flex items-center gap-1.5 font-medium text-slate-600">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block shadow-sm"></span>
                        有補課課堂日期
                    </span>
                    <button id="cal-reset-btn" class="px-3 py-1 rounded-full bg-white hover:bg-rose-50 text-slate-700 hover:text-rose-600 border border-slate-200 text-[10px] font-bold transition [...]
                        顯示全部課程
                    </button>
                </div>
            </div>

            <!-- 核心面板二：動態學業課程列表 -->
            <div id="topics-container" class="crystal-panel rounded-2xl overflow-hidden divide-y divide-slate-900/[0.05]">
                <!-- 這裡將透過 JS 依據試算表與身分權限動態載入課程 -->
                <div class="p-8 text-center text-sm text-slate-500/80">
                    <svg class="animate-spin h-5 w-5 mx-auto mb-3 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>正在為您構建個人專屬課堂清單...</span>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- 🚀 出席數據查閱入口卡片 -->
            <!-- ========================================== -->
            <div id="attendance-lookup-btn" class="crystal-panel rounded-2xl p-4 flex flex-row justify-between items-center cursor-pointer hover:bg-white/45 transition duration-300 shadow-sm bord[...]
                <div class="flex items-center space-x-4">
                    <div class="w-11 h-11 bg-indigo-500/10 border border-indigo-400/20 rounded-full flex items-center justify-center text-indigo-700 shadow-sm shrink-0">
                        <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="text-lg font-bold tracking-wide text-slate-900 shippori-title">出席數據查閱</h3>
                        <p class="text-[9px] text-slate-500 font-medium tracking-widest uppercase">全班出席率與課程完成進度</p>
                    </div>
                </div>
                <div class="flex items-center text-indigo-700 text-xs font-bold tracking-widest">
                    <span>展開查閱</span>
                    <i data-lucide="chevron-right" class="w-3.5 h-3.5 ml-1"></i>
                </div>
            </div>

            <!-- 底層資料註腳標記 -->
            <div class="flex justify-between items-center px-4 text-[10px] text-slate-500/70 uppercase tracking-widest">
                <span>學員代碼識別: <span id="card-student-id" class="font-mono bg-white/40 px-2 py-0.5 rounded ml-1 text-slate-800 border border-white/50">--</span></span>
                <span>Verified Secure Node</span>
            </div>

        </div>

    </main>

    <!-- ========================================== -->
    <!-- SECTION 3: 內置同頁滿版播放器 (淡色超重度磨砂 - 管理 iOS 阻尼轉場) -->
    <!-- ========================================== -->
    <div id="video-overlay" class="fixed inset-0 z-50 hidden flex flex-col justify-between text-slate-900">
        <!-- 播放器置頂控制列 -->
        <header class="p-4 bg-slate-100/80 backdrop-blur border-b border-slate-200/80 flex justify-between items-center shadow-sm shadow-slate-200">
            <div class="flex items-center space-x-3">
                <span class="text-xs tracking-widest text-emerald-700 font-bold bg-emerald-500/10 px-2.5 py-1 rounded border border-emerald-400/20 shadow-sm">ONLINE STREAM</span>
                <h1 id="video-overlay-title" class="text-sm font-bold tracking-wide text-slate-950 truncate max-w-xs sm:max-w-md">--</h1>
            </div>
            <button id="close-video-btn" class="w-8 h-8 flex items-center justify-center text-sm font-bold text-slate-700 hover:text-white bg-slate-200/50 hover:bg-rose-500/80 hover:border-rose-500/30[...]
                ✕
            </button>
        </header>

        <!-- 影音核心顯示與自訂操作區 -->
        <main class="flex-1 w-full flex flex-col items-center justify-center p-4 space-y-4">
            <!-- 🎬 Shippori Mincho 大字體標題區 (大字體、完美配合播放器最大寬度) -->
            <h2 id="video-player-large-title" class="text-xl md:text-2xl lg:text-3xl font-bold text-left text-slate-950 shippori-title tracking-wide px-2 w-full max-w-4xl leading-relaxed">
                --
            </h2>

            <!-- 🎬 還原版播放器容器 (w-full max-w-4xl) -->
            <div class="w-full max-w-4xl aspect-video relative flex items-center justify-center">
                <!-- YouTube API 專屬容器 -->
                <div id="video-overlay-player" class="w-full h-full rounded-2xl shadow-2xl border border-slate-300 bg-black"></div>
            </div>

            <!-- 自訂播放與簽到按鈕 -->
            <div class="w-full max-w-4xl flex flex-col sm:flex-row items-center justify-between gap-4 px-2">

    <script>
    // Print / Export attendance table to PDF
    (function attachPdfExport() {
        function refreshIcons() { if (window.lucide) lucide.createIcons(); }

        document.addEventListener('DOMContentLoaded', () => {
            const printBtn = document.getElementById('print-pdf-btn');
            if (!printBtn) return;

            printBtn.addEventListener('click', async () => {
                const tableContainer = document.getElementById('attendance-table-container');

                if (!tableContainer || tableContainer.classList.contains('hidden')) {
                    alert('出席表尚未載入，請先展開「出席數據查閱」並等待資料載入後再匯出。');
                    return;
                }

                // Clone to avoid UI changes
                const clone = tableContainer.cloneNode(true);
                clone.style.width = '1000px';
                clone.style.maxWidth = '100%';
                clone.style.background = '#fff';
                clone.style.padding = '24px';
                clone.style.boxSizing = 'border-box';
                clone.style.color = '#111827';
                const innerScroll = clone.querySelector('.overflow-auto');
                if (innerScroll) {
                    innerScroll.style.overflow = 'visible';
                    innerScroll.style.maxHeight = 'none';
                }
                clone.style.position = 'fixed';
                clone.style.left = '-9999px';
                clone.style.top = '0';
                document.body.appendChild(clone);

                const details = (function() {
                    try {
                        const name = document.getElementById('card-real-name')?.textContent?.trim() || '';
                        const cls = document.getElementById('card-class')?.textContent?.trim() || '';
                        return { name, cls };
                    } catch (e) { return { name: '', cls: '' }; }
                })();
                const dateStr = new Date().toISOString().slice(0,10);
                const safe = (s) => s.replace(/[^0-9a-zA-Z\u4e00-\u9fff\-_ ]/g,'').replace(/\s+/g,'_');
                const filename = `${safe(details.name||'attendance')}_${safe(details.cls||'class')}_${dateStr}.pdf`;

                const opt = {
                    margin: [0.4, 0.4, 0.4, 0.4],
                    filename: filename,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, logging: false },
                    jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
                };

                try {
                    printBtn.disabled = true;
                    const originalHtml = printBtn.innerHTML;
                    printBtn.innerHTML = '匯出中...';

                    await html2pdf().set(opt).from(clone).save();
                } catch (err) {
                    console.error('PDF export error', err);
                    alert('匯出 PDF 時發生錯誤，請稍後再試。');
                } finally {
                    printBtn.disabled = false;
                    printBtn.innerHTML = '';
                    const iconEl = document.createElement('i');
                    iconEl.setAttribute('data-lucide','printer');
                    iconEl.className = 'w-4.5 h-4.5';
                    printBtn.appendChild(iconEl);
                    refreshIcons();
                    clone.remove();
                }
            });

            refreshIcons();
        });
    })();
    </script>
