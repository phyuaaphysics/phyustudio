    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --dse-blue: #004a99;
            --interface-dark: #1a1a1a;
            --bg-white: #ffffff;
            --formula-grey: rgba(0,0,0,0.03);
        }

        body {
            background-color: var(--bg-white);
            overflow: hidden;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            color: var(--interface-dark);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        /* Formula Watermark Background */
        .formula-bg {
            position: fixed;
            inset: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
            padding: 20px;
            font-family: serif;
            font-style: italic;
            font-size: 1.5rem;
            color: var(--formula-grey);
            user-select: none;
            z-index: 0;
            pointer-events: none;
        }

        /* Academic Container */
        .academic-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .academic-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .app-logo {
            width: 140px;
            height: 140px;
            z-index: 20;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05));
            transition: transform 0.6s ease;
        }

        /* Closer spacing for branding */
        .brand-text {
            margin-top: 1.5rem; /* Reduced from 150px to bring words closer */
            text-align: center;
        }

        .brand-name {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--interface-dark);
            margin-bottom: 0.1rem;
        }

        .dse-tag {
            display: inline-block;
            background: var(--dse-blue);
            color: white;
            padding: 1px 10px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            border-radius: 4px;
            margin-bottom: 0.75rem;
            box-shadow: 0 4px 10px rgba(0, 74, 153, 0.15);
        }

        .brand-subtitle {
            font-size: 0.75rem;
            letter-spacing: 0.35em;
            color: #999;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Interaction Overlay */
        #interaction-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        .enter-btn {
            padding: 16px 48px;
            border: 1px solid #eee;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #333;
            background: #fff;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        #interaction-overlay:hover .enter-btn {
            border-color: var(--dse-blue);
            color: var(--dse-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .hud-status {
            position: fixed;
            bottom: 30px;
            left: 30px;
            font-family: monospace;
            font-size: 10px;
            color: #ddd;
            letter-spacing: 0.05em;
        }

        .loading-line {
            width: 80px;
            height: 1px;
            background: #f0f0f0;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .loading-line::after {
            content: '';
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--dse-blue);
            animation: load-progress 2.5s infinite linear;
        }

        @keyframes load-progress {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Exit Sequence */
        .fade-out-academic {
            opacity: 0 !important;
            transform: scale(1.02) !important;
            filter: blur(10px);
            transition: all 1.2s cubic-bezier(0.7, 0, 0.3, 1) !important;
        }
    </style>
</head>
<body>

    <div class="formula-bg">
        <span>F = ma</span>
        <span>E = mc²</span>
        <span>v = u + at</span>
        <span>λ = h/p</span>
        <span>PV = nRT</span>
        <span>V = IR</span>
        <span>Φ = BA</span>
        <span>p = mv</span>
        <span>T = 2π√(l/g)</span>
        <span>Q = mcΔT</span>
    </div>

    <div class="hud-status" id="status">
        HKDSE_PHYS_V.4.2<br>
        SYSTEM_READY
    </div>

    <div id="interaction-overlay">
        <button class="enter-btn">Initialize Study</button>
        <div class="loading-line"></div>
    </div>

    <div class="academic-container" id="main-ui">
        <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="Logo" class="app-logo">
        
        <div class="brand-text">
            <div class="dse-tag">HKDSE PHYSICS</div>
            <h1 class="brand-name">PH Studio</h1>
            <p class="brand-subtitle">Smart Learning Platform</p>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('interaction-overlay');
        const mainUI = document.getElementById('main-ui');
        const status = document.getElementById('status');
        const targetUrl = "https://phyuaaphysics.github.io/phyustudio/home.html";

        let audioCtx;

        overlay.addEventListener('click', () => handleStart());
        overlay.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleStart();
        }, { once: true });

        function handleStart() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            overlay.style.opacity = "0";
            setTimeout(() => {
                overlay.style.display = 'none';
                runSequence();
            }, 800);
        }

        function playStartChime() {
            const frequencies = [523.25, 659.25, 783.99]; 
            frequencies.forEach((f, i) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(f, audioCtx.currentTime + (i * 0.12));
                g.gain.setValueAtTime(0, audioCtx.currentTime);
                g.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.1 + (i * 0.12));
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
                osc.connect(g);
                g.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            });
        }

        function runSequence() {
            playStartChime();
            status.innerHTML = "MODULE: CORE<br>STATUS: SUCCESS";
            
            setTimeout(() => {
                mainUI.classList.add('visible');
            }, 200);

            setTimeout(() => {
                mainUI.classList.add('fade-out-academic');
            }, 4200);

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 5500);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
