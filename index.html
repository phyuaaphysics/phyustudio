<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PH studio | Launch</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://phyuaaphysics.github.io/phyustudio/favicon.png">
    <link rel="shortcut icon" href="https://phyuaaphysics.github.io/phyustudio/favicon.png">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#81D8D0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PH studio">
    <link rel="apple-touch-icon" href="https://phyuaaphysics.github.io/phyustudio/appicon.png">
    
    <!-- External Manifest Link -->
    <link rel="manifest" href="https://phyuaaphysics.github.io/phyustudio/manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes formulaFade {
            0% { opacity: 0; transform: scale(0.85) translateY(10px); filter: blur(4px); }
            20% { opacity: 0.4; transform: scale(1) translateY(0); filter: blur(0px); }
            80% { opacity: 0.4; transform: scale(1.05) translateY(-5px); filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.1) translateY(-15px); filter: blur(2px); }
        }

        .fade-in {
            animation: fadeIn 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .loading-bar-container {
            width: 80vw;
            max-width: 280px;
            height: 2px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            overflow: hidden;
            display: none;
            z-index: 10;
        }

        .loading-bar-progress {
            width: 0%;
            height: 100%;
            background: #000000;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: #81D8D0;
            color: #000000;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
        }

        #status-text {
            min-height: 1.5em;
            z-index: 10;
        }

        .btn-modern {
            font-weight: 500;
            letter-spacing: 0.15em;
            position: relative;
            background: transparent;
            color: #000000;
            border: 1.5px solid #000000;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: pointer;
            outline: none;
            z-index: 10;
            -webkit-tap-highlight-color: transparent;
        }

        @media (min-width: 1024px) {
            .btn-modern:hover {
                background: #000000;
                color: #ffffff;
                letter-spacing: 0.2em;
                padding-left: 4rem;
                padding-right: 4rem;
            }
        }

        .btn-modern:active {
            transform: scale(0.96);
            background: rgba(0, 0, 0, 0.1);
        }

        #formula-container {
            position: fixed;
            top: 0;left: 0;width: 100%;height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .formula {
            position: absolute;
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-weight: 600;
            color: #1e293b;
            opacity: 0;
            white-space: nowrap;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
            will-change: transform, opacity;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen m-0">

    <div id="formula-container" class="hidden"></div>

    <div id="landing-screen" class="flex flex-col items-center text-center space-y-10 sm:space-y-14 px-6 relative z-10 w-full max-w-lg">
        <div class="fade-in">
            <!-- App Icon from GitHub -->
            <img 
                src="https://phyuaaphysics.github.io/phyustudio/appicon.png" 
                alt="PH studio Icon" 
                class="w-28 h-28 sm:w-32 sm:h-32 md:w-36 md:h-36 rounded-[2rem] sm:rounded-[2.2rem] shadow-2xl transition-all duration-700"
                onerror="this.src='https://via.placeholder.com/512x512?text=PH+studio'"
            >
        </div>
        
        <div class="fade-in" style="animation-delay: 0.2s;">
            <p class="text-black/60 text-[9px] sm:text-[10px] md:text-xs font-semibold tracking-[0.3em] sm:tracking-[0.5em] uppercase">
                Self Directed Learning Platform
            </p>
        </div>

        <div class="fade-in w-full flex justify-center" style="animation-delay: 0.4s;">
            <button 
                id="launch-btn"
                onmouseenter="playHoverSound()"
                onclick="launchSystem()"
                class="btn-modern px-8 py-3 sm:px-10 sm:py-3.5 text-[10px] sm:text-[11px] md:text-xs uppercase w-full sm:w-auto"
            >
                Launch System
            </button>
        </div>
    </div>

    <div id="loading-screen" class="hidden flex flex-col items-center space-y-8 sm:space-y-10 relative z-10 w-full px-6">
        <div class="text-center w-full max-w-[280px]">
            <p id="status-text" class="text-slate-500 font-normal tracking-[0.2em] text-[8px] sm:text-[9px] mb-6 sm:mb-8 transition-opacity duration-500">Initializing System</p>
            <div class="loading-bar-container mx-auto" id="bar-container">
                <div class="loading-bar-progress" id="bar-progress"></div>
            </div>
        </div>
    </div>

    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('https://phyuaaphysics.github.io/phyustudio/sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed', err));
            });
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const physicsFormulas = [
            "v = u + at", "s = ut + ½at²", "v² = u² + 2as", "F = ma", "p = mv",
            "E = mc²", "W = Fs cos θ", "P = IV", "V = IR", "Q = mc∆T",
            "f = 1/T", "v = fλ", "n = c/v", "F = G m₁m₂/r²", "E = hf",
            "L = mvr", "a = v²/r", "T = 2π√(l/g)", "pV = nRT", "λ = h/p",
            "n₁sinθ₁ = n₂sinθ₂", "1/u + 1/v = 1/f", "∆p = F∆t", "E = ½mv²",
            "τ = Fr sinθ", "φ = BA cosθ", "ε = -N(∆φ/∆t)"
        ];

        function createFormula() {
            const container = document.getElementById('formula-container');
            const formula = document.createElement('div');
            formula.className = 'formula';
            formula.innerText = physicsFormulas[Math.floor(Math.random() * physicsFormulas.length)];
            const isMobile = window.innerWidth < 768;
            const padding = isMobile ? 15 : 5;
            const x = Math.random() * (100 - padding * 2) + padding;
            const y = Math.random() * (100 - padding * 2) + padding;
            const size = Math.random() * (isMobile ? 16 : 20) + (isMobile ? 16 : 22); 
            const duration = Math.random() * 1.5 + 2;
            formula.style.left = `${x}%`;
            formula.style.top = `${y}%`;
            formula.style.fontSize = `${size}px`;
            formula.style.animation = `formulaFade ${duration}s cubic-bezier(0.4, 0, 0.2, 1) forwards`;
            container.appendChild(formula);
            setTimeout(() => formula.remove(), duration * 1000);
        }

        function playHoverSound() {
            if (audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function playLoadingTick(frequency = 600) {
            if (audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.005, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        }

        function launchSystem() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const landing = document.getElementById('landing-screen');
            const loading = document.getElementById('loading-screen');
            const formulaContainer = document.getElementById('formula-container');
            const progress = document.getElementById('bar-progress');
            const barContainer = document.getElementById('bar-container');
            const statusText = document.getElementById('status-text');

            document.body.style.backgroundColor = "#FFFFFF";
            landing.style.opacity = '0';
            landing.style.transform = 'translateY(-4px)';

            setTimeout(() => {
                landing.classList.add('hidden');
                loading.classList.remove('hidden');
                loading.classList.add('flex');
                formulaContainer.classList.remove('hidden');
                barContainer.style.display = 'block';

                const formulaInterval = setInterval(() => createFormula(), 250);
                let width = 0;
                let messageIndex = 0;
                const statusMessages = ["Syncing modules", "Loading assets", "Configuring workspace", "Environment check", "Optimizing core", "Finalizing"];

                const interval = setInterval(() => {
                    if (width >= 100) {
                        clearInterval(interval);
                        clearInterval(formulaInterval);
                        setTimeout(() => { window.location.href = 'home.html'; }, 500);
                    } else {
                        width += Math.random() * 2 + 0.5;
                        if (width > 100) width = 100;
                        progress.style.width = width + '%';
                        const targetIdx = Math.min(Math.floor((width / 100) * statusMessages.length), statusMessages.length - 1);
                        if (targetIdx !== messageIndex) {
                            messageIndex = targetIdx;
                            statusText.innerText = statusMessages[messageIndex];
                            playLoadingTick(800 + (messageIndex * 50));
                        }
                    }
                }, 50);
            }, 800);
        }
    </script>
</body>
</html>
