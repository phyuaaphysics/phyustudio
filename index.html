<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ph Studio | Welcome</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://phyuaaphysics.github.io/phyustudio/favicon.png">
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PhyU Studio">
    
    <!-- PWA App Icon Location (iOS) -->
    <link rel="apple-touch-icon" href="https://phyuaaphysics.github.io/phyustudio/appicon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="https://phyuaaphysics.github.io/phyustudio/appicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://phyuaaphysics.github.io/phyustudio/appicon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="https://phyuaaphysics.github.io/phyustudio/appicon.png">
    
    <!-- Manifest (Android/Chrome) -->
    <link rel="manifest" href="data:application/manifest+json,{'name':'PhyU Studio','short_name':'PhyU','start_url':'.','display':'standalone','background_color':'#ffffff','theme_color':'#ffffff','icons':[{'src':'https://phyuaaphysics.github.io/phyustudio/appicon.png','sizes':'192x192','type':'image/png'},{'src':'https://phyuaaphysics.github.io/phyustudio/appicon.png','sizes':'512x512','type':'image/png'}]}">

    <style>
        :root {
            --accent: #0070f3;
            --bg: #ffffff;
            --text: #111111;
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            touch-action: none;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            transition: opacity 0.6s ease-in; 
        }

        #main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(10px, 4vh, 30px);
            z-index: 110;
            text-align: center;
            width: 100%;
            max-width: 400px;
            transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.8s ease-in;
            pointer-events: none;
        }

        #app-icon {
            width: clamp(120px, 40vw, 220px);
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.08));
            animation: float 6s ease-in-out infinite;
            transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(1deg); }
            50% { transform: translateY(-15px) rotate(-1deg); }
        }

        .start-btn {
            margin-top: 10px;
            padding: clamp(12px, 2.5vh, 18px) clamp(30px, 8vw, 50px);
            border: 1px solid var(--text);
            background: transparent;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: clamp(11px, 1.5vh, 14px);
            font-weight: 400;
            cursor: pointer;
            position: relative;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            pointer-events: auto;
            z-index: 120;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .start-btn:active {
            transform: scale(0.96);
            background: rgba(0,0,0,0.05);
        }

        @media (hover: hover) {
            .start-btn:hover {
                letter-spacing: 6px;
                background: rgba(0,0,0,0.03);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            }
        }

        #loading-ui {
            width: 80%;
            max-width: 280px;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
            margin-top: 20px;
        }

        .loading-text {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            height: 12px;
            font-style: italic;
        }

        .progress-container {
            width: 100%;
            height: 2px;
            background: rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--text);
            transition: width 0.1s linear; 
        }

        .visible { opacity: 1 !important; }
        .fade-out { opacity: 0 !important; pointer-events: none; }

        .netflix-zoom {
            transform: scale(40) !important;
            opacity: 0 !important;
        }

        @media (max-height: 450px) {
            #main-container {
                flex-direction: row;
                max-width: 600px;
                justify-content: center;
                gap: 40px;
            }
            #app-icon { width: 100px; }
            #loading-ui { margin-top: 0; }
        }

    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="overlay">
        <div id="main-container">
            <img id="app-icon" src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="PhyU Studio Icon">
            
            <button class="start-btn" id="start-btn">Launch System</button>

            <div id="loading-ui">
                <div class="loading-text" id="status-text">INITIALIZING...</div>
                <div class="progress-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const mainContainer = document.getElementById('main-container');
        const startBtn = document.getElementById('start-btn');
        const loadingUi = document.getElementById('loading-ui');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        
        const REDIRECT_URL = "https://phyuaaphysics.github.io/phyustudio/home.html";

        const AudioEngine = {
            ctx: null,
            buffers: {},
            initialized: false,

            init() {
                if (this.initialized) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.initialized = true;
            },

            async loadSound(name, url) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const arrayBuffer = await response.arrayBuffer();
                    if (!this.ctx) this.init();
                    const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
                    this.buffers[name] = audioBuffer;
                } catch (e) {
                    console.warn("Audio load deferred or failed:", name);
                }
            },

            play(name, options = {}) {
                const { volume = 0.5, pitch = 1, loop = false } = options;
                if (!this.ctx || !this.buffers[name]) return null;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const source = this.ctx.createBufferSource();
                const gainNode = this.ctx.createGain();
                source.buffer = this.buffers[name];
                source.playbackRate.value = pitch;
                source.loop = loop;
                gainNode.gain.value = volume;
                source.connect(gainNode);
                gainNode.connect(this.ctx.destination);
                source.start(0);
                return { source, gainNode };
            }
        };

        const assets = {
            tap: 'https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3',
            hum: 'https://assets.mixkit.co/active_storage/sfx/2567/2567-preview.mp3',
            glitch: 'https://assets.mixkit.co/active_storage/sfx/2563/2563-preview.mp3',
            ready: 'https://assets.mixkit.co/active_storage/sfx/2569/2569-preview.mp3',
            chime: 'https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3'
        };

        Object.entries(assets).forEach(([name, url]) => AudioEngine.loadSound(name, url));

        let width, height, particles = [];
        let speed = 0.4;
        const loadingPhases = ["SYNCING...", "LOADING MODULES...", "READY"];

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = (Math.random() - 0.5) * width;
                this.y = (Math.random() - 0.5) * height;
                this.z = Math.random() * width;
                this.pz = this.z;
                this.color = Math.random() > 0.8 ? '#0070f3' : '#dddddd';
            }
            update() {
                this.z -= speed;
                if (this.z <= 1) this.reset();
            }
            show() {
                let sx = (this.x / this.z) * (width / 2) + width / 2;
                let sy = (this.y / this.z) * (height / 2) + height / 2;
                let r = (1 - this.z / width) * 2;
                let px = (this.x / this.pz) * (width / 2) + width / 2;
                let py = (this.y / this.pz) * (height / 2) + height / 2;
                ctx.beginPath();
                ctx.lineWidth = r;
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = (1 - (this.z / width)) * 0.4;
                ctx.moveTo(px, py);
                ctx.lineTo(sx, sy);
                ctx.stroke();
                ctx.globalAlpha = 1;
                this.pz = this.z;
            }
        }

        function initCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            particles = [];
            const count = width < 768 ? 120 : 250;
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.show();
            });
            requestAnimationFrame(animate);
        }

        let humLoop = null;

        async function startSequence() {
            AudioEngine.init();
            AudioEngine.play('tap', { volume: 0.3 });
            startBtn.classList.add('fade-out');
            setTimeout(() => {
                startBtn.style.display = 'none';
                loadingUi.classList.add('visible');
                humLoop = AudioEngine.play('hum', { volume: 0.1, loop: true, pitch: 0.7 });
                runProgress();
            }, 400); 
        }

        function runProgress() {
            let progress = 0;
            const startTime = Date.now();
            const duration = 2400; 
            let glitchPlayed = false;
            const step = () => {
                const elapsed = Date.now() - startTime;
                progress = (elapsed / duration) * 100;
                if (progress > 100) progress = 100;
                progressBar.style.width = progress + "%";
                if (progress > 55 && !glitchPlayed) {
                    AudioEngine.play('glitch', { volume: 0.15 });
                    glitchPlayed = true;
                }
                const textIdx = Math.floor((progress / 100) * (loadingPhases.length - 1));
                statusText.innerText = loadingPhases[textIdx];
                if (progress < 100) {
                    requestAnimationFrame(step);
                } else {
                    AudioEngine.play('ready', { volume: 0.4 });
                    if (humLoop) {
                        try {
                            humLoop.gainNode.gain.exponentialRampToValueAtTime(0.01, AudioEngine.ctx.currentTime + 0.4);
                            setTimeout(() => humLoop.source.stop(), 400);
                        } catch (e) {}
                    }
                    setTimeout(triggerLaunch, 400);
                }
            };
            requestAnimationFrame(step);
        }

        function triggerLaunch() {
            AudioEngine.play('chime', { volume: 0.6 });
            speed = 25; 
            mainContainer.classList.add('netflix-zoom');
            setTimeout(() => { overlay.style.opacity = "0"; }, 600); 
            setTimeout(() => { window.location.href = REDIRECT_URL; }, 1100); 
        }

        window.addEventListener('resize', initCanvas);
        startBtn.addEventListener('click', startSequence);
        startBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startSequence();
        }, { passive: false });

        window.onload = () => {
            initCanvas();
            animate();
        };
    </script>
</body>
</html>
