<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生違規紀錄登記系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="flex items-center gap-3 mb-6">
            <div class="p-2 bg-blue-100 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">違規紀錄登記</h1>
        </div>

        <form id="recordForm" class="space-y-5">
            <!-- 學生姓名選擇 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">選擇學生姓名</label>
                <select id="studentName" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    <option value="" disabled selected>載入中...</option>
                </select>
            </div>

            <!-- 違規事項選擇 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">違規事項</label>
                <select id="violationType" required class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    <option value="" disabled selected>載入中...</option>
                </select>
            </div>

            <!-- 提交按鈕 -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-lg shadow-blue-200 flex items-center justify-center gap-2 disabled:bg-slate-400">
                <span>確認送出</span>
            </button>
        </form>

        <!-- 狀態回饋區域 -->
        <div id="statusMessage" class="mt-6 hidden p-4 rounded-lg text-center text-sm font-medium border"></div>
    </div>

    <!-- 載入中遮罩 -->
    <div id="loader" class="fixed inset-0 bg-white/80 flex flex-col items-center justify-center z-50">
        <div class="loading-spinner mb-4"></div>
        <p id="loaderText" class="text-slate-600 font-medium">正從資料庫獲取清單...</p>
    </div>

    <script>
        // 確認 GAS URL 正確性
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzy2c5oOX2MdaDeF9K3ulChaYAbZsTQd8HtSRdFxz-YPcYS-lEljUbaNNLMJsDpv2w/exec";

        const form = document.getElementById('recordForm');
        const studentSelect = document.getElementById('studentName');
        const violationSelect = document.getElementById('violationType');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMessage');

        // 初始化：獲取 DATA 分頁的資料
        async function init() {
            try {
                // 使用 mode: 'cors' 確保跨域請求能被發送，雖然 GAS 最終會重導向
                const response = await fetch(`${GAS_URL}?action=getList`, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });

                if (!response.ok) throw new Error('網絡響應不正常');

                const data = await response.json();

                // 填充學生名單
                studentSelect.innerHTML = '<option value="" disabled selected>請選擇學生</option>';
                if (data.students && data.students.length > 0) {
                    data.students.forEach(name => {
                        if(name && name.toString().trim() !== "") {
                            const opt = document.createElement('option');
                            opt.value = name;
                            opt.textContent = name;
                            studentSelect.appendChild(opt);
                        }
                    });
                }

                // 填充違規事項
                violationSelect.innerHTML = '<option value="" disabled selected>請選擇事項</option>';
                if (data.violations && data.violations.length > 0) {
                    data.violations.forEach(item => {
                        if(item && item.toString().trim() !== "") {
                            const opt = document.createElement('option');
                            opt.value = item;
                            opt.textContent = item;
                            violationSelect.appendChild(opt);
                        }
                    });
                }

                loader.classList.add('hidden');
            } catch (error) {
                console.error("無法載入資料:", error);
                document.getElementById('loaderText').innerHTML = `
                    <div class="text-center p-6">
                        <p class="text-red-500 font-bold mb-2">資料載入失敗 (Fetch Error)</p>
                        <p class="text-slate-600 text-xs mb-4">請確認 GAS 部署為「所有人 (Anyone)」，且已完成授權。</p>
                        <button onclick="location.reload()" class="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm">重新整理</button>
                    </div>
                `;
                document.querySelector('.loading-spinner').classList.add('hidden');
            }
        }

        // 送出表單
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = studentSelect.value;
            const violation = violationSelect.value;

            if (!name || !violation) {
                showStatus("請確保已選擇學生與事項", "error");
                return;
            }

            setLoading(true);

            try {
                // 使用 URLSearchParams 以符合 GAS doPost 的 parameter 接收方式
                const payload = new URLSearchParams();
                payload.append('action', 'addData');
                payload.append('name', name);
                payload.append('violation', violation);

                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors', // 關鍵：GAS POST 有時需要 no-cors 來避免 preflight 失敗
                    body: payload,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                });

                // 注意：在 no-cors 模式下，無法讀取 response body。
                // 我們等待一小段時間後假設成功，或是嘗試重新抓取狀態。
                // 為了用戶體驗，我們假設只要沒報錯就是成功發送。
                showStatus(`已送出登記：${name} - ${violation}`, "success");
                form.reset();

            } catch (error) {
                console.error("提交失敗:", error);
                showStatus("發送失敗，請確認網路連線。", "error");
            } finally {
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="flex items-center"><svg class="animate-spin h-5 w-5 mr-3 border-2 border-white border-t-transparent rounded-full" viewBox="0 0 24 24"></svg>處理中...</span>';
            } else {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>確認送出</span>';
            }
        }

        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.classList.remove('hidden', 'bg-green-50', 'text-green-700', 'border-green-200', 'bg-red-50', 'text-red-700', 'border-red-200');
            
            if (type === "success") {
                statusMsg.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
            } else {
                statusMsg.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
            }

            statusMsg.classList.remove('hidden');
            setTimeout(() => {
                statusMsg.classList.add('hidden');
            }, 5000);
        }

        window.onload = init;
    </script>
</body>
</html>
