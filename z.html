
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI YouTube 视频内容分析器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ef4444;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">

    <div class="max-w-4xl mx-auto py-12 px-4">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-slate-900 mb-4 tracking-tight">YouTube AI 视频分析工具</h1>
            <p class="text-slate-500 text-lg">输入链接，通过 Gemini 2.5 深度解析视频字幕</p>
        </div>

        <!-- Main Input Card -->
        <div class="glass border border-white rounded-3xl shadow-2xl p-8 mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="videoUrl" placeholder="粘贴 YouTube 视频链接 (例如: https://www.youtube.com/watch?v=...)" 
                    class="flex-1 px-6 py-4 bg-white border border-slate-200 rounded-2xl focus:ring-4 focus:ring-red-500/20 focus:border-red-500 outline-none transition-all shadow-inner">
                <button onclick="runAnalysis()" id="mainBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold px-10 py-4 rounded-2xl transition-all shadow-lg hover:shadow-red-500/30 flex items-center justify-center whitespace-nowrap">
                    <span id="btnContent">开始智能分析</span>
                </button>
            </div>
            <div id="errorBox" class="mt-4 hidden p-4 bg-red-50 border border-red-100 text-red-600 rounded-xl text-sm flex items-center">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                <span id="errorMsg"></span>
            </div>
        </div>

        <!-- Result Display -->
        <div id="results" class="hidden space-y-6 fade-in">
            <!-- Title Section -->
            <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
                <label class="text-xs font-bold text-red-600 uppercase tracking-widest block mb-2">建议的爆款标题</label>
                <h2 id="outTitle" class="text-2xl md:text-3xl font-extrabold text-slate-800 leading-tight"></h2>
            </div>

            <div class="grid md:grid-cols-3 gap-6">
                <!-- Summary Section -->
                <div class="md:col-span-2 bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-4">30字核心摘要</label>
                    <p id="outSummary" class="text-xl text-slate-700 leading-relaxed font-medium italic">
                        <!-- Summary goes here -->
                    </p>
                </div>

                <!-- Metadata Section -->
                <div class="bg-slate-900 rounded-3xl p-8 shadow-xl text-white">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-4">分析详情</label>
                    <ul id="outPoints" class="space-y-4 text-sm opacity-90">
                        <!-- Points go here -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        const apiKey = ""; // 执行环境自动填充

        window.runAnalysis = async () => {
            const url = document.getElementById('videoUrl').value.trim();
            const btn = document.getElementById('mainBtn');
            const btnText = document.getElementById('btnContent');
            const results = document.getElementById('results');
            const errorBox = document.getElementById('errorBox');

            if (!url) {
                showError("请先输入视频链接");
                return;
            }

            // UI Reset
            errorBox.classList.add('hidden');
            results.classList.add('hidden');
            btn.disabled = true;
            btnText.innerHTML = '<span class="loader"></span> 正在读取字幕数据...';

            const systemPrompt = `你是一个 YouTube 数据分析机器人。
            任务：
            1. 利用 Google Search 工具访问该 URL，并专门查找其 "Transcript" (字幕) 或 "Video Content"。
            2. 必须基于实际字幕内容进行分析。
            3. 输出一个点击率高的中文标题。
            4. 输出一个精确的 30 字左右的中文总结。
            5. 提供 3 个核心要点。

            输出格式必须为严格的 JSON:
            {"title": "...", "summary": "...", "points": ["...", "...", "..."]}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `分析这个视频的内容并根据字幕总结: ${url}` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        tools: [{ "google_search": {} }],
                        generationConfig: { 
                            responseMimeType: "application/json",
                            temperature: 0.2
                        }
                    })
                });

                if (!response.ok) throw new Error("API 连接失败，请检查网络或 Key");

                const json = await response.json();
                const rawText = json.candidates[0].content.parts[0].text;
                const data = JSON.parse(rawText);

                // Update UI
                document.getElementById('outTitle').innerText = data.title;
                document.getElementById('outSummary').innerText = data.summary;
                
                const pointsHtml = data.points.map(p => `
                    <li class="flex items-start">
                        <span class="text-red-500 mr-2">✦</span>
                        <span>${p}</span>
                    </li>
                `).join('');
                document.getElementById('outPoints').innerHTML = pointsHtml;

                results.classList.remove('hidden');
            } catch (err) {
                showError("分析失败: " + err.message + "。请确认视频是否有字幕，或稍后再试。");
            } finally {
                btn.disabled = false;
                btnText.innerText = '开始智能分析';
            }
        };

        window.showError = (msg) => {
            const errorBox = document.getElementById('errorBox');
            document.getElementById('errorMsg').innerText = msg;
            errorBox.classList.remove('hidden');
        };
    </script>
</body>
</html>
