
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LESSON ARCHIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-bg: #F2F2F7;
            --ios-blue: #007AFF;
            --radius-main: 12px;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif; 
            background-color: var(--ios-bg);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .capsule-container {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 999px;
            padding: 4px;
            display: flex;
            gap: 2px;
            border: 0.5px solid rgba(0,0,0,0.05);
        }
        .capsule-item {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 999px;
            color: #3A3A3C;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
            cursor: pointer;
        }
        .capsule-item.active {
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            color: black;
            font-weight: 700;
        }

        .calendar-day {
            aspect-ratio: 1/1;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 10;
        }
        .calendar-day:active { transform: scale(0.9); }
        .calendar-day.active { background-color: var(--ios-blue); color: white; }
        .calendar-day.today { color: var(--ios-blue); font-weight: 800; border: 1px solid rgba(0,122,255,0.2); }
        
        .dot { width: 4px; height: 4px; border-radius: 50%; margin-top: 2px; background: transparent; }
        .has-recording .dot { background: #C7C7CC; }
        .active .dot { background: white !important; }

        .ios-card {
            background: white;
            border-radius: var(--radius-main);
            border: 0.5px solid rgba(0,0,0,0.1);
            position: relative;
            z-index: 5;
        }

        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #F2F2F7;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        
        /* 修正點擊問題的核心：當隱藏時不允許攔截點擊事件 */
        #loadingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="text-center space-y-4">
        <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-16 h-16 mx-auto">
        <div id="loadingStatus" class="flex items-center gap-2 text-gray-400">
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
            <span>正在連線至雲端...</span>
        </div>
    </div>
</div>

<div id="mainContent" class="hidden pb-10">
    <nav class="sticky top-0 z-40 px-4 h-14 flex items-center justify-between bg-white/80 backdrop-blur-md border-b border-black/5">
        <div class="flex items-center gap-2">
            <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-8 h-8">
            <h1 class="font-bold text-[17px]">LESSON ARCHIVE</h1>
        </div>
        <div id="statusBadge" class="flex items-center gap-1 text-blue-500 font-semibold text-xs bg-blue-50 px-2 py-1 rounded-full">
            <i data-lucide="cloud" class="w-3.5 h-3.5"></i>
            <i data-lucide="check" class="w-3 h-3 -ml-1"></i>
            <span>已同步</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        <div class="capsule-container overflow-x-auto no-scrollbar">
            <button onclick="filterByClass('全部')" class="capsule-item active">全部</button>
            <button onclick="filterByClass('S3A')" class="capsule-item">S3A</button>
            <button onclick="filterByClass('S3B')" class="capsule-item">S3B</button>
            <button onclick="filterByClass('S3C')" class="capsule-item">S3C</button>
            <button onclick="filterByClass('S3D')" class="capsule-item">S3D</button>
            <button onclick="filterByClass('S4')" class="capsule-item">S4</button>
            <button onclick="filterByClass('S5')" class="capsule-item">S5</button>
            <button onclick="filterByClass('S6')" class="capsule-item">S6</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-5 gap-6">
            <div class="md:col-span-2 space-y-4">
                <div class="ios-card p-5">
                    <div class="flex items-center justify-between mb-6">
                        <h2 id="monthLabel" class="font-bold text-lg text-gray-900"></h2>
                        <div class="flex gap-1">
                            <button onclick="changeMonth(-1)" class="p-2 text-blue-500 active:bg-gray-100 rounded-full cursor-pointer"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                            <button onclick="changeMonth(1)" class="p-2 text-blue-500 active:bg-gray-100 rounded-full cursor-pointer"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 text-center text-[11px] font-bold text-gray-400 mb-3 uppercase tracking-tighter">
                        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                    </div>
                    <div id="calendarGrid" class="grid grid-cols-7 gap-y-2"></div>
                    <button onclick="jumpToToday()" class="w-full mt-6 py-2 text-blue-500 font-semibold text-sm border border-blue-100 rounded-lg active:bg-blue-50 cursor-pointer">回到今日</button>
                </div>
            </div>

            <div class="md:col-span-3 space-y-4">
                <div class="flex items-end justify-between px-1">
                    <h2 id="listTitle" class="text-xl font-bold tracking-tight text-gray-900">選擇日期</h2>
                    <span id="recordCount" class="text-xs font-medium text-gray-400">0 個項目</span>
                </div>
                <div id="videoList" class="space-y-3"></div>
                <div id="noData" class="hidden ios-card p-12 text-center text-gray-400 text-sm">
                    <i data-lucide="video-off" class="w-10 h-10 mx-auto mb-2 opacity-20"></i>
                    當天沒有符合班級的錄影
                </div>
            </div>
        </div>
    </main>
</div>

<div id="videoModal" class="fixed inset-0 z-[100] hidden flex items-end md:items-center justify-center">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeVideo()"></div>
    <div class="relative w-full max-w-4xl bg-white rounded-t-2xl md:rounded-2xl overflow-hidden shadow-2xl flex flex-col">
        <div class="h-12 flex items-center justify-between px-4 border-b border-gray-100">
            <div class="flex items-center gap-2">
                <span id="mClass" class="text-[10px] font-black bg-blue-50 text-blue-600 px-2 py-0.5 rounded"></span>
                <span id="mDate" class="text-[11px] text-gray-400"></span>
            </div>
            <button onclick="closeVideo()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 active:scale-90 cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="aspect-video bg-black" id="videoPlayer"></div>
        <div class="p-5 space-y-4">
            <h3 id="mTitle" class="font-bold text-lg text-gray-900"></h3>
            <button id="openAppBtn" class="flex items-center justify-center gap-2 w-full py-4 bg-[#F2F2F7] text-[#007AFF] font-bold rounded-xl active:scale-[0.98] transition-transform cursor-pointer">
                <i data-lucide="youtube" class="w-5 h-5"></i>
                在 YOUTUBE 應用程式中開啟
            </button>
        </div>
    </div>
</div>

<script>
    const SHEET_ID = '1EwnY9DEZbZ2oUzzC7YTU_ndCYRua8pyu3VWK1IaVhaI';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    let recordingsData = {};
    let currentDate = new Date();
    let selectedDate = new Date();
    let selectedClass = "全部";

    async function init() {
        lucide.createIcons();
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error('連線失敗');
            const csv = await response.text();
            parseCSV(csv);
        } catch (e) { 
            console.error('Fetch Error:', e);
            document.getElementById('loadingStatus').innerHTML = '<span class="text-red-400">連線異常，請檢查網路</span>';
        } finally {
            setTimeout(() => {
                const overlay = document.getElementById('loadingOverlay');
                overlay.classList.add('hidden'); // 加入 hidden 類別來關閉 pointer-events
                document.getElementById('mainContent').classList.remove('hidden');
                jumpToLatest();
            }, 800);
        }
    }

    function parseCSV(csv) {
        if (!csv) return;
        const rows = csv.split(/\r?\n/);
        rows.forEach((line, index) => {
            if (index === 0 || !line.trim()) return; 
            const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
            
            if (cols.length >= 2) {
                const dateKey = parseDateKey(cols[0]);
                if (dateKey) {
                    if (!recordingsData[dateKey]) recordingsData[dateKey] = [];
                    recordingsData[dateKey].push({ 
                        link: cols[1], 
                        class: cols[2] || '其他', 
                        raw: cols[0] 
                    });
                }
            }
        });
    }

    function parseDateKey(str) {
        if (!str) return null;
        const m = str.match(/(\d+)年(\d+)月(\d+)日/);
        if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
        const d = new Date(str);
        return isNaN(d.getTime()) ? null : formatDate(d);
    }

    function render() {
        const grid = document.getElementById('calendarGrid');
        if (!grid) return;
        grid.innerHTML = '';
        const y = currentDate.getFullYear();
        const m = currentDate.getMonth();
        document.getElementById('monthLabel').innerText = `${y}年 ${m + 1}月`;

        const start = new Date(y, m, 1).getDay();
        const days = new Date(y, m + 1, 0).getDate();
        for (let i = 0; i < start; i++) {
            const empty = document.createElement('div');
            grid.appendChild(empty);
        }

        for (let d = 1; d <= days; d++) {
            const dateObj = new Date(y, m, d);
            const dStr = formatDate(dateObj);
            const recs = recordingsData[dStr] || [];
            const hasRec = selectedClass === "全部" ? recs.length > 0 : recs.some(r => r.class.includes(selectedClass));
            
            const el = document.createElement('div');
            el.className = `calendar-day ${formatDate(selectedDate) === dStr ? 'active' : ''} ${hasRec ? 'has-recording' : ''}`;
            if (dStr === formatDate(new Date())) el.classList.add('today');
            el.innerHTML = `<span>${d}</span><div class="dot"></div>`;
            el.onclick = (e) => {
                e.stopPropagation();
                selectedDate = new Date(y, m, d); 
                render();
            };
            grid.appendChild(el);
        }
        renderList();
    }

    function renderList() {
        const dStr = formatDate(selectedDate);
        let vids = recordingsData[dStr] || [];
        if (selectedClass !== "全部") vids = vids.filter(v => v.class.includes(selectedClass));

        const list = document.getElementById('videoList');
        list.innerHTML = '';
        document.getElementById('recordCount').innerText = `${vids.length} 個項目`;
        document.getElementById('listTitle').innerText = selectedDate.toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'short' });

        if (!vids.length) {
            document.getElementById('noData').classList.remove('hidden');
            return;
        }
        document.getElementById('noData').classList.add('hidden');

        vids.forEach(v => {
            const yId = getYouTubeId(v.link);
            const card = document.createElement('div');
            card.className = "ios-card p-3 flex items-center gap-4 cursor-pointer active:scale-[0.98] transition-transform";
            card.onclick = () => openVideo(v);
            card.innerHTML = `
                <div class="w-24 h-16 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0 relative pointer-events-none">
                    <img src="https://img.youtube.com/vi/${yId}/mqdefault.jpg" class="w-full h-full object-cover">
                    <div class="absolute inset-0 flex items-center justify-center bg-black/10"><i data-lucide="play" class="w-5 h-5 text-white fill-current"></i></div>
                </div>
                <div class="flex-1 min-w-0 pointer-events-none">
                    <div class="flex items-center gap-1.5 mb-0.5">
                        <span class="text-[9px] font-black bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded uppercase">${v.class}</span>
                    </div>
                    <h4 class="font-bold text-sm truncate text-gray-900">${v.class} 課程錄影</h4>
                    <p class="text-[10px] text-gray-400">點擊播放</p>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
            `;
            list.appendChild(card);
        });
        lucide.createIcons();
    }

    function openVideo(v) {
        const yId = getYouTubeId(v.link);
        document.getElementById('videoPlayer').innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${yId}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        document.getElementById('mTitle').innerText = `${v.class} 課程錄影`;
        document.getElementById('mClass').innerText = v.class;
        document.getElementById('mDate').innerText = v.raw;
        document.getElementById('openAppBtn').onclick = () => window.open(v.link, '_blank');
        document.getElementById('videoModal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        lucide.createIcons();
    }

    function closeVideo() {
        document.getElementById('videoPlayer').innerHTML = '';
        document.getElementById('videoModal').classList.add('hidden');
        document.body.style.overflow = '';
    }

    function filterByClass(cls) {
        selectedClass = cls;
        document.querySelectorAll('.capsule-item').forEach(btn => btn.classList.toggle('active', btn.innerText === cls));
        render();
    }

    function changeMonth(n) { 
        currentDate.setMonth(currentDate.getMonth() + n); 
        render(); 
    }

    function jumpToToday() {
        selectedDate = new Date();
        currentDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
        render();
    }

    function jumpToLatest() {
        const dates = Object.keys(recordingsData).sort();
        if (dates.length) {
            const parts = dates[dates.length - 1].split('-');
            selectedDate = new Date(parts[0], parts[1]-1, parts[2]);
            currentDate = new Date(parts[0], parts[1]-1, 1);
        } else {
            selectedDate = new Date();
            currentDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
        }
        render();
    }

    function formatDate(d) { 
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; 
    }

    function getYouTubeId(url) {
        if (!url) return '';
        const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?]{11})/);
        return m ? m[1] : '';
    }

    window.onload = init;
</script>
</body>
</html>
