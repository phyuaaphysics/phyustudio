<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Simulation Lab - Lumina Studio</title>
    
    <!-- iOS PWA 狀態列修正 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        :root {
            --mint-deep: #064e3b;
            --mint-primary: #10b981; 
            --mint-accent: #34d399;
            --mint-bg: #f0fdf4;
            --mint-glass: rgba(240, 253, 244, 0.85); 
            --mint-nav-glass: rgba(255, 255, 255, 0.75);
            /* 調整後的灰綠色調 Docking */
            --sage-deep: #2d3a35;
            --sage-muted: #6b8278;
            --sage-active: #4a6d5d;
        }

        html { 
            scroll-behavior: smooth; 
            height: 100%;
            overflow: hidden; 
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--mint-bg);
            color: var(--mint-deep);
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            overflow-y: auto;
            padding-top: 0;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #page-loader {
            position: fixed; inset: 0; background-color: var(--mint-bg); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
        }
        #page-loader.active { opacity: 1; visibility: visible; }
        
        .logo-bar {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 120;
            background-color: rgba(240, 253, 244, 0.85);
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.1);
            padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
            padding-bottom: 12px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #main-logo {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: left center;
            will-change: transform;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scrolled #main-logo { transform: scale(0.75); }

        .filter-bar {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 68px);
            left: 0;
            width: 100%;
            z-index: 110;
            background-color: rgba(240, 253, 244, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-bottom: 1px solid rgba(16, 185, 129, 0.05);
        }

        .filter-bar.collapsed {
            transform: translateY(-56px); 
            opacity: 0.9;
        }

        .filter-capsule {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(16, 185, 129, 0.1);
            color: var(--mint-deep);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-capsule.active {
            background: var(--mint-primary);
            color: #fff;
            border-color: var(--mint-primary);
        }

        .sub-filter-container {
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(16, 185, 129, 0.03);
            display: flex;
            gap: 8px;
            padding: 0 24px;
        }

        .sub-filter-container.expanded {
            max-height: 60px;
            padding: 10px 24px;
            margin-top: 5px;
            border-top: 1px solid rgba(16, 185, 129, 0.05);
        }

        .filter-toggle-trigger {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: rgba(240, 253, 244, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 0 0 14px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(16, 185, 129, 0.05);
            border-top: none;
            color: var(--mint-primary);
            transition: all 0.3s;
        }

        #page-content { padding-top: calc(env(safe-area-inset-top, 0px) + 130px); }

        .slider-wrapper { position: relative; width: 100%; }

        .slider-container { 
            display: flex; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            gap: 12px; 
            padding: 10px 0 20px 0;
            scroll-behavior: smooth;
        }

        .nav-btn {
            position: absolute;
            top: 40%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }
        
        .slider-wrapper:hover .nav-btn { opacity: 1; }
        .nav-btn.prev { left: -12px; }
        .nav-btn.next { right: -12px; }

        .slider-item { scroll-snap-align: start; flex: 0 0 auto; }

        .poster-card { 
            aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #d1fae5; 
            position: relative; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 12px -4px rgba(6, 78, 59, 0.1);
        }

        .card-topic-tag {
            font-size: 10px;
            font-weight: 700;
            color: var(--mint-primary);
            background: rgba(16, 185, 129, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 8px;
            display: inline-block;
        }

        .card-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--mint-deep);
            margin-top: 4px;
            display: block;
        }

        .hero-container-framed {
            border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 24px;
            overflow: hidden; position: relative; background-color: var(--mint-deep); 
        }

        .section-hidden { display: none !important; }

        /* 浮窗與 iframe 樣式 */
        #sim-preview-modal {
            position: fixed; inset: 0; z-index: 300;
            background: rgba(0,0,0,0.6);
            display: none; align-items: center; justify-content: center;
            padding: 20px; backdrop-filter: blur(8px);
        }
        .modal-body {
            background: white; width: 100%; max-width: 480px;
            border-radius: 28px; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            transform: scale(0.9); transition: transform 0.3s;
        }
        #sim-preview-modal.active { display: flex; }
        #sim-preview-modal.active .modal-body { transform: scale(1); }

        #iframe-container {
            position: fixed; inset: 0; z-index: 400;
            background: black; display: none;
        }
        #iframe-container.active { display: block; }
        
        .iframe-close-btn {
            position: absolute; top: calc(env(safe-area-inset-top, 0px) + 15px);
            right: 20px; z-index: 410;
            width: 40px; height: 40px; background: rgba(0,0,0,0.4);
            color: white; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 20px;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.2);
        }

        /* 灰綠色調 Docking */
        .dock-wrapper {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
            width: auto;
            min-width: 340px;
        }

        .dock-wrapper.collapsed { transform: translateX(-50%) translateY(200px); opacity: 0; }

        .dock-nav {
            background-color: rgba(60, 75, 68, 0.85); /* 灰綠色 */
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            padding: 12px 14px;
            border-radius: 42px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex; align-items: center; justify-content: center; gap: 14px;
        }

        .dock-toggle-btn {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.4); cursor: pointer; font-size: 14px;
        }

        .dock-content { display: flex; align-items: center; gap: 14px; }

        .dock-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: var(--sage-muted); transition: all 0.3s; min-width: 58px;
            background: transparent; border: none; cursor: pointer;
        }

        .dock-item i { font-size: 1.6rem; }
        .dock-item span { font-size: 9px; font-weight: 500; opacity: 0.7; }
        .dock-item.active { color: white; }

        .dock-trigger-bar {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 5px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px; z-index: 199; cursor: pointer; display: none;
        }
        .dock-wrapper.collapsed + .dock-trigger-bar { display: block; }

        .section-title { font-size: 1.15rem; font-weight: 800; color: var(--mint-deep); margin-bottom: 8px; }

        @media (max-width: 768px) {
            .hero-container-framed { border-radius: 0; }
            .dock-wrapper { width: 92%; max-width: 400px; }
            #page-content { padding-top: calc(env(safe-area-inset-top, 0px) + 160px); }
        }
    </style>
</head>
<body class="pb-40 hide-scrollbar">

    <div id="page-loader">
        <div class="flex flex-col items-center">
            <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-12 h-12 animate-pulse mb-4">
            <p class="text-[10px] font-black tracking-[0.3em] text-emerald-400 uppercase">Simulation Lab</p>
        </div>
    </div>

    <header id="header-root">
        <div class="logo-bar px-6" id="logo-nav-bar"> 
            <div class="max-w-screen-2xl mx-auto flex items-center justify-between">
                <div class="cursor-pointer" onclick="handleNavigation('https://phyuaaphysics.github.io/phyustudio/home.html', false)" id="main-logo">
                    <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="Lumina" class="h-12 w-auto">
                    <span class="text-xl font-black text-emerald-900 tracking-tighter">Simulation Lab</span>
                </div>
                <div class="flex items-center gap-6 text-emerald-800 opacity-60">
                    <i class="fas fa-search text-xl"></i>
                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-emerald-900 text-[10px] font-bold">U</div>
                </div>
            </div>
        </div>
        
        <div class="filter-bar" id="filter-bar">
            <div class="max-w-screen-2xl mx-auto flex items-center gap-3 overflow-x-auto hide-scrollbar px-6 pr-12">
                <button class="filter-capsule active" data-filter="all" onclick="setFilter('all')">全部模擬</button>
                <button class="filter-capsule" data-filter="atomic" onclick="setFilter('atomic')">原子世界</button>
                <button class="filter-capsule" data-filter="medical" onclick="setFilter('medical')">醫學物理</button>
            </div>
            
            <div id="sub-filter-atomic" class="sub-filter-container hide-scrollbar overflow-x-auto">
                <button class="filter-capsule active text-[11px]" data-subfilter="all" onclick="setSubFilter('atomic', 'all')">
                    <i class="fas fa-th-large"></i>全選
                </button>
                <button class="filter-capsule text-[11px]" data-subfilter="光電效應" onclick="setSubFilter('atomic', '光電效應')">
                    <i class="fas fa-bolt"></i>光電效應
                </button>
                <button class="filter-capsule text-[11px]" data-subfilter="原子模型" onclick="setSubFilter('atomic', '原子模型')">
                    <i class="fas fa-atom"></i>原子模型
                </button>
            </div>

            <div class="filter-toggle-trigger" onclick="toggleFilter()">
                <i class="fas fa-chevron-up text-[10px]" id="filter-chevron"></i>
            </div>
        </div>
    </header>

    <div id="page-content">
        <div id="view-sim">
            <section id="hero-section" class="px-4 md:px-12 max-w-screen-2xl mx-auto mb-12">
                <div class="hero-container-framed relative w-full h-[50vh] md:h-[60vh]">
                    <img src="https://phyuaaphysics.github.io/phyustudio/simulator-atomic-hydrogen.png" class="absolute inset-0 w-full h-full object-cover opacity-50 filter saturate-150">
                    <div class="absolute inset-0 flex flex-col items-center justify-center px-6 text-center">
                        <h1 class="text-4xl md:text-6xl font-black text-white mb-4 tracking-tight">虛擬實驗室</h1>
                        <p class="text-emerald-100 text-sm md:text-lg mb-8 max-w-lg">探索物理世界的奧秘，透過互動模擬深入理解科學原理。</p>
                        <button onclick="scrollToContent()" class="bg-emerald-500 text-white px-12 py-3 font-bold rounded-full text-[11px] tracking-[0.2em] uppercase shadow-2xl hover:bg-emerald-400 transition-colors">
                            瀏覽所有模擬
                        </button>
                    </div>
                </div>
            </section>

            <main class="space-y-12 max-w-screen-2xl mx-auto px-6" id="main-content"></main>
        </div>
    </div>

    <!-- 詳情浮窗 (Modal) -->
    <div id="sim-preview-modal" onclick="closeModal()">
        <div class="modal-body" onclick="event.stopPropagation()">
            <div class="relative w-full aspect-video bg-gray-100">
                <img id="modal-img" src="" class="w-full h-full object-cover">
                <div class="absolute inset-0 flex items-center justify-center bg-black/20">
                    <button id="modal-play-trigger" class="w-16 h-16 bg-emerald-500 text-white rounded-full flex items-center justify-center text-xl shadow-xl hover:scale-110 transition-transform">
                        <i class="fas fa-play ml-1"></i>
                    </button>
                </div>
            </div>
            <div class="p-8">
                <div id="modal-tag" class="card-topic-tag mb-2"></div>
                <h3 id="modal-name" class="text-2xl font-bold text-gray-900 mb-2"></h3>
                <p id="modal-desc" class="text-gray-500 text-sm leading-relaxed mb-6"></p>
                <div class="flex justify-end border-t pt-4">
                    <button onclick="closeModal()" class="text-gray-400 text-xs font-bold uppercase tracking-widest px-4 py-2">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Iframe 容器 -->
    <div id="iframe-container">
        <div class="iframe-close-btn" onclick="closeIframe()"><i class="fas fa-times"></i></div>
        <iframe id="sim-frame" src="" class="w-full h-full border-none"></iframe>
    </div>

    <div id="dock-nav-wrapper" class="dock-wrapper">
        <nav class="dock-nav">
            <div class="dock-toggle-btn" onclick="toggleDock()"><i class="fas fa-chevron-down"></i></div>
            <div class="dock-content">
                <button onclick="handleNavigation('https://phyuaaphysics.github.io/phyustudio/home.html', false)" id="dock-home" class="dock-item">
                    <i class="fas fa-home"></i><span class="uppercase">錄影庫</span>
                </button>
                <button onclick="scrollToTop()" class="dock-item active">
                    <i class="fas fa-cube"></i><span class="uppercase">模擬器</span>
                </button>
                <button onclick="handleNavigation('https://phyuaaphysics.github.io/phyustudio/functionhub.html', true)" class="dock-item">
                    <i class="fas fa-shapes"></i><span class="uppercase">功能區</span>
                </button>
                <button onclick="handleNavigation('https://mail.google.com/mail/u/0/#inbox', false)" class="dock-item">
                    <i class="fab fa-google"></i><span class="uppercase">郵箱</span>
                </button>
            </div>
            <div class="dock-toggle-btn" onclick="toggleDock()"><i class="fas fa-chevron-down"></i></div>
        </nav>
    </div>
    <div id="dock-handle" onclick="toggleDock()" class="dock-trigger-bar"></div>

    <script>
        const config = {
            categories: [
                { id: 'atomic', title: '原子世界' },
                { id: 'medical', title: '醫學物理學' }
            ],
            data: [
                { category: 'atomic', topic: '原子模型', name: '氫原子躍遷模擬器', desc: '探索氫原子的波耳模型，觀察電子在不同能級間躍遷時吸收或釋放光子的過程，深入理解原子光譜的形成原理。', img: 'https://phyuaaphysics.github.io/phyustudio/simulator-atomic-hydrogen.png', url: 'https://phyuaaphysics.github.io/simulator-atomic-hydrogen.html' },
                { category: 'atomic', topic: '光電效應', name: '光電效應基礎實驗', desc: '透過調整入射光頻率與強度，觀察金屬表面電子的逸出情況。驗證愛因斯坦的光電效應方程式。', img: 'https://phet.colorado.edu/sims/html/photoelectric-effect/latest/photoelectric-effect-600.png', url: 'https://phet.colorado.edu/sims/html/photoelectric-effect/latest/photoelectric-effect_all.html' },
                { category: 'medical', topic: '眼', name: '近視糾正光路圖', desc: '互動式演示近視眼的成像缺陷，以及如何利用凹透鏡發散光線使焦點重新落在視網膜上。', img: 'https://phyuaaphysics.github.io/phyustudio/simulator-eye.png', url: 'https://phyuaaphysics.github.io/simulator-eye.html' },
                { category: 'medical', topic: '眼', name: '近視糾正光路圖(虛像)', desc: '從虛像角度分析透鏡對成像位置的改變，進一步理解光學矯正的幾何原理。', img: 'https://phyuaaphysics.github.io/phyustudio/simulator-eye2.png', url: 'https://phyuaaphysics.github.io/simulator-eye2.html' }
            ]
        };

        const loader = document.getElementById('page-loader');
        let lastScrollY = window.scrollY;

        function toggleDock() { document.getElementById('dock-nav-wrapper').classList.toggle('collapsed'); }
        function toggleFilter() { document.getElementById('filter-bar').classList.toggle('collapsed'); }

        // 詳情彈窗控制
        function openPreview(item) {
            const modal = document.getElementById('sim-preview-modal');
            document.getElementById('modal-img').src = item.img;
            document.getElementById('modal-tag').innerText = item.topic;
            document.getElementById('modal-name').innerText = item.name;
            document.getElementById('modal-desc').innerText = item.desc || "透過互動式模擬，深入理解物理定律與現象的關聯。";
            
            document.getElementById('modal-play-trigger').onclick = () => {
                closeModal();
                openIframe(item.url);
            };

            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('sim-preview-modal');
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
            document.body.style.overflow = 'auto';
        }

        // Iframe 控制
        function openIframe(url) {
            const container = document.getElementById('iframe-container');
            const frame = document.getElementById('sim-frame');
            frame.src = url;
            container.style.display = 'block';
            setTimeout(() => container.classList.add('active'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeIframe() {
            const container = document.getElementById('iframe-container');
            const frame = document.getElementById('sim-frame');
            container.classList.remove('active');
            setTimeout(() => {
                container.style.display = 'none';
                frame.src = '';
            }, 300);
            document.body.style.overflow = 'auto';
        }

        function scrollSlider(id, offset) {
            const el = document.getElementById(id);
            if (el) el.scrollBy({ left: offset, behavior: 'smooth' });
        }

        function scrollToContent() {
            const main = document.getElementById('main-content');
            if (main) main.scrollIntoView({ behavior: 'smooth' });
        }

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function handleNavigation(url, showAnim = false) {
            if (!url || url === '#') return;
            if (showAnim) {
                loader.classList.add('active');
                setTimeout(() => { window.location.href = url; }, 400);
            } else {
                window.location.href = url;
            }
        }

        function setFilter(filterType) {
            const buttons = document.querySelectorAll('#filter-bar > .max-w-screen-2xl > .filter-capsule');
            buttons.forEach(btn => {
                if(btn.dataset.filter === filterType) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const atomicSub = document.getElementById('sub-filter-atomic');
            if (filterType === 'atomic') atomicSub.classList.add('expanded');
            else {
                atomicSub.classList.remove('expanded');
                resetSubFilters('atomic');
            }
            applyFilters(filterType, 'all');
        }

        function setSubFilter(parentCategory, subTopic) {
            const buttons = document.querySelectorAll(`#sub-filter-${parentCategory} .filter-capsule`);
            buttons.forEach(btn => {
                if(btn.dataset.subfilter === subTopic) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            applyFilters(parentCategory, subTopic);
        }

        function resetSubFilters(parentCategory) {
            const buttons = document.querySelectorAll(`#sub-filter-${parentCategory} .filter-capsule`);
            buttons.forEach((btn, idx) => {
                if(idx === 0) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function applyFilters(category, topic) {
            const heroSection = document.getElementById('hero-section');
            const sections = document.querySelectorAll('#main-content section');
            
            if (category === 'all') {
                if(heroSection) heroSection.classList.remove('section-hidden');
                sections.forEach(sec => {
                    sec.classList.remove('section-hidden');
                    sec.querySelectorAll('.slider-item').forEach(item => item.classList.remove('section-hidden'));
                });
            } else {
                if(heroSection) heroSection.classList.add('section-hidden');
                sections.forEach(sec => {
                    if (sec.dataset.group === category) {
                        sec.classList.remove('section-hidden');
                        const items = sec.querySelectorAll('.slider-item');
                        let visibleCount = 0;
                        items.forEach(item => {
                            if (topic === 'all' || item.dataset.topic === topic) {
                                item.classList.remove('section-hidden');
                                visibleCount++;
                            } else {
                                item.classList.add('section-hidden');
                            }
                        });
                        if (visibleCount === 0) sec.classList.add('section-hidden');
                    } else {
                        sec.classList.add('section-hidden');
                    }
                });
            }
        }

        function render() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';

            config.categories.forEach(cat => {
                const filteredData = config.data.filter(item => item.category === cat.id);
                if (filteredData.length === 0) return;

                const section = document.createElement('section');
                section.id = `sec-${cat.id}`;
                section.dataset.group = cat.id;
                
                section.innerHTML = `
                    <h2 class="section-title">${cat.title}</h2>
                    <div class="slider-wrapper">
                        <button class="nav-btn prev" onclick="scrollSlider('${cat.id}-slider', -400)"><i class="fas fa-chevron-left text-xs text-emerald-400"></i></button>
                        <div class="slider-container hide-scrollbar" id="${cat.id}-slider"></div>
                        <button class="nav-btn next" onclick="scrollSlider('${cat.id}-slider', 400)"><i class="fas fa-chevron-right text-xs text-emerald-400"></i></button>
                    </div>
                `;
                mainContent.appendChild(section);

                const slider = document.getElementById(`${cat.id}-slider`);
                filteredData.forEach(item => {
                    const div = document.createElement('div');
                    div.className = `slider-item w-52 md:w-80`;
                    div.dataset.topic = item.topic;
                    div.innerHTML = `
                        <div class="poster-card"><img src="${item.img}" class="w-full h-full object-cover"></div>
                        <span class="card-topic-tag">${item.topic || '通用'}</span>
                        <span class="card-name">${item.name}</span>
                    `;
                    div.onclick = () => openPreview(item);
                    slider.appendChild(div);
                });
            });
        }

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY || document.documentElement.scrollTop;
            if (currentScrollY > 30) document.body.classList.add('scrolled');
            else document.body.classList.remove('scrolled');
            
            const filterBar = document.getElementById('filter-bar');
            if (currentScrollY > lastScrollY && currentScrollY > 150) {
                if (!filterBar.classList.contains('collapsed')) filterBar.classList.add('collapsed');
            } else if (currentScrollY < lastScrollY) {
                if (filterBar.classList.contains('collapsed')) filterBar.classList.remove('collapsed');
            }
            lastScrollY = currentScrollY;
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', () => {
            render();
            setTimeout(() => loader.classList.remove('active'), 400);
        });
    </script>
</body>
</html>
