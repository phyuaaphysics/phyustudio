
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Simulation Lab - 物理模擬中心</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700&display=swap');
        
        :root {
            --pdd-red: #e02e24;
            --glacier-bg: #f8fafc;
            --glacier-glass: rgba(255, 255, 255, 0.9); 
            --glacier-nav-glass: rgba(255, 255, 255, 0.8);
            --primary-blue: #0284c7;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--glacier-bg);
            margin: 0;
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
        }

        /* 頂部 Logo Bar */
        .logo-bar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 120;
            background-color: var(--glacier-glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-top: env(safe-area-inset-top);
        }

        .header-content {
            display: flex; align-items: center; padding: 10px 16px; gap: 12px;
        }

        .brand-logo {
            font-weight: 800; color: var(--pdd-red); font-size: 20px;
            white-space: nowrap; letter-spacing: -0.5px;
        }

        .search-box {
            flex: 1; background: #f1f5f9; border-radius: 12px; padding: 8px 12px;
            display: flex; align-items: center; gap: 8px; color: #94a3b8;
        }

        /* 一級分類 */
        .category-nav {
            display: flex; overflow-x: auto; white-space: nowrap; background: white;
            scrollbar-width: none; border-bottom: 1px solid #f1f5f9;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        .nav-item {
            padding: 14px 18px; font-size: 14px; color: #64748b; position: relative; cursor: pointer;
        }
        .nav-item.active { color: var(--pdd-red); font-weight: bold; }
        .nav-item.active::after {
            content: ''; position: absolute; bottom: 8px; left: 25%; right: 25%; height: 3px; background: var(--pdd-red); border-radius: 2px;
        }

        /* 二級分類 (舊版圓形 Icon 風格) */
        .sub-filter-panel {
            display: none; background: white; padding: 12px 0; overflow-x: auto;
            white-space: nowrap; scrollbar-width: none; border-bottom: 1px solid #f1f5f9;
            animation: fadeIn 0.3s ease-out;
        }
        .sub-filter-panel::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .sub-item { display: inline-flex; flex-direction: column; align-items: center; width: 75px; margin: 0 4px; cursor: pointer; }
        .sub-icon {
            width: 42px; height: 42px; background: #f8fafc; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
            font-size: 16px; color: #64748b; border: 2px solid transparent; transition: all 0.2s;
        }
        .sub-item.active .sub-icon { background: #fff0f0; color: var(--pdd-red); border-color: var(--pdd-red); }
        .sub-label { font-size: 11px; color: #64748b; }
        .sub-item.active .sub-label { color: var(--pdd-red); font-weight: bold; }

        /* 商品格線 */
        .product-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px;
            margin-top: 10px;
        }
        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }

        .product-card {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: transform 0.2s;
        }
        .product-card:active { transform: scale(0.97); }
        .product-img { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .product-info { padding: 10px; }
        .product-title { font-size: 13px; line-height: 1.4; height: 36px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; color: #1e293b; font-weight: 500; }
        .category-tag { background: #f1f5f9; color: #94a3b8; font-size: 10px; padding: 2px 6px; border-radius: 4px; }

        /* 統一 Dock */
        .dock-wrapper {
            position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 2px);
            left: 50%; transform: translateX(-50%); z-index: 200; width: 92%; max-width: 400px;
        }
        .dock-nav {
            background-color: var(--glacier-nav-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); padding: 12px; border-radius: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08); display: flex; justify-content: center; gap: 15px;
        }
        .dock-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; min-width: 60px; transition: 0.3s; }
        .dock-item i { font-size: 1.4rem; }
        .dock-item span { font-size: 9px; font-weight: 700; text-transform: uppercase; }
        .dock-item.active { color: var(--primary-blue); }

        /* 模態窗 */
        .pdd-modal { 
            display: none; position: fixed; inset: 0; background: white; z-index: 2000; 
            flex-direction: column; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding-top: env(safe-area-inset-top);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #f1f5f9; }
        .close-btn { width: 32px; height: 32px; background: #f1f5f9; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="hide-scrollbar">

    <header class="logo-bar">
        <div class="header-content">
            <div class="brand-logo">Simulation Lab</div>
            <div class="search-box">
                <i class="fas fa-search text-xs"></i>
                <input type="text" id="searchInput" placeholder="搜尋物理實驗..." class="bg-transparent border-none outline-none text-xs w-full text-slate-600" oninput="render()">
            </div>
        </div>
        <!-- 一級分類 -->
        <div class="category-nav" id="categoryNav">
            <div class="nav-item active" onclick="setMainCategory('all', this)">熱門推薦</div>
            <div class="nav-item" onclick="setMainCategory('原子世界', this)">原子世界</div>
            <div class="nav-item" onclick="setMainCategory('醫學物理學', this)">醫學物理</div>
            <div class="nav-item" onclick="setMainCategory('力學', this)">經典力學</div>
            <div class="nav-item" onclick="setMainCategory('電磁', this)">電磁感應</div>
        </div>
        <!-- 舊版二級分類面板 -->
        <div class="sub-filter-panel hide-scrollbar" id="subFilterPanel"></div>
    </header>

    <!-- 調整內容上間距以避免被 Fixed Header 遮擋 -->
    <div style="height: calc(env(safe-area-inset-top) + 110px);" id="header-spacer"></div>

    <main class="product-grid" id="productGrid"></main>

    <!-- 統一 Dock -->
    <div class="dock-wrapper">
        <nav class="dock-nav">
            <button onclick="window.location.href='index.html'" class="dock-item">
                <i class="fas fa-home"></i><span>錄影庫</span>
            </button>
            <button onclick="scrollToTop()" class="dock-item active">
                <i class="fas fa-cube"></i><span>模擬器</span>
            </button>
            <button onclick="window.location.href='functionhub.html'" class="dock-item">
                <i class="fas fa-shapes"></i><span>功能區</span>
            </button>
            <button onclick="triggerRandom()" class="dock-item">
                <i class="fas fa-dice"></i><span>隨機</span>
            </button>
        </nav>
    </div>

    <!-- 模擬器彈窗 -->
    <div id="pdd-modal" class="pdd-modal">
        <div class="modal-header">
            <div class="flex items-center gap-2">
                <i class="fas fa-flask text-red-500"></i>
                <span id="detail-title" class="font-bold text-sm text-slate-700 truncate">實驗室</span>
            </div>
            <div class="close-btn" onclick="closeDetail()">
                <i class="fas fa-times text-slate-400 text-xs"></i>
            </div>
        </div>
        <iframe id="sim-iframe" class="flex-1 w-full border-none"></iframe>
    </div>

    <script>
        const products = [
            { id: 101, title: "氫原子躍遷模擬器：視覺化波耳模型實驗室", category: "原子世界", sub: "原子物理", img: "https://phyuaaphysics.github.io/phyustudio/simulator-atomic-hydrogen.png", url: "https://phyuaaphysics.github.io/simulatorbank/atomic-hydrogen-1.html" },
            { id: 102, title: "近視糾正光路圖：凹透鏡成像原理分析", category: "醫學物理學", sub: "視覺光學", img: "https://phyuaaphysics.github.io/phyustudio/simulator-eye.png", url: "https://phyuaaphysics.github.io/simulatorbank/eye.html" },
            { id: 103, title: "近視糾正(虛像模式)：動態晶體調節模擬", category: "醫學物理學", sub: "視覺光學", img: "https://phyuaaphysics.github.io/phyustudio/simulator-eye2.png", url: "https://phyuaaphysics.github.io/simulatorbank/eye2.html" },
            { id: 104, title: "光電效應：金屬表面電子溢出實驗", category: "原子世界", sub: "光電效應", img: "https://phet.colorado.edu/sims/html/photoelectric-effect/latest/photoelectric-effect-600.png", url: "https://phet.colorado.edu/sims/html/photoelectric-effect/latest/photoelectric-effect_all.html" },
            { id: 1, title: "拋體運動：初始速度與重力加速度交互實驗", category: "力學", sub: "運動學", img: "https://phet.colorado.edu/sims/html/projectile-motion/latest/projectile-motion-600.png", url: "https://phet.colorado.edu/sims/html/projectile-motion/latest/projectile-motion_all.html" },
            { id: 2, title: "DC 直流電路：虛擬電子元件組裝實驗室", category: "電磁", sub: "電路分析", img: "https://phet.colorado.edu/sims/html/circuit-construction-kit-dc/latest/circuit-construction-kit-dc-600.png", url: "https://phet.colorado.edu/sims/html/circuit-construction-kit-dc/latest/circuit-construction-kit-dc_all.html" }
        ];

        const subCategories = {
            "原子世界": [{ name: "全部", icon: "fa-atom" }, { name: "光電效應", icon: "fa-bolt" }, { name: "原子物理", icon: "fa-microchip" }],
            "醫學物理學": [{ name: "全部", icon: "fa-briefcase-medical" }, { name: "視覺光學", icon: "fa-eye" }],
            "力學": [{ name: "全部", icon: "fa-cog" }, { name: "運動學", icon: "fa-running" }],
            "電磁": [{ name: "全部", icon: "fa-magnet" }, { name: "電路分析", icon: "fa-plug" }]
        };

        let currentMain = 'all';
        let currentSub = '全部';

        function render() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => {
                const mMatch = currentMain === 'all' || p.category === currentMain;
                const sMatch = currentSub === '全部' || p.sub === currentSub;
                return mMatch && sMatch && p.title.toLowerCase().includes(search);
            });
            grid.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="openDetail('${p.title}', '${p.url}')">
                    <img src="${p.img}" class="product-img">
                    <div class="product-info">
                        <div class="product-title">${p.title}</div>
                        <div class="category-tag">${p.sub}</div>
                    </div>
                </div>
            `).join('');
        }

        function setMainCategory(cat, el) {
            currentMain = cat;
            currentSub = '全部';
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            
            const panel = document.getElementById('subFilterPanel');
            const spacer = document.getElementById('header-spacer');
            
            if (cat === 'all' || !subCategories[cat]) {
                panel.style.display = 'none';
                spacer.style.height = 'calc(env(safe-area-inset-top) + 110px)';
            } else {
                panel.style.display = 'block';
                spacer.style.height = 'calc(env(safe-area-inset-top) + 190px)';
                panel.innerHTML = subCategories[cat].map(s => `
                    <div class="sub-item ${currentSub === s.name ? 'active' : ''}" onclick="setSubCategory('${s.name}', this)">
                        <div class="sub-icon"><i class="fas ${s.icon}"></i></div>
                        <div class="sub-label">${s.name}</div>
                    </div>
                `).join('');
            }
            render();
        }

        function setSubCategory(subName, el) {
            currentSub = subName;
            document.querySelectorAll('.sub-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function openDetail(t, u) {
            document.getElementById('detail-title').innerText = t;
            document.getElementById('sim-iframe').src = u;
            document.getElementById('pdd-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('pdd-modal').style.display = 'none';
            document.getElementById('sim-iframe').src = "";
            document.body.style.overflow = 'auto';
        }

        function triggerRandom() {
            const rand = products[Math.floor(Math.random() * products.length)];
            openDetail(rand.title, rand.url);
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = () => render();
    </script>
</body>
</html>
