            document.body.appendChild(div);
        }

        function closeResourceVideo() {
            const player = document.getElementById('resource-video-player');
            if (player) player.remove();
        }

        // 鎖定提示 (供 switchResource 等使用)
        function showLockedHint(rolesStr, userRole) {
            const msg = userRole
                ? `此資源只開放給: ${rolesStr}\n你的班別: ${userRole}`
                : `此資源只開放給: ${rolesStr}\n(你目前未登入或無班別資料)`;
            alert(msg);
        }

        // 屬性轉義 (onclick 字串用)
        function escapeAttr(s) {
            return String(s == null ? '' : s)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '&quot;');
        }

        // HTML 內容轉義
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ==========================================================================
        // 💎 資料載入 (Cache-First + 背景同步)
        // ==========================================================================
        //   - sheet1 為 HWMENU 分頁，欄 A1 為版本號
        //   - 系統強制使用 localStorage 渲染（秒開）
        //   - 背景只抓 A1 比對版本，無變化就不重抓
        //   - 有變化才抓完整 sheet，更新 localStorage
        // ==========================================================================
        const LS_KEY_VER      = 'hwmenu_ver';
        const LS_KEY_DATA     = 'hwmenu_data';
        const LS_KEY_VOLMETA  = 'hwmenu_volmeta';   // 舊 HWMENU VOL 封面元數據
        const LS_KEY_IMG_VER  = 'hwmenu_img_ver';   // 圖片快取對應的版本號

        // ==========================================================================
        // 💎 IndexedDB 圖片快取系統
        //   - 第一次點卡片時下載 → 存 Blob 到 IDB
        //   - 之後點同卡片 → 直接從 IDB 讀，瞬間開啟
        //   - A1 版本變動時 → 清空 IDB，強制重新下載
        // ==========================================================================
        const IMG_DB_NAME = 'phstudio_image_cache';
        const IMG_STORE    = 'images';
        let imgDB = null;

        function openImageDB() {
            if (imgDB) return Promise.resolve(imgDB);
            return new Promise((resolve, reject) => {
                if (typeof indexedDB === 'undefined') {
                    reject(new Error('IndexedDB 不支援'));
                    return;
                }
                const req = indexedDB.open(IMG_DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IMG_STORE)) {
                        db.createObjectStore(IMG_STORE);
                    }
                };
                req.onsuccess = (e) => { imgDB = e.target.result; resolve(imgDB); };
                req.onerror   = (e) => reject(e.target.error);
            });
        }

        async function getImageBlob(key) {
            try {
                const db = await openImageDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(IMG_STORE, 'readonly');
                    const store = tx.objectStore(IMG_STORE);
                    const req = store.get(key);
                    req.onsuccess = () => resolve(req.result || null);  // {blob, version, url}
                    req.onerror   = () => reject(req.error);
                });
            } catch (e) {
                console.warn('[IDB] getImageBlob 失敗:', e);
                return null;
            }
        }

        async function setImageBlob(key, blob, version, url) {
            try {
                const db = await openImageDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(IMG_STORE, 'readwrite');
                    const store = tx.objectStore(IMG_STORE);
                    const req = store.put({ blob, version, url }, key);
                    req.onsuccess = () => resolve();
                    req.onerror   = () => reject(req.error);
                });
            } catch (e) {
                console.warn('[IDB] setImageBlob 失敗:', e);
            }
        }

        async function clearImageCache() {
            try {
                const db = await openImageDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(IMG_STORE, 'readwrite');
                    const store = tx.objectStore(IMG_STORE);
                    const req = store.clear();
                    req.onsuccess = () => {
                        console.log('[IDB] 🗑️ 圖片快取已清空');
                        resolve();
                    };
                    req.onerror = () => reject(req.error);
                });
            } catch (e) {
                console.warn('[IDB] clearImageCache 失敗:', e);
            }
        }

        // 物件 URL 快取 (避免重複建立)
        const objectURLsCache = new Map();

        function getOrCreateObjectURL(key, blob) {
            if (objectURLsCache.has(key)) return objectURLsCache.get(key);
            const url = URL.createObjectURL(blob);
            objectURLsCache.set(key, url);
            return url;
        }

        // 🛡️ 走 GAS loader 抓 Sheet2 (VERSION) 全部列，回傳 [{name, version}]
        async function fetchVersionManifest() {
            const token = storage.getItem('jwt_token');
            if (!token) throw new Error("尚未登入，無法讀取版本清單");
            const url = `${GAS_LOADER_URL}?action=getVersionManifest&token=${encodeURIComponent(token)}&cachebust=${Date.now()}`;
            const response = await fetch(url, { method: 'GET', mode: 'cors', redirect: 'follow' });
            const data = await response.json();
            if (data.result !== 'success') {
                if (data.requireLogin) { storage.removeItem('jwt_token'); storage.removeItem('userToken'); }
                throw new Error(data.msg || "版本清單抓取失敗");
            }
            return data.manifest || [];
        }

        // 抓取舊 HWMENU 的 VOL 封面元數據 (BG, CARD, 中文標籤, tag)
        //   - 舊 sheet A1 是 "ver N"，下面每行是 [VOL, 中文標籤, version, BG, CARD, tag]
        //   - 用作 VOL 卡片的封面來源 (取代 YouTube 縮圖)
        async function fetchOldHwMenuMeta() {
            const url = `https://docs.google.com/spreadsheets/d/${OLD_SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${OLD_SHEET_NAME}&cachebust=${Date.now()}`;
            try {
                const response = await fetch(url);
                const text = await response.text();
                if (!text || text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
                    return { version: '1', meta: {} };
                }
                const rows = parseCSVRows(text);
                const meta = {};
                let version = '1';
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i];
                    if (i === 0) {
                        // 第一列是 "ver N" 之類
                        const v = (r[0] || '').toString().replace(/^ver\s*/i, '').trim();
                        version = v || '1';
                        continue;
                    }
                    const name = (r[0] || '').trim();
                    if (!name || name.toUpperCase() === 'VER') continue;
                    meta[name] = {
                        label:   (r[1] || '').trim(),
                        version: (r[2] || '1').trim() || '1',
                        bg:      (r[3] || '').trim(),
                        card:    (r[4] || '').trim(),
                        tag:     (r[5] || '').trim(),
                    };
                }
                return { version, meta };
            } catch (e) {
                console.warn('[OldHWMENU] 抓取失敗，使用空 meta:', e.message);
                return { version: '1', meta: {} };
            }
        }

        // 把 manifest 序列化為單一字串當作版本比對值
        function manifestToVerString(manifest) {
            return manifest.map(m => `${m.name}:${m.version}`).join('|');
        }

        // 🛡️ 抓取單一 VOL sheet 的資料（走 GAS loader，取代原本公開 gviz）
        async function fetchVolSheet(volName) {
            const token = storage.getItem('jwt_token');
            if (!token) throw new Error("尚未登入，無法讀取 VOL 內容");
            const url = `${GAS_LOADER_URL}?action=getTopic&topicId=${encodeURIComponent(volName)}&token=${encodeURIComponent(token)}&cachebust=${Date.now()}`;
            const response = await fetch(url, { method: 'GET', mode: 'cors', redirect: 'follow' });
            const data = await response.json();
            if (data.result !== 'success') {
                if (data.requireLogin) {
                    storage.removeItem('jwt_token');
                    storage.removeItem('userToken');
                }
                throw new Error(data.msg || `分頁 ${volName} 抓取失敗`);
            }
            return data.data;   // 直接回 2D 陣列（不再 parseCSV）
        }

        // 解析 VOL sheet rows → { volName, version, homework: [{id, resources: [...]}] }
        function parseVolSheetRows(rows) {
            if (!rows || rows.length === 0) return { volName: '', version: '1', homework: [] };
            const volName = (rows[0][0] || '').trim();
            const version = (rows[0][1] || '1').trim() || '1';
            const hwMap = new Map();
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                const hwId = (r[0] || '').trim();
                if (!hwId) continue;
                if (!hwMap.has(hwId)) hwMap.set(hwId, { id: hwId, resources: [] });
                const type   = (r[1] || 'VIDEOS').trim().toUpperCase();
                const title  = (r[2] || '').trim();
                const roleStr= (r[3] || 'ACTIVE').trim();
                const youtube= (r[4] || '').trim();
                const notes  = (r[5] || '').trim();
                hwMap.get(hwId).resources.push({
                    type, title,
                    roles: parseRoleString(roleStr),
                    youtube, notes
                });
            }
            const homework = Array.from(hwMap.values())
                .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
            return { volName, version, homework };
        }

        // 解析 D 欄角色字串 → 陣列
        // "ACTIVE" / "" → ["*"]  (全部可看)
        // "S3"         → ["S3"]
        // "S3,S5"      → ["S3","S5"]
        function parseRoleString(s) {
            const t = (s || '').trim();
            if (!t || t.toUpperCase() === 'ACTIVE') return ['*'];
            return t.split(',').map(x => x.trim()).filter(Boolean);
        }

        async function initData() {
            // ============================================================
            // Step 1. ⚡ 強制使用 localStorage 渲染（秒開）
            //   - 也順便載入 volMeta 快取 (LS_KEY_VOLMETA)
            // ============================================================
            let cachedVer = null;
            let hasRenderedCache = false;
            try {
                cachedVer = storage.getItem(LS_KEY_VER);
                const cachedData = storage.getItem(LS_KEY_DATA);
                const cachedVolMeta = storage.getItem(LS_KEY_VOLMETA);
                if (cachedVolMeta) {
                    try { volMeta = JSON.parse(cachedVolMeta) || {}; } catch {}
                }
                if (cachedData) {
                    const parsed = JSON.parse(cachedData);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        rawData = parsed;
                        renderFilters();
                        renderContent();
                        hasRenderedCache = true;
                        console.log(`[Cache] ⚡ 從 localStorage 渲染 ${rawData.length} 筆，本地版本: "${cachedVer || '(空)'}"`);
                    }
                }
            } catch (jsonErr) {
                console.warn("[Cache] localStorage 解析失敗，清除:", jsonErr);
                storage.removeItem(LS_KEY_VER);
                storage.removeItem(LS_KEY_DATA);
                storage.removeItem(LS_KEY_VOLMETA);
            }

            // ============================================================
            // Step 2. 🔄 抓 Sheet2 manifest + 舊 HWMENU 元數據
            // ============================================================
            let manifest = null;
            let oldMeta  = null;
            try {
                [manifest, oldMeta] = await Promise.all([
                    fetchVersionManifest(),
                    fetchOldHwMenuMeta()
                ]);
                console.log(`[Sync] 線上 manifest: ${manifest.length} 個 VOL · 舊 HWMENU: ${Object.keys(oldMeta.meta).length} 個 VOL 元數據 (v${oldMeta.version})`);
            } catch (versionErr) {
                console.warn("[Sync] 版本清單抓取失敗:", versionErr.message);
                if (!hasRenderedCache) {
                    document.getElementById('main-content-area').innerHTML =
                        `<div class="loader">無法連線至資料來源，請檢查網路後重試。</div>`;
                }
                return;
            }

            // 組合版本字串: 舊 HWMENU + 新 manifest
            const onlineVer = `HWMENU@${oldMeta.version}|${manifestToVerString(manifest)}`;

            // ============================================================
            // Step 3. 🆚 版本比對
            // ============================================================
            if (onlineVer === cachedVer && hasRenderedCache) {
                console.log("[Sync] ✅ 版本一致，使用本地快取，不重抓");
                return;
            }

            console.log(`[Sync] 🔄 版本有變 (舊: "${cachedVer || '(空)'}" → 新: "${onlineVer}")`);

            // 更新 volMeta
            volMeta = oldMeta.meta || {};
            storage.setItem(LS_KEY_VOLMETA, JSON.stringify(volMeta));

            // ============================================================
            // Step 4. 📥 並行抓所有 VOL sheet，組合成 rawData
            //   - 若舊 HWMENU 有該 VOL 但新 manifest 沒有，也保留 (顯示為空內容)
            // ============================================================
            try {
                // 合併 VOL 列表: 舊 meta 全部 + 新 manifest 全部
                const allVolNames = Array.from(new Set([
                    ...Object.keys(volMeta),
                    ...manifest.map(m => m.name)
                ])).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

                const allRows = await Promise.all(
                    allVolNames.map(async name => {
                        // 從新 manifest 找 version
                        const inManifest = manifest.find(m => m.name === name);
                        const volVersion = inManifest ? inManifest.version : (volMeta[name] && volMeta[name].version) || '1';
                        try {
                            const rows = await fetchVolSheet(name);
                            return { name, version: volVersion, rows };
                        } catch (e) {
                            // 該 VOL 可能沒在新 sheet (僅舊 HWMENU 有)
                            return { name, version: volVersion, rows: [] };
                        }
                    })
                );

                // 組裝成 flat rawData
                const newRawData = [];
                for (const { name: volName, version: volVersion, rows } of allRows) {
                    if (!rows || rows.length === 0) continue;
                    const parsed = parseVolSheetRows(rows);
                    const ver = volVersion || parsed.version;
                    parsed.homework.forEach((hw, idx) => {
                        newRawData.push(hwToItem(volName, ver, hw, idx + 1));
                    });
                }
                rawData = newRawData;

                // 🚀 版本變了 → 清空 IDB 圖片快取
                if (cachedVer && cachedVer !== onlineVer) {
                    console.log(`[Sync] 🔄 版本變更，清空 IDB 圖片快取`);
                    await clearImageCache();
                    objectURLsCache.forEach(url => URL.revokeObjectURL(url));
                    objectURLsCache.clear();
                }

                storage.setItem(LS_KEY_VER, onlineVer);
                storage.setItem(LS_KEY_DATA, JSON.stringify(rawData));
                console.log(`[Sync] 💾 已更新 localStorage: ${rawData.length} 筆，ver: "${onlineVer}"`);

                renderFilters();
                renderContent();
            } catch (fetchErr) {
                console.error("[Sync] ❌ 抓取失敗:", fetchErr);
                if (!hasRenderedCache) {
                    document.getElementById('main-content-area').innerHTML =
                        `<div class="loader">載入失敗：${fetchErr.message}。請確認 Sheet2 與 VOL sheets 存在且權限已公開。</div>`;
                }
            }
        }

        // 手動同步按鈕：強制清快取 + 重抓
        async function manualSync() {
            console.log("[Manual Sync] 🔄 使用者觸發強制同步");
            storage.removeItem(LS_KEY_VER);
            storage.removeItem(LS_KEY_DATA);
            storage.removeItem(LS_KEY_VOLMETA);
            await initData();
        }

        // CSV 行分割
        function parseCSVRows(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') {
                lines.push(row);
            }
            return lines;
        }

        // 試算表資料映射 — sheet1 (HWMENU) 結構
        //   row[0] = A1 版本號 (在 initData 階段已被取出，這裡從 row 1 開始處理)
        //   欄 A (row[0]) = name     (該功課的 NAME，保留供稍後使用)
        //   欄 B (row[1]) = section  (欄目分類，如「中四上學期適用」)
        // ==========================================================================
        // 💎 Sheet2 模型: HW 轉成 flat rawData item
        //   每張卡片 = 一份功課 (HW) in 一個 VOL
        //   bg / img 從首個 VIDEOS 資源的 YouTube 縮圖派生 (沒 YouTube 就空字串)
        // ==========================================================================
        function hwToItem(volName, volVersion, hw, order) {
            const firstVideo = (hw.resources || []).find(r => r.type === 'VIDEOS' && r.youtube) || {};
            const thumb      = firstVideo.youtube ? getYouTubeThumb(firstVideo.youtube, 'mq') : '';
            const bg         = firstVideo.youtube ? getYouTubeThumb(firstVideo.youtube, 'hq') : '';
            // 收集此 HW 內所有資源 type 當作 tag
            const tags = Array.from(new Set((hw.resources || []).map(r => r.type).filter(Boolean))).join(',');
            return {
                name:        `${volName}::${hw.id}`,   // 複合 key: "VOL1A::HW02"
                displayName: hw.id,                    // 顯示用
                vol:         volName,
                volVersion,
                section:     volName,                  // 用 VOL 當 section 分組
                order:       order,
                bg,                                     // 派生自 YouTube 縮圖
                img:         thumb,
                tag:         tags,                     // 資源 type 列表 (filter 用)
                resources:   hw.resources || []
            };
        }

        // 篩選按鈕渲染 — 以 欄 F (tag) 作為篩選值
        function renderFilters() {
            const allTags = new Set();
            rawData.forEach(d => {
                // 支援多 tag (以逗號或空格分隔)
                String(d.tag || '').split(/[,，\s]+/).forEach(t => {
                    const v = t.trim();
                    if (v) allTags.add(v);
                });
            });
            const filters = ['all', ...[...allTags].sort((a, b) => a.localeCompare(b, 'zh-Hant'))];
            const container = document.getElementById('filter-container');
            container.innerHTML = filters.map(f => `
                <button class="filter-capsule ${f === currentFilter ? 'active' : ''}" 
                        data-filter="${f}" 
                        onclick="setFilter('${f.replace(/'/g, "\\'")}')">
                    ${f === 'all' ? '全部' : f}
                </button>
            `).join('');
        }

        // ==========================================================================
        // 💎 渲染主入口 — 根據 viewState 渲染對應視圖
        //   level='volumes' : VOL 封面網格
        //   level='volume'  : 某 VOL 的 HW 列表
        //   level='hw'      : HW 播放器 (modal) — 主區仍顯示 VOL HW 列表
        // ==========================================================================
        function renderHome() {
            const mainArea = document.getElementById('main-content-area');
            if (!mainArea) return;

            // 切換 filter bar 顯示
            const filterBar = document.getElementById('filter-bar');
            if (filterBar) {
                filterBar.style.display = (viewState.level === 'volumes') ? 'none' : '';
            }

            if (viewState.level === 'volumes') {
                renderVolumesView(mainArea);
            } else if (viewState.level === 'volume' || viewState.level === 'hw') {
                renderVolumeView(mainArea);
                // 若在 hw 視圖，同時打開播放器
                if (viewState.level === 'hw' && viewState.selectedHw) {
                    openHwPlayer(viewState.selectedVol, viewState.selectedHw);
                }
            }
        }

        // ==========================================================================
        // 💎 Layer 1: VOL 封面網格 (A4 直向 + 按欄 B 分組)
        //   按欄 B (label) 分組顯示密集卡片，只顯示圖片
        // ==========================================================================
        function renderVolumesView(container) {
            // 從 rawData + volMeta 聚合出每個 VOL
            const volMap = new Map();
            rawData.forEach(item => {
                if (!item.vol) return;
                if (!volMap.has(item.vol)) {
                    volMap.set(item.vol, { name: item.vol, version: item.volVersion || (volMeta[item.vol] && volMeta[item.vol].version) || '1', label: volMeta[item.vol]?.label || '', hws: [], resources: 0, videos: 0 });
                }
                const v = volMap.get(item.vol);
                v.hws.push(item);
                v.resources += (item.resources || []).length;
                v.videos    += (item.resources || []).filter(r => r.type === 'VIDEOS').length;
            });
            Object.keys(volMeta).forEach(name => {
                if (!volMap.has(name)) {
                    volMap.set(name, { name, version: (volMeta[name] && volMeta[name].version) || '1', label: volMeta[name]?.label || '', hws: [], resources: 0, videos: 0 });
                }
            });
            const vols = Array.from(volMap.values()).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

            if (vols.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">沒有任何功課冊</div>`;
                return;
            }

            // 按欄 B (label) 分組
            const grouped = {};
            vols.forEach(v => {
                const label = v.label || '未分類';
                if (!grouped[label]) grouped[label] = [];
                grouped[label].push(v);
            });

            // 生成 HTML
            let html = `<div class="max-w-[794px] mx-auto px-4 py-6">`; // A4 width approx
            Object.keys(grouped).forEach((label, gIdx) => {
                html += `
                <div class="mb-8">
                    <h3 class="text-sm font-bold tracking-widest text-gray-500 uppercase mb-3 pb-1 border-b border-gray-200">${escapeHtml(label)}</h3>
                    <div class="a4-card-grid">${grouped[label].map((v, idx) => renderA4VolumeCard(v, gIdx * 100 + idx)).join('')}</div>
                </div>`;
            });
            html += `</div>`;

            container.innerHTML = html;
        }

        function renderA4VolumeCard(vol, idx) {
            const meta = volMeta[vol.name] || {};
            const cover = meta.card || getVolCoverUrl(vol.name);
            const imgSrc = cover || 'https://via.placeholder.com/400x600/ececf1/86868b?text=' + encodeURIComponent(vol.name);
            const safeVol = escapeAttr(vol.name);
            return `
                <div class="a4-card-item" style="animation-delay: ${idx * 30}ms">
                    <div class="cursor-pointer vol-card rounded-lg overflow-hidden transition-transform hover:scale-105 active:scale-95 animate-fade-rise"
                         onclick="openOSWindow('${safeVol}')"
                         data-vol-name="${safeVol}">
                        <div class="aspect-[3/4] bg-slate-100 overflow-hidden">
                            <img src="${imgSrc}" class="w-full h-full object-cover" loading="lazy"
                                 onerror="this.src='https://via.placeholder.com/400x600/ececf1/86868b?text=No+Cover'">
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================================================
        // 💎 Layer 2: VOL 詳情 — 該 VOL 的 HW 列表
        //   頂部有「← 返回」+「VOL1A · v1」
        //   每張 HW 卡顯示該 HW 的資源數 / 鎖定數
        // ==========================================================================
        function renderVolumeView(container) {
            const volName = viewState.selectedVol;
            const allItems = rawData.filter(d => d.vol === volName);
            // 套用 filter + search
            let items = [...allItems];
            if (currentFilter !== 'all') {
                items = items.filter(item => {
                    const tags = String(item.tag || '').split(/[,，\s]+/).map(s => s.trim());
                    return tags.includes(currentFilter);
                });
            }
            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase().trim();
                items = items.filter(item => {
                    return (item.displayName && item.displayName.toLowerCase().includes(q)) ||
                           (item.tag         && item.tag.toLowerCase().includes(q));
                });
            }
            items.sort((a, b) => a.order - b.order);

            const volVersion = (allItems[0] && allItems[0].volVersion) || '1';
            const totalHw = allItems.length;

            container.innerHTML = `
                <div class="max-w-screen-2xl mx-auto px-2 sm:px-4 py-4">
                    <!-- 頂部導航列 -->
                    <div class="flex items-center justify-between mb-4 px-1">
                        <button onclick="navigateTo('volumes')"
                                class="inline-flex items-center gap-1.5 text-sm font-medium px-3 py-1.5 rounded-full bg-white/70 hover:bg-white border border-black/5 transition active:scale-95"
                                style="color: #007aff;">
                            <i class="fas fa-chevron-left text-[10px]"></i> 返回功課冊
                        </button>
                        <div class="text-right">
                            <h2 class="text-base sm:text-lg font-bold mono" style="color: #1d1d1f;">${escapeHtml(volName)}</h2>
                            <p class="text-[10px] tracking-wider uppercase" style="color: #86868b;">v${escapeHtml(volVersion)} · ${totalHw} 份功課</p>
                        </div>
                    </div>

                    ${items.length === 0
                        ? `<div class="text-center py-12 text-slate-500 text-sm">這冊沒有符合條件的功課</div>`
                        : `<div class="netflix-brick-grid">
                            ${items.map((item, idx) => renderHwCard(item, idx)).join('')}
                        </div>`
                    }
                </div>
            `;
        }

        function renderHwCard(item, idx) {
            const stats = countResourcesForUser(item);
            const cover = item.img || 'https://via.placeholder.com/320x180/ececf1/86868b?text=' + encodeURIComponent(item.displayName);
            const safeVol  = escapeAttr(item.vol);
            const safeHw   = escapeAttr(item.displayName);
            const lockedBadge = stats.locked > 0
                ? `<div class="absolute top-2 right-2 bg-rose-600/90 text-white text-[9px] font-bold tracking-wider px-1.5 py-0.5 rounded inline-flex items-center gap-1">
                       <i class="fas fa-lock text-[8px]"></i>${stats.locked}
                   </div>`
                : '';
            const allowedBadge = stats.allowed > 0
                ? `<div class="absolute top-2 left-2 bg-black/65 text-white text-[9px] font-bold tracking-wider px-1.5 py-0.5 rounded inline-flex items-center gap-1">
                       <i class="fas fa-eye text-[8px]"></i>${stats.allowed}
                   </div>`
                : '';
            return `
                <div class="hw-card animate-fade-rise"
                     style="animation-delay: ${idx * 30}ms"
                     onclick="openOSWindow('${safeVol}')"
                     data-hw-name="${safeHw}">
                    <div class="relative aspect-[2/3] bg-slate-200/60 overflow-hidden">
                        <img src="${cover}" class="w-full h-full object-cover" loading="lazy"
                             onerror="this.src='https://via.placeholder.com/320x180/ececf1/86868b?text=No+Preview'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-transparent pointer-events-none"></div>
                        ${allowedBadge}
                        ${lockedBadge}
                        <div class="absolute bottom-2 right-2 bg-white/85 backdrop-blur text-slate-800 text-[9px] font-bold px-1.5 py-0.5 rounded inline-flex items-center gap-1">
                            <i class="fas fa-layer-group text-[7px]"></i>${stats.total}
                        </div>
                        <!-- 標題疊在圖片底部（Netflix 風格：hover 才完整顯現） -->
                        <div class="absolute bottom-0 left-0 right-0 p-2.5 pointer-events-none">
                            <p class="text-white text-[12px] font-extrabold leading-tight mono line-clamp-2 drop-shadow-[0_1px_2px_rgba(0,0,0,0.6)]">${escapeHtml(item.displayName)}</p>
                            <p class="text-white/70 text-[9px] mt-0.5 truncate tracking-wider uppercase" title="${escapeHtml(item.tag || '')}">
                                ${escapeHtml(item.tag || '—')}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 為了向後相容 (其他地方可能呼叫 renderContent) — 委派給 renderHome
        function renderContent() {
            renderHome();
        }


        // 搜尋切換
        function toggleSearchInput() {
            const panel = document.getElementById('search-panel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                document.getElementById('tag-search-input').focus();
            } else {
                clearSearch();
            }
        }

        function handleSearch(val) {
            searchQuery = val;
            renderContent();
        }

        function clearSearch() {
            const input = document.getElementById('tag-search-input');
            if (input) input.value = '';
            searchQuery = '';
            renderContent();
        }

        function toggleDock() {
            document.getElementById('dock-nav-wrapper').classList.toggle('collapsed');
        }

        function toggleFilter() {
            const bar = document.getElementById('filter-bar');
            bar.classList.toggle('collapsed');
        }

        function scrollToHome() {
            setFilter('all');
            clearSearch();
            // 3 層導航: 點 logo 回到 Layer 1 (VOL 封面)
            if (viewState.level !== 'volumes') {
                navigateTo('volumes');
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function handleNavigation(url) {
            if (!url || url === '#' || url === 'no link' || url === 'undefined') return;
            window.location.href = url;
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            const buttons = document.querySelectorAll('.filter-capsule');
            buttons.forEach(btn => {
                if (btn.dataset.filter === filterType) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            renderContent();
        }

        // ==========================================================================
        // 💎 QR Code 掃描器
        // ==========================================================================
        async function openQRScanner() {
            const modal = document.getElementById('qr-scanner-modal');
            const video = document.getElementById('qr-video');
            const errMsg = document.getElementById('qr-error-msg');
            errMsg.classList.add('hidden');
            errMsg.innerText = "";
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                qrStream = stream;
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                try { await video.play(); } catch (playErr) { console.warn(playErr); }
                qrAnimationId = requestAnimationFrame(tickQRScanner);
            } catch (err) {
                console.error("Camera access failed:", err);
                errMsg.innerText = "相機不可用（可能被瀏覽器安全政策限制、未授權，或未在 HTTPS 環境下）。請使用上方「選擇照片 / 上傳條碼圖」按鈕。";
                errMsg.classList.remove('hidden');
            }
        }

        function closeQRScanner() {
            const modal = document.getElementById('qr-scanner-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.classList.remove('opacity-100');
            if (qrStream) {
                qrStream.getTracks().forEach(track => track.stop());
                qrStream = null;
            }
            if (qrAnimationId) {
                cancelAnimationFrame(qrAnimationId);
                qrAnimationId = null;
            }
            document.getElementById('qr-file-input').value = "";
        }

        function tickQRScanner() {
            const video = document.getElementById('qr-video');
            const canvasElement = document.getElementById('qr-canvas');
            if (!video || !canvasElement) return;
            const canvas = canvasElement.getContext('2d', { willReadFrequently: true });
            if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                try {
                    const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
                    if (code) {
                        let resultText = code.data.trim();
                        let finalUrl = '';
                        if (resultText.startsWith('http://') || resultText.startsWith('https://')) {
                            finalUrl = resultText;
                        } else {
                            if (resultText.startsWith('/')) resultText = resultText.substring(1);
                            finalUrl = `http://phyuaaphysics.github.io/phyustudio/${resultText}`;
                        }
                        closeQRScanner();
                        window.location.href = finalUrl;
                        return;
                    }
                } catch (e) { console.error("Error drawing or extracting canvas pixels", e); }
            }
            if (qrStream) qrAnimationId = requestAnimationFrame(tickQRScanner);
        }

        function handleQRFile(input) {
            const file = input.files[0];
            if (!file) return;
            const errMsg = document.getElementById('qr-error-msg');
            errMsg.classList.add('hidden');
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvasElement = document.getElementById('qr-canvas');
                    const canvas = canvasElement.getContext('2d');
                    canvasElement.width = img.width;
                    canvasElement.height = img.height;
                    canvas.drawImage(img, 0, 0);
                    try {
                        const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
                        if (code) {
                            let resultText = code.data.trim();
                            let finalUrl = '';
                            if (resultText.startsWith('http://') || resultText.startsWith('https://')) {
                                finalUrl = resultText;
                            } else {
                                if (resultText.startsWith('/')) resultText = resultText.substring(1);
                                finalUrl = `http://phyuaaphysics.github.io/phyustudio/${resultText}`;
                            }
                            closeQRScanner();
                            window.location.href = finalUrl;
                        } else {
                            errMsg.innerText = "無法解析此圖中的條碼。請確認照片清晰無陰影，條碼居中未變形。";
                            errMsg.classList.remove('hidden');
                        }
                    } catch (err) {
                        console.error("Manual QR decode error:", err);
                        errMsg.innerText = "相片讀取失敗，請重新嘗試。";
                        errMsg.classList.remove('hidden');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 滾動監聽 (Filter bar 收合)
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY || document.documentElement.scrollTop;
            if (currentScrollY > 30) document.body.classList.add('scrolled');
            else document.body.classList.remove('scrolled');
            const filterBar = document.getElementById('filter-bar');
            if (currentScrollY > lastScrollY && currentScrollY > 150) {
                if (!filterBar.classList.contains('collapsed')) filterBar.classList.add('collapsed');
            } else if (currentScrollY < lastScrollY) {
                if (filterBar.classList.contains('collapsed')) filterBar.classList.remove('collapsed');
            }
            lastScrollY = currentScrollY;
        }, { passive: true });

        // ==========================================================================
        // 🚀 啟動入口：先做 token 守衛驗證
        // ==========================================================================
        async function bootstrap() {
            // 啟動背景公式動畫 (全時段)
            startFormulaAnimation();

            // 註冊會員說明彈窗事件
            setupMembershipOverlay();

            // 註冊 Card Detail Modal 的 ESC 關閉
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    const overlay = document.getElementById('card-detail-overlay');
                    if (overlay && !overlay.classList.contains('hidden')) {
                        closeCardDetail();
                    }
                }
            });

            // 對齊相容 key
            syncCompatKeys();

            const token = storage.getItem('jwt_token');
            if (!token) {
                // 沒有 token，保持登入畫面
                return;
            }

            // 顯示「驗證中」狀態 (重複使用 login-overlay，按鈕變 loading)
            const btn = document.getElementById('login-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Verifying Token...';

            const valid = await verifyTokenWithLoader(token);
            if (valid) {
                enterHome();
            } else {
                // token 失效，清除並提示重新登入
                storage.removeItem('jwt_token');
                storage.removeItem('userToken');
                storage.removeItem('user_role');
                storage.removeItem('userRole');
                const errorEl = document.getElementById('login-error');
                errorEl.textContent = '驗證已過期，請重新登入';
                errorEl.style.opacity = '1';
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        document.addEventListener('DOMContentLoaded', bootstrap);
    </script>
</body>
