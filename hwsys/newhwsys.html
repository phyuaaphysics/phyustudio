                    bgLayer.style.display = '';
                } else {
                    bgLayer.style.backgroundImage = '';
                    bgLayer.style.display = 'none';
                }
                bgLayer.style.animation = 'none';
                void bgLayer.offsetWidth;
                bgLayer.style.animation = '';
            }
            setHeader('Volume', volName, false);
            bodyEl.innerHTML = '';
            loadingEl.style.display = '';
            modal.classList.remove('modal-open', 'modal-closing');
            modal.classList.remove('pointer-events-none');
            void modal.offsetWidth;
            modal.classList.add('modal-open');
            let items = getCachedDetail(volName);
            let fromCache = !!items;
            if (!items) {
                console.log(`[openCardDetail] 快取 miss：${volName}，現抓`);
                try {
                    const json = await callLoaderGetTopic(volName);
                    const rows = (json && json.data) || [];
                    const csv = rowsToCSV(rows);
                    items = parseDetailCSV(csv);
                    __detailCache[volName] = items;
                } catch (e) {
                    console.warn(`[openCardDetail] 抓取失敗：${volName}`, e);
                }
            } else {
                console.log(`[openCardDetail] ✓ 用快取：${volName} (${items.length} items)`);
            }
            loadingEl.style.display = 'none';
            if (!items || items.length === 0) {
                bodyEl.innerHTML = renderEmptyDetail(volName, fromCache ? 'empty' : 'not-found', '');
                bodyEl.classList.remove('detail-pane', 'pane-back');
                void bodyEl.offsetWidth;
                bodyEl.classList.add('detail-pane');
                return;
            }
            __detailItems = items;
            renderHWList();
        }

        function renderHWList(direction = 'forward') {
            const bodyEl = document.getElementById('card-detail-body');
            const groups = groupByHW(__detailItems);
            bodyEl.classList.remove('detail-pane', 'pane-back');
            void bodyEl.offsetWidth;
            bodyEl.classList.add(direction === 'back' ? 'pane-back' : 'detail-pane');
            bodyEl.innerHTML = groups.map(({ id, list }, idx) => {
                const it0 = list[0];
                const access = checkAccess(it0.status);
                const ts = typeStyle(it0.type);
                const sectionCount = list.length;
                const sectionLabel = sectionCount > 1 ? `${sectionCount} 個段落` : (it0.range || ts.label);
                const delay = Math.min(idx, 8) * 60;
                if (!access.allowed) {
                    return `
                        <div class="detail-item flex items-center gap-4 px-5 py-4 rounded-2xl mb-2 w-full bg-white/30 opacity-60 ring-1 ring-white/15 backdrop-blur-md cursor-not-allowed"
                             style="animation-delay:${delay}ms;">
                            <div class="w-11 h-11 rounded-xl bg-slate-200 flex items-center justify-center shrink-0">
                                <i class="fas fa-lock text-slate-400 text-base"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-base font-extrabold text-slate-500 tracking-tight">${escapeHtml(id)}</div>
                                <div class="text-[11px] text-slate-400 font-medium mt-0.5">需要角色：${escapeHtml(access.required)}</div>
                            </div>
                        </div>`;
                }
                return `
                    <button onclick="openHWDetail('${escapeAttr(id)}')"
                            class="detail-item group flex items-center gap-4 px-5 py-4 rounded-2xl text-left transition-all mb-2 w-full
                                   bg-white/85 hover:bg-white ring-1 ring-white/40 hover:ring-emerald-300/60 hover:shadow-lg hover:scale-[1.005] active:scale-[0.995] cursor-pointer backdrop-blur-md"
                            style="animation-delay:${delay}ms;">
                        <div class="w-11 h-11 rounded-xl ${ts.bg} flex items-center justify-center shrink-0 transition-transform group-hover:scale-110">
                            <i class="fas ${ts.icon} ${ts.text} text-base"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-base font-extrabold text-slate-800 tracking-tight">${escapeHtml(id)}</div>
                            <div class="text-[11px] text-slate-500 font-medium mt-0.5">${escapeHtml(sectionLabel)}</div>
                        </div>
                        <span class="text-[11px] font-extrabold tracking-[0.2em] uppercase text-emerald-600 group-hover:text-emerald-700 flex items-center gap-1 shrink-0 transition-transform group-hover:translate-x-0.5">Enter <i class="fas fa-chevron-right text-[9px]"></i></span>
                    </button>`;
            }).join('');
        }

        function openHWDetail(hwId) {
            teardownYTPlayer();
            const group = __detailItems.filter(it => it.id === hwId);
            if (!group.length) return;
            const access = checkAccess(group[0].status);
            if (!access.allowed) return;
            const ts = typeStyle(group[0].type);
            setHeader(group[0].id, `${group.length} 段內容 · ${ts.label}`, true);
            document.getElementById('card-detail-icon').innerHTML = `<i class="fas ${ts.icon} ${ts.text} text-sm"></i>`;
            const type = String(group[0].type || '').toUpperCase();
            if (type === 'NOTES') {
                renderNotesView(group);
            } else {
                renderMediaView(group, ts);
            }
        }

        function cardDetailBack() {
            setHeader('Volume', __detailVolName, false);
            document.getElementById('card-detail-icon').innerHTML = `<i class="fas fa-folder-open text-emerald-600 text-sm"></i>`;
            renderHWList('back');
        }

        function renderMediaView(group, ts) {
            const bodyEl = document.getElementById('card-detail-body');
            const firstYt = youtubeId(group[0].url);
            bodyEl.classList.remove('detail-pane', 'pane-back');
            void bodyEl.offsetWidth;
            bodyEl.classList.add('detail-pane');
            bodyEl.innerHTML = `
                <div class="flex gap-2 overflow-x-auto hide-scrollbar mb-4 pb-1">
                    ${group.map((g, i) => {
                        const active = i === 0;
                        return `<button data-tab="${i}" onclick="switchMediaTab(${i})"
                            class="shrink-0 px-4 py-2 rounded-full text-xs font-extrabold transition-all
                                   ${active ? 'bg-emerald-600 text-white shadow-md' : 'bg-white/70 text-slate-600 hover:bg-white ring-1 ring-white/40'}">
                            ${escapeHtml(g.range || `${i + 1}`)}
                        </button>`;
                    }).join('')}
                </div>
                <div id="media-stage" class="media-fade-in bg-white/90 backdrop-blur-md rounded-3xl overflow-hidden ring-1 ring-white/40 shadow-xl">
                    ${firstYt ? renderYTFrame(firstYt) : renderExternalLink(group[0], ts)}
                    <div id="media-caption" class="px-5 py-4 border-t border-slate-100">
                        <div class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">${escapeHtml(ts.label)}</div>
                        <div class="text-sm font-bold text-slate-800 mt-0.5">${escapeHtml(group[0].range || group[0].id)}</div>
                    </div>
                </div>`;
            window.__mediaGroup = group;
            __ytLastVideoKey = `${__detailVolName}::${group[0].id}::${group[0].range || '0'}`;
            // 渲染簽到 4 顆膠囊按鈕
            setTimeout(() => renderAttendanceBar(__detailVolName, group[0].id, group[0].range || '0'), 80);
        }

        function renderYTFrame(yt, autoplay = false) {
            const id = `yt-player-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
            window.__currentYTFrameId = id;
            window.__currentYTId = yt;
            setTimeout(() => {
                if (window.__ytSetupPlayer) window.__ytSetupPlayer(yt, id, !!autoplay);
            }, 60);
            return `
                <div class="aspect-video bg-black relative" id="${id}-wrap">
                    <div id="${id}" class="w-full h-full"></div>
                    <!-- 右下角全螢幕按鈕（覆蓋在 YouTube 原生 controls 上） -->
                    <button onclick="toggleFullscreen()" title="全螢幕"
                            class="yt-fs-btn absolute bottom-3 right-3 w-8 h-8 rounded-lg flex items-center justify-center z-10">
                        <i class="fas fa-expand text-xs"></i>
                    </button>
                </div>
                <!-- 自訂進度條 overlay（顯示當前/總時長、防快轉範圍、等級） -->
                <div id="yt-progress-overlay" class="px-4 py-3 border-t border-slate-100 flex flex-col gap-2">
                    <div class="flex items-center justify-between text-[11px] text-white/80 font-mono">
                        <span class="yt-cur-time">0:00</span>
                        <span class="yt-lock-status text-[10px] font-bold uppercase tracking-widest">載入中</span>
                        <span class="yt-total-time">0:00</span>
                    </div>
                    <div class="yt-progress-track">
                        <div class="yt-locked-bar"></div>
                        <div class="yt-progress-bar"></div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="yt-tier-badge text-[9px] font-bold uppercase tracking-widest text-white/40">PH CORE</span>
                        <span class="text-[9px] text-white/40 font-medium">點擊右下放大鍵進入全螢幕</span>
                    </div>
                </div>`;
        }

        function renderExternalLink(g, ts) {
            return `
                <div class="aspect-video flex flex-col items-center justify-center bg-slate-100 text-slate-500 p-6 text-center">
                    <i class="fas fa-link text-3xl mb-3 text-slate-400"></i>
                    <div class="text-sm font-bold mb-2">${escapeHtml(ts.label)}</div>
                    <a href="${escapeAttr(g.url)}" target="_blank" rel="noopener"
                       class="text-xs text-emerald-600 underline">在新分頁開啟 →</a>
                </div>`;
        }

        function switchMediaTab(idx) {
            teardownYTPlayer();
            const group = window.__mediaGroup || [];
            const g = group[idx];
            if (!g) return;
            const yt = youtubeId(g.url);
            const stage = document.getElementById('media-stage');
            const ts = typeStyle(g.type);
            stage.classList.remove('media-fade-in');
            void stage.offsetWidth;
            stage.classList.add('media-fade-in');
            stage.innerHTML = `
                ${yt ? renderYTFrame(yt, true) : renderExternalLink(g, ts)}
                <div class="px-5 py-4 border-t border-slate-100">
                    <div class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">${escapeHtml(ts.label)}</div>
                    <div class="text-sm font-bold text-slate-800 mt-0.5">${escapeHtml(g.range || g.id)}</div>
                </div>`;
            document.querySelectorAll('[data-tab]').forEach(b => {
                if (Number(b.dataset.tab) === idx) {
                    b.className = 'shrink-0 px-4 py-2 rounded-full text-xs font-extrabold transition-all bg-emerald-600 text-white shadow-md';
                } else {
                    b.className = 'shrink-0 px-4 py-2 rounded-full text-xs font-extrabold transition-all bg-white/70 text-slate-600 hover:bg-white ring-1 ring-white/40';
                }
            });
            __ytLastVideoKey = `${__detailVolName}::${g.id}::${g.range || '0'}`;
            // 切換 range 時重新渲染簽到按鈕
            setTimeout(() => renderAttendanceBar(__detailVolName, g.id, g.range || '0'), 80);
        }

        function renderNotesView(group) {
            const bodyEl = document.getElementById('card-detail-body');
            bodyEl.classList.remove('detail-pane', 'pane-back');
            void bodyEl.offsetWidth;
            bodyEl.classList.add('detail-pane');
            const md = group.map(g => g.url).join('\n\n---\n\n');
            const html = (typeof marked !== 'undefined')
                ? marked.parse(md, { gfm: true, breaks: true })
                : `<pre>${escapeHtml(md)}</pre>`;
            bodyEl.innerHTML = `
                <div class="media-fade-in bg-white/95 backdrop-blur-md rounded-3xl p-6 md:p-10 ring-1 ring-white/40 shadow-xl">
                    <div class="md-body">${html}</div>
                </div>
                <div class="text-[10px] text-white/60 text-center mt-3 tracking-widest uppercase">
                    ${group.length} 段筆記 · 來源 ${escapeHtml(group[0].id)}
                </div>`;
        }

        function closeCardDetail() {
            teardownYTPlayer();
            const modal = document.getElementById('card-detail-modal');
            document.body.classList.add('is-closing');
            modal.classList.remove('modal-open');
            modal.classList.add('modal-closing');
            setTimeout(() => {
                modal.classList.add('pointer-events-none');
                modal.classList.remove('modal-closing');
                document.body.classList.remove('is-closing');
            }, 340);
        }

        function renderEmptyDetail(volName, kind, rawCSV) {
            const firstLine = (rawCSV || '').split('\n')[0] || '(empty)';
            const csvLen = (rawCSV || '').length;
            console.warn(`[card-detail] EMPTY ${volName} kind=${kind} bytes=${csvLen} firstLine="${firstLine}"`);
            if (kind === 'not-found') {
                return `
                    <div class="text-center py-16 px-4">
                        <div class="w-16 h-16 rounded-2xl bg-white/35 ring-1 ring-white/30 flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-folder-tree text-2xl text-rose-300 drop-shadow"></i>
                        </div>
                        <div class="text-base font-bold text-white mb-2 drop-shadow">${escapeHtml(volName)} 還沒建立分頁</div>
                        <p class="text-xs text-white/85 leading-relaxed mb-4">詳情表裡找不到這個 Volume，<br>可能要先去試算表補上對應 tab。</p>
                        <div class="text-[10px] text-white/70 font-mono mb-4">debug: ${csvLen} bytes, first="${escapeHtml(firstLine.slice(0, 60))}"</div>
                        <button onclick="closeCardDetail()"
                                class="text-[11px] font-bold text-white bg-white/35 hover:bg-white/50 ring-1 ring-white/30 px-5 py-2 rounded-full uppercase tracking-widest transition-colors">
                            <i class="fas fa-times mr-1"></i> 關閉
                        </button>
                    </div>`;
            }
            return `
                <div class="text-center py-16 px-4">
                    <div class="w-16 h-16 rounded-2xl bg-white/35 ring-1 ring-white/30 flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-folder-open text-2xl text-white/80 drop-shadow"></i>
                    </div>
                    <div class="text-base font-bold text-white mb-2 drop-shadow">${escapeHtml(volName)} 暫時沒有內容</div>
                    <p class="text-xs text-white/85 mb-3">這個 Volume 還沒放任何選單項目。</p>
                    <div class="text-[10px] text-white/70 font-mono px-4 break-all">debug: ${csvLen} bytes, first="${escapeHtml(firstLine.slice(0, 60))}"</div>
                </div>`;
        }

        function checkAccess(status) {
            const s = String(status || 'ACTIVE').toUpperCase().trim();
            if (s === 'ACTIVE' || s === '') return { allowed: true, reason: 'active' };
            const role = (typeof localStorage !== 'undefined' && localStorage.getItem('user_role')) || 'User';
            if (s === role.toUpperCase()) return { allowed: true, reason: 'role-match' };
            return { allowed: false, reason: `需要 ${s} 角色`, required: s };
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCardDetail();
                closeMembershipInfo();
            }
        });

        function setFilter(filterType) {
            const buttons = document.querySelectorAll('.filter-capsule');
            buttons.forEach(btn => {
                if(btn.dataset.filter === filterType) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            const sections = document.querySelectorAll('.dynamic-section');
            if (filterType === 'all') {
                sections.forEach(sec => sec.classList.remove('section-hidden'));
            } else {
                sections.forEach(sec => {
                    if (sec.getAttribute('data-group') === filterType) sec.classList.remove('section-hidden');
                    else sec.classList.add('section-hidden');
                });
            }
        }

        // ---- QR Scanner ----
        async function openQRScanner() {
            const modal = document.getElementById('qr-scanner-modal');
            const video = document.getElementById('qr-video');
            const errMsg = document.getElementById('qr-error-msg');
            errMsg.classList.add('hidden');
            errMsg.innerText = "";
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                qrStream = stream;
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                try {
                    await video.play();
                } catch(playErr) {
                    console.warn("Video play interrupted, attempting fallback options", playErr);
                }
                qrAnimationId = requestAnimationFrame(tickQRScanner);
            } catch (err) {
                console.error("Camera access failed:", err);
                errMsg.innerText = "相機不可用（可能被瀏覽器安全政策限制、未授權，或未在 HTTPS 環境下）。請使用上方「選擇照片 / 上傳條碼圖」按鈕進行解碼。";
                errMsg.classList.remove('hidden');
            }
        }

        function closeQRScanner() {
            const modal = document.getElementById('qr-scanner-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.classList.remove('opacity-100');
            if (qrStream) {
                qrStream.getTracks().forEach(track => track.stop());
                qrStream = null;
            }
            const video = document.getElementById('qr-video');
            if (video) video.srcObject = null;
            if (qrAnimationId) {
                cancelAnimationFrame(qrAnimationId);
                qrAnimationId = null;
            }
            document.getElementById('qr-file-input').value = "";
        }

        function tickQRScanner() {
            const video = document.getElementById('qr-video');
            const canvasElement = document.getElementById('qr-canvas');
            if (!video || !canvasElement) return;
            const canvas = canvasElement.getContext('2d', { willReadFrequently: true });
            if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                try {
                    const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "attemptBoth",
                    });
                    if (code) {
                        let resultText = code.data.trim();
                        let finalUrl = '';
                        if (resultText.startsWith('http://') || resultText.startsWith('https://')) {
                            finalUrl = resultText;
                        } else {
                            if (resultText.startsWith('/')) {
                                resultText = resultText.substring(1);
                            }
                            finalUrl = `http://phyuaaphysics.github.io/phyustudio/${resultText}`;
                        }
                        closeQRScanner();
                        window.location.href = finalUrl;
                        return;
                    }
                } catch (e) {
                    console.error("Error drawing or extracting canvas pixels", e);
                }
            }
            if (qrStream) {
                qrAnimationId = requestAnimationFrame(tickQRScanner);
            }
        }

        function handleQRFile(input) {
            const file = input.files[0];
            if (!file) return;
            const errMsg = document.getElementById('qr-error-msg');
            errMsg.classList.add('hidden');
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvasElement = document.getElementById('qr-canvas');
                    const canvas = canvasElement.getContext('2d');
                    canvasElement.width = img.width;
                    canvasElement.height = img.height;
                    canvas.drawImage(img, 0, 0);
                    try {
                        const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height, {
                            inversionAttempts: "attemptBoth",
                        });
                        if (code) {
                            let resultText = code.data.trim();
                            let finalUrl = '';
                            if (resultText.startsWith('http://') || resultText.startsWith('https://')) {
                                finalUrl = resultText;
                            } else {
                                if (resultText.startsWith('/')) {
                                    resultText = resultText.substring(1);
                                }
                                finalUrl = `http://phyuaaphysics.github.io/phyustudio/${resultText}`;
                            }
                            closeQRScanner();
                            window.location.href = finalUrl;
                        } else {
                            errMsg.innerText = "無法解析此圖中的條碼。請確認照片清晰無陰影，條碼居中未變形。";
                            errMsg.classList.remove('hidden');
                        }
                    } catch (err) {
                        console.error("Manual QR decode error:", err);
                        errMsg.innerText = "相片讀取失敗，請重新嘗試。";
                        errMsg.classList.remove('hidden');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ---- Scroll handlers ----
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY || document.documentElement.scrollTop;
            if (currentScrollY > 30) document.body.classList.add('scrolled');
            else document.body.classList.remove('scrolled');
            const filterBar = document.getElementById('filter-bar');
            if (currentScrollY > lastScrollY && currentScrollY > 150) {
                if (!filterBar.classList.contains('collapsed')) filterBar.classList.add('collapsed');
            } else if (currentScrollY < lastScrollY) {
                if (filterBar.classList.contains('collapsed')) filterBar.classList.remove('collapsed');
            }
            lastScrollY = currentScrollY;
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', initData);
        document.addEventListener('DOMContentLoaded', updateMembershipChip);
    </script>
</body>
</html>
