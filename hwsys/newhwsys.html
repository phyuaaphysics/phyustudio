<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumina Studio</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        .md-body { color: #334155; line-height: 1.75; font-size: 15px; }

        /* 自訂進度條 overlay（在 video 下方，黑色玻璃） */
        #yt-progress-overlay {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .yt-progress-track {
            background: rgba(255, 255, 255, 0.15);
            height: 6px;
            border-radius: 999px;
            position: relative;
            overflow: hidden;
        }
        .yt-locked-bar {
            background: linear-gradient(90deg, rgba(251, 191, 36, 0.6), rgba(251, 191, 36, 0.9));
            height: 100%;
            border-radius: 999px;
            position: absolute;
            top: 0;
            left: 0;
            transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
        }
        .yt-progress-bar {
            background: linear-gradient(90deg, #10b981, #34d399);
            height: 100%;
            border-radius: 999px;
            position: absolute;
            top: 0;
            left: 0;
            transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
        }
        .yt-fs-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            transition: all 0.2s;
        }
        .yt-fs-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        .yt-fs-btn:active {
            transform: scale(0.95);
        }
        .md-body h1, .md-body h2, .md-body h3, .md-body h4 { font-weight: 800; color: #0f172a; margin-top: 1.5em; margin-bottom: 0.5em; line-height: 1.3; }
        .md-body h1 { font-size: 1.75rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.3em; }
        .md-body h2 { font-size: 1.4rem; }
        .md-body h3 { font-size: 1.15rem; }
        .md-body h4 { font-size: 1rem; }
        .md-body p { margin: 0.8em 0; }
        .md-body a { color: #0284c7; text-decoration: underline; text-underline-offset: 3px; }
        .md-body a:hover { color: #0369a1; }
        .md-body ul, .md-body ol { padding-left: 1.5em; margin: 0.6em 0; }
        .md-body li { margin: 0.3em 0; }
        .md-body ul li { list-style-type: disc; }
        .md-body ol li { list-style-type: decimal; }
        .md-body code { background: #f1f5f9; padding: 0.15em 0.4em; border-radius: 4px; font-family: 'Consolas','Monaco',monospace; font-size: 0.9em; color: #be185d; }
        .md-body pre { background: #0f172a; color: #e2e8f0; padding: 1em; border-radius: 12px; overflow-x: auto; margin: 1em 0; }
        .md-body pre code { background: transparent; color: inherit; padding: 0; }
        .md-body blockquote { border-left: 4px solid #cbd5e1; padding-left: 1em; color: #64748b; margin: 1em 0; font-style: italic; }
        .md-body table { border-collapse: collapse; width: 100%; margin: 1em 0; }
        .md-body th, .md-body td { border: 1px solid #e2e8f0; padding: 0.5em 0.8em; text-align: left; }
        .md-body th { background: #f8fafc; font-weight: 700; }
        .md-body img { max-width: 100%; border-radius: 8px; margin: 0.5em 0; }
        .md-body hr { border: none; border-top: 2px dashed #e2e8f0; margin: 1.5em 0; }
        .md-body strong { font-weight: 800; color: #0f172a; }

        #card-detail-modal {
            transform: scale(0.96) translateY(12px);
            opacity: 0;
            transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
        }
        #card-detail-modal.modal-open {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        #card-detail-modal.modal-closing {
            transform: scale(0.98) translateY(6px);
            opacity: 0;
            transition: opacity 300ms cubic-bezier(0.32, 0, 0.67, 0), transform 340ms cubic-bezier(0.32, 0, 0.67, 0);
        }
        .detail-pane {
            animation: paneEnter 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .detail-pane.pane-back {
            animation: paneEnterBack 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes paneEnter {
            0%   { opacity: 0; transform: translateX(28px) scale(0.985); }
            100% { opacity: 1; transform: translateX(0)    scale(1);     }
        }
        @keyframes paneEnterBack {
            0%   { opacity: 0; transform: translateX(-28px) scale(0.985); }
            100% { opacity: 1; transform: translateX(0)     scale(1);     }
        }
        .detail-item {
            animation: itemPop 520ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes itemPop {
            0%   { opacity: 0; transform: translateY(14px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0)    scale(1);    }
        }
        .media-fade-in { animation: mediaIn 360ms cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes mediaIn {
            0%   { opacity: 0; transform: translateY(8px) scale(0.99); }
            100% { opacity: 1; transform: translateY(0)  scale(1);    }
        }
        #card-detail-bg {
            animation: bgFade 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes bgFade {
            0%   { opacity: 0; transform: scale(1.04); }
            100% { opacity: 1; transform: scale(1);    }
        }
        .header-text-swap { animation: textIn 360ms cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes textIn {
            0%   { opacity: 0; transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0);  }
        }
        #card-detail-back { transition: transform 360ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 360ms ease, width 360ms ease, margin 360ms ease; }
        #card-detail-back.entering { animation: backIn 420ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        @keyframes backIn {
            0%   { opacity: 0; transform: translateX(-12px) scale(0.6) rotate(-90deg); }
            100% { opacity: 1; transform: translateX(0)      scale(1)   rotate(0);     }
        }
        body.is-closing .detail-item { animation: itemOut 280ms cubic-bezier(0.32, 0, 0.67, 0) both; }
        @keyframes itemOut {
            0%   { opacity: 1; transform: translateY(0)    scale(1);    }
            100% { opacity: 0; transform: translateY(8px)  scale(0.97); }
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        
        :root {
            --glacier-deep: #0f172a;
            --glacier-primary: #0284c7; 
            --glacier-ice: #38bdf8;
            --glacier-bg: #eef2f6;
            --glacier-glass: rgba(224, 242, 254, 0.85); 
            --glacier-nav-glass: rgba(255, 255, 255, 0.75);
        }
        body.dark-mode {
            --glacier-deep: #f8fafc;
            --glacier-primary: #38bdf8; 
            --glacier-ice: #0284c7;
            --glacier-bg: #090d16; 
            --glacier-glass: rgba(15, 23, 42, 0.85); 
            --glacier-nav-glass: rgba(15, 23, 42, 0.75);
            color: #cbd5e1;
        }
        #dark-mode-toggle:checked + .theme-track {
            background-color: #1e293b;
            border-color: #0f172a;
        }
        #dark-mode-toggle:checked + .theme-track .theme-stars {
            opacity: 1 !important;
        }
        #dark-mode-toggle:checked + .theme-track .theme-knob {
            transform: translateX(0px) !important;
        }
        #dark-mode-toggle:checked + .theme-track .theme-sun {
            transform: scale(0) !important;
        }
        #dark-mode-toggle:checked + .theme-track .theme-moon {
            transform: scale(1) !important;
        }
        #dark-mode-toggle:checked + .theme-track .theme-cloud {
            transform: translateX(48px) !important;
            opacity: 0 !important;
        }
        body, .logo-bar, .filter-bar, .hero-container-framed, #page-content, .dock-nav, .filter-capsule, .nav-btn, .sync-btn {
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, backdrop-filter 0.4s ease, -webkit-backdrop-filter 0.4s ease;
        }
        body.dark-mode .hero-container-framed {
            background-color: #1e293b;
            border-color: rgba(255, 255, 255, 0.1);
        }
        body.dark-mode .hero-gradient-overlay {
            background: linear-gradient(to bottom, rgba(15,23,42,0) 0%, rgba(15,23,42,0.2) 40%, rgba(9,13,22,0.95) 95%);
        }
        body.dark-mode .filter-capsule {
            background: rgba(30, 41, 59, 0.5);
            border-color: rgba(56, 189, 248, 0.1);
            color: #cbd5e1;
        }
        body.dark-mode .filter-capsule.active {
            background: var(--glacier-primary);
            color: #fff;
            border-color: var(--glacier-primary);
        }
        body.dark-mode .nav-btn {
            background: rgba(30, 41, 59, 0.95);
            border-color: rgba(255, 255, 255, 0.05);
        }
        body.dark-mode .sync-btn {
            background: rgba(15, 23, 42, 0.4);
            border-color: rgba(255, 255, 255, 0.1);
        }
        body.dark-mode .dock-nav {
            border-color: rgba(255, 255, 255, 0.1);
        }
        body.dark-mode .logo-bar .text-sky-800 {
            color: #38bdf8 !important;
        }
        body.dark-mode .logo-bar .bg-white {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }
        body.dark-mode .card-name {
            color: #cbd5e1;
        }
        html {
            scroll-behavior: smooth;
            height: 100%;
        }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--glacier-bg);
            color: #334155;
            -webkit-tap-highlight-color: transparent;
            min-height: 100%;
            overflow-y: auto;
            padding-top: 0;
            -webkit-overflow-scrolling: touch;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .logo-bar {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 120;
            background-color: var(--glacier-glass);
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(14, 165, 233, 0.1);
            padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
            padding-bottom: 12px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #main-logo {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: left center;
            will-change: transform;
        }
        .scrolled #main-logo { transform: scale(0.75); }
        .filter-bar {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 68px);
            left: 0;
            width: 100%;
            z-index: 110;
            background-color: var(--glacier-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-bottom: 1px solid rgba(14, 165, 233, 0.05);
        }
        .filter-bar.collapsed {
            transform: translateY(-56px);
            opacity: 0.9;
        }
        .filter-capsule {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(14, 165, 233, 0.1);
            color: var(--glacier-deep);
        }
        .filter-capsule.active {
            background: var(--glacier-primary);
            color: #fff;
            border-color: var(--glacier-primary);
        }
        .filter-toggle-trigger {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: var(--glacier-glass);
            backdrop-filter: blur(20px);
            border-radius: 0 0 14px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(14, 165, 233, 0.05);
            border-top: none;
            color: var(--glacier-primary);
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .filter-bar.collapsed .filter-toggle-trigger i {
            transform: rotate(180deg);
        }
        #page-content { padding-top: calc(env(safe-area-inset-top, 0px) + 130px); }
        .slider-wrapper { position: relative; width: 100%; }
        .slider-container { 
            display: flex;
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            gap: 12px; 
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s, transform 0.2s;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .slider-wrapper:hover .nav-btn { opacity: 1; }
        .nav-btn.prev { left: -12px; }
        .nav-btn.next { right: -12px; }
        .slider-item { scroll-snap-align: start; flex: 0 0 auto; }
        .poster-card {
            aspect-ratio: 2/3;
            border-radius: 12px; overflow: hidden; background: #cbd5e1;
            position: relative; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 12px -4px rgba(15, 23, 42, 0.05);
            will-change: transform;
        }
        .poster-card.brick {
            aspect-ratio: 3/4;
            border-radius: 0;
            border: none;
            box-shadow: none;
            background: #000;
        }
        .card-name {
            margin-top: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--glacier-deep);
            line-height: 1.3;
            max-width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }
        .hero-container-framed {
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.1);
            overflow: hidden; position: relative; background-color: #fff;
            transition: all 0.4s ease;
        }
        .hero-gradient-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 40%, rgba(238,242,246,0.9) 95%);
            pointer-events: none;
        }
        .section-hidden { display: none !important; }
        .dock-wrapper {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
            width: auto;
            min-width: 340px;
        }
        .dock-wrapper.collapsed { transform: translateX(-50%) translateY(200px); opacity: 0; }
        .dock-nav {
            background-color: var(--glacier-nav-glass);
            backdrop-filter: blur(28px) saturate(210%);
            -webkit-backdrop-filter: blur(28px) saturate(210%);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            padding: 12px 14px;
            border-radius: 42px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
            display: flex; align-items: center; justify-content: center; gap: 14px;
        }
        .dock-toggle-btn {
            width: 32px;
            height: 32px; display: flex; align-items: center; justify-content: center;
            color: #94a3b8; cursor: pointer; font-size: 14px; transition: color 0.3s;
        }
        .dock-content { display: flex; align-items: center; gap: 14px; }
        .dock-item {
            display: flex;
            flex-direction: column; align-items: center; gap: 5px;
            color: #94a3b8; transition: all 0.3s; min-width: 58px;
        }
        .dock-item i { font-size: 1.6rem; }
        .dock-item span { font-size: 9px; font-weight: 500; opacity: 0.7; }
        .dock-item.active { color: var(--glacier-primary); }
        .dock-item.dock-deck-active {
            color: #059669;
        }
        .dock-item.dock-deck-active i {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dock-item.dock-deck-active span {
            color: #059669;
            opacity: 1;
            font-weight: 700;
        }
        .dock-item.dock-deck-active:hover {
            color: #047857;
        }
        .dock-item.dock-deck-active:hover i {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: translateY(-2px);
        }
        .dock-trigger-bar {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 5px;
            background: rgba(15, 23, 42, 0.2);
            border-radius: 10px;
            z-index: 199; cursor: pointer; display: none;
        }
        .dock-wrapper.collapsed + .dock-trigger-bar { display: block; }
        .section-title { font-size: 1.15rem; font-weight: 800; color: var(--glacier-deep); margin-bottom: 8px; }
        .sync-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(14, 165, 233, 0.2);
            color: var(--glacier-primary);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            cursor: pointer;
        }
        .sync-btn:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-1px); }
        .sync-btn:active { transform: scale(0.96); }
        .sync-btn.loading i { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 12px;
            color: var(--glacier-primary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        @keyframes qr-scan-line {
            0% { transform: translateY(-130px); }
            50% { transform: translateY(130px); }
            100% { transform: translateY(-130px); }
        }
        @media (max-width: 768px) {
            .hero-container-framed { border-radius: 0; }
            .dock-wrapper { width: 92%; max-width: 400px; }
            #page-content { padding-top: calc(env(safe-area-inset-top, 0px) + 120px); }
            .nav-btn { display: none !important; }
            .sync-btn { padding: 6px 12px; font-size: 9px; }
        }

        /* ===== 登入 Modal（PH studio Launch 風格） ===== */
        .ph-login-overlay {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ph-login-card {
            background: rgba(255, 255, 255, 0.78) !important;
            backdrop-filter: blur(40px) saturate(190%) !important;
            -webkit-backdrop-filter: blur(40px) saturate(190%) !important;
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            box-shadow:
                0 4px 30px rgba(0, 0, 0, 0.04),
                0 30px 70px rgba(27, 54, 93, 0.12),
                inset 0 1px 1px rgba(255, 255, 255, 0.8) !important;
            transform: scale(0.85) translateY(30px);
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, "Inter", "Noto Sans TC", sans-serif;
            color: #1b365d;
        }
        .ph-login-card.active {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .ph-login-input {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #1b365d;
            transition: all 0.3s ease;
        }
        .ph-login-input::placeholder {
            color: rgba(27, 54, 93, 0.4);
        }
        .ph-login-input:focus {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            outline: none;
        }
        .ph-login-btn {
            background: rgba(226, 232, 240, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #1b365d;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .ph-login-btn:hover {
            background: #1b365d;

    <script>
        // ===== 全局配置 =====
        // 改用 loader.gs（GAS Web App）作為唯一讀取入口；gviz 公開讀取已關閉
        const LOADER_URL     = 'https://script.google.com/macros/s/AKfycbxtjfSCGYQ9Xwo7mCtccVk8oJUi_uCWeAmg-QA-YlWD5BpJN3hemMZN3rAw95dN72RV/exec';  // loader.gs v3.0（純讀取，redeploy 2026-08-15）
        const GUARD_URL      = 'https://script.google.com/macros/s/AKfycbyDzxZDfiymvnfYGAuW7_ltPvosZjHOhYOL1zAYU0cZhgN7061zK7wbzukAu014muZu/exec';  // guard.gs（登入）
        const ATTENDANCE_URL = 'https://script.google.com/macros/s/AKfycbwoml8VH-X_Qw_kGgSxKC4CuU0Z403lbV7FhdYQ3e3fJh7bn2MhrjvDpMRPnbR5QUb2/exec';  // attendance.gs Web App (v2.2: + realNameOverride)
        const SPREADSHEET_ID = '1Xfl7-SvKai2j6rg1ZnICJFENaLOSurD0Tg_OIO_PTGU';
        const SHEET_NAME = 'HWMENU';
        const DETAIL_SPREADSHEET_ID = '1HUjN9M9u7-vFt3dR9zbfNjgeFfyIWitxnEJiZ7mqesA';
        const DETAIL_VERSION_RANGE = 'B2';
        const JWT_STORAGE_KEY = 'jwt_token';
        const USER_STORAGE_KEY = 'ph_user_payload_v1';
        // HWMENU 走 gviz 公開直連（首頁卡片牆免登入就看得到）
        const buildSheetUrl = () =>
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&t=${Date.now()}`;
        // 進到任何 vol 才走 loader/guard；VERSION 仍走 gviz 公開（只給出版本字串）
        const detailVersionUrl = () =>
            `https://docs.google.com/spreadsheets/d/${DETAIL_SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=VERSION&_=${Date.now()}`;

        // ===== Token / 登入 助手 =====
        function getStoredToken() {
            try {
                const t = localStorage.getItem(JWT_STORAGE_KEY) || '';
                // 自動過濾過期 token（避免拿舊 token 打 server 浪費一次 round-trip）
                if (t && isTokenExpired(t)) {
                    console.log('[token] 已過期，清掉並要求重登');
                    localStorage.removeItem(JWT_STORAGE_KEY);
                    return '';
                }
                return t;
            } catch (e) { return ''; }
        }
        function setStoredToken(t) {
            try {
                if (t) localStorage.setItem(JWT_STORAGE_KEY, t);
                else   localStorage.removeItem(JWT_STORAGE_KEY);
            } catch (e) {}
        }
        function decodeJwtPayload(token) {
            try {
                const parts = (token || '').split('.');
                if (parts.length !== 3) return null;
                const b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
                const padded = b64 + '==='.slice((b64.length + 3) % 4);
                const json = decodeURIComponent(escape(atob(padded)));
                return JSON.parse(json);
            } catch (e) { return null; }
        }
        function isTokenExpired(token) {
            const p = decodeJwtPayload(token);
            if (!p || !p.exp) return true;
            return Math.floor(Date.now() / 1000) >= p.exp;
        }
        function setStoredUser(payload) {
            try {
                if (payload) localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(payload));
                else         localStorage.removeItem(USER_STORAGE_KEY);
                // 同步一些舊 localStorage（向下相容）
                if (payload && payload.role)      localStorage.setItem('user_role', payload.role);
                if (payload && payload.class)     localStorage.setItem('user_class', payload.class);
                if (payload && payload.class_no)  localStorage.setItem('user_class_no', payload.class_no);
                if (payload && payload.real_name) localStorage.setItem('user_real_name', payload.real_name);
                if (payload && payload.username)  localStorage.setItem('user_username', payload.username);
            } catch (e) {}
        }
        function getStoredUser() {
            try { return JSON.parse(localStorage.getItem(USER_STORAGE_KEY) || 'null'); }
            catch (e) { return null; }
        }

        // 透過 loader 呼叫 action（GET）。若 requireLogin 或 401 → 自動跳出登入 modal → 重試
        async function callLoader(action, params = {}) {
            const token = getStoredToken();
            const url = new URL(LOADER_URL);
            url.searchParams.set('action', action);
            if (token) url.searchParams.set('token', token);
            for (const k of Object.keys(params)) {
                if (params[k] != null) url.searchParams.set(k, params[k]);
            }
            let resp, json;
            try {
                resp = await fetch(url.toString(), { method: 'GET', cache: 'no-store', redirect: 'follow' });
            } catch (e) {
                throw { network: true, message: 'Loader 連線失敗：' + e.message };
            }
            try { json = await resp.json(); }
            catch (e) { throw { network: true, message: 'Loader 回應非 JSON' }; }

            if (json && json.result === 'error' && (json.requireLogin || /Token|未提供|過期|簽章/.test(json.msg || ''))) {
                // 嘗試重新登入
                const newToken = await promptLoginAndGetToken();
                if (!newToken) throw { requireLogin: true, message: '用戶取消登入' };
                // 拿到新 token 再打一次
                const url2 = new URL(LOADER_URL);
                url2.searchParams.set('action', action);
                url2.searchParams.set('token', newToken);
                for (const k of Object.keys(params)) {
                    if (params[k] != null) url2.searchParams.set(k, params[k]);
                }
                const resp2 = await fetch(url2.toString(), { method: 'GET', cache: 'no-store', redirect: 'follow' });
                const json2 = await resp2.json();
                if (json2 && json2.result === 'error') {

        async function callAttendance(action, params = {}) {
            const token = getStoredToken();
            const url = new URL(ATTENDANCE_URL);
            url.searchParams.set('action', action);
            if (token) url.searchParams.set('token', token);
            for (const k of Object.keys(params)) {
                if (params[k] != null) url.searchParams.set(k, params[k]);
            }
            let resp, json;
            try {
                resp = await fetch(url.toString(), { method: 'GET', cache: 'no-store', redirect: 'follow' });
            } catch (e) {
                throw { network: true, message: 'Attendance 連線失敗：' + e.message };
            }
            try { json = await resp.json(); }
            catch (e) { throw { network: true, message: 'Attendance 回應非 JSON' }; }

            if (json && json.result === 'error' && (json.requireLogin || /Token|未提供|過期|簽章/.test(json.msg || ''))) {
                const newToken = await promptLoginAndGetToken();
                if (!newToken) throw { requireLogin: true, message: '用戶取消登入' };
                const url2 = new URL(ATTENDANCE_URL);
                url2.searchParams.set('action', action);
                url2.searchParams.set('token', newToken);
                for (const k of Object.keys(params)) {
                    if (params[k] != null) url2.searchParams.set(k, params[k]);
                }
                const resp2 = await fetch(url2.toString(), { method: 'GET', cache: 'no-store', redirect: 'follow' });
                const json2 = await resp2.json();
                if (json2 && json2.result === 'error') {
                    throw { requireLogin: true, message: json2.msg || '仍無法通過驗證' };
                }
                return json2;
            }
            if (json && json.result === 'error') {
                throw { message: json.msg || 'Attendance 錯誤' };
            }
            return json;
        }

        function rowsToCSV(rows) {
            if (!Array.isArray(rows) || rows.length === 0) return '';
            const escape = (v) => {
                if (v == null) return '';
                const s = String(v);
                if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
                return s;
            };
            return rows.map(r => (r || []).map(escape).join(',')).join('\n');
        }

        // 寫入簽到 / 簽退。回傳 boolean（true = 成功）
        async function recordAttendance(opts) {
            const { volName, hwId, range, status, note } = opts || {};
            if (!volName || !hwId || !range) {
                throw new Error('缺少 volName / hwId / range');
            }
            if (status !== 'ACTIVE' && status !== 'INACTIVE') {
                throw new Error('status 只能 ACTIVE / INACTIVE');
            }
            if (!isStudentRole()) {
                throw new Error('你的角色無簽到權限（需 S3 / S4 / S5 / S6）');
            }
            // 觀看 gating：必須看過該 video
            const vk = currentVideoKey(volName, hwId, range);
            if (!hasWatchedVideo(vk)) {
                throw new Error('請先完整觀看此短片再簽到');
            }
            const token = getStoredToken();
            if (!token) throw new Error('尚未登入');

            // v2.2：用 localStorage 裡的 real_name / class / class_no 作為 override
            //   index 登入時已把正確姓名寫進 localStorage（即使 Permissions F 欄是 placeholder）
            //   把這些值帶給 attendance.gs，覆寫 token payload 的值
            const realNameOverride = (localStorage.getItem('user_real_name') || '').trim();
            const classOverride    = (localStorage.getItem('user_class')      || '').trim();
            const classNoOverride  = (localStorage.getItem('user_class_no')   || '').trim();

            const postBody = JSON.stringify({
                volName, hwId, range, status,
                note: note || '',
                realNameOverride:  realNameOverride,
                classOverride:     classOverride,
                classNoOverride:   classNoOverride
            });

            // 走 attendance.gs（POST）
            const resp = await fetch(ATTENDANCE_URL + '?action=recordAttendance&token=' + encodeURIComponent(token), {
                method: 'POST',
                cache: 'no-store',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: postBody,
                redirect: 'follow'
            });
            const text = await resp.text();
            let json = null;
            try { json = JSON.parse(text); } catch (e) {}
            if (json && json.result === 'success') return true;
            if (json && json.result === 'error' && (json.requireLogin || /Token|未提供|過期|簽章/.test(json.msg || ''))) {
                const newToken = await promptLoginAndGetToken();
                if (!newToken) throw new Error('已取消登入');
                const resp2 = await fetch(ATTENDANCE_URL + '?action=recordAttendance&token=' + encodeURIComponent(newToken), {
                    method: 'POST',
                    cache: 'no-store',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: postBody,
                    redirect: 'follow'
                });
                const json2 = await resp2.json();
                if (json2 && json2.result === 'success') return true;
                throw new Error((json2 && json2.msg) || '寫入失敗');
            }
            throw new Error((json && json.msg) || ('HTTP ' + resp.status) || '寫入失敗');
        }

        // 從 gviz 直連 NAME tab 抓 roster（公開資料，繞過 attendance.gs）
        // 欄位：A=Role, B=Class, C=class_no, D=real_name, E=membership
        // role 過濾在前端做
        const NAME_TAB_URL = () =>
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=NAME&_=${Date.now()}`;
        async function getRosterByClass(_klass, role) {
            const r = await fetch(NAME_TAB_URL(), { cache: 'no-store' });
            if (!r.ok) throw new Error('抓 NAME tab 失敗 (HTTP ' + r.status + ')');
            const csv = await r.text();
            const rows = parseCSV(csv);
            const out = [];
            const wantedRole = (role || '').toUpperCase();
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || !row[0]) continue;
                const stuRole = String(row[0] || '').trim().toUpperCase();
                if (!STUDENT_ROLES.has(stuRole)) continue;
                if (wantedRole && wantedRole !== 'ALL' && stuRole !== wantedRole) continue;
                out.push({
                    role:       stuRole,
                    class:      String(row[1] || '').trim(),
                    class_no:   String(row[2] || '').trim(),
                    real_name:  String(row[3] || '').trim(),
                    membership: String(row[4] || '').trim()
                });
            }
            // 排序：role → class → class_no
            out.sort((a, b) => {
                if (a.role !== b.role) return a.role.localeCompare(b.role);
                if (a.class !== b.class) return a.class.localeCompare(b.class);
                return (parseInt(a.class_no, 10) || 0) - (parseInt(b.class_no, 10) || 0);
            });
            return { result: 'success', action: 'getRoster', roster: out };
        }

        async function guardLogin(username, password) {
            // Apps Script doPost 三條相容路徑（依序嘗試）：
            //   1) text/plain + JSON 字串         （避免 preflight，但 GAS 偶爾會回 HTML）
            //   2) application/x-www-form-urlencoded （最穩，guard 端用 e.parameter 取）
            //   3) text/plain + form-urlencoded 字串  （保底）
            // 任一條拿到 success:true 就回傳 token；都失敗就把伺服器原始回應拼到錯誤訊息。
            //
            // 注意：兩種 Content-Type 都不會觸發 CORS preflight，瀏覽器只會直接 POST。
            //
            // 另：guard.gs 必須有一個 doGet（即使是 stub），否則 GAS 對任何意外 GET
            //     （例如瀏覽器書籤、preflight fallback）會回 "找不到指令碼函數：doGet"，
            //     那段錯誤訊息不是 JSON，前端會誤判。
            //     修法：在 GAS 編輯器新增 function doGet(e) { return ContentService...
            //              .createTextOutput(JSON.stringify({result:'error',msg:'Use POST'}))... }

            const tries = [
                {
                    name: 'text/plain-json',
                    body: JSON.stringify({ username, password }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                },
                {
                    name: 'form-urlencoded',
                    body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' }
                }
            ];

            let lastErr = null;
            for (const t of tries) {
                try {
                    const resp = await fetch(GUARD_URL, {
                        method: 'POST',
                        cache: 'no-store',
                        headers: t.headers,
                        body: t.body,
                        redirect: 'follow'
                    });
                    const text = await resp.text();
                    console.log(`[guard] ${t.name} status=${resp.status} body[:200]=`, text.slice(0, 200));
                    if (!text) { lastErr = `[${t.name}] 空回應`; continue; }
                    // 先試 JSON
                    let json = null;
                    try { json = JSON.parse(text); } catch (e) {}
                    if (json && json.success) {
                        return finalizeGuardLogin(json, username);
                    }
                    if (json && !json.success) {
                        throw new Error(json.message || '帳號或密碼錯誤');
                    }
                    // 不是 JSON（很可能是 HTML 授權頁或登入頁）→ 換下一種試
                    lastErr = `[${t.name}] 非 JSON（status=${resp.status}，前 80 字：${text.slice(0, 80).replace(/\s+/g, ' ')}）`;
                } catch (e) {
                    // 業務錯誤訊息（帳號不存在 / 密碼錯誤 / 此帳號已被停用）→ 直接上拋，不重試
                    const msg = (e && e.message) || '';
                    if (msg && !/JSON|回應|空|非 JSON/.test(msg)) throw e;
                    lastErr = `[${t.name}] ` + (msg || 'exception');
                }
            }
            throw new Error('Guard 連線失敗：' + (lastErr || '未知錯誤'));
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        function escapeAttr(str) { return escapeHtml(str); }

        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cell = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                const next = text[i + 1];
                if (inQuotes) {
                    if (ch === '"' && next === '"') {
                        cell += '"';
                        i++;
                    } else if (ch === '"') {
                        inQuotes = false;
                    } else {
                        cell += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        row.push(cell.trim());
                        cell = '';
                    } else if (ch === '\n' || ch === '\r') {
                        row.push(cell.trim());
                        rows.push(row);
                        row = [];
                        cell = '';
                        if (ch === '\r' && next === '\n') i++;
                    } else {
                        cell += ch;
                    }
                }
            }
            if (cell.length > 0 || row.length > 0) {
                row.push(cell.trim());
                rows.push(row);
            }
            return rows;
        }

        function parseCardCSV(text) {
            return parseCSV(text)
                .slice(1)
                .filter(r => r[0])
                .map(r => ({
                    name:     r[0] ?? '',

                    order:    parseInt(r[2], 10) || 0,
                    bg:       r[3] ?? '',

                }));

        function parseDetailCSV(text) {
            const INACTIVE_STATUS = new Set(['INACTIVE', 'DISABLED', 'OFF', 'FALSE', 'NO', 'HIDDEN']);
            const rows = parseCSV(text);
            const result = [];
            for (const r of rows) {
                if (!r || !r[0]) continue;
                if (!r[4] || !String(r[4]).trim()) continue;
                if (String(r[1] || '').trim() === '1' &&
                    !String(r[2] || '').trim() &&
                    !String(r[3] || '').trim() &&
                    !String(r[4] || '').trim()) {
                    continue;
                }
                const status = String(r[3] || '').toUpperCase().trim();
                if (INACTIVE_STATUS.has(status)) continue;
                result.push({
                    id:     String(r[0]).trim(),
                    type:   String(r[1] || 'ITEM').trim(),
                    range:  String(r[2] || '').trim(),
                    status: status || 'ACTIVE',
                    url:    r[4]
                });
            }
            return result;
        }

                return;
            }
            if (serverVer && serverVer === localVer) {
                const cached = localStorage.getItem(DETAIL_DATA_KEY);
                if (cached) {
                    try {
                        const map = JSON.parse(cached);
                        __detailCache = map;
                        console.log('[preload] ✓ 詳情 sheet 用 localStorage 快取（' + Object.keys(map).length + ' 個 vol）');
                        return;
                    } catch (e) {}
                }
            }
            if (serverVer && serverVer !== localVer) {
                console.log(`[preload] ⟳ 詳情版本變更 (${localVer} → ${serverVer})，清掉詳情快取`);
                localStorage.removeItem(DETAIL_DATA_KEY);
            }
            const map = {};
            await Promise.all(volNames.map(async (vol) => {
                try {
                    const json = await callLoaderGetTopic(vol);
                    const rows = (json && json.data) || [];
                    const csv = rowsToCSV(rows);
                    const items = parseDetailCSV(csv);
                    if (items.length > 0) map[vol] = items;
                } catch (e) {
                    console.warn(`[preload] ${vol} 抓取失敗：`, e);
                }
            }));
            __detailCache = map;
            try {
                localStorage.setItem(DETAIL_DATA_KEY, JSON.stringify(map));
                if (serverVer) localStorage.setItem(DETAIL_VERSION_KEY, serverVer);
                console.log(`[preload] ✓ 詳情 sheet 全抓完成（${Object.keys(map).length} 個 vol），已寫入 localStorage`);
            } catch (e) {
                console.warn('[preload] localStorage 寫入失敗：', e);
            }
        }

        function getCachedDetail(volName) {
            if (__detailCache[volName]) return __detailCache[volName];
            try {
                const cached = localStorage.getItem(DETAIL_DATA_KEY);
                if (cached) {
                    const map = JSON.parse(cached);
                    __detailCache = map;
                    if (map[volName]) return map[volName];
                }
            } catch (e) {}
            return null;
        }

        function getMembership() {
            try { return (localStorage.getItem('user_membership') || '').toUpperCase(); }
            catch (e) { return ''; }
        }
        function isUltra() { return getMembership().includes('ULTRA'); }

        // 取得顯示用等級（若 localStorage 沒值，預設為 CORE）
        function getDisplayMembership() {
            const m = getMembership();
            if (!m) return 'CORE';  // 預設 CORE
            if (m.includes('ULTRA')) return 'ULTRA';
            if (m.includes('PRIME')) return 'PRIME';
            if (m.includes('PLUS'))  return 'PLUS';
            if (m.includes('CORE'))  return 'CORE';
            return m;
        }

        // 等級 → 文字主色（PH CORE 樣式，玻璃白底 + 等級字染主色）
        const MEMBERSHIP_TIER_COLOR = {
            CORE:  '#475569',  // slate-600
            PLUS:  '#1d4ed8',  // blue-700
            PRIME: '#b91c1c',  // red-700
            ULTRA: '#7e22ce'   // purple-700
        };

        // 更新頂部 chip（依 localStorage 套用文字顏色 + 文字）

        // 開啟會員說明 overlay
        function openMembershipInfo() {
            const overlay = document.getElementById('membership-overlay');
            if (!overlay) return;
            overlay.classList.remove('pointer-events-none', 'opacity-0');

            overlay.classList.remove('opacity-100');

        // ---- YT Player ----
        window.__ytSetupPlayer = function (yt, targetId, autoplay) {
            try { if (__ytPlayer && __ytPlayer.destroy) __ytPlayer.destroy(); } catch (e) {}
            stopYTTimeTracking();
            clearYTAttendanceTimer();
            __ytMaxWatchedTime = 0;
            __ytFullyWatchedSession = false;
            __ytAttendanceUnlocked = false;
            __ytCurrentWatched = false;
            let retryCount = 0;
            const MAX_RETRIES = 30;
            const tryCreate = () => {
                if (typeof YT === 'undefined' || !YT.Player) {
                    if (retryCount++ < MAX_RETRIES) {
                        return setTimeout(tryCreate, 100);
                    }
                    console.warn('[YT] 加載超時，請檢查網路或廣告攔截器');
                    return;
                }
                __ytPlayer = new YT.Player(targetId, {
                    videoId: yt,
                    playerVars: {
                        rel: 0,
                        modestbranding: 1,
                        controls: 1,              // 顯示原生進度條（可看進度）
                        disablekb: 1,            // 禁用鍵盤控制
                        fs: 1,                   // 允許全螢幕按鈕
                        playsinline: 1,
                        iv_load_policy: 3,       // 不顯示註釋
                        autoplay: autoplay ? 1 : 0
                    },
                    events: {
                        onReady: (e) => {
                            if (autoplay) { try { e.target.playVideo(); } catch (err) {} }
                        },
                        onStateChange: onYTStateChange
                    }
                });
            };
            tryCreate();
        };

        function onYTStateChange(event) {
            if (!__ytPlayer) return;
            const state = event.data;
            if (state === 1) {
                startYTTimeTracking();
            } else if (state === 2 || state === 0) {
                stopYTTimeTracking();
            }
            if (state === 0) {
                handleYTEnded();
            }
        }

        function startYTTimeTracking() {
            if (__ytCurrentWatched) return;  // 已看過：跳過限制（ULTRA / 已簽到）
            if (__ytWatchCheckInterval) clearInterval(__ytWatchCheckInterval);
            const locked = !isUltra();   // CORE/PLUS/PRIME 鎖定；ULTRA 完全自由
            __ytWatchCheckInterval = setInterval(() => {
                if (!__ytPlayer || typeof __ytPlayer.getCurrentTime !== 'function') return;
                if (__ytCurrentWatched) return;
                const t = __ytPlayer.getCurrentTime();
                const dur = (typeof __ytPlayer.getDuration === 'function') ? __ytPlayer.getDuration() : 0;

                // ULTRA / 已看過：只更新進度條，不做防快轉
                if (locked) {
                    // 鎖 1x 播放速度
                    try {
                        if (typeof __ytPlayer.getPlaybackRate === 'function' && __ytPlayer.getPlaybackRate() !== 1) {
                            __ytPlayer.setPlaybackRate(1);
                        }
                    } catch (e) {}
                    // 防快轉
                    if (t > __ytMaxWatchedTime + 2.5) {
                        try { __ytPlayer.seekTo(__ytMaxWatchedTime, true); } catch (e) {}
                    } else {
                        __ytMaxWatchedTime = Math.max(__ytMaxWatchedTime, t);
                    }
                } else {
                    __ytMaxWatchedTime = Math.max(__ytMaxWatchedTime, t);
                }

                // 更新自訂 overlay 進度條
                updateProgressOverlay(t, dur, locked);
            }, 500);
        }

        // 格式化秒數為 mm:ss
        function formatTime(sec) {
            sec = Math.max(0, Math.floor(sec || 0));
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        // 更新自訂進度條 overlay（在 video 下方）
        // t = 當前時間, dur = 總長, locked = true 表示 CORE/PLUS/PRIME 鎖定
        function updateProgressOverlay(t, dur, locked) {
            const overlay = document.getElementById('yt-progress-overlay');
            if (!overlay) return;
            const percent = dur > 0 ? (t / dur) * 100 : 0;
            const lockedPercent = dur > 0 ? (__ytMaxWatchedTime / dur) * 100 : 0;
            const cur = overlay.querySelector('.yt-cur-time');
            const total = overlay.querySelector('.yt-total-time');
            const bar = overlay.querySelector('.yt-progress-bar');
            const lockBar = overlay.querySelector('.yt-locked-bar');
            const status = overlay.querySelector('.yt-lock-status');
            const tierBadge = overlay.querySelector('.yt-tier-badge');
            if (cur) cur.textContent = formatTime(t);
            if (total) total.textContent = formatTime(dur);
            if (bar) bar.style.width = percent + '%';
            if (lockBar) lockBar.style.width = lockedPercent + '%';
            if (status) {
                if (__ytCurrentWatched) {
                    status.textContent = '✓ 已解鎖';
                    status.className = 'yt-lock-status text-[10px] font-bold uppercase tracking-widest text-emerald-400';
                } else if (locked) {
                    status.textContent = '🔒 防快轉';
                    status.className = 'yt-lock-status text-[10px] font-bold uppercase tracking-widest text-amber-300';
                } else {
                    status.textContent = '✓ 自由';
                    status.className = 'yt-lock-status text-[10px] font-bold uppercase tracking-widest text-emerald-300';
                }
            }
            if (tierBadge) {
                const tier = getDisplayMembership();
                tierBadge.textContent = 'PH ' + tier;
            }
        }

        // 全螢幕切換：偵測當前狀態自動決定進入/退出
        function toggleFullscreen() {
            if (!__ytPlayer) return;
            const iframe = __ytPlayer.getIframe && __ytPlayer.getIframe();
            if (!iframe) return;

            // 判斷目前 iframe（或它的祖先）是否在全螢幕
            const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            const iframeIsFs = fsEl === iframe;
            const inFs = !!fsEl;  // 文件內任何元素在全螢幕也算

            try {
                if (iframeIsFs) {
                    // 已全螢幕 → 退出
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    else if (document.msExitFullscreen) document.msExitFullscreen();
                } else {
                    // 進入全螢幕
                    if (iframe.requestFullscreen) iframe.requestFullscreen();
                    else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
                    else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
                }
            } catch (e) {
                console.warn('[yt-fs] 全螢幕切換失敗：', e);
            }
        }

        // 監聽 fullscreenchange，自動更新按鈕 icon
        function updateFSButtonIcon() {
            const btn = document.querySelector('.yt-fs-btn');
            if (!btn) return;
            const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            const icon = btn.querySelector('i');
            if (icon) {
                if (fsEl) {
                    icon.className = 'fas fa-compress text-xs';
                    btn.title = '退出全螢幕';
                } else {
                    icon.className = 'fas fa-expand text-xs';
                    btn.title = '全螢幕';
                }
            }
        }
        document.addEventListener('fullscreenchange', updateFSButtonIcon);
        document.addEventListener('webkitfullscreenchange', updateFSButtonIcon);
        document.addEventListener('msfullscreenchange', updateFSButtonIcon);

        function stopYTTimeTracking() {
            if (__ytWatchCheckInterval) {
                clearInterval(__ytWatchCheckInterval);
                __ytWatchCheckInterval = null;
            }
        }

        function handleYTEnded() {
            if (__ytCurrentWatched || __ytFullyWatchedSession) return;
            if (isUltra()) {
                renderYTAttendanceButton('ready');
                return;
            }
            const dur = (typeof __ytPlayer.getDuration === 'function') ? __ytPlayer.getDuration() : 0;
            if (dur > 0 && __ytMaxWatchedTime >= dur * 0.9) {
                __ytFullyWatchedSession = true;
                startYTAttendanceCountdown(120);
            } else {
                renderYTAttendanceButton('incomplete');
            }
        }

        function startYTAttendanceCountdown(seconds) {
            let left = seconds;
            renderYTAttendanceButton('counting', left);
            if (__ytAttendanceTimer) clearInterval(__ytAttendanceTimer);
            __ytAttendanceTimer = setInterval(() => {
                left--;
                if (left <= 0) {
                    clearInterval(__ytAttendanceTimer);
                    __ytAttendanceTimer = null;
                    renderYTAttendanceButton('timeout');
                } else {
                    renderYTAttendanceButton('counting', left);
                }
            }, 1000);
        }

        function clearYTAttendanceTimer() {
            if (__ytAttendanceTimer) { clearInterval(__ytAttendanceTimer); __ytAttendanceTimer = null; }
        }

        function renderYTAttendanceButton(kind, secondsLeft) {
            const stage = document.getElementById('media-stage');
            if (!stage) return;
            let existing = document.getElementById('yt-attendance-bar');
            if (!existing) {
                existing = document.createElement('div');
                existing.id = 'yt-attendance-bar';
                existing.className = 'px-5 py-3 border-t border-slate-100 flex items-center justify-center';
                stage.appendChild(existing);
            }
            if (kind === 'counting') {
                const m = Math.floor(secondsLeft / 60);
                const s = secondsLeft % 60;
                const txt = `完成簽到 (剩餘 ${m}分${String(s).padStart(2,'0')}秒)`;
                existing.innerHTML = `<button id="yt-attendance-btn" onclick="onYTAttendanceConfirm()"
                    class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white rounded-full text-xs font-extrabold shadow-lg active:scale-95 flex items-center gap-2 animate-pulse">
                    <i class="fas fa-check-circle"></i><span>${txt}</span></button>`;
                __ytAttendanceUnlocked = true;
                if (__ytLastVideoKey) __ytWatchedKeys.add(__ytLastVideoKey);
            } else if (kind === 'ready') {
                existing.innerHTML = `<button id="yt-attendance-btn" onclick="onYTAttendanceConfirm()"
                    class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full text-xs font-extrabold shadow-md active:scale-95 flex items-center gap-2">
                    <i class="fas fa-check-circle"></i><span>完成簽到 (ULTRA 會員免倒數)</span></button>`;
                __ytAttendanceUnlocked = true;
                if (__ytLastVideoKey) __ytWatchedKeys.add(__ytLastVideoKey);
            } else if (kind === 'timeout') {
                existing.innerHTML = `<button disabled
                    class="px-5 py-2.5 bg-rose-600 text-white rounded-full text-xs font-extrabold shadow-md cursor-not-allowed flex items-center gap-2">
                    <i class="fas fa-exclamation-triangle"></i><span>超時，請重新播放</span></button>`;
                __ytAttendanceUnlocked = false;
            } else {
                existing.innerHTML = `<button disabled
                    class="px-5 py-2.5 bg-rose-600 text-white rounded-full text-xs font-extrabold shadow-md cursor-not-allowed flex items-center gap-2">
                    <i class="fas fa-exclamation-triangle"></i><span>未完整觀看 (請重播並完整看完)</span></button>`;
                __ytAttendanceUnlocked = false;
            }
        }

        // ===== 簽到 4 個按鈕（PH glass pill 風） =====
        // 在 media-stage 頂端插入一條 4 顆膠囊：簽到 / 簽退 / 全班 / 重整
        function renderAttendanceBar(volName, hwId, range) {
            const stage = document.getElementById('media-stage');
            if (!stage) return;
            // 移除舊的（避免切換 range 時殘留）
            const old = document.getElementById('attendance-bar');
            if (old) old.remove();

            const vk = currentVideoKey(volName, hwId, range);
            const watched = hasWatchedVideo(vk);
            const student = isStudentRole();
            const token = getStoredToken();

            const bar = document.createElement('div');
            bar.id = 'attendance-bar';
            bar.className = 'px-4 py-3 border-b border-slate-100 flex flex-wrap items-center gap-2 justify-center';
            const btnBase = 'px-3.5 py-2 rounded-full text-[10px] font-extrabold tracking-[0.2em] uppercase transition-all active:scale-95 flex items-center gap-1.5 backdrop-blur-md';
            const disabledCls = ' opacity-50 cursor-not-allowed pointer-events-none';

            // 1) 簽到 ACTIVE
            const signInDisabled = !student || !token || !watched;
            const signInTitle = !student ? '需 S3/S4/S5/S6 學生身份'
                : !token ? '請先登入'
                : !watched ? '請先完整觀看此短片'
                : '記錄 ACTIVE 簽到';
            bar.innerHTML = `
                <button id="btn-sign-in"
                        class="${btnBase} bg-emerald-500 hover:bg-emerald-600 text-white shadow-md${signInDisabled ? disabledCls : ''}"
                        title="${signInTitle}">
                    <i class="fas fa-check"></i><span>簽到</span>
                </button>
                <button id="btn-sign-out"
                        class="${btnBase} bg-rose-500 hover:bg-rose-600 text-white shadow-md${signInDisabled ? disabledCls : ''}"
                        title="${signInTitle}">
                    <i class="fas fa-times"></i><span>簽退</span>
                </button>
                <button id="btn-show-all"
                        class="${btnBase} bg-white/85 hover:bg-white ring-1 ring-slate-200 text-slate-700 shadow-sm${!token ? disabledCls : ''}"
                        title="${!token ? '請先登入' : '查看全班簽到記錄'}">
                    <i class="fas fa-users"></i><span>全部人簽到</span>
                </button>
                <button id="btn-refresh-att"
                        class="${btnBase} bg-white/85 hover:bg-white ring-1 ring-slate-200 text-slate-700 shadow-sm${!token ? disabledCls : ''}"
                        title="重新整理我的簽到狀態">
                    <i class="fas fa-rotate"></i><span>重整</span>
                </button>
                <span id="att-status-chip" class="text-[9px] font-bold tracking-widest uppercase text-slate-400 ml-1"></span>
            `;
            // 插在 media-stage 內最前面（在 video 之前）
            stage.insertBefore(bar, stage.firstChild);

            // 綁事件
            const bind = (id, fn) => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('click', fn);
            };
            bind('btn-sign-in',  () => handleStudentSign('ACTIVE',  volName, hwId, range));
            bind('btn-sign-out', () => handleStudentSign('INACTIVE', volName, hwId, range));
            bind('btn-show-all', () => showAllAttendance(volName, hwId, range));
            bind('btn-refresh-att', () => refreshMyAttendanceChip(volName, hwId, range));

            // 抓自己最新狀態
            refreshMyAttendanceChip(volName, hwId, range);
        }

        function setAttStatusChip(text, tone) {
            const el = document.getElementById('att-status-chip');
            if (!el) return;
            const colors = {
                active:   'text-emerald-600',
                inactive: 'text-rose-600',
                none:     'text-slate-400',
                loading:  'text-sky-500',
                error:    'text-rose-600'
            };
            el.className = `text-[9px] font-bold tracking-widest uppercase ml-1 ${colors[tone] || colors.none}`;
            el.textContent = text;
        }

        async function refreshMyAttendanceChip(volName, hwId, range) {
            if (!getStoredToken()) { setAttStatusChip('未登入', 'none'); return; }
            setAttStatusChip('讀取中…', 'loading');
            try {
                const json = await getMyAttendance(volName, hwId, range);
                const rec = json && json.record;
                if (!rec) {
                    setAttStatusChip('尚未簽到', 'none');
                } else if (rec.status === 'ACTIVE') {
                    setAttStatusChip('你目前：ACTIVE ✓', 'active');
                } else if (rec.status === 'INACTIVE') {
                    setAttStatusChip('你目前：INACTIVE ✗', 'inactive');
                } else {
                    setAttStatusChip('你目前：' + rec.status, 'none');
                }
            } catch (e) {
                setAttStatusChip('讀取失敗', 'error');
            }
        }

        async function handleStudentSign(status, volName, hwId, range) {
            const vk = currentVideoKey(volName, hwId, range);
            if (!getStoredToken()) {
                const t = await promptLoginAndGetToken();
                if (!t) return;
            }
            if (!isStudentRole()) {
                showToast('你的角色無簽到權限（需 S3 / S4 / S5 / S6）', 'error');
                return;
            }
            if (!hasWatchedVideo(vk)) {
                showToast('請先完整觀看此短片再簽到', 'error');
                return;
            }
            setAttStatusChip('寫入中…', 'loading');
            try {
                await recordAttendance({ volName, hwId, range, status });
                showToast(status === 'ACTIVE' ? '簽到成功 ✓' : '已記錄簽退 ✗', 'success');
                await refreshMyAttendanceChip(volName, hwId, range);
            } catch (e) {
                showToast('寫入失敗：' + ((e && e.message) || '未知錯誤'), 'error');
                setAttStatusChip('寫入失敗', 'error');
            }
        }

        // ===== 全班簽到 overlay（含 role filter + ULTRA 紫色高亮） =====
        // 模組狀態：filter + records 緩存（filter 切換時不重打 attendance）
        const __rosterState = {
            volName: '', hwId: '', range: '',
            role: 'ALL',          // 'ALL' | 'S3' | 'S4' | 'S5' | 'S6'
            records: [],          // attendance records
            roster: [],           // 全部班 (server-side role filter 應已套用)
            myClass: ''
        };

        async function showAllAttendance(volName, hwId, range) {
            if (!getStoredToken()) {
                const t = await promptLoginAndGetToken();
                if (!t) return;
            }
            ensureAllAttModal();
            const m = document.getElementById('all-att-modal');
            const body = document.getElementById('all-att-body');
            const title = document.getElementById('all-att-title');
            const me2 = getStoredUser() || {};
            const classLabel = me2.class ? ` · ${me2.class} 班` : '';
            title.textContent = `${volName} · ${hwId} · ${range}${classLabel}`;

            // 初始化 state
            const me = getStoredUser() || {};
            __rosterState.volName = volName;
            __rosterState.hwId    = hwId;
            __rosterState.range   = range;
            __rosterState.myClass = me.class || '';
            // 預設 filter：自己班；沒 myClass 就 ALL
            __rosterState.role = (typeof me.role === 'string' && /S[3-6]/i.test(me.role)) ? me.role.toUpperCase() : 'ALL';

            body.innerHTML = `<div class="flex items-center gap-2 text-slate-500 text-sm"><i class="fas fa-spinner fa-spin"></i> 載入中…</div>`;
            m.classList.remove('opacity-0', 'pointer-events-none');
            m.classList.add('opacity-100');
            requestAnimationFrame(() => document.getElementById('all-att-card')?.classList.add('active'));

            await loadAndRenderRoster();
        }

        async function loadAndRenderRoster() {
            const body = document.getElementById('all-att-body');
            body.innerHTML = `<div class="flex items-center gap-2 text-slate-500 text-sm"><i class="fas fa-spinner fa-spin"></i> 載入中…</div>`;
            try {
                const { volName, hwId, range, role } = __rosterState;
                // 規則：跨班，role filter 控管 S3~S6 範圍
                //   - role='ALL' → 全部 S3~S6 學生（跨班）
                //   - role='S3'  → 全部 S3 學生（跨班）
                const [attJson, rosterJson] = await Promise.all([
                    getAttendance({ volName, hwId, range }),
                    getRosterByClass(null, role === 'ALL' ? null : role)
                ]);
                __rosterState.records = (attJson && attJson.records) || [];
                __rosterState.roster  = (rosterJson && rosterJson.roster) || [];
                renderRoster();
            } catch (e) {
                // Debug：把原始錯誤物件印出來
                console.error('[roster-load] error:', e);
                body.innerHTML = `<div class="text-rose-600 text-sm font-bold">
                    <i class="fas fa-exclamation-triangle mr-1"></i> 載入失敗：${escapeHtml((e && e.message) || '未知錯誤')}
                </div>`;
            }
        }

        function renderRoster() {
            const body = document.getElementById('all-att-body');
            const { records, roster, role } = __rosterState;

        async function fetchVersion() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&t=${Date.now()}`;
                const r = await fetch(url, { cache: 'no-store' });
                if (!r.ok) return null;
                const txt = await r.text();
                const firstLine = txt.split('\n')[0] || '';
                const cells = firstLine.split(',').map(c => c.replace(/^"|"$/g, '').trim());
                return cells[0] || null;
            } catch (e) {
                console.warn('[version] fetch failed:', e);
                return null;
            }
        }

        function renderFromCache() {
            try {
                const cached = localStorage.getItem(CACHE_DATA_KEY);
                if (!cached) return false;
                rawData = JSON.parse(cached);
                if (!Array.isArray(rawData) || rawData.length === 0) return false;
                renderFilters();
                renderContent();
                return true;
            } catch (e) {
                return false;
            }
        }

        async function initData(force = false) {
            const mainArea = document.getElementById('main-content-area');
            if (mainArea && !isRendered) {
                mainArea.innerHTML = `<div class="loader">正在從數據庫獲取內容...</div>`;
            }
            const serverVersion = await fetchVersion();
            const localVersion = localStorage.getItem(VERSION_KEY);
            console.log(`[init] server=${serverVersion}  local=${localVersion}  force=${force}`);
            if (!force && serverVersion && serverVersion === localVersion) {
                if (renderFromCache()) {
                    console.log('[init] ✓ 使用 localStorage 快取（版本一致）');
                    isRendered = true;
                    return;
                }
            }
            if (serverVersion && serverVersion !== localVersion) {
                console.log(`[init] ⟳ 版本變更 (${localVersion} → ${serverVersion})，清掉快取`);
                localStorage.removeItem(CACHE_KEY);
                localStorage.removeItem(CACHE_DATA_KEY);
            }
            try {
                const response = await fetch(buildSheetUrl(), { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csvText = await response.text();
                rawData = parseCardCSV(csvText);
                if (rawData.length === 0) {
                    if (mainArea) mainArea.innerHTML = `<div class="loader">HWMENU 沒有可顯示的卡片。</div>`;
                    return;
                }
                try {
                    localStorage.setItem(CACHE_KEY, csvText);
                    localStorage.setItem(CACHE_DATA_KEY, JSON.stringify(rawData));
                    if (serverVersion) localStorage.setItem(VERSION_KEY, serverVersion);
                    console.log('[init] ✓ 已寫入 localStorage 快取');
                } catch (e) {
                    console.warn('[init] localStorage 寫入失敗（可能 quota 滿）:', e);
                }
                renderFilters();
                renderContent();
                isRendered = true;
            } catch (error) {
                console.error('Fetch error:', error);
                if (renderFromCache()) {
                    console.log('[init] ⚠ 網路失敗，使用舊快取');
                    isRendered = true;
                } else {
                    if (mainArea) mainArea.innerHTML = `<div class="loader">載入失敗，請檢查網路連線或工作表權限。</div>`;
                }
            }
            if (rawData && rawData.length > 0) {
                preloadAllDetails().catch(e => console.warn('[preload] 失敗：', e));
            }
        }

        function groupByHW(items) {
            const groups = new Map();
            for (const it of items) {
                if (!groups.has(it.id)) groups.set(it.id, []);
                groups.get(it.id).push(it);
            }
            return [...groups.entries()].map(([id, list]) => ({ id, list }));
        }
