
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Simulation Lab - Lumina Studio</title>
    
    <!-- iOS PWA 狀態列修正 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        :root {
            --mint-deep: #1f2937; 
            --mint-primary: #10b981; 
            --mint-accent: #34d399;
            --mint-bg: #ffffff; 
            --mint-glass: rgba(255, 255, 255, 0.85); 
            --mint-nav-glass: rgba(255, 255, 255, 0.75);
            --sage-deep: #2d3a35;
            --sage-muted: #6b8278;
            --sage-active: #4a6d5d;
        }

        html { 
            scroll-behavior: smooth; 
            height: 100%;
            overflow: hidden; 
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-image: url('https://phyuaaphysics.github.io/phyustudio/1468.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: var(--mint-bg);
            color: var(--mint-deep);
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            overflow-y: auto;
            padding-top: 0;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 移除 Loader 動畫與顯示 */
        #page-loader {
            display: none;
        }
        
        /* Functions Bar - 全透明 */
        .logo-bar {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 120;
            background-color: transparent; 
            padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
            padding-bottom: 12px;
        }

        #main-logo {
            transform-origin: left center;
            will-change: transform;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scrolled #main-logo { transform: scale(0.75); }

        #page-content { 
            padding-top: calc(env(safe-area-inset-top, 0px) + 100px); 
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 120px;
            max-width: 800px; 
            margin: 0 auto;
        }

        /* iOS Widget Style */
        .ios-widget {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .ios-widget:active { transform: scale(0.98); }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px 15px;
            justify-items: center;
        }
        @media (min-width: 768px) {
            .app-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .app-item:active {
            transform: scale(0.9);
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            overflow: hidden;
            background: #f3f4f6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 6px;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-label {
            font-size: 11px;
            font-weight: 700;
            color: #111827;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-shadow: none;
        }

        /* Window / Modal Style */
        .modal-overlay {
            position: fixed; inset: 0; 
            background: rgba(0,0,0,0.4); 
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-window {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            position: relative;
            animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Fullscreen Music Layout - iOS Style */
        #modal-music .modal-window {
            max-width: 100%;
            width: 100%;
            height: 100%;
            /* Smaller rounding than before for a sharper iOS look */
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            animation: appLaunch 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
        }

        /* Music Iframe Container - Ensure scrolling works */
        #music-container {
            margin: 10px;
            border-radius: 12px; /* Smaller rounding inside */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* Momentum scrolling for iOS */
            flex: 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: transparent;
        }

        @keyframes appLaunch {
            from { transform: scale(0.6) translateY(200px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .modal-close {
            width: 30px; height: 30px; border-radius: 50%;
            background: rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #111;
        }

        /* Timer Widget Style */
        .timer-ctrl {
            display: flex; align-items: center; gap: 15px; font-size: 24px; font-weight: bold;
        }
        .timer-btn {
            width: 40px; height: 40px; border-radius: 50%; background: #10b981;
            color: white; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* Calendar Style */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            gap: 8px;
            padding: 15px;
        }
        .calendar-day-header { font-size: 10px; font-weight: 800; color: #9ca3af; }
        .calendar-day { font-size: 14px; padding: 10px 0; border-radius: 10px; color: #374151; }
        .calendar-day.today { background: #ef4444; color: white; font-weight: bold; }
        .calendar-day.prev-month { color: #d1d5db; }

        /* Apple Style Dock */
        .dock-wrapper {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
            width: auto;
            min-width: 340px;
        }
        .dock-wrapper.collapsed { transform: translateX(-50%) translateY(200px); opacity: 0; }
        .dock-nav {
            background-color: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(25px) saturate(180%); 
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 12px 14px;
            border-radius: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); 
            display: flex; align-items: center; justify-content: center; gap: 14px;
        }
        .dock-toggle-btn {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: rgba(0,0,0,0.2); cursor: pointer; font-size: 14px;
        }
        .dock-content { display: flex; align-items: center; gap: 14px; }
        .dock-item {
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            color: #636366; transition: all 0.3s; min-width: 58px;
            background: transparent; border: none; cursor: pointer;
        }
        .dock-item i { font-size: 1.6rem; }
        .dock-item span { font-size: 9px; font-weight: 700; opacity: 0.8; }
        .dock-item.active { color: #007aff; } 
        
        .dock-trigger-bar {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 5px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px; z-index: 199; cursor: pointer; display: none;
        }
        .dock-wrapper.collapsed + .dock-trigger-bar { display: block; }

        @media (max-width: 768px) {
            .dock-wrapper { width: 92%; max-width: 400px; }
            #page-content { padding-top: calc(env(safe-area-inset-top, 0px) + 100px); }
        }
    </style>
</head>

    <script>
        let lastScrollY = window.scrollY;

        function updateWidget() {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            document.getElementById('widget-date').textContent = `${days[now.getDay()]} , ${months[now.getMonth()]} ${now.getDate()}`;
            document.getElementById('widget-time').textContent = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateWidget, 1000);
        updateWidget();

        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendar-title').textContent = `${monthNames[month]} ${year}`;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();
            const container = document.getElementById('calendar-days');
            container.innerHTML = '';
            for (let i = firstDay - 1; i >= 0; i--) {
                const div = document.createElement('div');
                div.className = 'calendar-day prev-month';
                div.textContent = prevMonthDays - i;
                container.appendChild(div);
            }
            for (let i = 1; i <= daysInMonth; i++) {
                const div = document.createElement('div');
                div.className = 'calendar-day' + (i === today ? ' today' : '');
                div.textContent = i;
                container.appendChild(div);
            }
        }

        function openPlugin(type) {
            if (type === 'music') {
                document.getElementById('music-frame').src = "https://phyuaaphysics.github.io/phyustudio/musicplayer.html";
                document.getElementById('modal-music').classList.add('active');
                document.body.style.overflow = 'hidden';
            } else if (type === 'timer') {
                document.getElementById('modal-timer').classList.add('active');
            } else if (type === 'calc') {
                document.getElementById('modal-calc').classList.add('active');
            } else if (type === 'calendar') {
                renderCalendar();
                document.getElementById('modal-calendar').classList.add('active');
            }
        }

        function closePlugin(type) {
            const modal = document.getElementById('modal-' + type);
            if (modal) modal.classList.remove('active');
            if (type === 'music') {
                document.getElementById('music-frame').src = "";
                document.body.style.overflow = '';
            }
        }

        function closeModal(e, id) {
            if (e.target.id === id) {
                closePlugin(id.replace('modal-', ''));
            }
        }

        let tH = 0, tM = 0, tS = 0, timerInterval = null;
        function adjTimer(unit, val) {
            if (timerInterval) return;
            if (unit === 'h') tH = Math.max(0, tH + val);
            if (unit === 'm') tM = Math.max(0, Math.min(59, tM + val));
            if (unit === 's') tS = Math.max(0, Math.min(59, tS + val));
            renderTimer();
        }
        function renderTimer() {
            document.getElementById('t-h').textContent = String(tH).padStart(2, '0');
            document.getElementById('t-m').textContent = String(tM).padStart(2, '0');
            document.getElementById('t-s').textContent = String(tS).padStart(2, '0');
        }
        function toggleTimer() {
            const btn = document.getElementById('timer-main-btn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.textContent = "Start";
                btn.style.background = "black";
            } else {
                if (tH === 0 && tM === 0 && tS === 0) return;
                btn.textContent = "Stop";
                btn.style.background = "#ef4444";
                timerInterval = setInterval(() => {
                    if (tS > 0) tS--;
                    else if (tM > 0) { tM--; tS = 59; }
                    else if (tH > 0) { tH--; tM = 59; tS = 59; }
                    else {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        btn.textContent = "Done";
                        setTimeout(() => { btn.textContent = "Start"; btn.style.background = "black"; }, 2000);
                    }
                    renderTimer();
                }, 1000);
            }
        }

        function toggleDock() { document.getElementById('dock-nav-wrapper').classList.toggle('collapsed'); }
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function handleNavigation(url, showAnim = false) {
            if (!url || url === '#') return;
            window.location.href = url;
        }

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY || document.documentElement.scrollTop;
            if (currentScrollY > 30) document.body.classList.add('scrolled');
            else document.body.classList.remove('scrolled');
            lastScrollY = currentScrollY;
        }, { passive: true });
    </script>
</body>
</html>
