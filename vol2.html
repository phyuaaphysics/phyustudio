<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fundamental Exercise - Lumina Studio</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lumina">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        :root {
            --mint-deep: #064e3b;
            --mint-primary: #10b981; 
            --mint-bg: #f0fdf4;
            --anim-os: 1.2s cubic-bezier(0.25, 1, 0.3, 1); 
            --anim-slow: 1.6s cubic-bezier(0.4, 0, 0.2, 1);
            --anim-item: 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 針對 iOS PWA 全螢幕修正 */
        html, body { 
            height: 100dvh;
            width: 100%;
            margin: 0;
            overflow: hidden; 
            position: fixed; 
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .hero-full {
            position: absolute;
            inset: 0; 
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            z-index: 100;
        }

        #hero-bg {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            filter: saturate(1.2) brightness(1.05);
            transition: transform var(--anim-slow), filter 0.8s;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            z-index: 5;
        }

        .hero-glass-panel {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            padding: 3.5rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            max-width: 90%;
            width: 540px;
            display: flex; flex-direction: column; align-items: center;
            transition: opacity var(--anim-os), transform var(--anim-os), visibility var(--anim-os);
            z-index: 20;
        }

        .hero-content-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding-top: env(safe-area-inset-top);
        }

        .fade-exit-up { 
            opacity: 0;
            transform: translateY(-150px) scale(0.9);
            visibility: hidden; 
        }

        /* 統一列表風格 */
        .uniform-list-container {
            display: flex;
            flex-direction: column;
            max-width: 1024px;
            margin: 0 auto;
            width: 100%;
            padding-bottom: 80px;
        }

        .list-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: 0.2s;
        }

        .list-item-row:active {
            background: rgba(16, 185, 129, 0.08);
        }

        #page-loader {
            position: fixed;
            inset: 0; background-color: #ffffff; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }

        .sync-spinning { animation: spin 1s linear infinite; }
        .sync-success { color: #10b981 !important; animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-window {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(60px); 
            -webkit-backdrop-filter: blur(60px);
            transform: translateY(110vh);
            z-index: 310;
            display: none; opacity: 0; overflow: hidden;
            transition: opacity var(--anim-os), transform var(--anim-os);
        }

        .modal-window.open { 
            display: flex; 
            flex-direction: column; 
            opacity: 1; 
            transform: translateY(0);
        }

        .window-header {
            padding: 0 12px;
            display: flex; 
            align-items: center;
            background: rgba(255, 255, 255, 0.4); 
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            height: 54px;
            gap: 8px;
            flex-shrink: 0;
            padding-top: env(safe-area-inset-top);
            box-sizing: content-box;
        }

        .tab-strip {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
            height: 100%;
            scrollbar-width: none;
        }
        .tab-strip::-webkit-scrollbar { display: none; }

        .browser-tab {
            height: 38px;
            min-width: 100px;
            max-width: 180px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 8px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            margin-bottom: -1px;
            border: 1px solid transparent;
            border-bottom: none;
        }

        @media (max-width: 640px) {
            .browser-tab {
                min-width: 45px;
                padding: 0 12px;
                justify-content: center;
            }
            .tab-title {
                display: none;
            }
        }

        .browser-tab.active {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.05);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
            z-index: 2;
        }

        .tab-title {
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #4b5563;
        }

        .tab-close {
            font-size: 10px;
            opacity: 0.4;
            transition: 0.2s;
            padding: 4px;
        }
        .tab-close:hover { opacity: 1; color: #ef4444; }
        
        .window-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px;
        }

        .toolbar-item {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #4b5563;
            font-size: 14px;
            transition: 0.3s;
            cursor: pointer;
            background: rgba(0,0,0,0.03);
        }
        .toolbar-item:hover { background: rgba(0,0,0,0.08); transform: scale(1.1); }
        .toolbar-item.pro-unlocked { color: #10b981; }

        .window-body { 
            flex: 1;
            width: 100%; 
            background: transparent; 
            position: relative; 
            overflow-y: auto;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .win-content-page {
            display: none;
            width: 100%;
            height: 100%;
        }
        .win-content-page.active { display: block; }

        .bottom-close-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        .btn-close-bottom {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .btn-close-bottom:active { transform: scale(0.9); background: rgba(239, 68, 68, 0.8); }

        #custom-alert {
            position: fixed;
            top: calc(100px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-200px);
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(30px);
            padding: 14px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); z-index: 2000;
            display: flex; align-items: center; gap: 12px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #custom-alert.show { transform: translateX(-50%) translateY(0); }

        #success-notification {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
            padding: 40px 60px;
            border-radius: 35px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 40px 100px rgba(0,0,0,0.15);
            z-index: 2100;
            display: flex; flex-direction: column; align-items: center;
            gap: 20px;
            opacity: 0; visibility: hidden;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        #success-notification.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

        #passcode-screen {
            position: fixed;
            inset: 0; background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(70px); -webkit-backdrop-filter: blur(70px);
            z-index: 1500; display: flex; flex-direction: column; align-items: center;
            justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.5s ease, visibility 0.5s;
            padding-bottom: env(safe-area-inset-bottom);
        }
        #passcode-screen.active { opacity: 1; visibility: visible; }
        .dots-container { display: flex; gap: 20px; margin-bottom: 60px; }
        .dot { width: 12px; height: 12px; border: 1.5px solid #1e293b; border-radius: 50%; transition: background 0.2s; }
        .dot.filled { background: #1e293b; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; width: 280px; }
        .key {
            width: 75px;
            height: 75px; border-radius: 50%; background: rgba(0,0,0,0.04);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="page-loader">
        <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-16 h-16 mb-4">
        <p class="text-xs tracking-[0.2em] text-gray-400 font-medium uppercase animate-pulse">正在與雲端同步數據...</p>
    </div>

    <div id="success-notification">
        <div class="w-20 h-20 rounded-full bg-emerald-500 text-white flex items-center justify-center text-4xl shadow-lg"><i class="fas fa-check"></i></div>
        <div class="text-center">
            <h2 class="text-xl font-bold text-gray-800 tracking-widest uppercase mb-1">驗證成功</h2>
            <p class="text-xs font-medium text-gray-500 uppercase tracking-[0.3em]">解鎖高級權限</p>
        </div>
    </div>

    <div id="passcode-screen">
        <div class="text-[#1e293b] text-[18px] font-semibold tracking-widest mb-5">輸入密碼</div>
        <div id="dots-container" class="dots-container">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="keypad">
            <div class="key" onclick="pressKey('1')"><span class="text-3xl text-[#1e293b]">1</span></div>
            <div class="key" onclick="pressKey('2')"><span class="text-3xl text-[#1e293b]">2</span><span class="text-[9px] font-bold text-[#1e293b]">ABC</span></div>
            <div class="key" onclick="pressKey('3')"><span class="text-3xl text-[#1e293b]">3</span><span class="text-[9px] font-bold text-[#1e293b]">DEF</span></div>
            <div class="key" onclick="pressKey('4')"><span class="text-3xl text-[#1e293b]">4</span><span class="text-[9px] font-bold text-[#1e293b]">GHI</span></div>
            <div class="key" onclick="pressKey('5')"><span class="text-3xl text-[#1e293b]">5</span><span class="text-[9px] font-bold text-[#1e293b]">JKL</span></div>
            <div class="key" onclick="pressKey('6')"><span class="text-3xl text-[#1e293b]">6</span><span class="text-[9px] font-bold text-[#1e293b]">MNO</span></div>
            <div class="key" onclick="pressKey('7')"><span class="text-3xl text-[#1e293b]">7</span><span class="text-[9px] font-bold text-[#1e293b]">PQRS</span></div>
            <div class="key" onclick="pressKey('8')"><span class="text-3xl text-[#1e293b]">8</span><span class="text-[9px] font-bold text-[#1e293b]">TUV</span></div>
            <div class="key" onclick="pressKey('9')"><span class="text-3xl text-[#1e293b]">9</span><span class="text-[9px] font-bold text-[#1e293b]">WXYZ</span></div>
            <div class="key invisible"></div>
            <div class="key" onclick="pressKey('0')"><span class="text-3xl text-[#1e293b]">0</span></div>
            <div class="key" onclick="deleteKey()"><span class="text-xl text-[#1e293b]"><i class="fas fa-backspace"></i></span></div>
        </div>
        <div class="mt-12 w-[280px] flex justify-end"><div class="text-[#1e293b] font-medium cursor-pointer" onclick="hidePasscodeScreen()">取消</div></div>
    </div>

    <div id="custom-alert">
        <i class="fas fa-info-circle text-emerald-500"></i>
        <span id="alert-text" class="text-xs font-bold text-gray-600 uppercase tracking-widest"></span>
    </div>

    <div id="main-browser-window" class="modal-window">
        <div class="window-header">
            <div id="browser-tab-strip" class="tab-strip"></div>
            <div class="window-toolbar">
                <div class="toolbar-item" onclick="openHomeFolder()"><i class="fas fa-th-list"></i></div>
                <div class="toolbar-item" onclick="manualRefresh()"><i id="win-cloud-icon" class="fas fa-cloud"></i></div>
                <div class="toolbar-item" id="win-pro-lock" onclick="showPasscodeScreen()"><i class="fas fa-lock"></i></div>
                <div class="w-[1px] h-4 bg-gray-300 mx-1"></div>
                <div class="toolbar-item" onclick="closeAllTabs()"><i class="fas fa-times"></i></div>
            </div>
        </div>
        <div id="browser-window-body" class="window-body"></div>
    </div>

    <section class="hero-full">
        <img id="hero-bg" src="">
        <div class="hero-overlay"></div>
        <div class="hero-content-wrapper text-center">
            <div id="hero-main-content" class="hero-glass-panel">
                <div class="mb-8 flex flex-col items-center gap-4">
                    <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="Lumina" class="h-14 w-14 drop-shadow-sm">
                    <div class="h-[1px] w-10 bg-emerald-500/20"></div>
                </div>
                <h1 id="hero-title" class="text-3xl md:text-4xl tracking-[0.3em] uppercase mb-2" style="font-family: 'Cinzel', serif;"></h1>
                <p id="hero-subtitle" class="text-xl md:text-xl font-bold tracking-[1em] mb-6 uppercase pl-[1em] opacity-80"></p>
                <div class="flex flex-col gap-4">
                    <button onclick="openHomeFolder()" class="glass-btn px-16 py-4 font-black rounded-full text-[10px] tracking-[0.5em] uppercase shadow-sm transition-all transform active:scale-95 bg-white/20 backdrop-blur-md border border-white/40">
                        BROWSE ALL
                    </button>
                    
                    <div class="flex items-center justify-center gap-2 mt-2">
                        <button onclick="manualRefresh()" class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 backdrop-blur-lg border border-white/30 text-emerald-600/80 hover:bg-white/20 transition-all active:scale-90">
                            <i id="hero-cloud-icon" class="fas fa-cloud"></i>
                        </button>
                        <button id="hero-pro-lock" onclick="showPasscodeScreen()" class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 backdrop-blur-lg border border-white/30 text-emerald-600/80 hover:bg-white/20 transition-all active:scale-90">
                            <i class="fas fa-lock"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const SPREADSHEET_ID = '1MeEEF8xVR2Sq-uqqshG-XLnf2hpeoElBNQTJnynP110';
        const FETCH_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=VOL2`;

        let hwList = [];
        let rawDataRows = [];
        let isSyncing = false;
        let openTabs = [];
        let activeTabId = null;
        let isProUnlocked = false; 
        let currentPasscode = "";
        let TARGET_PASSCODE = "666666";

        function checkAppleDevice() {
            const isApple = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) || /Macintosh/.test(navigator.userAgent);
            if (isApple) document.body.classList.add('is-ios');
        }

        async function loadSheetData(isManual = false) {
            if (isSyncing) return;
            isSyncing = true;
            const cloudIcons = [document.getElementById('hero-cloud-icon'), document.getElementById('win-cloud-icon')];
            if (isManual) cloudIcons.forEach(i => { if(i) i.className = 'fas fa-spinner sync-spinning'; });
            try {
                const response = await fetch(FETCH_URL);
                const data = await response.text();
                const rows = data.split('\n').map(row => {
                    const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    return matches ? matches.map(m => m.replace(/^"|"$/g, '')) : [];
                });
                rawDataRows = rows;
     
                const tempHW = new Set();
                rows.forEach(row => {
                    if (row[0] === 'PASSCODE') TARGET_PASSCODE = row[4] || TARGET_PASSCODE;
                    if (row[0] === 'HEROSECTION') {
                        if (row[1] === 'CONTENT_1') document.getElementById('hero-title').innerText = row[4];
                        if (row[1] === 'CONTENT_2') document.getElementById('hero-subtitle').innerText = row[4];
                        if (row[1] === 'PHOTO') document.getElementById('hero-bg').src = row[4];
                    } else if (row[0] && row[0].startsWith('HW')) tempHW.add(row[0]);
                });
                hwList = Array.from(tempHW).sort();
                if (isManual) {
                    cloudIcons.forEach(i => { if(i) i.className = 'fas fa-check sync-success'; });
                    setTimeout(() => { 
                        cloudIcons.forEach(i => { if(i) i.className = 'fas fa-cloud'; }); 
                        isSyncing = false; 
                    }, 2000);
                    if (activeTabId) {
                        const tab = openTabs.find(t => t.id === activeTabId);
                        if (tab && tab.type === 'HW') renderHWContent(tab.title, `content-${tab.id}`);
                        if (tab && tab.id === 'HOME_FOLDER') renderHomeFolder('content-HOME_FOLDER');
                    }
                } else {
                    setTimeout(() => {
                        document.getElementById('page-loader').style.opacity = '0';
                        setTimeout(() => { document.getElementById('page-loader').style.display = 'none'; isSyncing = false; }, 1000);
                    }, 800);
                }
            } catch (error) { isSyncing = false; }
        }

        function manualRefresh() { loadSheetData(true); }

        function openHomeFolder() { openTab("Browse ALL", "FOLDER"); }

        /* 修改：使用與內容頁一致的列表方式展示 HWXX 分類 */
        function renderHomeFolder(containerId) {
            const body = document.getElementById(containerId);
            body.innerHTML = '';
            
            const listWrapper = document.createElement('div');
            listWrapper.className = 'uniform-list-container';
            
            hwList.forEach(hw => {
                const row = document.createElement('div');
                row.className = 'list-item-row';
                row.onclick = () => openTab(hw, 'HW');
                row.innerHTML = `
                    <div class="flex items-center gap-5">
                        <div class="w-10 h-10 rounded-2xl bg-emerald-100 flex items-center justify-center text-emerald-600">
                            <i class="fas fa-layer-group text-sm"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[13px] font-black text-gray-800 tracking-widest uppercase">${hw}</span>
                            <span class="text-[9px] font-medium text-gray-400 tracking-wider uppercase">練習系列</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 text-emerald-500">
                        <span class="text-[10px] font-bold tracking-widest uppercase">ENTER</span>
                        <i class="fas fa-chevron-right text-[10px]"></i>
                    </div>
                `;
                listWrapper.appendChild(row);
            });
            
            body.appendChild(listWrapper);
        }

        function openTab(title, type, contentUrl = null) {
            const id = type === 'FOLDER' ? 'HOME_FOLDER' : type + "_" + title.replace(/\s+/g, '_');
            const existing = openTabs.find(t => t.id === id);
            if (existing) { switchTab(id); return; }

            const newTab = { id, title, type, contentUrl };
            openTabs.push(newTab);
            
            const body = document.getElementById('browser-window-body');
            const page = document.createElement('div');
            page.id = `page-${id}`;
            page.className = 'win-content-page';
            if (type === 'VID') {
                let embed = contentUrl.includes('watch?v=') ?
                contentUrl.replace('watch?v=', 'embed/') : contentUrl.replace('youtu.be/', 'youtube.com/embed/');
                page.innerHTML = `<iframe class="w-full h-full" src="${embed}${embed.includes('?') ? '&' : '?'}playsinline=1" frameborder="0" allowfullscreen></iframe>`;
            } else if (type === 'PIC') {
                page.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center p-4 bg-black/5 overflow-hidden"><img src="${contentUrl}" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl"><div class="bottom-close-container"><button class="btn-close-bottom" onclick="closeTab('${id}')">關閉內容</button></div></div>`;
            } else if (type === 'PDF') {
                page.innerHTML = `<div class="w-full h-full relative"><iframe src="${contentUrl}" class="w-full h-full" frameborder="0"></iframe><div class="bottom-close-container"><button class="btn-close-bottom" onclick="closeTab('${id}')">關閉 PDF</button></div></div>`;
            } else {
                page.innerHTML = `<div id="content-${id}" class="w-full h-full flex flex-col p-0 overflow-y-auto"></div>`;
            }
            body.appendChild(page);
            
            if (type === 'HW') renderHWContent(title, `content-${id}`);
            if (type === 'FOLDER') renderHomeFolder(`content-${id}`);
            
            renderTabs();
            switchTab(id);
            
            const win = document.getElementById('main-browser-window');
            win.style.display = 'flex';
            document.getElementById('hero-main-content').classList.add('fade-exit-up');
            setTimeout(() => { win.classList.add('open'); }, 80);
        }

        function renderTabs() {
            const strip = document.getElementById('browser-tab-strip');
            strip.innerHTML = '';
            openTabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = `browser-tab ${activeTabId === tab.id ? 'active' : ''}`;
                el.onclick = () => switchTab(tab.id);
                
                let iconClass = 'fa-file-alt text-emerald-500';
                if (tab.type === 'VID') iconClass = 'fa-play-circle text-red-500';
                if (tab.type === 'FOLDER') iconClass = 'fa-th-list text-emerald-500';
                if (tab.type === 'PIC') iconClass = 'fa-image text-blue-500';
                if (tab.type === 'PDF') iconClass = 'fa-file-pdf text-orange-500';

                el.innerHTML = `<i class="fas ${iconClass} text-[10px]"></i><span class="tab-title">${tab.title}</span><i class="fas fa-times tab-close" onclick="event.stopPropagation(); closeTab('${tab.id}')"></i>`;
                strip.appendChild(el);
            });
        }

        function switchTab(id) {
            activeTabId = id;
            document.querySelectorAll('.win-content-page').forEach(p => p.classList.remove('active'));
            const activePage = document.getElementById(`page-${id}`);
            if (activePage) activePage.classList.add('active');
            renderTabs();
        }

        function closeTab(id) {
            const index = openTabs.findIndex(t => t.id === id);
            if (index === -1) return;
            openTabs.splice(index, 1);
            const pageEl = document.getElementById(`page-${id}`);
            if (pageEl) pageEl.remove();
            if (openTabs.length === 0) {
                closeAllTabs();
            } else {
                if (activeTabId === id) switchTab(openTabs[Math.max(0, index - 1)].id);
                else renderTabs();
            }
        }

        function closeAllTabs() {
            openTabs = [];
            activeTabId = null;
            const win = document.getElementById('main-browser-window');
            win.classList.remove('open');
            document.getElementById('hero-main-content').classList.remove('fade-exit-up');
            setTimeout(() => { 
                win.style.display = 'none'; 
                document.getElementById('browser-window-body').innerHTML = '';
            }, 1200);
        }

        function renderHWContent(hwName, containerId) {
            const body = document.getElementById(containerId);
            body.innerHTML = ''; 
            const hwData = rawDataRows.filter(row => row[0] === hwName);
            if (!hwData.length) { body.innerHTML = `<div class="p-10 text-center opacity-50 uppercase tracking-widest text-xs">Waiting for Content Update</div>`; return; }

            const list = document.createElement('div');
            list.className = 'uniform-list-container';
            
            hwData.filter(row => row[1] === 'QUESTION').forEach((row, index) => {
                const subType = row[2];
                const fileUrl = row[4] || '';
                const title = subType === 'PIC' ? '查看圖片題目' : '查看 PDF 題目';
                const icon = subType === 'PIC' ? 'fa-image text-blue-500' : 'fa-file-pdf text-orange-500';
                
                const rowEl = document.createElement('div');
                rowEl.className = `list-item-row bg-emerald-50/20`;
                rowEl.onclick = () => { if (fileUrl) openTab(subType, subType, fileUrl); else showAlert('尚未配置檔案連結'); };
                rowEl.innerHTML = `
                    <div class="flex items-center gap-5">
                        <i class="fas ${icon} text-lg"></i>
                        <span class="text-[13px] font-extrabold text-gray-800 uppercase tracking-widest">${title}</span>
                    </div>
                    <div class="flex items-center gap-2 text-emerald-600">
                        <span class="text-[9px] font-bold uppercase tracking-widest">OPEN</span>
                        <i class="fas fa-chevron-right text-[10px]"></i>
                    </div>
                `;
                list.appendChild(rowEl);
            });
            
            hwData.filter(row => row[1] === 'VIDEOS').forEach((row, index) => {
                const tag = row[2] || 'UNIT';
                const isUnlocked = row[3] === 'ACTIVE' || isProUnlocked;
                const videoUrl = row[4] || '';
                const safeId = (hwName + tag).replace(/\s+/g, '');
                
                const rowEl = document.createElement('div');
                rowEl.className = `list-item-row`;
                const phonePlayIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="2" width="14" height="20" rx="3" stroke="currentColor" stroke-width="2"/><path d="M10 9L15 12L10 15V9Z" fill="currentColor"/><line x1="11" y1="19" x2="13" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
                rowEl.innerHTML = `
                    <div class="flex items-center gap-5">
                        <i class="fas fa-play-circle text-emerald-500/70 text-lg"></i>
                        <span class="text-[13px] font-bold text-gray-700 uppercase tracking-widest">${tag}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <button class="w-9 h-9 rounded-xl flex items-center justify-center transition-all ${isUnlocked ? 'text-emerald-600 hover:bg-emerald-50' : 'text-gray-300 cursor-not-allowed'}" id="ext-${safeId}">
                            ${isUnlocked ? phonePlayIcon : '<i class=\"fas fa-lock text-[11px]\"></i>'}
                        </button>
                        <button class="w-9 h-9 rounded-xl flex items-center justify-center transition-all ${isUnlocked ? 'bg-emerald-500 text-white shadow-md shadow-emerald-200 active:scale-90' : 'bg-gray-100 text-gray-300'}" id="int-${safeId}">
                            <i class="fas ${isUnlocked ? 'fa-play ml-0.5' : 'fa-lock'} text-[11px]"></i>
                        </button>
                    </div>
                `;
                list.appendChild(rowEl);
                setTimeout(() => {
                    const extBtn = document.getElementById(`ext-${safeId}`);
                    const intBtn = document.getElementById(`int-${safeId}`);
                    if (extBtn) extBtn.onclick = (e) => { e.stopPropagation(); if (isUnlocked && videoUrl) window.open(videoUrl, '_blank'); else showAlert('解鎖後即可觀看'); };
                    if (intBtn) intBtn.onclick = (e) => { e.stopPropagation(); if (isUnlocked && videoUrl) openTab(tag, 'VID', videoUrl); else showAlert('解鎖後即可觀看'); };
                }, 0);
            });
            body.appendChild(list);
        }

        function showPasscodeScreen() {
            if (isProUnlocked) { showAlert("高級權限已啟用"); return; }
            document.getElementById('passcode-screen').classList.add('active');
            currentPasscode = ""; updatePasscodeDots();
        }
        function hidePasscodeScreen() { document.getElementById('passcode-screen').classList.remove('active'); }
        function pressKey(num) {
            if (currentPasscode.length < 6) {
                currentPasscode += num;
                updatePasscodeDots();
                if (currentPasscode.length === 6) setTimeout(verifyPasscode, 300);
            }
        }
        function deleteKey() { if (currentPasscode.length > 0) { currentPasscode = currentPasscode.slice(0, -1); updatePasscodeDots(); } }
        function updatePasscodeDots() {
            const dots = document.getElementById('dots-container').children;
            for (let i = 0; i < dots.length; i++) dots[i].className = i < currentPasscode.length ? 'dot filled' : 'dot';
        }
        function verifyPasscode() {
            if (currentPasscode === TARGET_PASSCODE) {
                isProUnlocked = true;
                document.getElementById('success-notification').classList.add('show');
                setTimeout(() => document.getElementById('success-notification').classList.remove('show'), 2500);
                const locks = [document.getElementById('hero-pro-lock'), document.getElementById('win-pro-lock')];
                locks.forEach(l => { if (l) { l.classList.add('pro-unlocked'); l.innerHTML = '<i class=\"fas fa-unlock\"></i>'; } });
                hidePasscodeScreen();
                if (activeTabId && activeTabId.startsWith('HW')) {
                    const tab = openTabs.find(t => t.id === activeTabId);
                    renderHWContent(tab.title, `content-${tab.id}`);
                }
            } else {
                const dots = document.getElementById('dots-container').children;
                for (let dot of dots) dot.classList.add('animate-shake', 'border-red-500');
                setTimeout(() => { currentPasscode = ""; updatePasscodeDots(); for (let dot of dots) dot.classList.remove('animate-shake', 'border-red-500'); }, 500);
            }
        }

        function showAlert(text) { const alert = document.getElementById('custom-alert'); document.getElementById('alert-text').innerText = text; alert.classList.add('show'); setTimeout(() => alert.classList.remove('show'), 3000); }

        document.addEventListener('DOMContentLoaded', () => {
            checkAppleDevice();
            loadSheetData(false);
        });
    </script>
</body>
</html>
