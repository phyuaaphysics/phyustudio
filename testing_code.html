<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumina Studio</title>

    <!-- iOS PWA 狀態列修正 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 jsQR 解析庫 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js">
    </script>
    <!-- 引入日文字型 (Noto Sans JP) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');

        :root {
            --glacier-deep: #0f172a;
            --glacier-primary: #0284c7;
            --glacier-ice: #38bdf8;
            --glacier-bg: #eef2f6;
            --glacier-glass: rgba(224, 242, 254, 0.85);
            --glacier-nav-glass: rgba(255, 255, 255, 0.75);
        }

        /* ダークモード時の変数定義 */
        body.dark-mode {
            --glacier-deep: #f8fafc;
            --glacier-primary: #38bdf8;
            --glacier-ice: #0284c7;
            --glacier-bg: #090d16;
            --glacier-glass: rgba(15, 23, 42, 0.85);
            --glacier-nav-glass: rgba(15, 23, 42, 0.75);
            color: #cbd5e1;
        }

        /* テーマ切り替え用のトグルスイッチアニメーション */
        #dark-mode-toggle:checked+.theme-track {
            background-color: #1e293b;
            border-color: #0f172a;
        }
        #dark-mode-toggle:checked+.theme-track .theme-stars {
            opacity: 1 !important;
        }
        #dark-mode-toggle:checked+.theme-track .theme-knob {
            transform: translateX(0px) !important;
        }
        #dark-mode-toggle:checked+.theme-track .theme-sun {
            transform: scale(0) !important;
        }
        #dark-mode-toggle:checked+.theme-track .theme-moon {
            transform: scale(1) !important;
        }
        #dark-mode-toggle:checked+.theme-track .theme-cloud {
            transform: translateX(48px) !important;
            opacity: 0 !important;
        }

        /* スムーズなテーマ移行用トランジション */
        body,
        .logo-bar,
        .filter-bar,
        .hero-container-framed,
        #page-content,
        .dock-nav,
        .filter-capsule,
        .nav-btn,
        .sync-btn {
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, backdrop-filter 0.4s ease, -webkit-backdrop-filter 0.4s ease;
        }

        /* ダークモード用スタイル修正 */
        body.dark-mode .hero-container-framed {
            background-color: #0f172a;
            border-color: rgba(255, 255, 255, 0.08);
        }

        body.dark-mode .hero-gradient-overlay {
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0) 0%, rgba(15, 23, 42, 0.3) 40%, rgba(9, 13, 22, 0.95) 95%);
        }

        body.dark-mode .filter-capsule {
            background: rgba(30, 41, 59, 0.5);
            border-color: rgba(56, 189, 248, 0.1);
            color: #cbd5e1;
        }

        body.dark-mode .filter-capsule.active {
            background: var(--glacier-primary);
            color: #fff;
            border-color: var(--glacier-primary);
        }

        body.dark-mode .nav-btn {
            background: rgba(30, 41, 59, 0.95);
            border-color: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode .sync-btn {
            background: rgba(15, 23, 42, 0.4);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .dock-nav {
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .logo-bar .text-sky-800 {
            color: #38bdf8 !important;
        }

        body.dark-mode .logo-bar .bg-white {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }

        html {
            scroll-behavior: smooth;
            height: 100%;
            overflow: hidden;
        }

        body {
            /* 日式風格字型優先 */
            font-family: 'Noto Sans JP', 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--glacier-bg);
            color: #334155;
            -webkit-tap-highlight-color: transparent;
            height: 100%;
            overflow-y: auto;
            padding-top: 0;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .logo-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 120;
            background-color: var(--glacier-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(14, 165, 233, 0.1);
            padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
            padding-bottom: 12px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #main-logo {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: left center;
            will-change: transform;
        }

        .scrolled #main-logo {
            transform: scale(0.75);
        }

        .filter-bar {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 68px);
            left: 0;
            width: 100%;
            z-index: 110;
            background-color: var(--glacier-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 0;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-bottom: 1px solid rgba(14, 165, 233, 0.05);
        }

        .filter-bar.collapsed {
            transform: translateY(-56px);
            opacity: 0.9;
        }

        .filter-capsule {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(14, 165, 233, 0.1);
            color: var(--glacier-deep);
        }

        .filter-capsule.active {
            background: var(--glacier-primary);
            color: #fff;
            border-color: var(--glacier-primary);
        }

        .filter-toggle-trigger {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: var(--glacier-glass);
            backdrop-filter: blur(20px);
            border-radius: 0 0 14px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(14, 165, 233, 0.05);
            border-top: none;
            color: var(--glacier-primary);
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .filter-bar.collapsed .filter-toggle-trigger i {
            transform: rotate(180deg);
        }

        /* 検索パネル関連スタイル */
        #search-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.4s ease;
        }
        #search-panel.open {
            max-height: 80px;
            padding-bottom: 12px;
        }

        /* メインコンテンツ配置 */
        #page-content {
            padding-top: calc(env(safe-area-inset-top, 0px) + 130px);
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
        }

        .slider-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 6px;
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s, transform 0.2s;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .slider-wrapper:hover .nav-btn {
            opacity: 1;
        }
        .nav-btn.prev {
            left: -12px;
        }
        .nav-btn.next {
            right: -12px;
        }

        .slider-item {
            scroll-snap-align: start;
            flex: 0 0 auto;
        }

        .poster-card {
            aspect-ratio: 2/3;
            border-radius: 6px;
            overflow: hidden;
            background: #cbd5e1;
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 12px -4px rgba(15, 23, 42, 0.05);
            will-change: transform;
        }

        .poster-card:active {
            transform: scale(0.94);
            filter: brightness(0.9);
        }

        /* 網格緊密無圓角、無間隙覆寫樣式 */
        .grid-tight-pack .poster-card {
            border-radius: 0px !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* ===== 全新 Hero 容器設計 ===== */
        .hero-container-framed {
            position: relative;
            width: 100%;
            height: 70vh;
            min-height: 500px;
            max-height: 800px;
            border-radius: 28px;
            overflow: hidden;
            background: linear-gradient(135deg, #0c1a2e 0%, #1a2a4a 40%, #0f2847 100%);
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            isolation: isolate;
        }

        /* Hero 背景層 - 動態粒子與光暈 */
        .hero-bg-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
        }

        /* 粒子容器 */
        .hero-particles {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.15);
            pointer-events: none;
            animation: floatParticle var(--duration, 8s) ease-in-out infinite alternate;
        }

        @keyframes floatParticle {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            100% {
                transform: translate(var(--tx, 40px), var(--ty, -30px)) scale(1.6);
                opacity: 0.9;
            }
        }

        /* 光暈球體 */
        .hero-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 1;
        }

        .hero-glow-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25), transparent 70%);
            top: -100px;
            right: -100px;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        .hero-glow-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2), transparent 70%);
            bottom: -80px;
            left: -80px;
            animation: pulseGlow 8s ease-in-out infinite alternate-reverse;
        }

        .hero-glow-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.12), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* 背景圖片 (輕柔覆蓋) */
        .hero-bg-image {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0.3;
            object-fit: cover;
            object-position: center 30%;
            mix-blend-mode: overlay;
        }

        .hero-gradient-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: linear-gradient(to bottom,
                    rgba(12, 26, 46, 0.2) 0%,
                    rgba(12, 26, 46, 0.5) 40%,
                    rgba(12, 26, 46, 0.92) 100%);
            pointer-events: none;
        }

        /* Hero 內容層 */
        .hero-content {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 40px 32px 48px;
            text-align: center;
        }

        /* 歡迎訊息 - 更精緻 */
        .hero-welcome {
            margin-bottom: 12px;
        }

        .hero-welcome .greeting {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .hero-welcome .username {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
        }

        @media (min-width: 768px) {
            .hero-welcome .username {
                font-size: 3rem;
            }
            .hero-welcome .greeting {
                font-size: 1.1rem;
            }
        }

        /* 標語 */
        .hero-tagline {
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* 服務卡片群組 - 更精緻 */
        .session-card-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }

        .session-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            min-width: 100px;
            flex: 1 1 0;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* 卡片內部光暈 */
        .session-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.06), transparent 70%);
            pointer-events: none;
            transition: opacity 0.4s;
            opacity: 0;
        }

        .session-card:hover::before {
            opacity: 1;
        }

        .session-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.2);
        }

        .session-card:active {
            transform: scale(0.94);
            transition-duration: 0.08s;
        }

        .session-card i {
            font-size: 1.6rem;
            opacity: 0.8;
            transition: transform 0.3s;
        }

        .session-card:hover i {
            transform: scale(1.1) translateY(-2px);
        }

        .session-card .card-title {
            font-weight: 400;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            line-height: 1.2;
        }

        .session-card .card-sub {
            font-size: 0.55rem;
            opacity: 0.4;
            font-weight: 300;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        @media (max-width: 640px) {
            .hero-container-framed {
                height: 60vh;
                min-height: 420px;
                border-radius: 0;
            }
            .session-card {
                padding: 14px 10px;
                min-width: 70px;
                flex: 1 1 30%;
            }
            .session-card i {
                font-size: 1.3rem;
            }
            .session-card .card-title {
                font-size: 0.7rem;
            }
            .session-card .card-sub {
                font-size: 0.5rem;
            }
            .hero-content {
                padding: 24px 16px 32px;
            }
            .hero-welcome .username {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 768px) {
            .dock-wrapper {
                width: 92%;
                max-width: 400px;
            }
            #page-content {
                padding-top: calc(env(safe-area-inset-top, 0px) + 120px);
            }
            .nav-btn {
                display: none !important;
            }
        }

        /* 暗色模式卡片微調 */
        body.dark-mode .session-card {
            background: rgba(30, 41, 59, 0.25);
            border-color: rgba(255, 255, 255, 0.05);
        }
        body.dark-mode .session-card:hover {
            background: rgba(30, 41, 59, 0.4);
            border-color: rgba(255, 255, 255, 0.12);
        }
        body.dark-mode .hero-container-framed {
            background: linear-gradient(135deg, #0a0f1f 0%, #141d33 40%, #0a1a2e 100%);
        }

        .section-hidden {
            display: none !important;
        }

        .dock-wrapper {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
            width: auto;
            min-width: 340px;
        }

        .dock-wrapper.collapsed {
            transform: translateX(-50%) translateY(200px);
            opacity: 0;
        }

        .dock-nav {
            background-color: var(--glacier-nav-glass);
            backdrop-filter: blur(28px) saturate(210%);
            -webkit-backdrop-filter: blur(28px) saturate(210%);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            padding: 12px 14px;
            border-radius: 42px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .dock-toggle-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            transition: color 0.3s;
        }

        .dock-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #94a3b8;
            transition: all 0.3s;
            min-width: 58px;
        }

        .dock-item i {
            font-size: 1.6rem;
        }
        .dock-item span {
            font-size: 9px;
            font-weight: 500;
            opacity: 0.7;
        }
        .dock-item.active {
            color: var(--glacier-primary);
        }

        .dock-trigger-bar {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 5px;
            background: rgba(15, 23, 42, 0.2);
            border-radius: 10px;
            z-index: 199;
            cursor: pointer;
            display: none;
        }
        .dock-wrapper.collapsed+.dock-trigger-bar {
            display: block;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--glacier-deep);
            margin-bottom: 8px;
        }

        .sync-btn {
            display: none;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            font-size: 12px;
            color: var(--glacier-primary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        @keyframes fadeRise {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-rise {
            opacity: 0;
            animation: fadeRise 1.1s cubic-bezier(0.34, 1.3, 0.64, 1) forwards;
            animation-delay: calc(var(--row-m) * 0.08s);
        }
        @media (min-width: 768px) {
            .animate-fade-rise {
                animation-delay: calc(var(--row-d) * 0.08s);
            }
        }

        @keyframes qr-scan-line {
            0% {
                transform: translateY(-130px);
            }
            50% {
                transform: translateY(130px);
            }
            100% {
                transform: translateY(-130px);
            }
        }
    </style>
</head>
<body class="pb-40 hide-scrollbar">

    <header id="header-root">
        <div class="logo-bar px-6" id="logo-nav-bar">
            <div class="max-w-screen-2xl mx-auto flex items-center justify-between">
                <div class="cursor-pointer" onclick="scrollToHome()" id="main-logo">
                    <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="Lumina" class="h-12 w-auto">
                </div>

                <div class="flex items-center gap-4 md:gap-6">
                    <div class="flex items-center">
                        <label class="relative inline-flex items-center cursor-pointer select-none scale-90 md:scale-100">
                            <input type="checkbox" id="dark-mode-toggle" class="sr-only" onchange="toggleTheme(this.checked)">
                            <div class="theme-track w-[72px] h-[38px] bg-[#93c5fd] rounded-full relative transition-all duration-500 overflow-hidden shadow-inner border-2 border-[#60a5fa]">
                                <div class="theme-stars absolute inset-0 opacity-0 transition-opacity duration-500 pointer-events-none">

    <script>
        // 安全 LocalStorage 沙盒防禦封裝物件
        const storage = {
            getItem(key) {
                try {
                    return localStorage.getItem(key);
                } catch (e) {
                    console.warn("Storage read blocked:", e);
                    return null;
                }
            },
            setItem(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (e) {
                    console.warn("Storage write blocked:", e);
                }
            },
            removeItem(key) {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    console.warn("Storage remove blocked:", e);
                }
            }
        };

        // 讀取使用者名稱並顯示
        (function displayUsername() {
            const name = storage.getItem('user_real_name');
            const displayEl = document.getElementById('username-display');
            if (displayEl) {
                displayEl.textContent = name || '訪客';
            }
        })();

        // ===== 粒子生成器 =====
        (function createParticles() {
            const container = document.getElementById('hero-particles');
            if (!container) return;
            const count = 35;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = 4 + Math.random() * 20;
                const duration = 6 + Math.random() * 10;
                const tx = (Math.random() - 0.5) * 120;
                const ty = (Math.random() - 0.5) * 100;
                p.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        top: ${Math.random() * 100}%;
                        left: ${Math.random() * 100}%;
                        --duration: ${duration}s;
                        --tx: ${tx}px;
                        --ty: ${ty}px;
                        animation-delay: ${Math.random() * 5}s;
                        background: rgba(56, 189, 248, ${0.05 + Math.random() * 0.12});
                        border: 1px solid rgba(56, 189, 248, ${0.03 + Math.random() * 0.06});
                    `;
                container.appendChild(p);
            }
        })();

        // Google Sheet CSV URL (針對 FRONT 分頁)
        const SPREADSHEET_ID = '1Xfl7-SvKai2j6rg1ZnICJFENaLOSurD0Tg_OIO_PTGU';
        const SHEET_CSV_URL =
            `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=966779417`;

        let rawData = [];
        let lastScrollY = window.scrollY;

        let qrStream = null;
        let qrAnimationId = null;

        let currentFilter = 'all';
        let searchQuery = '';
        let isGridView = false;

        function toggleTheme(isDark) {
            if (isDark) {
                document.body.classList.add('dark-mode');
                storage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                storage.setItem('theme', 'light');
            }
        }

        (function() {
            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem('theme');
            } catch (e) {
                console.warn("Theme storage access denied", e);
            }
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);

            if (isDark) {
                document.body.classList.add('dark-mode');
                document.addEventListener('DOMContentLoaded', () => {
                    const toggleInput = document.getElementById('dark-mode-toggle');
                    if (toggleInput) toggleInput.checked = true;
                });
            }
        })();

        async function initData() {
            const cachedVer = storage.getItem('lumina_data_ver');
            const cachedData = storage.getItem('lumina_data_payload');
            let hasRenderedCache = false;

            if (cachedData) {
                try {
                    rawData = JSON.parse(cachedData);
                    if (rawData && rawData.length > 0) {
                        console.log("第一瞬載入：已從 LocalStorage 恢復快取數據，版本號:", cachedVer);
                        renderFilters();
                        renderContent();
                        hasRenderedCache = true;
                    }
                } catch (jsonErr) {
                    console.warn("LocalStorage 快取受損，清理重設:", jsonErr);
                    storage.removeItem('lumina_data_ver');
                    storage.removeItem('lumina_data_payload');
                }
            }

            try {
                let csvText = '';
                let response;

                try {
                    response = await fetch(`${SHEET_CSV_URL}&cachebust=${Date.now()}&t=${Date.now()}`);
                    csvText = await response.text();

                    if (csvText.trim().startsWith('<!DOCTYPE html>') || csvText.trim().startsWith('<html')) {
                        throw new Error("返回格式非 CSV (可能是 GID 無效或需要權限設定)");
                    }
                } catch (firstErr) {
                    console.warn("標準 GID 導出失敗，啟動備用分頁名稱解析器 (FRONT):", firstErr);

                    const fallbackUrl =
                        `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=FRONT&cachebust=${Date.now()}`;
                    response = await fetch(fallbackUrl);
                    csvText = await response.text();

                    if (csvText.trim().startsWith('<!DOCTYPE html>') || csvText.trim().startsWith('<html')) {
                        throw new Error("備用管道仍返回網頁 HTML (請確定試算表權限已設定為『知道連結的任何人均可檢視』)");
                    }
                }

                const lines = parseCSVRows(csvText);

                if (lines.length > 0) {
                    const firstRow = lines[0];
                    if (firstRow[0] && firstRow[0].toLowerCase() === 'ver') {
                        const currentOnlineVer = firstRow[1] || '';

                        if (currentOnlineVer !== cachedVer || !hasRenderedCache) {
                            console.log("偵測到線上版本改變或無快取，正在背景重新匯入最新數據...", "舊版本:", cachedVer, "新版本:",
                                currentOnlineVer);
                            rawData = processRawRows(lines);

                            storage.setItem('lumina_data_ver', currentOnlineVer);
                            storage.setItem('lumina_data_payload', JSON.stringify(rawData));

                            renderFilters();
                            renderContent();
                        } else {
                            console.log("背景版本檢查完成：線上版本與快取一致 (", cachedVer, ")，無須更新。");
                        }
                    } else {
                        rawData = processRawRows(lines);
                        renderFilters();
                        renderContent();
                    }
                }
            } catch (error) {
                console.error("背景同步失敗:", error);
                if (!hasRenderedCache) {
                    document.getElementById('main-content-area').innerHTML =
                        `<div class="loader">載入失敗，請確認試算表分享權限並保持網路連線。</div>`;
                }
            }
        }

        async function manualSync() {
            console.warn("manualSync 已不再使用");
        }

        function parseCSVRows(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i + 1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"';
                        i++; } else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') {
                lines.push(row);
            }
            return lines;
        }

        function processRawRows(lines) {
            return lines
                .filter((row, idx) => {
                    if (idx === 0) return false;
                    return row[1] && row[0] !== 'ver' && row[0] !== 'filter';
                })
                .map(row => {
                    return {
                        filter: (row[0] || '').trim(),
                        section: (row[1] || '').trim(),
                        order: parseInt(row[2]) || 0,
                        tag: (row[3] || '').trim(),
                        img: (row[4] || '').trim(),
                        url: (row[5] || '').trim(),
                        gridOrder: parseInt(row[6]) || 0
                    };
                });
        }

        function renderFilters() {
            const filters = ['all', ...new Set(rawData.map(d => d.filter).filter(f => f))];
            const container = document.getElementById('filter-container');
            container.innerHTML = filters.map(f => `
                    <button class="filter-capsule ${f === currentFilter ? 'active' : ''}" 
                            data-filter="${f}" 
                            onclick="setFilter('${f}')">
                        ${f === 'all' ? '全部' : f}
                    </button>
                `).join('');
        }

        function toggleGridView() {
            isGridView = !isGridView;
            const btn = document.getElementById('grid-view-toggle');
            if (isGridView) {
                btn.classList.add('text-sky-500');
                btn.classList.remove('opacity-60');
            } else {
                btn.classList.remove('text-sky-500');
                btn.classList.add('opacity-60');
            }
            renderContent();
        }

        function renderContent() {
            const mainArea = document.getElementById('main-content-area');
            mainArea.innerHTML = '';

            const heroSection = document.getElementById('hero-section');
            const archiveSection = document.getElementById('sec-archive');

            let processedItems = [...rawData];

            if (currentFilter !== 'all') {
                processedItems = processedItems.filter(item => item.filter === currentFilter);
            }

            if (searchQuery.trim() !== '') {
                const query = searchQuery.toLowerCase().trim();
                processedItems = processedItems.filter(item => {
                    return item.tag && item.tag.toLowerCase().includes(query);
                });
            }

            if (isGridView) {
                processedItems.sort((a, b) => a.gridOrder - b.gridOrder);

                heroSection.classList.add('section-hidden');
                archiveSection.classList.add('section-hidden');

                if (processedItems.length === 0) {
                    mainArea.innerHTML = `<div class="loader">找不到符合該標籤的相關卡片。</div>`;
                    return;
                }

                const gridHtml = `
                        <section class="max-w-screen-2xl mx-auto py-4">
                            <div class="grid grid-cols-3 md:grid-cols-6 gap-0 grid-tight-pack">
                                ${processedItems.map((item, index) => {
                                    const rowMobile = Math.floor(index / 3);
                                    const rowDesktop = Math.floor(index / 6);
                                    return `
                                    <div class="cursor-pointer animate-fade-rise" style="--row-m: ${rowMobile}; --row-d: ${rowDesktop};" onclick="handleNavigation('${item.url}')">
                                        <div class="poster-card" title="Tags: ${item.tag || '無'}">
                                            <img src="${item.img}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                                        </div>
                                    </div>
                                    `;
                                }).join('')}
                            </div>
                        </section>
                    `;
                mainArea.innerHTML = gridHtml;

            } else {
                if (currentFilter === 'all') {
                    heroSection.classList.remove('section-hidden');
                    archiveSection.classList.remove('section-hidden');
                } else {
                    heroSection.classList.add('section-hidden');
                    archiveSection.classList.add('section-hidden');
                }

                const sections = [...new Set(rawData.map(d => d.section))];
                let hasVisibleCards = false;

                sections.forEach(secName => {
                    let itemsInSec = rawData
                        .filter(d => d.section === secName)
                        .sort((a, b) => a.order - b.order);

                    if (currentFilter !== 'all') {
                        itemsInSec = itemsInSec.filter(item => item.filter === currentFilter);
                    }

                    if (searchQuery.trim() !== '') {
                        const query = searchQuery.toLowerCase().trim();
                        itemsInSec = itemsInSec.filter(item => {
                            return item.tag && item.tag.toLowerCase().includes(query);
                        });
                    }

                    if (itemsInSec.length === 0) return;
                    hasVisibleCards = true;

                    const filterTag = itemsInSec[0].filter;
                    const sectionId = `sec-${Math.random().toString(36).substr(2, 9)}`;
                    const sliderId = `slider-${Math.random().toString(36).substr(2, 9)}`;

                    const sectionHtml = `
                            <section id="${sectionId}" data-group="${filterTag}" class="dynamic-section">
                                <h2 class="section-title">${secName}</h2>
                                <div class="slider-wrapper">
                                    <button class="nav-btn prev" onclick="scrollSlider('${sliderId}', -400)">
                                        <i class="fas fa-chevron-left text-xs text-slate-400"></i>
                                    </button>
                                    <div class="slider-container hide-scrollbar" id="${sliderId}">
                                        ${itemsInSec.map(item => `
                                            <div class="slider-item w-32 md:w-56" onclick="handleNavigation('${item.url}')">
                                                <div class="poster-card" title="Tags: ${item.tag || '無'}">
                                                    <img src="${item.img}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=No+Image'">
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <button class="nav-btn next" onclick="scrollSlider('${sliderId}', 400)">
                                        <i class="fas fa-chevron-right text-xs text-slate-400"></i>
                                    </button>
                                </div>
                            </section>
                        `;
                    mainArea.insertAdjacentHTML('beforeend', sectionHtml);
                });

                if (!hasVisibleCards) {
                    mainArea.innerHTML = `<div class="loader">找不到符合該標籤的相關卡片。</div>`;
                }
            }
        }

        function toggleSearchInput() {
            const panel = document.getElementById('search-panel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                document.getElementById('tag-search-input').focus();
            } else {
                clearSearch();
            }
        }

        function handleSearch(val) {
            searchQuery = val;
            renderContent();
        }

        function clearSearch() {
            const input = document.getElementById('tag-search-input');
            if (input) input.value = '';
            searchQuery = '';
            renderContent();
        }

        function toggleDock() { document.getElementById('dock-nav-wrapper').classList.toggle('collapsed'); }

        function toggleFilter() {
            const bar = document.getElementById('filter-bar');
            bar.classList.toggle('collapsed');
        }

        function scrollSlider(id, offset) {
            const el = document.getElementById(id);
            if (el) el.scrollBy({ left: offset, behavior: 'smooth' });
        }

        function scrollToHome() {
            setFilter('all');
            clearSearch();
            if (isGridView) {
                toggleGridView();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleNavigation(url) {
            if (!url || url === '#' || url === 'no link' || url === 'undefined') return;
            window.location.href = url;
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            const buttons = document.querySelectorAll('.filter-capsule');
            buttons.forEach(btn => {
                if (btn.dataset.filter === filterType) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const heroSection = document.getElementById('hero-section');
            const archiveSection = document.getElementById('sec-archive');

            if (!isGridView) {
                if (filterType === 'all') {
                    heroSection.classList.remove('section-hidden');
                    archiveSection.classList.remove('section-hidden');
                } else {
                    heroSection.classList.add('section-hidden');
                    archiveSection.classList.add('section-hidden');
                }
            }
            renderContent();
        }

        async function openQRScanner() {
            const modal = document.getElementById('qr-scanner-modal');
            const video = document.getElementById('qr-video');
            const errMsg = document.getElementById('qr-error-msg');

            errMsg.classList.add('hidden');
            errMsg.innerText = "";
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                qrStream = stream;
                video.srcObject = stream;
                video.setAttribute("playsinline", true);

                try {
                    await video.play();
                } catch (playErr) {
                    console.warn("Video play interrupted, attempting fallback options", playErr);
                }

                qrAnimationId = requestAnimationFrame(tickQRScanner);
            } catch (err) {
                console.error("Camera access failed:", err);
                errMsg.innerText =
                    "相機不可用（可能被瀏覽器安全政策限制、未授權， or 未在 HTTPS 環境下）。請使用上方「選擇照片 / 上傳條碼圖」按碼。";
                errMsg.classList.remove('hidden');
            }
        }

        function closeQRScanner() {
            const modal = document.getElementById('qr-scanner-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.classList.remove('opacity-100');

            if (qrStream) {
                qrStream.getTracks().forEach(track => track.stop());
                qrStream = null;
            }
            if (qrAnimationId) {
                cancelAnimationFrame(qrAnimationId);
                qrAnimationId = null;
            }

            document.getElementById('qr-file-input').value = "";
        }

        function tickQRScanner() {
            const video = document.getElementById('qr-video');
            const canvasElement = document.getElementById('qr-canvas');
            if (!video || !canvasElement) return;
            const canvas = canvasElement.getContext('2d', { willReadFrequently: true });
            if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);

                try {
                    const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "attemptBoth",
                    });
                    if (code) {
                        let resultText = code.data.trim();
                        let finalUrl = '';

                        if (resultText.startsWith('http://') || resultText.startsWith('https://')) {
                            finalUrl = resultText;
                        } else {
                            if (resultText.startsWith('/')) {
                                resultText = resultText.substring(1);
                            }
                            finalUrl = `http://phyuaaphysics.github.io/phyustudio/${resultText}`;
                        }

                        closeQRScanner();
                        window.location.href = finalUrl;
                        return;
                    }
                } catch (e) {
                    console.error("Error drawing or extracting canvas pixels", e);
                }
            }
            if (qrStream) {
                qrAnimationId = requestAnimationFrame(tickQRScanner);
            }
        }

        function handleQRFile(input) {
            const file = input.files[0];
            if (!file) return;

            const errMsg = document.getElementById('qr-error-msg');
            errMsg.classList.add('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvasElement = document.getElementById('qr-canvas');
                    const canvas = canvasElement.getContext('2d');
                    canvasElement.width = img.width;
                    canvasElement.height = img.height;
                    canvas.drawImage(img, 0, 0);
                    try {
                        const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height, {
                            inversionAttempts: "attemptBoth",
                        });
                        if (code) {
                            let resultText = code.data.trim();
                            let finalUrl = '';
                            if (resultText.startsWith('http://') || resultText.startsWith('https://')) {
                                finalUrl = resultText;
                            } else {
                                if (resultText.startsWith('/')) {
                                    resultText = resultText.substring(1);
                                }
                                finalUrl = `http://phyuaaphysics.github.io/phyustudio/${resultText}`;
                            }
                            closeQRScanner();
                            window.location.href = finalUrl;
                        } else {
                            errMsg.innerText = "無法解析此圖中的條碼。請確認照片清晰無陰影，條碼居中未變形。";
                            errMsg.classList.remove('hidden');
                        }
                    } catch (err) {
                        console.error("Manual QR decode error:", err);
                        errMsg.innerText = "相片讀取失敗，請重新嘗試。";
                        errMsg.classList.remove('hidden');
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY || document.documentElement.scrollTop;
            if (currentScrollY > 30) document.body.classList.add('scrolled');
            else document.body.classList.remove('scrolled');

            const filterBar = document.getElementById('filter-bar');
            if (currentScrollY > lastScrollY && currentScrollY > 150) {
                if (!filterBar.classList.contains('collapsed')) filterBar.classList.add('collapsed');
            } else if (currentScrollY < lastScrollY) {
                if (filterBar.classList.contains('collapsed')) filterBar.classList.remove('collapsed');
            }
            lastScrollY = currentScrollY;
        }, { passive: true });

        document.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
