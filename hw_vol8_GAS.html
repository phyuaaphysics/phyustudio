<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fundamental Exercise - Lumina Studio</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lumina">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        :root {
            --mint-deep: #064e3b;
            --mint-primary: #10b981; 
            --mint-bg: #f0fdf4;
            --anim-os: 1.2s cubic-bezier(0.25, 1, 0.3, 1); 
            --anim-slow: 1.6s cubic-bezier(0.4, 0, 0.2, 1);
            --anim-item: 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        html, body { 
            height: 100dvh;
            width: 100%;
            margin: 0;
            overflow: hidden; 
            position: fixed; 
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .hero-full {
            position: absolute;
            inset: 0; 
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            z-index: 100;
        }

        #hero-bg {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            filter: saturate(1.2) brightness(1.05);
            transition: transform var(--anim-slow), filter 0.8s;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            z-index: 5;
        }

        .hero-glass-panel {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            padding: 3.5rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            max-width: 90%;
            width: 540px;
            display: flex; flex-direction: column; align-items: center;
            transition: opacity var(--anim-os), transform var(--anim-os), visibility var(--anim-os);
            z-index: 20;
        }

        .hero-content-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding-top: env(safe-area-inset-top);
        }

        .fade-exit-up { 
            opacity: 0;
            transform: translateY(-150px) scale(0.9);
            visibility: hidden; 
        }

        .uniform-list-container {
            display: flex;
            flex-direction: column;
            max-width: 1024px;
            margin: 0 auto;
            width: 100%;
            padding-bottom: 80px;
        }

        .list-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: 0.2s;
        }

        .list-item-row:active {
            background: rgba(16, 185, 129, 0.08);
        }

        .list-item-row.is-locked {
            opacity: 0.6;
            cursor: not-allowed !important;
            background: rgba(241, 245, 249, 0.5);
        }

        .resource-drawer {
            max-height: 0;
            overflow: hidden;
            background: #f1f5f9;
            transition: max-height 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            opacity: 0;
            position: relative;
        }
        .resource-drawer.expanded {
            max-height: 2000px;
            opacity: 1;
        }
        .resource-content-container {
            width: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .resource-iframe {
            width: 100%;
            height: 70vh;
            border: none;
        }
        .resource-img {
            width: 100%;
            max-height: 85vh;
            object-fit: contain;
        }
        .resource-collapse-bar {
            width: 100%;
            height: 48px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-top: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .resource-collapse-bar:hover { background: #0f172a;
        }
        .resource-collapse-bar span {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
        }
        .resource-collapse-bar i {
            font-size: 10px;
            color: #10b981;
            margin-right: 8px;
            animation: bounceUp 1.5s infinite;
        }

        @keyframes bounceUp {
            0%, 100% { transform: translateY(0);
            }
            50% { transform: translateY(-3px);
            }
        }

        #page-loader {
            position: fixed;
            inset: 0; background-color: #ffffff; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }

        #shutdown-overlay {
            position: fixed;
            inset: 0; background-color: #000; z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.8s ease;
        }

        .sync-spinning { animation: spin 1s linear infinite;
        }
        .sync-success { color: #10b981 !important; animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(3600deg);
        } }
        @keyframes bounceIn {
            0% { transform: scale(0.5);
            opacity: 0; }
            70% { transform: scale(1.2); opacity: 1;
            }
            100% { transform: scale(1); opacity: 1;
            }
        }

        .modal-window {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(60px); 
            -webkit-backdrop-filter: blur(60px);
            transform: translateY(110vh);
            z-index: 310;
            display: none; opacity: 0; overflow: hidden;
            transition: opacity var(--anim-os), transform var(--anim-os);
        }

        .modal-window.open { 
            display: flex;
            flex-direction: column; 
            opacity: 1; 
            transform: translateY(0);
        }

        .window-header {
            padding: 0 12px;
            display: flex; 
            align-items: center;
            background: rgba(255, 255, 255, 0.4); 
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            height: 54px;
            gap: 8px;
            flex-shrink: 0;
            padding-top: env(safe-area-inset-top);
            box-sizing: content-box;
        }

        .tab-strip {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
            height: 100%;
            scrollbar-width: none;
        }
        .tab-strip::-webkit-scrollbar { display: none;
        }

        .browser-tab {
            height: 38px;
            min-width: 100px;
            max-width: 180px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 8px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            margin-bottom: -1px;
            border: 1px solid transparent;
            border-bottom: none;
        }

        @media (max-width: 640px) {
            .browser-tab {
                min-width: 45px;
                padding: 0 12px;
                justify-content: center;
            }
            .tab-title {
                display: none;
            }
        }

        .browser-tab.active {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.05);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
            z-index: 2;
        }

        .tab-title {
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #4b5563;
        }

        .tab-close {
            font-size: 10px;
            opacity: 0.4;
            transition: 0.2s;
            padding: 4px;
        }
        .tab-close:hover { opacity: 1; color: #ef4444;
        }
        
        .window-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px;
        }

        .toolbar-item {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #4b5563;
            font-size: 14px;
            transition: 0.3s;
            cursor: pointer;
            background: rgba(0,0,0,0.03);
        }
        .toolbar-item:hover { background: rgba(0,0,0,0.08); transform: scale(1.1);
        }
        .toolbar-item.btn-shutdown:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444;
        }
        .toolbar-item.btn-logout:hover { background: rgba(59, 130, 246, 0.1); color: #3b82f6;
        }

        .grade-badge {
            background: #10b981;
            color: white;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
            display: none;
        }

        .window-body { 
            flex: 1;
            width: 100%; 
            background: transparent; 
            position: relative; 
            overflow-y: auto;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .win-content-page {
            display: none;
            width: 100%;
            height: 100%;
        }
        .win-content-page.active { display: block;
        }

        #custom-alert {
            position: fixed;
            top: calc(100px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-200px);
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(30px);
            padding: 14px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); z-index: 2000;
            display: flex; align-items: center; gap: 12px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #custom-alert.show { transform: translateX(-50%) translateY(0);
        }

        #success-notification {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
            padding: 40px 60px;
            border-radius: 35px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 40px 100px rgba(0,0,0,0.15);
            z-index: 2100;
            display: flex; flex-direction: column; align-items: center;
            gap: 20px;
            opacity: 0; visibility: hidden;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        #success-notification.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1);
        }

        .login-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 12px 20px;
            font-size: 13px;
            color: #374151;
            outline: none;
            transition: 0.3s;
            margin-bottom: 12px;
            text-align: center;
            font-weight: 500;
        }
        .login-input::placeholder { color: #9ca3af; font-weight: 400; text-transform: uppercase; letter-spacing: 0.1em;
        }
        .login-input:focus { background: rgba(255, 255, 255, 0.5); border-color: #10b981;
        }
    </style>
</head>
<body>

    <div id="shutdown-overlay">
        <i class="fas fa-spinner sync-spinning text-white text-4xl mb-6"></i>
        <p class="text-white text-xs tracking-[0.4em] font-medium uppercase animate-pulse">系統正在關機中...</p>
    </div>

    <div id="page-loader">
        <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-16 h-16 mb-4">
        <p class="text-xs tracking-[0.2em] text-gray-400 font-medium uppercase animate-pulse">正在與雲端同步數據...</p>
    </div>

    <div id="success-notification">
        <div class="w-20 h-20 rounded-full bg-emerald-500 text-white flex items-center justify-center text-4xl shadow-lg"><i class="fas fa-check"></i></div>
        <div class="text-center">
            <h2 id="success-title" class="text-xl font-bold text-gray-800 tracking-widest uppercase mb-1">驗證成功</h2>
            <p id="success-subtitle" class="text-xs font-medium text-gray-500 uppercase tracking-[0.3em]">歡迎進入</p>
        </div>
    </div>

    <div id="custom-alert">
        <i class="fas fa-info-circle text-emerald-500"></i>
        <span id="alert-text" class="text-xs font-bold text-gray-600 uppercase tracking-widest"></span>
    </div>

    <div id="main-browser-window" class="modal-window">
 
        <div class="window-header">
            <div id="browser-tab-strip" class="tab-strip"></div>
            <div class="window-toolbar">
                <div id="user-grade-display" class="grade-badge">GRADUATED</div>
                <div class="toolbar-item" onclick="openHomeFolder()"><i class="fas fa-th-list"></i></div>
                <div class="toolbar-item" onclick="manualRefresh()"><i id="win-cloud-icon" class="fas fa-cloud"></i></div>
      
                <div class="w-[1px] h-4 bg-gray-300 mx-1"></div>
                <div class="toolbar-item btn-logout" onclick="handleLogout()" title="登出"><i class="fas fa-sign-out-alt"></i></div>
                <div class="toolbar-item btn-shutdown" onclick="handleSystemShutdown()" title="關機"><i class="fas fa-power-off"></i></div>
            </div>
        </div>
        <div id="browser-window-body" class="window-body"></div>
    </div>

    <section class="hero-full">
   
      <img id="hero-bg" src="">
        <div class="hero-overlay"></div>
        <div class="hero-content-wrapper text-center">
            <div id="hero-main-content" class="hero-glass-panel">
                <div class="mb-8 flex flex-col items-center gap-4">
                    <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" alt="Lumina" class="h-14 w-14 drop-shadow-sm">
              
                    <div class="h-[1px] w-10 bg-emerald-500/20"></div>
                </div>
                <h1 id="hero-title" class="text-3xl md:text-4xl tracking-[0.3em] uppercase mb-2" style="font-family: 'Cinzel', serif;"></h1>
                <p id="hero-subtitle" class="text-xl md:text-xl font-bold tracking-[1em] mb-6 uppercase pl-[1em] opacity-80"></p>
               
          
                <div class="w-full max-w-[320px] mb-6">
                    <input type="text" id="login-username" class="login-input" placeholder="Username" autocomplete="off">
                    <input type="password" id="login-password" class="login-input" placeholder="Password" autocomplete="new-password">
                </div>

                <div class="flex flex-col gap-4">
      
                    <button id="login-btn" onclick="handleLoginAndBrowse()" class="px-16 py-4 font-black rounded-full text-[10px] tracking-[0.5em] uppercase shadow-sm transition-all transform active:scale-95 bg-white/20 backdrop-blur-md border border-white/40">
                        Login & Browse
                    </button>
                    <div class="flex items-center justify-center gap-2 mt-2">
                        <button onclick="manualRefresh()" class="w-12 h-12 flex items-center justify-center rounded-full bg-white/10 backdrop-blur-lg border border-white/30 text-emerald-600/80 hover:bg-white/20 transition-all active:scale-90">
                            <i id="hero-cloud-icon" class="fas fa-cloud"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 配置項
        const SPREADSHEET_ID_HERO = '1-JB2srNidbjg3Kf15rzaGmSwRp5O6SnR_xoWmuYY0Mg';
        const HERO_DATA_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID_HERO}/gviz/tq?tqx=out:csv&sheet=VOL8`;
        
        // Google Apps Script API 網址
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxbu-w5UasIlTfsLGTPbalAu_gLgFHj7eekAoGsxkPVXpee4UzcsCk486sNH2-SA_ck/exec';

        let hwList = [];
        let isSyncing = false;
        let openTabs = [];
        let activeTabId = null;
        let currentUserGrade = null;
        let currentUserName = null;

        // 修正後的 API Fetch 函數，解決 CORS 與 Redirect 問題
        async function fetchGAS(params) {
            const queryString = new URLSearchParams(params).toString();
            const url = `${GAS_API_URL}?${queryString}`;
            
            // 使用 no-cache 避免舊資料，並顯式設定 redirect: 'follow'
            const response = await fetch(url, {
                method: 'GET',
                mode: 'cors',
                cache: 'no-cache',
                redirect: 'follow' 
            });

            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
            return await response.json();
        }

        // 輔助：指數退避 Fetch (用於 CSV 直連)
        async function fetchWithRetry(url, options = {}, retries = 3, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response;
            } catch (error) {
                if (retries <= 0) throw error;
                await new Promise(res => setTimeout(res, backoff));
                return fetchWithRetry(url, options, retries - 1, backoff * 2);
            }
        }

        // 輔助：解析 CSV
        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i+1];
                if (inQuotes) {
                    if (char === '"' && nextChar === '"') { currentField += '"'; i++; }
                    else if (char === '"') { inQuotes = false; }
                    else { currentField += char; }
                } else {
                    if (char === '"') { inQuotes = true; }
                    else if (char === ',') { currentRow.push(currentField); currentField = ''; }
                    else if (char === '\r' || char === '\n') {
                        currentRow.push(currentField);
                        if (currentRow.length > 0 && (currentRow.length > 1 || currentRow[0] !== '')) rows.push(currentRow);
                        currentRow = []; currentField = '';
                        if (char === '\r' && nextChar === '\n') i++;
                    } else { currentField += char; }
                }
            }
            if (currentField || currentRow.length > 0) { currentRow.push(currentField); rows.push(currentRow); }
            return rows;
        }

        // 初始化：加載 Landing Page (CSV 直連)
        async function initHeroSection() {
            try {
                const res = await fetchWithRetry(HERO_DATA_URL);
                const text = await res.text();
                const rows = parseCSV(text);
                rows.forEach(row => {
                    if (row[0] === 'HEROSECTION') {
                        if (row[1] === 'CONTENT_1') document.getElementById('hero-title').innerText = row[4];
                        if (row[1] === 'CONTENT_2') document.getElementById('hero-subtitle').innerText = row[4];
                        if (row[1] === 'PHOTO') document.getElementById('hero-bg').src = row[4];
                    }
                });
                document.getElementById('page-loader').style.opacity = '0';
                setTimeout(() => { document.getElementById('page-loader').style.display = 'none'; }, 1000);
            } catch (err) {
                console.error("Hero Load Error:", err);
                showAlert("背景資料同步失敗");
                // 即使失敗也關閉 loader 讓使用者能嘗試登入
                document.getElementById('page-loader').style.display = 'none';
            }
        }

        // 登入邏輯
        async function handleLoginAndBrowse() {
            const userIn = document.getElementById('login-username').value.trim();
            const passIn = document.getElementById('login-password').value;
            const loginBtn = document.getElementById('login-btn');

            if (!userIn || !passIn) { showAlert("請輸入帳號與密碼"); return; }

            loginBtn.disabled = true;
            loginBtn.innerText = "Authenticating...";
            
            try {
                // 使用修正後的 fetchGAS
                const result = await fetchGAS({
                    action: 'login',
                    username: userIn,
                    password: passIn
                });

                if (result.status === 'success') {
                    currentUserGrade = result.user.grade;
                    currentUserName = result.user.username;
                    
                    const badge = document.getElementById('user-grade-display');
                    badge.innerText = currentUserGrade;
                    badge.style.display = 'block';

                    showSuccessNotification("驗證成功", `使用者：${currentUserName}`);
                    
                    await fetchHomeworkData();
                    openHomeFolder();
                } else {
                    showAlert("帳號或密碼錯誤");
                }
            } catch (err) {
                console.error("Login Error:", err);
                showAlert("伺服器連線失敗 (CORS/Network)");
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "Login & Browse";
            }
        }

        // 獲取數據
        async function fetchHomeworkData() {
            const cloudIcons = [document.getElementById('hero-cloud-icon'), document.getElementById('win-cloud-icon')];
            cloudIcons.forEach(i => { if(i) i.className = 'fas fa-spinner sync-spinning'; });
            
            try {
                const result = await fetchGAS({
                    action: 'getData',
                    sheet: 'VOL8'
                });

                if (result.status === 'success') {
                    const rows = result.data;
                    const tempHW = [];
                    const seen = new Set();
                    
                    rows.forEach(row => {
                        if (row[0] && typeof row[0] === 'string' && row[0].startsWith('HW') && !seen.has(row[0])) {
                            seen.add(row[0]);
                            tempHW.push({ id: row[0], permission: String(row[3] || '').trim().toUpperCase(), fullData: rows.filter(r => r[0] === row[0]) });
                        }
                    });
                    hwList = tempHW.sort((a, b) => a.id.localeCompare(b.id));
                    
                    cloudIcons.forEach(i => { if(i) i.className = 'fas fa-check sync-success'; });
                    setTimeout(() => { cloudIcons.forEach(i => { if(i) i.className = 'fas fa-cloud'; }); }, 2000);
                } else {
                    throw new Error(result.message);
                }
            } catch (err) {
                console.error("Data Fetch Error:", err);
                showAlert("同步清單失敗");
                cloudIcons.forEach(i => { if(i) i.className = 'fas fa-exclamation-triangle text-red-500'; });
            }
        }

        // 權限檢查
        function hasHwPermission(permission) {
            if (!currentUserGrade) return false;
            const p = (permission || '').trim().toUpperCase();
            const u = currentUserGrade.toUpperCase();
            if (u === 'TEACHER') return true;
            if (p === 'ACTIVE' || p === '') return true;
            if (p === 'NIL') return false;
            const allowedGrades = p.split(',').map(g => g.trim().toUpperCase());
            return allowedGrades.includes(u);
        }

        // 頁面切換與標籤邏輯
        function openHomeFolder() { openTab("Browse ALL", "FOLDER"); }

        function openTab(title, type) {
            const id = type === 'FOLDER' ? 'HOME_FOLDER' : type + "_" + title.replace(/\s+/g, '_');
            const existing = openTabs.find(t => t.id === id);
            if (existing) { switchTab(id); return; }
            
            const newTab = { id, title, type };
            openTabs.push(newTab);
            
            const body = document.getElementById('browser-window-body');
            const page = document.createElement('div');
            page.id = `page-${id}`;
            page.className = 'win-content-page';
            page.innerHTML = `<div id="content-${id}" class="w-full h-full flex flex-col p-0 overflow-y-auto"></div>`;
            body.appendChild(page);

            if (type === 'HW') renderHWContent(title, `content-${id}`);
            if (type === 'FOLDER') renderHomeFolder(`content-${id}`);
            
            switchTab(id);
            const win = document.getElementById('main-browser-window');
            win.style.display = 'flex';
            document.getElementById('hero-main-content').classList.add('fade-exit-up');
            setTimeout(() => { win.classList.add('open'); }, 80);
        }

        function renderTabs() {
            const strip = document.getElementById('browser-tab-strip');
            strip.innerHTML = '';
            openTabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = `browser-tab ${activeTabId === tab.id ? 'active' : ''}`;
                el.onclick = () => switchTab(tab.id);
                let iconClass = tab.type === 'FOLDER' ? 'fa-th-list text-emerald-500' : 'fa-layer-group text-emerald-500';
                el.innerHTML = `<i class="fas ${iconClass} text-[10px]"></i><span class="tab-title">${tab.title}</span><i class="fas fa-times tab-close" onclick="event.stopPropagation(); closeTab('${tab.id}')"></i>`;
                strip.appendChild(el);
            });
        }

        function switchTab(id) {
            activeTabId = id;
            document.querySelectorAll('.win-content-page').forEach(p => p.classList.remove('active'));
            const activePage = document.getElementById(`page-${id}`);
            if (activePage) activePage.classList.add('active');
            renderTabs();
        }

        function closeTab(id) {
            const index = openTabs.findIndex(t => t.id === id);
            if (index === -1) return;
            openTabs.splice(index, 1);
            const page = document.getElementById(`page-${id}`);
            if (page) page.remove();
            if (openTabs.length === 0) closeAllTabs();
            else {
                if (activeTabId === id) switchTab(openTabs[Math.max(0, index - 1)].id);
                else renderTabs();
            }
        }

        function closeAllTabs() {
            openTabs = []; activeTabId = null;
            const win = document.getElementById('main-browser-window');
            win.classList.remove('open');
            document.getElementById('hero-main-content').classList.remove('fade-exit-up');
            setTimeout(() => { win.style.display = 'none'; document.getElementById('browser-window-body').innerHTML = ''; }, 1200);
        }

        function renderHomeFolder(containerId) {
            const body = document.getElementById(containerId);
            body.innerHTML = '<div class="uniform-list-container"></div>';
            const wrapper = body.querySelector('.uniform-list-container');
            hwList.forEach(hw => {
                const isAllowed = hasHwPermission(hw.permission);
                const row = document.createElement('div');
                row.className = `list-item-row ${!isAllowed ? 'is-locked' : ''}`;
                row.onclick = () => isAllowed ? openTab(hw.id, 'HW') : showAlert(`權限不足 (${hw.permission})`);
                row.innerHTML = `
                    <div class="flex items-center gap-5">
                        <div class="w-10 h-10 rounded-2xl ${isAllowed ? 'bg-emerald-100 text-emerald-600' : 'bg-gray-100 text-gray-400'} flex items-center justify-center">
                            <i class="fas ${isAllowed ? 'fa-layer-group' : 'fa-lock'} text-sm"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[13px] font-black ${isAllowed ? 'text-gray-800' : 'text-gray-400'} tracking-widest uppercase">${hw.id}</span>
                            <span class="text-[9px] font-medium text-gray-400 tracking-wider uppercase">${isAllowed ? '系列內容已就緒' : '存取受限'}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 ${isAllowed ? 'text-emerald-500' : 'text-gray-300'}">
                        <i class="fas fa-chevron-right text-[10px]"></i>
                    </div>
                `;
                wrapper.appendChild(row);
            });
        }

        function renderHWContent(hwName, containerId) {
            const body = document.getElementById(containerId);
            const hwEntry = hwList.find(h => h.id === hwName);
            if (!hwEntry) return;
            
            const hwData = hwEntry.fullData;
            const wrapper = document.createElement('div');
            wrapper.className = 'uniform-list-container';
            
            hwData.forEach((row, idx) => {
                if (row[1] !== 'QUESTION' && row[1] !== 'VIDEOS') return;
                
                const type = row[1];
                const subType = row[2];
                const isAllowed = hasHwPermission(row[3]);
                const url = row[4];
                const safeId = (hwName + type + idx).replace(/\s+/g, '');
                
                const rowContainer = document.createElement('div');
                rowContainer.className = 'flex flex-col';
                const rowEl = document.createElement('div');
                rowEl.className = `list-item-row ${!isAllowed ? 'is-locked' : ''}`;
                
                let icon = 'fa-file-alt';
                let label = subType;
                if (type === 'VIDEOS') icon = 'fa-play-circle';
                else if (subType === 'PIC') icon = 'fa-image';
                else if (subType === 'PDF') icon = 'fa-file-pdf';

                rowEl.innerHTML = `
                    <div class="flex items-center gap-5">
                        <i class="fas ${isAllowed ? icon : 'fa-lock'} ${isAllowed ? 'text-emerald-500' : 'text-gray-300'} text-lg"></i>
                        <span class="text-[13px] font-bold ${isAllowed ? 'text-gray-700' : 'text-gray-400'} tracking-widest uppercase">${label}</span>
                    </div>
                    <i class="fas fa-chevron-down text-[10px] ${isAllowed ? 'text-emerald-500' : 'text-gray-300'}"></i>
                `;

                const drawer = document.createElement('div');
                drawer.id = `drawer-${safeId}`;
                drawer.className = 'resource-drawer';

                rowEl.onclick = () => {
                    if (!isAllowed) { showAlert("權限不足"); return; }
                    if (drawer.classList.contains('expanded')) {
                        drawer.classList.remove('expanded');
                        setTimeout(() => drawer.innerHTML = '', 600);
                    } else {
                        let content = '';
                        if (type === 'VIDEOS') {
                            let embed = url.includes('watch?v=') ? url.replace('watch?v=', 'embed/') : url.replace('youtu.be/', 'youtube.com/embed/');
                            content = `<div style="width:100%; aspect-ratio:16/9;"><iframe class="w-full h-full" src="${embed}?playsinline=1" frameborder="0" allow="autoplay; fullscreen"></iframe></div>`;
                        } else if (subType === 'PIC') {
                            content = `<img src="${url}" class="resource-img">`;
                        } else {
                            content = `<iframe src="${url}" class="resource-iframe"></iframe>`;
                        }
                        drawer.innerHTML = `<div class="resource-content-container">${content}<div class="resource-collapse-bar" onclick="this.parentElement.parentElement.classList.remove('expanded')"><span>收回 COLLAPSE</span></div></div>`;
                        drawer.classList.add('expanded');
                    }
                };
                
                rowContainer.appendChild(rowEl);
                rowContainer.appendChild(drawer);
                wrapper.appendChild(rowContainer);
            });
            body.appendChild(wrapper);
        }

        // 其他 UI 輔助
        function handleLogout() { currentUserGrade = null; closeAllTabs(); }
        function handleSystemShutdown() {
            document.getElementById('shutdown-overlay').style.display = 'flex';
            setTimeout(() => { document.getElementById('shutdown-overlay').style.opacity = '1'; }, 10);
            setTimeout(() => { window.location.href = "https://phyuaaphysics.github.io/phyustudio/home.html"; }, 2000);
        }
        function manualRefresh() { if(currentUserGrade) fetchHomeworkData(); else initHeroSection(); }
        function showAlert(text) { 
            const alert = document.getElementById('custom-alert');
            document.getElementById('alert-text').innerText = text; alert.classList.add('show'); 
            setTimeout(() => alert.classList.remove('show'), 3000); 
        }
        function showSuccessNotification(title, subtitle) {
            document.getElementById('success-title').innerText = title;
            document.getElementById('success-subtitle').innerText = subtitle;
            document.getElementById('success-notification').classList.add('show');
            setTimeout(() => document.getElementById('success-notification').classList.remove('show'), 2500);
        }

        window.onload = initHeroSection;
    </script>
</body>
</html>
