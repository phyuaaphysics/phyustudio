<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fundamental Exercise - Lumina Studio</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lumina">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        :root {
            --mint-deep: #064e3b;
            --mint-primary: #10b981; 
            --mint-bg: #f0fdf4;
            --anim-os: 1.2s cubic-bezier(0.25, 1, 0.3, 1); 
            --anim-slow: 1.6s cubic-bezier(0.4, 0, 0.2, 1);
            --anim-item: 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        html, body { 
            height: 100dvh; width: 100%; margin: 0; overflow: hidden; position: fixed; 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f8fafc;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* UI Styles Remain Strictly Unchanged */
        .hero-full { position: absolute; inset: 0; width: 100%; height: 100dvh; overflow: hidden; z-index: 100; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s; }
        #hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.2) brightness(1.05); transition: transform var(--anim-slow), filter 0.8s; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%); z-index: 5; }
        .hero-glass-panel { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 40px; padding: 3.5rem 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); max-width: 90%; width: 540px; display: flex; flex-direction: column; align-items: center; transition: opacity var(--anim-os), transform var(--anim-os), visibility var(--anim-os); z-index: 20; }
        .hero-content-wrapper { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; padding-top: env(safe-area-inset-top); }
        .fade-exit-up { opacity: 0; transform: translateY(-150px) scale(0.9); visibility: hidden; }
        .uniform-list-container { display: flex; flex-direction: column; max-width: 1024px; margin: 0 auto; width: 100%; padding-bottom: 80px; }
        .list-item-row { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; background: rgba(255, 255, 255, 0.5); border-bottom: 1px solid rgba(0, 0, 0, 0.05); cursor: pointer; transition: 0.2s; }
        .list-item-row:active { background: rgba(16, 185, 129, 0.08); }
        .resource-drawer { max-height: 0; overflow: hidden; background: #f1f5f9; transition: max-height 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease; opacity: 0; position: relative; }
        .resource-drawer.expanded { max-height: 2000px; opacity: 1; }
        .resource-content-container { width: 100%; background: #fff; display: flex; flex-direction: column; align-items: center; }
        .resource-iframe { width: 100%; height: 70vh; border: none; }
        .resource-img { width: 100%; max-height: 85vh; object-fit: contain; }
        .resource-collapse-bar { width: 100%; height: 48px; background: #1e293b; display: flex; align-items: center; justify-content: center; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05); }
        .resource-collapse-bar span { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: rgba(255, 255, 255, 0.8); text-transform: uppercase; }
        #page-loader { position: fixed; inset: 0; background-color: #ffffff; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s ease; }
        .sync-spinning { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .modal-window { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(60px); -webkit-backdrop-filter: blur(60px); transform: translateY(110vh); z-index: 310; display: none; opacity: 0; transition: opacity var(--anim-os), transform var(--anim-os); }
        .modal-window.open { display: flex; flex-direction: column; opacity: 1; transform: translateY(0); }
        .window-header { padding: 0 12px; display: flex; align-items: center; background: rgba(255, 255, 255, 0.4); border-bottom: 1px solid rgba(0, 0, 0, 0.05); height: 54px; flex-shrink: 0; padding-top: env(safe-area-inset-top); box-sizing: content-box; }
        .tab-strip { display: flex; align-items: flex-end; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
        
        /* Tab Styles with Close Button */
        .browser-tab { height: 38px; min-width: 120px; background: rgba(0, 0, 0, 0.05); border-radius: 12px 12px 0 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; gap: 8px; cursor: pointer; transition: background 0.2s; position: relative; }
        .browser-tab.active { background: rgba(255, 255, 255, 0.7); }
        .tab-close-btn { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #94a3b8; transition: all 0.2s; }
        .tab-close-btn:hover { background: rgba(0,0,0,0.1); color: #ef4444; }

        .grade-badge { background: #10b981; color: white; font-size: 10px; font-weight: 900; padding: 4px 10px; border-radius: 20px; letter-spacing: 1px; display: none; }
        .login-input { width: 100%; background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); border-radius: 15px; padding: 12px 20px; font-size: 13px; color: #374151; outline: none; margin-bottom: 12px; text-align: center; }
        #custom-alert { position: fixed; top: calc(100px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-200px); background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(30px); padding: 14px 28px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.5); z-index: 2000; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        #custom-alert.show { transform: translateX(-50%) translateY(0); }

        /* 🔹 iOS Style Loading Zone */
        #auth-loading-zone { display: none; flex-direction: column; align-items: center; width: 100%; margin-top: 2rem; animation: iosFadeIn 0.5s ease forwards; }
        @keyframes iosFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .ios-spinner { width: 24px; height: 24px; color: #10b981; animation: spin 1s steps(12, end) infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .ios-loading-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* 🔹 iOS Shutdown Overlay */
        .ios-shutdown-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ios-shutdown-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .ios-shutdown-spinner {
            color: #fff;
            font-size: 24px;
            animation: spin 1s steps(12, end) infinite;
        }
    </style>
</head>
<body>

    <div id="page-loader">
        <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-16 h-16 mb-4">
        <p class="text-xs tracking-[0.2em] text-gray-400 font-medium uppercase animate-pulse">正在同步安全協議...</p>
    </div>

    <!-- 🔹 iOS Shutdown Overlay -->
    <div id="shutdown-overlay" class="ios-shutdown-overlay">
        <div class="ios-shutdown-spinner"><i class="fas fa-spinner"></i></div>
    </div>

    <div id="custom-alert" class="flex items-center gap-3">
        <i class="fas fa-shield-alt text-emerald-500"></i>
        <span id="alert-text" class="text-xs font-bold text-gray-600 uppercase tracking-widest"></span>
    </div>

    <div id="main-browser-window" class="modal-window">
        <div class="window-header">
            <div id="browser-tab-strip" class="tab-strip"></div>
            <div class="flex items-center gap-4 px-4">
                <div id="user-grade-display" class="grade-badge"></div>
                <!-- 改為登出圖標 -->
                <button onclick="handleLogout()" class="text-gray-400"><i class="fas fa-sign-out-alt"></i></button>
                <button onclick="handleLogout()" class="text-red-400"><i class="fas fa-power-off"></i></button>
            </div>
        </div>
        <div id="browser-window-body" class="flex-1 overflow-y-auto"></div>
    </div>

    <section class="hero-full" id="hero-section">
        <img id="hero-bg" src="">
        <div class="hero-overlay"></div>
        <div class="hero-content-wrapper text-center">
            <div id="hero-main-content" class="hero-glass-panel">
                <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="h-14 w-14 mb-8">
                <h1 id="hero-title" class="text-3xl tracking-[0.3em] uppercase mb-2" style="font-family: 'Cinzel', serif;"></h1>
                <p id="hero-subtitle" class="text-xl font-bold tracking-[1em] mb-10 pl-[1em] opacity-80 uppercase"></p>
                
                <!-- Login Fields Container -->
                <div id="login-fields" class="w-full flex flex-col items-center">
                    <div class="w-full max-w-[300px] mb-8">
                        <input type="text" id="login-username" class="login-input" placeholder="USERNAME" autocomplete="off">
                        <input type="password" id="login-password" class="login-input" placeholder="PASSWORD">
                    </div>

                    <button onclick="handleLoginAndBrowse()" class="px-16 py-4 font-black rounded-full text-[10px] tracking-[0.5em] uppercase bg-white/20 backdrop-blur-md border border-white/40 shadow-sm active:scale-95 transition-all">
                        Login & Access
                    </button>
                </div>

                <!-- 🔹 iOS Style Auth Loading Zone -->
                <div id="auth-loading-zone">
                    <div class="ios-loading-card">
                        <div class="ios-spinner mb-4 flex items-center justify-center">
                            <i class="fas fa-spinner"></i>
                        </div>
                        <div class="text-[11px] font-semibold text-gray-700 tracking-wider mb-1" id="loading-main-text">Loading Environment</div>
                        <div class="text-[9px] font-medium text-gray-400 tracking-wide" id="loading-sub-text">Connecting to Studio...</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 🔹 部署作業 ID 整合
        const DEPLOY_ID = 'AKfycbz45Mfi3tIgRC4nd56smXC8mLQDRZN_H7u8SQgSWW4ZtZqYTU0Ym64AtLdi0HgOTMc';
        const GAS_API = `https://script.google.com/macros/s/${DEPLOY_ID}/exec`;

        const HERO_DATA_URL = `https://docs.google.com/spreadsheets/d/1-JB2srNidbjg3Kf15rzaGmSwRp5O6SnR_xoWmuYY0Mg/gviz/tq?tqx=out:csv&sheet=VOL8`;

        let rawDataRows = [];
        let hwList = [];
        let session = { token: null, grade: null };
        let openTabs = [];
        let activeTabId = null;

        function checkAppleDevice() {
            if (/iPad|iPhone|iPod/.test(navigator.userAgent)) document.body.classList.add('is-ios');
        }

        async function loadHeroConfig() {
            try {
                const res = await fetch(HERO_DATA_URL);
                const text = await res.text();
                const rows = text.split('\n').map(r => r.split(',').map(c => c.replace(/"/g,'')));
                rows.forEach(row => {
                    if (row[0] === 'HEROSECTION') {
                        if (row[1] === 'CONTENT_1') document.getElementById('hero-title').innerText = row[4];
                        if (row[1] === 'CONTENT_2') document.getElementById('hero-subtitle').innerText = row[4];
                        if (row[1] === 'PHOTO') document.getElementById('hero-bg').src = row[4];
                    }
                });
            } finally {
                document.getElementById('page-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('page-loader').style.display = 'none', 1000);
            }
        }

        async function handleLoginAndBrowse() {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;
            if(!u || !p) { showAlert("請輸入憑據"); return; }

            document.getElementById('login-fields').style.display = 'none';
            document.getElementById('auth-loading-zone').style.display = 'flex';
            
            const mainTexts = ["Loading Environment", "Initializing Studio", "Syncing Database"];
            const subTexts = ["Authenticating...", "Checking Permissions...", "Handshaking with API..."];
            let textIdx = 0;
            const textTimer = setInterval(() => {
                textIdx = (textIdx + 1) % 3;
                document.getElementById('loading-main-text').innerText = mainTexts[textIdx];
                document.getElementById('loading-sub-text').innerText = subTexts[textIdx];
            }, 1800);

            try {
                const secureRes = await fetch(GAS_API, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username: u, password: p })
                });
                const result = await secureRes.json();

                if(result.success) {
                    session.token = result.token;
                    session.grade = result.grade;
                    document.getElementById('user-grade-display').innerText = session.grade;
                    document.getElementById('user-grade-display').style.display = 'block';
                    await fetchSecureDatabase();
                    clearInterval(textTimer);
                    enterPortal();
                } else {
                    clearInterval(textTimer);
                    document.getElementById('login-fields').style.display = 'flex';
                    document.getElementById('auth-loading-zone').style.display = 'none';
                    showAlert("帳號或密碼錯誤");
                }
            } catch (e) {
                clearInterval(textTimer);
                document.getElementById('login-fields').style.display = 'flex';
                document.getElementById('auth-loading-zone').style.display = 'none';
                showAlert("服務暫時不可用");
            }
        }

        async function fetchSecureDatabase() {
            const res = await fetch(GAS_API, {
                method: 'POST',
                body: JSON.stringify({ action: 'fetchData', token: session.token, grade: session.grade })
            });
            const result = await res.json();
            if(result.success) {
                rawDataRows = result.data;
                const seen = new Set();
                hwList = rawDataRows.filter(r => r[0]?.toString().startsWith('HW'))
                                   .map(r => r[0])
                                   .filter(id => { if(seen.has(id)) return false; seen.add(id); return true; });
            }
        }

        function enterPortal() {
            document.getElementById('hero-main-content').classList.add('fade-exit-up');
            const win = document.getElementById('main-browser-window');
            win.style.display = 'flex';
            setTimeout(() => win.classList.add('open'), 100);
            openHomeFolder();
        }

        function openHomeFolder() { openTab("Browse All", "FOLDER"); }

        function openTab(title, type) {
            const id = type === 'FOLDER' ? 'HOME' : type + "_" + title.replace(/\s+/g,'');
            if(openTabs.find(t => t.id === id)) { switchTab(id); return; }
            
            openTabs.push({id, title, type});
            const page = document.createElement('div');
            page.id = `page-${id}`;
            page.className = 'win-content-page hidden w-full h-full';
            page.innerHTML = `<div id="content-${id}" class="uniform-list-container"></div>`;
            document.getElementById('browser-window-body').appendChild(page);
            
            if(type === 'FOLDER') renderHome(id);
            else renderHW(title, id);
            
            renderTabStrip();
            switchTab(id);
        }

        function closeTab(e, id) {
            e.stopPropagation();
            const tabIdx = openTabs.findIndex(t => t.id === id);
            if(tabIdx === -1) return;
            openTabs.splice(tabIdx, 1);
            const page = document.getElementById(`page-${id}`);
            if(page) page.remove();
            if(activeTabId === id) {
                if(openTabs.length > 0) {
                    const nextId = openTabs[Math.max(0, tabIdx - 1)].id;
                    switchTab(nextId);
                } else {
                    activeTabId = null;
                    openHomeFolder();
                }
            } else {
                renderTabStrip();
            }
        }

        function renderTabStrip() {
            const strip = document.getElementById('browser-tab-strip');
            strip.innerHTML = '';
            openTabs.forEach(t => {
                const tab = document.createElement('div');
                tab.className = `browser-tab ${activeTabId === t.id ? 'active' : ''}`;
                tab.onclick = () => switchTab(t.id);
                tab.innerHTML = `
                    <span class="text-[11px] font-bold text-gray-500 truncate mr-2">${t.title}</span>
                    <div class="tab-close-btn" onclick="closeTab(event, '${t.id}')">
                        <i class="fas fa-times"></i>
                    </div>
                `;
                strip.appendChild(tab);
            });
        }

        function switchTab(id) {
            activeTabId = id;
            document.querySelectorAll('.win-content-page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${id}`)?.classList.remove('hidden');
            renderTabStrip();
        }

        function renderHome(cid) {
            const container = document.getElementById(`content-${cid}`);
            hwList.forEach(hw => {
                const row = document.createElement('div');
                row.className = 'list-item-row';
                row.onclick = () => openTab(hw, 'HW');
                row.innerHTML = `
                    <div class="flex items-center gap-5">
                        <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center"><i class="fas fa-folder"></i></div>
                        <span class="text-[13px] font-black uppercase tracking-widest text-gray-800">${hw}</span>
                    </div>
                    <i class="fas fa-chevron-right text-emerald-500"></i>
                `;
                container.appendChild(row);
            });
        }

        function renderHW(hwName, cid) {
            const container = document.getElementById(`content-${cid}`);
            const items = rawDataRows.filter(r => r[0] === hwName);
            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'list-item-row bg-emerald-50/20';
                const label = item[2] || '資源';
                row.innerHTML = `
                    <div class="flex items-center gap-5">
                        <i class="fas ${item[1]==='VIDEOS'?'fa-play-circle text-red-400':'fa-file-alt text-emerald-500'}"></i>
                        <span class="text-[12px] font-bold text-gray-700">${label}</span>
                    </div>
                    <i class="fas fa-chevron-down text-gray-300"></i>
                `;
                
                const drawer = document.createElement('div');
                drawer.className = 'resource-drawer';
                row.onclick = () => {
                    if(drawer.classList.contains('expanded')) {
                        drawer.classList.remove('expanded');
                        setTimeout(() => drawer.innerHTML = '', 600);
                    } else {
                        const url = item[4];
                        const content = item[1] === 'VIDEOS' 
                            ? `<iframe class="w-full aspect-video" src="${url.replace('watch?v=','embed/')}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
                            : `<iframe src="${url}" class="resource-iframe"></iframe>`;
                        drawer.innerHTML = `<div class="resource-content-container">${content}<div class="resource-collapse-bar" onclick="this.parentElement.parentElement.classList.remove('expanded')"><span>收回 COLLAPSE</span></div></div>`;
                        drawer.classList.add('expanded');
                    }
                };
                container.appendChild(row);
                container.appendChild(drawer);
            });
        }

        // 🔹 iOS Style Shutdown & Logout
        function handleLogout() { 
            const overlay = document.getElementById('shutdown-overlay');
            const win = document.getElementById('main-browser-window');
            const hero = document.getElementById('hero-section');

            // Start blackout transition
            overlay.classList.add('active');
            win.style.transform = 'scale(0.9)';
            win.style.opacity = '0';
            hero.style.transform = 'scale(1.1)';
            hero.style.opacity = '0';

            // Redirect after animation completes
            setTimeout(() => {
                window.location.href = 'https://phyuaaphysics.github.io/phyustudio/home.html';
            }, 800);
        }

        function showAlert(t) { 
            const a = document.getElementById('custom-alert');
            document.getElementById('alert-text').innerText = t;
            a.classList.add('show');
            setTimeout(() => a.classList.remove('show'), 3000);
        }

        window.onload = () => { checkAppleDevice(); loadHeroConfig(); };
    </script>
</body>
</html>
