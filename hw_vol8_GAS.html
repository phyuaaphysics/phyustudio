<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fundamental Exercise - Lumina Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        :root {
            --mint-deep: #064e3b; --mint-primary: #10b981; --mint-bg: #f0fdf4;
            /* iOS 經典阻尼曲線 */
            --ios-ease: cubic-bezier(0.32, 0.72, 0, 1);
        }
        html, body { 
            height: 100dvh; 
            width: 100%; 
            margin: 0; 
            overflow: hidden; 
            position: fixed; 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            background-color: #f8fafc;
            /* 關鍵：使用環境變數留出安全區域，避免重疊靈動島 */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        /* Hero 容器起動態 */
        .hero-full { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100dvh; 
            overflow: hidden; 
            z-index: 100; 
            transition: transform 1.8s var(--ios-ease), opacity 1.6s var(--ios-ease), filter 1.6s var(--ios-ease);
        }
        #hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 2.5s var(--ios-ease); }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%); z-index: 5; }
        
        .hero-glass-panel { 
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px); 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            border-radius: 40px; 
            padding: 3.5rem 2.5rem; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); 
            max-width: 90%; 
            width: 540px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            z-index: 20;
            transition: all 1.8s var(--ios-ease);
        }

        /* 成功驗證後的 Hero 狀態 */
        .hero-exit-active {
            pointer-events: none;
        }
        .hero-exit-active #hero-main-content {
            transform: translateY(-120px) scale(1.05);
            opacity: 0;
            filter: blur(20px);
        }
        .hero-exit-active #hero-title {
            letter-spacing: 1.5em;
            opacity: 0;
            filter: blur(10px);
            transition: all 1.8s var(--ios-ease);
        }
        .hero-exit-active #hero-subtitle {
            letter-spacing: 2em;
            opacity: 0;
            transition: all 1.5s var(--ios-ease);
        }
        
        /* 分頁系統：極致透明磨砂背景 */
        .modal-window { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100dvh; 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(45px) saturate(210%) brightness(105%); 
            -webkit-backdrop-filter: blur(45px) saturate(210%) brightness(105%); 
            transform: translateY(80px); 
            opacity: 0;
            z-index: 310; 
            display: none; 
            transition: transform 2.2s var(--ios-ease), opacity 2.2s var(--ios-ease), filter 1.5s var(--ios-ease);
            /* 內部也使用 padding 確保內容不被靈動島切掉 */
            padding-top: env(safe-area-inset-top);
        }
        .modal-window.open { 
            display: flex; 
            flex-direction: column; 
            transform: translateY(0);
            opacity: 1;
        }

        /* iOS 關機動畫效果 */
        .ios-shutdown {
            transform: scale(0.92) !important;
            opacity: 0 !important;
            filter: blur(40px) !important;
            pointer-events: none;
        }

        .shutdown-overlay {
            position: fixed;
            inset: 0;
            background: black;
            opacity: 0;
            z-index: 2000;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }
        .shutdown-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .window-header { 
            padding: 0 16px; 
            display: flex; 
            align-items: center; 
            height: 64px; 
            flex-shrink: 0; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .tab-strip { display: flex; gap: 8px; flex: 1; overflow-x: auto; scrollbar-width: none; }
        .browser-tab { height: 40px; padding: 0 16px; background: rgba(255,255,255,0.15); border-radius: 12px; display: flex; align-items: center; cursor: pointer; white-space: nowrap; transition: 0.2s; position: relative; color: #0f172a; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .browser-tab.active { background: #10b981; color: white; }
        
        .uniform-list-container { display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; padding: 16px; }
        
        /* HW Capsule：緊湊版 iOS 磨砂質感 */
        .list-item-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 20px; 
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 14px; 
            margin-bottom: 8px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03), inset 0 0 0 1px rgba(255,255,255,0.3); 
            cursor: pointer; 
            transition: all 0.4s var(--ios-ease); 
            border: none;
        }
        .list-item-row:hover { background: rgba(255, 255, 255, 0.4); transform: translateY(-1px); box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        .list-item-row:active { transform: scale(0.97); background: rgba(16, 185, 129, 0.15); }
        
        .resource-drawer { max-height: 0; overflow: hidden; transition: max-height 0.8s var(--ios-ease), opacity 0.4s; opacity: 0; }
        .resource-drawer.expanded { max-height: 1200px; opacity: 1; padding-bottom: 16px; }
        .resource-iframe { width: 100%; height: 70vh; border-radius: 18px; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.85); backdrop-filter: blur(15px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        
        #custom-alert { position: fixed; top: calc(120px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-200px); background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); padding: 12px 24px; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 2000; transition: 0.5s var(--ios-ease); border: 1px solid rgba(255,255,255,0.5); }
        #custom-alert.show { transform: translateX(-50%) translateY(0); }
        .grade-badge { background: #064e3b; color: white; font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; }
        
        /* 登入框：Username / Password 使用 Cinzel 字體 */
        .login-input { 
            width: 100%; 
            background: rgba(255,255,255,0.3); 
            border: 1px solid rgba(255,255,255,0.5); 
            border-radius: 12px; 
            padding: 12px; 
            margin-bottom: 10px; 
            text-align: center; 
            outline: none; 
            transition: 0.3s;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.1em;
        }
        .login-input:focus { background: rgba(255,255,255,0.6); border-color: #10b981; }
        
        .collapse-guide { width: 100%; display: flex; justify-content: center; align-items: center; padding: 10px; margin-top: 8px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 10px; color: #334155; font-size: 10px; font-weight: 800; letter-spacing: 2px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.2); }
        .collapse-guide:hover { background: rgba(16, 185, 129, 0.1); color: #10b981; }
    </style>
</head>
<body>

    <div id="page-loader" class="fixed inset-0 bg-white z-[1000] flex flex-col items-center justify-center transition-opacity duration-1000">
        <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="w-16 h-16 animate-bounce">
    </div>

    <!-- 關機遮罩 -->
    <div id="shutdown-mask" class="shutdown-overlay"></div>

    <div id="custom-alert" class="flex items-center gap-3">
        <i class="fas fa-exclamation-circle text-amber-500"></i>
        <span id="alert-text" class="text-sm font-bold text-gray-700"></span>
    </div>

    <!-- 分頁系統主視窗 -->
    <div id="main-browser-window" class="modal-window">
        <div class="window-header">
            <div id="browser-tab-strip" class="tab-strip"></div>
            <div class="flex items-center gap-3">
                <div id="user-grade-display" class="grade-badge"></div>
                <!-- 登出按鈕：執行即時重新整理返回登入頁 -->
                <button onclick="location.reload()" class="w-10 h-10 flex items-center justify-center text-slate-500 bg-white/10 hover:bg-slate-500/20 rounded-full transition-colors">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
                <!-- 關機按鈕：執行 iOS 關機動畫後導向外部連結 -->
                <button onclick="handleShutdown()" class="w-10 h-10 flex items-center justify-center text-red-500 bg-white/10 hover:bg-red-500/20 rounded-full transition-colors">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </div>
        <div id="browser-window-body" class="flex-1 overflow-y-auto"></div>
    </div>

    <!-- Landing Page Hero -->
    <section class="hero-full" id="hero-section">
        <img id="hero-bg" src="">
        <div class="hero-overlay"></div>
        <div class="hero-content-wrapper flex items-center justify-center h-full">
            <div id="hero-main-content" class="hero-glass-panel text-center">
                <img src="https://phyuaaphysics.github.io/phyustudio/appicon.png" class="h-12 w-12 mb-6 mx-auto">
                <h1 id="hero-title" class="text-2xl tracking-[0.2em] mb-2 uppercase" style="font-family: 'Cinzel', serif;">Lumina Studio</h1>
                <p id="hero-subtitle" class="text-sm font-medium tracking-[0.5em] mb-10 opacity-60 uppercase">Fundamental Exercise</p>
                
                <div id="login-form" class="w-full max-w-[280px] mx-auto">
                    <input type="text" id="login-username" class="login-input" placeholder="USERNAME">
                    <input type="password" id="login-password" class="login-input" placeholder="PASSWORD">
                    <button id="login-btn" onclick="handleAuth()" class="w-full py-3 mt-4 bg-emerald-500 text-white rounded-xl font-bold tracking-widest text-xs uppercase shadow-lg active:scale-95 transition-all">
                        進入系統 Access
                    </button>
                    <div id="login-loader" class="hidden mt-6 flex flex-col items-center">
                        <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                        <p id="loader-msg" class="text-[10px] font-bold text-emerald-600 tracking-[0.3em] uppercase">Checking Credentials...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const DEPLOY_ID = 'AKfycbx0DtGAIxQL9RXKCNWHBf5dYn8Qp7MA8NTx6a0RlF2PVpuY5cuNnKZ8dEvPvNYCrm8';
        const GAS_API = `https://script.google.com/macros/s/${DEPLOY_ID}/exec`;
        const CONFIG_SHEET = `https://docs.google.com/spreadsheets/d/1-JB2srNidbjg3Kf15rzaGmSwRp5O6SnR_xoWmuYY0Mg/gviz/tq?tqx=out:csv&sheet=VOL8`;

        let rawDataRows = [];
        let session = { token: null, grade: null };
        let openTabs = [];
        let activeTabId = null;

        async function loadConfig() {
            try {
                const res = await fetch(CONFIG_SHEET);
                const text = await res.text();
                const rows = text.split('\n').map(r => r.split(',').map(c => c.replace(/"/g,'')));
                rows.forEach(row => {
                    if (row[0] === 'HEROSECTION') {
                        if (row[1] === 'CONTENT_1') document.getElementById('hero-title').innerText = row[4];
                        if (row[1] === 'CONTENT_2') document.getElementById('hero-subtitle').innerText = row[4];
                        if (row[1] === 'PHOTO') document.getElementById('hero-bg').src = row[4];
                    }
                });
            } finally {
                document.getElementById('page-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('page-loader').style.display = 'none', 1000);
            }
        }

        async function handleAuth() {
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;
            if(!u || !p) return showAlert("請完整填寫資訊");

            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('login-loader').classList.remove('hidden');
            
            const msgs = ["Loading Environment...", "Checking Safety Keys...", "Verifying Protocol...", "Syncing Database..."];
            let msgIdx = 0;
            const msgInterval = setInterval(() => {
                document.getElementById('loader-msg').innerText = msgs[msgIdx % msgs.length];
                msgIdx++;
            }, 800);

            try {
                const res = await fetch(GAS_API, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username: u, password: p })
                });
                const result = await res.json();
                
                if(result.success) {
                    session.token = result.token;
                    session.grade = result.grade.toUpperCase();
                    document.getElementById('user-grade-display').innerText = session.grade;
                    
                    const dataRes = await fetch(GAS_API, { method: 'POST', body: JSON.stringify({ action: 'fetchData', token: session.token }) });
                    const dataResult = await dataRes.json();
                    rawDataRows = dataResult.data;

                    clearInterval(msgInterval);
                    enterPortal();
                } else {
                    clearInterval(msgInterval);
                    resetLoginUI("驗證失敗：帳密不符");
                }
            } catch (e) {
                clearInterval(msgInterval);
                resetLoginUI("連線逾時，請檢查網路");
            }
        }

        function resetLoginUI(msg) {
            document.getElementById('login-btn').classList.remove('hidden');
            document.getElementById('login-loader').classList.add('hidden');
            showAlert(msg);
        }

        function enterPortal() {
            const heroSection = document.getElementById('hero-section');
            heroSection.classList.add('hero-exit-active');
            
            const win = document.getElementById('main-browser-window');
            win.style.display = 'flex';
            
            setTimeout(() => {
                win.classList.add('open');
            }, 300);

            openTab("課程目錄", "HOME");
        }

        // iOS 關機動畫邏輯
        function handleShutdown() {
            const win = document.getElementById('main-browser-window');
            const mask = document.getElementById('shutdown-mask');
            
            // 觸發視窗縮小與模糊
            win.classList.add('ios-shutdown');
            
            // 觸發黑色遮罩漸入
            setTimeout(() => {
                mask.classList.add('active');
            }, 200);

            // 轉場至目標頁面
            setTimeout(() => {
                window.location.href = "https://phyuaaphysics.github.io/phyustudio/home.html";
            }, 1800);
        }

        function openTab(title, type) {
            const id = type === 'HOME' ? 'HOME' : `CAT_${btoa(encodeURIComponent(title)).slice(0,8)}`;
            if(openTabs.find(t => t.id === id)) { switchTab(id); return; }

            openTabs.push({id, title, type});
            const page = document.createElement('div');
            page.id = `page-${id}`;
            page.className = 'win-content-page hidden w-full';
            page.innerHTML = `<div id="content-${id}" class="uniform-list-container"></div>`;
            document.getElementById('browser-window-body').appendChild(page);

            if(type === 'HOME') renderHome(id);
            else renderCategoryItems(title, id);
            switchTab(id);
        }

        function closeTab(id, e) {
            e.stopPropagation();
            if(id === 'HOME') return;
            
            openTabs = openTabs.filter(t => t.id !== id);
            const page = document.getElementById(`page-${id}`);
            if(page) page.remove();
            
            if(activeTabId === id) {
                switchTab('HOME');
            } else {
                renderTabStrip();
            }
        }

        function switchTab(id) {
            activeTabId = id;
            document.querySelectorAll('.win-content-page').forEach(p => p.classList.add('hidden'));
            const targetPage = document.getElementById(`page-${id}`);
            if(targetPage) targetPage.classList.remove('hidden');
            renderTabStrip();
        }

        function renderTabStrip() {
            const strip = document.getElementById('browser-tab-strip');
            strip.innerHTML = '';
            openTabs.forEach(t => {
                const tab = document.createElement('div');
                tab.className = `browser-tab ${activeTabId === t.id ? 'active' : ''}`;
                tab.onclick = () => switchTab(t.id);
                
                const closeBtn = t.id !== 'HOME' ? `<i class="fas fa-times ml-3 opacity-50 hover:opacity-100" onclick="closeTab('${t.id}', event)"></i>` : '';
                tab.innerHTML = `<span class="text-[11px] font-bold tracking-wider">${t.title}</span> ${closeBtn}`;
                strip.appendChild(tab);
            });
        }

        function renderHome(cid) {
            const container = document.getElementById(`content-${cid}`);
            container.innerHTML = '<h2 class="text-sm font-black mb-4 text-slate-800 tracking-[0.2em] uppercase opacity-80">Database Categories</h2>';
            const categories = new Set();
            rawDataRows.forEach(row => {
                const val = row[0] ? row[0].toString().trim() : '';
                if(val && val.toUpperCase() !== 'VERSION' && val.toUpperCase() !== 'HEROSECTION') categories.add(val);
            });
            Array.from(categories).sort().forEach(cat => {
                const row = document.createElement('div');
                row.className = 'list-item-row';
                row.onclick = () => openTab(cat, 'CAT');
                row.innerHTML = `<div class="flex items-center gap-4"><div class="w-8 h-8 bg-emerald-500/20 text-emerald-700 rounded-lg flex items-center justify-center text-xs"><i class="fas fa-folder"></i></div><span class="font-bold text-slate-800 text-xs tracking-wide">${cat}</span></div><i class="fas fa-chevron-right text-slate-400 text-[10px]"></i>`;
                container.appendChild(row);
            });
        }

        function renderCategoryItems(catName, cid) {
            const container = document.getElementById(`content-${cid}`);
            const items = rawDataRows.filter(r => r[0] && r[0].toString().trim() === catName);

            items.forEach(item => {
                const req = (item[3] || 'ACTIVE').toString().toUpperCase();
                const isPermitted = (session.grade === 'TEACHER' || session.grade === 'ADMIN' || req === 'ACTIVE' || req.split(',').includes(session.grade));

                const wrap = document.createElement('div');
                wrap.className = 'flex flex-col';

                const row = document.createElement('div');
                row.className = `list-item-row ${!isPermitted ? 'opacity-40 grayscale' : ''}`;
                row.innerHTML = `<div class="flex items-center gap-4"><div class="w-8 h-8 flex items-center justify-center text-sm"><i class="fas ${item[1] === 'VIDEOS' ? 'fa-play-circle text-rose-500' : 'fa-file-pdf text-emerald-600'}"></i></div><span class="text-xs font-bold text-slate-800 tracking-wide">${item[2] || 'Resource'}</span></div><i class="fas ${isPermitted ? 'fa-plus text-slate-400 text-[10px]' : 'fa-lock text-slate-400 text-[10px]'}"></i>`;

                const drawer = document.createElement('div');
                drawer.className = 'resource-drawer';

                row.onclick = () => {
                    if(!isPermitted) return showAlert(`限 ${req} 訪問`);
                    if(drawer.classList.contains('expanded')) {
                        drawer.classList.remove('expanded');
                        setTimeout(() => drawer.innerHTML = '', 600);
                    } else {
                        const url = item[4];
                        const content = item[1] === 'VIDEOS' 
                            ? `<iframe class="w-full aspect-video rounded-xl shadow-lg" src="${url.replace('watch?v=','embed/')}?autoplay=1" allowfullscreen></iframe>`
                            : `<iframe src="${url}" class="resource-iframe"></iframe>`;
                        
                        drawer.innerHTML = `
                            <div class="mt-2">
                                ${content}
                                <div class="collapse-guide" onclick="this.parentElement.parentElement.classList.remove('expanded')">
                                    <i class="fas fa-chevron-up mr-2"></i> 收回資源 COLLAPSE
                                </div>
                            </div>`;
                        drawer.classList.add('expanded');
                    }
                };

                wrap.appendChild(row);
                wrap.appendChild(drawer);
                container.appendChild(wrap);
            });
        }

        function showAlert(msg) {
            const a = document.getElementById('custom-alert');
            const t = document.getElementById('alert-text');
            if (t) t.innerText = msg;
            if (a) {
                a.classList.add('show');
                setTimeout(() => a.classList.remove('show'), 3000);
            }
        }

        window.onload = loadConfig;
    </script>
</body>
</html>
