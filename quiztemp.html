
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>力學基礎小測驗</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="力學小測">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* 針對 iOS 瀏海屏避開頂部狀態列 */
        .safe-padding-top {
            padding-top: calc(1.5rem + env(safe-area-inset-top));
        }
        /* 觸控選項選中效果 */
        .option-card input:checked + .option-content {
            border-color: #81D8D0;
            background-color: rgba(129, 216, 208, 0.15);
            box-shadow: 0 0 0 2px rgba(129, 216, 208, 0.4);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-12">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50 safe-padding-top pb-3 px-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="w-2 h-6 bg-[#81D8D0] rounded-full"></div>
            <span class="font-bold text-lg tracking-wide text-slate-800">力學小測驗</span>
        </div>
        <a href="https://phyuaaphysics.github.io/phyustudio/home.html" 
           class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 transition-all duration-200 active:scale-95"
           aria-label="返回首頁">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </a>
    </header>

    <main class="max-w-xl w-full mx-auto px-4 mt-6 flex-grow">
        
        <div class="bg-gradient-to-r from-slate-800 to-slate-900 text-white rounded-2xl p-5 shadow-lg mb-6">
            <h3 class="text-xs font-semibold uppercase tracking-widest opacity-60 mb-2">學生考試憑證</h3>
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="bg-white/10 rounded-xl p-2 backdrop-blur-sm">
                    <p class="text-[10px] opacity-80">班級</p>
                    <p id="info-class" class="font-bold text-sm mt-0.5">載入中...</p>
                </div>
                <div class="bg-white/10 rounded-xl p-2 backdrop-blur-sm">
                    <p class="text-[10px] opacity-80">座號</p>
                    <p id="info-no" class="font-bold text-sm mt-0.5">載入中...</p>
                </div>
                <div class="bg-white/10 rounded-xl p-2 backdrop-blur-sm">
                    <p class="text-[10px] opacity-80">姓名</p>
                    <p id="info-name" class="font-bold text-sm mt-0.5">載入中...</p>
                </div>
            </div>
            
            <div id="credentials-fallback" class="hidden mt-4 pt-3 border-t border-white/20 text-xs">
                <p class="mb-2 text-amber-300 font-semibold">⚠️ 未偵測到登入紀錄，請手動確認資料以確保成績上傳正確：</p>
                <div class="grid grid-cols-3 gap-2 text-slate-800">
                    <input type="text" id="fallback-class" placeholder="班級" class="rounded px-2 py-1 text-xs focus:outline-none">
                    <input type="text" id="fallback-no" placeholder="座號" class="rounded px-2 py-1 text-xs focus:outline-none">
                    <input type="text" id="fallback-name" placeholder="真實姓名" class="rounded px-2 py-1 text-xs focus:outline-none">
                </div>
            </div>
        </div>

        <div class="mb-6 bg-slate-200 h-1.5 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-[#81D8D0] h-full w-0 transition-all duration-300"></div>
        </div>

        <form id="quiz-form" class="space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 question-block">
                <div class="flex items-center space-x-2 mb-3">
                    <span class="bg-slate-100 text-slate-700 font-bold text-xs px-2.5 py-1 rounded-full">第 1 題</span>
                    <span class="text-slate-400 text-xs">牛頓第一定律</span>
                </div>
                <p class="font-medium text-slate-800 leading-relaxed mb-4">
                    根據牛頓第一運動定律，當物體所受合力為零（$\sum F = 0$）時，物體會如何運動？
                </p>
                <div class="space-y-3 options">
                    <label class="option-card block relative cursor-pointer">
                        <input type="radio" name="q1" value="A" class="sr-only" required>
                        <div class="option-content border border-slate-200 rounded-xl p-4 transition-all duration-150 hover:bg-slate-50">
                            <span class="font-semibold text-slate-500 mr-2">A</span> 立即停止運動並保持靜止
                        </div>
                    </label>
                    <label class="option-card block relative cursor-pointer">
                        <input type="radio" name="q1" value="B" class="sr-only">
                        <div class="option-content border border-slate-200 rounded-xl p-4 transition-all duration-150 hover:bg-slate-50">
                            <span class="font-semibold text-slate-500 mr-2">B</span> 保持靜止或作等速度直線運動
                        </div>
                    </label>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 question-block">
                <div class="flex items-center space-x-2 mb-3">
                    <span class="bg-slate-100 text-slate-700 font-bold text-xs px-2.5 py-1 rounded-full">第 2 題</span>
                    <span class="text-slate-400 text-xs">牛頓第二定律計算</span>
                </div>
                <p class="font-medium text-slate-800 leading-relaxed mb-4">
                    一個質量 $m = 2 \text{ kg}$ 的物體受到 $F = 10 \text{ N}$ 的水平外力作用。若不計任何摩擦阻力，該物體產生的加速度大小為多少？
                </p>
                <div class="space-y-3 options">
                    <label class="option-card block relative cursor-pointer">
                        <input type="radio" name="q2" value="A" class="sr-only" required>
                        <div class="option-content border border-slate-200 rounded-xl p-4 transition-all duration-150 hover:bg-slate-50">
                            <span class="font-semibold text-slate-500 mr-2">A</span> $2 \text{ m/s}^2$
                        </div>
                    </label>
                    <label class="option-card block relative cursor-pointer">
                        <input type="radio" name="q2" value="B" class="sr-only">
                        <div class="option-content border border-slate-200 rounded-xl p-4 transition-all duration-150 hover:bg-slate-50">
                            <span class="font-semibold text-slate-500 mr-2">B</span> $5 \text{ m/s}^2$
                        </div>
                    </label>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" id="submit-btn" class="w-full bg-[#81D8D0] text-slate-800 font-bold py-4 rounded-xl shadow-lg hover:opacity-90 active:scale-[0.99] transition-all duration-150 flex items-center justify-center space-x-2">
                    <span>交卷並上傳成績</span>
                </button>
            </div>
        </form>

        <div id="result-modal" class="hidden mt-6 bg-white border border-slate-100 rounded-2xl p-6 shadow-xl transition-all duration-300">
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-12 h-12 rounded-full flex items-center justify-center bg-green-100 text-green-600 font-bold text-2xl">✓</div>
                <div>
                    <h4 class="font-bold text-lg text-slate-800">提交成功</h4>
                    <p class="text-xs text-slate-500">成績已同步至試算表</p>
                </div>
            </div>
            <div class="bg-slate-50 rounded-xl p-4 mb-4 text-center">
                <p class="text-slate-500 text-sm">本次測驗得分</p>
                <p class="text-4xl font-extrabold text-slate-800 mt-1"><span id="user-score">0</span> <span class="text-lg font-medium text-slate-400">/ 100</span></p>
            </div>
            <div class="mt-6">
                <a href="https://phyuaaphysics.github.io/phyustudio/home.html" class="block text-center w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 rounded-xl transition-all duration-150">
                    返回物理首頁
                </a>
            </div>
        </div>
    </main>

    <script>
        const CONFIG = { bigTopic: "物理", smallTopic: "力學", quizName: "力學基礎概念小測驗" };
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw0H83aeXxYvnDsi5KrRXXnUkSWRyK30Z9vq7hen46WtVLDW5qiQ7iTlLctP3LD8k_3/exec"; 
        const answerKey = { q1: "B", q2: "B" }; // 簡化示範

        // 🔗 核心修改：精準讀取主網頁 index.html 寫入的 user_ 欄位 🔗
        // 同時引入 URL 參數解析，解決 iOS PWA 獨立沙盒讀取不到 localStorage 的限制
        const urlParams = new URLSearchParams(window.location.search);
        
        let studentClass = urlParams.get('class') || localStorage.getItem('user_class');
        let studentNo = urlParams.get('classNo') || localStorage.getItem('user_class_no');
        let realName = urlParams.get('realName') || localStorage.getItem('user_real_name');

        const infoClassEl = document.getElementById('info-class');
        const infoNoEl = document.getElementById('info-no');
        const infoNameEl = document.getElementById('info-name');
        const fallbackSection = document.getElementById('credentials-fallback');
        let hasAuth = true;

        if (studentClass && studentNo && realName) {
            infoClassEl.innerText = studentClass;
            infoNoEl.innerText = studentNo;
            infoNameEl.innerText = realName;
        } else {
            infoClassEl.innerText = "未設定";
            infoNoEl.innerText = "未設定";
            infoNameEl.innerText = "未設定";
            fallbackSection.classList.remove('hidden');
            hasAuth = false;
        }

        // 進度條與提交邏輯保持不變...
        const form = document.getElementById('quiz-form');
        form.addEventListener('change', () => {
            const formData = new FormData(form);
            let answered = 0;
            for (let key in answerKey) { if (formData.get(key)) answered++; }
            document.getElementById('progress-bar').style.width = `${(answered / Object.keys(answerKey).length) * 100}%`;
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            let finalClass = hasAuth ? studentClass : document.getElementById('fallback-class').value.trim();
            let finalNo = hasAuth ? studentNo : document.getElementById('fallback-no').value.trim();
            let finalName = hasAuth ? realName : document.getElementById('fallback-name').value.trim();

            if (!finalClass || !finalNo || !finalName) {
                alert('請完整填寫學生資料！');
                return;
            }

            let score = 0;
            const formData = new FormData(form);
            for (let key in answerKey) { if (formData.get(key) === answerKey[key]) score += 50; }

            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').innerText = "上傳中...";

            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    class: finalClass,
                    classNo: finalNo,
                    realName: finalName,
                    bigTopic: CONFIG.bigTopic,
                    smallTopic: CONFIG.smallTopic,
                    quizName: CONFIG.quizName,
                    score: score,
                    fullmarks: 100
                })
            }).then(() => {
                form.classList.add('hidden');
                document.getElementById('user-score').innerText = score;
                document.getElementById('result-modal').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
