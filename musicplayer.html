
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hybrid Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body {
            background-color: #ffffff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            body { flex-direction: row; background-color: #f2f2f7; }
        }

        aside {
            background: #ffffff;
            border-right: 1px solid #e5e5ea;
            display: flex;
            flex-direction: column;
            order: 2;
            transition: flex 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media (min-width: 768px) {
            aside { width: 320px; order: 1; }
        }
        @media (min-width: 1024px) {
            aside { width: 384px; }
        }

        main {
            flex: 1;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            order: 1;
            z-index: 30;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media (min-width: 768px) {
            main { order: 2; }
        }

        /* 播放器縮小狀態 (手機版專用) */
        .player-minimized .video-wrapper {
            transform: scale(0.85);
            opacity: 0.6;
            margin-top: -10px;
        }
        .player-minimized main {
            flex: 0 0 auto;
        }

        .playlist-item-container {
            position: relative;
            border-bottom: 1px solid #f2f2f7;
        }
        @media (min-width: 768px) {
            .playlist-item-container {
                border-radius: 12px;
                margin-bottom: 4px;
                border-bottom: none;
            }
        }

        .playlist-item {
            position: relative;
            background: white;
            transition: background 0.2s ease;
            cursor: pointer;
            min-height: 56px; /* 加大觸控高度 */
        }
        
        .playlist-item.active {
            background: #f2f2f7;
        }
        .playlist-item.active .song-title {
            color: #007aff;
            font-weight: 800;
        }

        .delete-btn {
            opacity: 0.4;
            transition: opacity 0.2s ease, transform 0.2s ease;
            padding: 12px; /* 加大點擊區域 */
        }
        .delete-btn:active {
            transform: scale(1.2);
            color: #ff3b30;
            opacity: 1;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: top center;
        }
        @media (min-width: 768px) {
            .video-wrapper {
                border-radius: 20px;
                margin: 20px;
                width: calc(100% - 40px);
                box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            }
        }

        #youtube-player {
            width: 100%;
            height: 100%;
        }

        #playlist {
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch; 
            flex-grow: 1;
        }

        #playlist::-webkit-scrollbar { width: 4px; }
        #playlist::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
</head>
<body id="app-body">

    <div id="loading-overlay">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-blue-500"></div>
        <p id="loading-text" class="text-gray-400 text-sm">載入中...</p>
    </div>

    <main id="main-container">
        <div class="w-full">
            <div class="video-wrapper">
                <div id="youtube-player"></div>
            </div>
        </div>

        <div class="p-4 md:p-8 flex justify-between items-center border-b border-gray-100 md:border-none">
            <div class="min-w-0 flex-1">
                <h1 id="current-title" class="text-lg md:text-xl font-extrabold truncate">載入中...</h1>
                <p id="current-artist" class="text-gray-400 text-xs md:text-sm font-medium">請選擇歌曲</p>
            </div>
            <div class="hidden sm:flex items-center gap-3 ml-4">
                <div class="text-[9px] font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded-full uppercase tracking-widest border border-blue-100">Now Playing</div>
            </div>
        </div>
    </main>

    <aside class="flex-1 overflow-hidden">
        <div class="p-4 md:p-8 pb-3">
            <h2 class="text-2xl font-black tracking-tighter mb-3">媒體庫</h2>
            <div class="flex gap-2">
                <button onclick="shuffleAndPlay()" id="shuffle-btn" class="flex-1 bg-black text-white py-3 rounded-2xl transition-all flex items-center justify-center gap-2 text-sm font-bold active:scale-95">
                    <i class="fa-solid fa-shuffle text-xs"></i> 隨機播放
                </button>
                <button onclick="fetchSheetData()" class="w-12 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-2xl flex items-center justify-center active:scale-95">
                    <i class="fa-solid fa-rotate text-xs"></i>
                </button>
            </div>
        </div>
        
        <div id="playlist" class="flex-1 overflow-y-auto px-0 md:px-4 space-y-0 md:space-y-1 pb-20">
            <!-- 動態生成 -->
        </div>
    </aside>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const SHEET_ID = '1QIwkfmUZPRWMLrDVHYe-bUtUMSmkU2Ad6PlZnYIij_M';
        const SHEET_NAME = 'MUSIC PLAYER';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&t=${Date.now()}`;

        let playlistData = [];
        let player;
        let currentIndex = 0;
        let sortable;

        const playlistEl = document.getElementById('playlist');
        const titleEl = document.getElementById('current-title');
        const artistEl = document.getElementById('current-artist');
        const bodyEl = document.getElementById('app-body');

        // 監聽捲動以最小化播放器
        playlistEl.addEventListener('scroll', () => {
            if (window.innerWidth < 768) {
                if (playlistEl.scrollTop > 20) {
                    bodyEl.classList.add('player-minimized');
                } else {
                    bodyEl.classList.remove('player-minimized');
                }
            }
        });

        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
            return lines.map(line => {
                const result = [];
                let cell = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) {
                        result.push(cell.trim());
                        cell = '';
                    } else cell += char;
                }
                result.push(cell.trim());
                return result;
            });
        }

        async function fetchSheetData() {
            const loader = document.getElementById('loading-overlay');
            loader.style.display = 'flex';
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const rows = parseCSV(text);
                playlistData = rows.slice(1)
                    .filter(row => row.length >= 2 && row[1])
                    .map((row) => {
                        const videoId = extractVideoId(row[1]);
                        return videoId ? {
                            id: Math.random().toString(36).substr(2, 9),
                            videoId: videoId,
                            title: row[2] || '無標題',
                            artist: row[3] || '未知'
                        } : null;
                    })
                    .filter(item => item !== null);

                renderPlaylist();
                initSortable();
                if (player && typeof player.loadVideoById === 'function' && playlistData.length > 0) loadSong(0);
                loader.style.display = 'none';
            } catch (error) {
                document.getElementById('loading-text').innerText = "載入失敗";
            }
        }

        function initSortable() {
            if (sortable) sortable.destroy();
            sortable = new Sortable(playlistEl, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                handle: '.playlist-item', 
                onEnd: function (evt) {
                    const item = playlistData.splice(evt.oldIndex, 1)[0];
                    playlistData.splice(evt.newIndex, 0, item);
                    if (evt.oldIndex === currentIndex) currentIndex = evt.newIndex;
                    else if (evt.oldIndex < currentIndex && evt.newIndex >= currentIndex) currentIndex--;
                    else if (evt.oldIndex > currentIndex && evt.newIndex <= currentIndex) currentIndex++;
                    renderPlaylist();
                }
            });
        }

        function extractVideoId(url) {
            const cleanUrl = url.replace(/"/g, '');
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = cleanUrl.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%', videoId: '',
                playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
                events: {
                    'onReady': () => { fetchSheetData(); },
                    'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) nextSong(); },
                    'onError': () => { nextSong(); }
                }
            });
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            playlistData.forEach((song, index) => {
                const container = document.createElement('div');
                container.className = 'playlist-item-container';
                
                container.innerHTML = `
                    <div class="playlist-item flex items-center p-4 md:p-4 ${index === currentIndex ? 'active' : ''}" data-index="${index}">
                        <div class="hidden md:block relative w-12 h-12 mr-4 flex-shrink-0 pointer-events-none">
                            <img src="https://img.youtube.com/vi/${song.videoId}/default.jpg" class="w-full h-full rounded-xl object-cover">
                        </div>
                        <div class="flex-1 flex flex-row items-center justify-between min-w-0 mr-1" onclick="loadSong(${index})">
                            <div class="font-bold truncate text-sm song-title pr-4">${song.title}</div>
                            <div class="text-[10px] text-gray-400 truncate font-bold uppercase tracking-widest flex-shrink-0">${song.artist}</div>
                        </div>
                        <button class="delete-btn flex-shrink-0" onclick="event.stopPropagation(); removeSong(${index})">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>
                `;
                playlistEl.appendChild(container);
            });
        }

        function removeSong(index) {
            if (playlistData.length <= 1) return;
            const wasCurrent = (index === currentIndex);
            playlistData.splice(index, 1);
            if (wasCurrent) {
                if (currentIndex >= playlistData.length) currentIndex = 0;
                loadSong(currentIndex);
            } else if (index < currentIndex) {
                currentIndex--;
            }
            renderPlaylist();
        }

        function updateMeta(index) {
            if (!playlistData[index]) return;
            titleEl.innerText = playlistData[index].title;
            artistEl.innerText = playlistData[index].artist;
        }

        function loadSong(index) {
            if (!playlistData[index]) return;
            currentIndex = index;
            player.loadVideoById(playlistData[index].videoId);
            updateMeta(index);
            renderPlaylist();
            const activeItem = document.querySelector('.playlist-item.active');
            if(activeItem) {
                activeItem.parentElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function nextSong() {
            loadSong((currentIndex + 1) % playlistData.length);
        }

        function shuffleAndPlay() {
            if (playlistData.length <= 1) return;
            for (let i = playlistData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [playlistData[i], playlistData[j]] = [playlistData[j], playlistData[i]];
            }
            currentIndex = 0;
            loadSong(0);
        }
    </script>
</body>
</html>
