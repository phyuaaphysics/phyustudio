<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600&display=swap');

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
            color: white;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .player-header {
            padding: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        /* 錯誤覆蓋層 */
        #error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .controls-overlay {
            padding: 15px 20px;
            background: rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-info {
            flex-grow: 1;
            margin-right: 15px;
            overflow: hidden;
        }

        .song-title {
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            transition: background 0.2s;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .playlist-item.active {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-item.active .item-name {
            color: #ff375f;
        }

        .item-index {
            width: 25px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        .item-content {
            flex-grow: 1;
            margin: 0 10px;
            overflow: hidden;
        }

        .item-name {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-artist {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .delete-btn {
            color: rgba(255, 255, 255, 0.3);
            padding: 5px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #ff453a;
        }

        .action-bar {
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-shuffle {
            background: #ff375f;
        }

        .playlist::-webkit-scrollbar {
            display: none;
        }

        .status-msg {
            position: fixed;
            bottom: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: black;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="player-header">正在播放</div>
        
        <div class="video-container">
            <div id="player"></div>
            <!-- 播放錯誤時的提示 -->
            <div id="error-overlay">
                <div class="text-white text-sm mb-3">此影片受嵌入限制或載入失敗</div>
                <button class="bg-[#ff375f] px-4 py-2 rounded-full text-sm font-bold" onclick="retryCurrent()">手動重試</button>
                <button class="mt-2 text-white/50 text-xs" onclick="playNext()">跳過此曲</button>
            </div>
        </div>

        <div class="controls-overlay">
            <div class="song-info">
                <div id="current-title" class="song-title">選擇歌曲播放</div>
                <div id="current-artist" class="song-artist">等待列表中...</div>
            </div>
            <div id="playing-icon" style="display: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#ff375f"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-shuffle" onclick="shufflePlaylist()">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                隨機順序
            </button>
            <button class="btn" onclick="resetPlaylist()">
                重置列表
            </button>
        </div>

        <div id="playlist" class="playlist">
            <div class="text-center p-10 text-white/30">讀取中...</div>
        </div>
    </div>

    <div id="status-msg" class="status-msg"></div>

    <script>
        const SHEET_ID = '1iNsI-_rzcFneBjTN9D7pIf-aTQKXqoyoaHSXM5QMXME';
        const GID = '0';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

        let originalSongs = [];
        let currentPlaylist = [];
        let player;
        let currentIndex = -1;
        let isPlayerReady = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: '',
                playerVars: {
                    'autoplay': 1,
                    'playsinline': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'origin': window.location.origin // 嘗試修正 Referrer 議題
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            fetchSongs();
        }

        function onPlayerStateChange(event) {
            const overlay = document.getElementById('error-overlay');
            if (event.data === YT.PlayerState.PLAYING) {
                overlay.style.display = 'none';
                document.getElementById('playing-icon').style.display = 'block';
            } else if (event.data === YT.PlayerState.ENDED) {
                playNext();
            } else {
                document.getElementById('playing-icon').style.display = 'none';
            }
        }

        function onPlayerError(e) {
            console.error("Player Error Code:", e.data);
            const overlay = document.getElementById('error-overlay');
            
            // 針對錯誤碼 153 (限制嵌入) 顯示覆蓋層
            if (e.data === 153 || e.data === 101) {
                overlay.style.display = 'flex';
                showStatus("此歌曲無法在嵌入播放器中直接播放");
            } else {
                showStatus("播放出錯，2秒後跳過...");
                setTimeout(playNext, 2000);
            }
        }

        function retryCurrent() {
            if (currentIndex >= 0) playSong(currentIndex);
        }

        async function fetchSongs() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').filter(r => r.trim() !== '').slice(1);
                
                originalSongs = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (cols.length < 4) return null;
                    
                    return {
                        id: cols[0].trim(),
                        url: cols[1].trim(),
                        name: cols[2].trim().replace(/^"|"$/g, ''),
                        artist: cols[3].trim().replace(/^"|"$/g, ''),
                        youtubeId: extractVideoID(cols[1].trim())
                    };
                }).filter(song => song && song.youtubeId);

                currentPlaylist = [...originalSongs];
                renderPlaylist();
                showStatus("列表導入成功");
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('playlist').innerHTML = `<div class="text-center p-10 text-red-400">無法讀取資料</div>`;
            }
        }

        function extractVideoID(url) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[7].length === 11) ? match[7] : null;
        }

        function renderPlaylist() {
            const container = document.getElementById('playlist');
            container.innerHTML = '';

            currentPlaylist.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                div.onclick = () => playSong(index);

                div.innerHTML = `
                    <div class="item-index">${index + 1}</div>
                    <div class="item-content">
                        <div class="item-name">${song.name}</div>
                        <div class="item-artist">${song.artist}</div>
                    </div>
                    <div class="delete-btn" onclick="deleteSong(event, ${index})">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function playSong(index) {
            if (index < 0 || index >= currentPlaylist.length) return;
            
            currentIndex = index;
            const song = currentPlaylist[index];
            
            document.getElementById('current-title').innerText = song.name;
            document.getElementById('current-artist').innerText = song.artist;
            document.getElementById('error-overlay').style.display = 'none';
            
            player.loadVideoById(song.youtubeId);
            renderPlaylist();

            const activeItem = document.querySelector('.playlist-item.active');
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function playNext() {
            if (currentPlaylist.length === 0) return;
            let nextIndex = (currentIndex + 1) % currentPlaylist.length;
            playSong(nextIndex);
        }

        function deleteSong(event, index) {
            event.stopPropagation();
            if (index === currentIndex) {
                showStatus("不能刪除正在播放的歌曲");
                return;
            }
            currentPlaylist.splice(index, 1);
            if (index < currentIndex) currentIndex--;
            renderPlaylist();
        }

        function shufflePlaylist() {
            if (currentPlaylist.length < 2) return;
            for (let i = currentPlaylist.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentPlaylist[i], currentPlaylist[j]] = [currentPlaylist[j], currentPlaylist[i]];
            }
            currentIndex = 0;
            renderPlaylist();
            playSong(0);
        }

        function resetPlaylist() {
            currentPlaylist = [...originalSongs];
            currentIndex = -1;
            renderPlaylist();
            showStatus("已恢復原始清單");
        }

        function showStatus(msg) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
