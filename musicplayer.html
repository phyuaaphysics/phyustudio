<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hybrid Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body {
            background-color: #ffffff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            body { flex-direction: row; }
        }

        aside {
            background: #ffffff;
            border-right: 1px solid #e5e5ea;
            display: flex;
            flex-direction: column;
            order: 2;
            transition: all 1.2s cubic-bezier(0.25, 1, 0.25, 1);
            z-index: 40;
            position: relative;
        }
        @media (min-width: 768px) {
            aside { width: 320px; order: 1; }
        }
        @media (min-width: 1024px) {
            aside { width: 384px; }
        }

        main {
            flex: 1;
            background: #000;
            display: flex;
            flex-direction: column;
            order: 1;
            z-index: 30;
            transition: all 1.2s cubic-bezier(0.25, 1, 0.25, 1);
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        @media (min-width: 768px) {
            main { order: 2; }
        }

        /* 擴展模式：隱藏右側播放器 */
        .mode-expanded main {
            width: 0;
            flex: 0;
            opacity: 0;
            transform: scale(0.92);
            pointer-events: none;
        }
        .mode-expanded aside {
            flex: 1;
            width: 100% !important;
        }

        /* 播放器容器區域 */
        .player-region {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            transition: all 1.2s cubic-bezier(0.25, 1, 0.25, 1);
        }

        #youtube-player {
            width: 100%;
            height: 100%;
        }

        .playlist-item-container {
            position: relative;
            border-bottom: 1px solid #f2f2f7;
        }

        .playlist-item {
            position: relative;
            background: white;
            transition: background 0.2s ease;
            cursor: pointer;
            min-height: 48px;
            display: flex;
            align-items: center;
            padding: 14px;
            z-index: 10;
        }
        
        .playlist-item.active {
            background: #f2f2f7;
        }
        .playlist-item.active .song-title {
            color: #007aff;
            font-weight: 700;
        }

        .delete-btn {
            opacity: 0.3;
            transition: all 0.2s ease;
            padding: 10px;
            position: relative;
            z-index: 20;
        }
        .delete-btn:hover {
            opacity: 1;
            color: #ff3b30;
        }
        .delete-btn:active {
            transform: scale(1.1);
        }

        #playlist {
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch; 
            flex: 1;
        }

        #playlist::-webkit-scrollbar { width: 0px; }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }

        #expand-btn, #done-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 100%;
            transition: all 0.4s ease;
        }

        #done-btn { display: none; }
        .mode-expanded #done-btn { display: flex; }
        .mode-expanded #expand-btn { display: none; }
    </style>
</head>
<body id="app-body">

    <div id="loading-overlay">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-blue-500"></div>
        <p id="loading-text" class="text-gray-400 text-sm">載入中...</p>
    </div>

    <main id="main-container">
        <div class="player-region">
            <div class="video-wrapper">
                <div id="youtube-player"></div>
            </div>
        </div>
    </main>

    <aside class="flex-1 overflow-hidden">
        <div class="p-4 md:p-6 pb-3">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-black tracking-tighter">媒體庫</h2>
                <div class="flex gap-2">
                    <button id="expand-btn" onclick="toggleExpand(true)" class="bg-gray-50 text-gray-400 border border-gray-100 active:scale-90">
                        <i class="fa-solid fa-expand text-xs"></i>
                    </button>
                    <button id="done-btn" onclick="toggleExpand(false)" class="bg-blue-50 text-blue-600 px-4 rounded-full border border-blue-100 active:scale-90 text-[10px] font-bold">
                        <i class="fa-solid fa-check mr-1"></i>完成
                    </button>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="shuffleAndPlay()" class="flex-1 bg-black text-white py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 text-xs font-bold active:scale-95">
                    <i class="fa-solid fa-shuffle text-[10px]"></i> 隨機播放
                </button>
                <button onclick="fetchSheetData()" class="w-10 bg-gray-100 text-gray-700 rounded-xl flex items-center justify-center active:scale-95">
                    <i class="fa-solid fa-rotate text-[10px]"></i>
                </button>
            </div>
        </div>
        
        <div id="playlist" class="flex-1 overflow-y-auto px-0 md:px-4 pb-20">
            </div>
    </aside>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const SHEET_ID = '1iNsI-_rzcFneBjTN9D7pIf-aTQKXqoyoaHSXM5QMXME';
        const SHEET_NAME = 'music';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&t=${Date.now()}`;

        let playlistData = [];
        let player;
        let currentIndex = 0;
        let sortable;

        const playlistEl = document.getElementById('playlist');
        const bodyEl = document.getElementById('app-body');

        function toggleExpand(expand) {
            if (expand) {
                bodyEl.classList.add('mode-expanded');
            } else {
                bodyEl.classList.remove('mode-expanded');
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
            return lines.map(line => {
                const result = [];
                let cell = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) {
                        result.push(cell.trim());
                        cell = '';
                    } else cell += char;
                }
                result.push(cell.trim());
                return result;
            });
        }

        async function fetchSheetData() {
            const loader = document.getElementById('loading-overlay');
            loader.style.display = 'flex';
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                const rows = parseCSV(text);
                playlistData = rows.slice(1)
                    .filter(row => row.length >= 2 && row[1])
                    .map((row) => {
                        const videoId = extractVideoId(row[1]);
                        return videoId ? {
                            id: Math.random().toString(36).substr(2, 9),
                            videoId: videoId,
                            title: row[2] || '無標題',
                            artist: row[3] || '未知'
                        } : null;
                    })
                    .filter(item => item !== null);

                renderPlaylist();
                initSortable();
                if (player && typeof player.loadVideoById === 'function' && playlistData.length > 0) loadSong(0);
                loader.style.display = 'none';
            } catch (error) {
                document.getElementById('loading-text').innerText = "載入失敗";
            }
        }

        function initSortable() {
            if (sortable) sortable.destroy();
            sortable = new Sortable(playlistEl, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                handle: '.playlist-item', 
                onEnd: function (evt) {
                    const item = playlistData.splice(evt.oldIndex, 1)[0];
                    playlistData.splice(evt.newIndex, 0, item);
                    if (evt.oldIndex === currentIndex) currentIndex = evt.newIndex;
                    else if (evt.oldIndex < currentIndex && evt.newIndex >= currentIndex) currentIndex--;
                    else if (evt.oldIndex > currentIndex && evt.newIndex <= currentIndex) currentIndex++;
                    renderPlaylist();
                }
            });
        }

        function extractVideoId(url) {
            const cleanUrl = url.replace(/"/g, '');
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = cleanUrl.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%', videoId: '',
                playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
                events: {
                    'onReady': () => { fetchSheetData(); },
                    'onStateChange': (e) => { if (e.data === YT.PlayerState.ENDED) nextSong(); },
                    'onError': () => { nextSong(); }
                }
            });
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            playlistData.forEach((song, index) => {
                const container = document.createElement('div');
                container.className = 'playlist-item-container';
                
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                item.onclick = () => loadSong(index);
                
                item.innerHTML = `
                    <div class="flex-1 flex flex-row items-center justify-between min-w-0 mr-1">
                        <div class="font-bold truncate text-xs song-title pr-4">${song.title}</div>
                        <div class="text-[9px] text-gray-400 truncate font-bold uppercase tracking-wider flex-shrink-0">${song.artist}</div>
                    </div>
                `;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn flex-shrink-0';
                delBtn.innerHTML = '<i class="fa-solid fa-xmark text-base"></i>';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeSong(index);
                };

                item.appendChild(delBtn);
                container.appendChild(item);
                playlistEl.appendChild(container);
            });
        }

        function removeSong(index) {
            if (playlistData.length <= 1) return;
            const wasCurrent = (index === currentIndex);
            playlistData.splice(index, 1);
            if (wasCurrent) {
                if (currentIndex >= playlistData.length) currentIndex = 0;
                loadSong(currentIndex);
            } else if (index < currentIndex) {
                currentIndex--;
            }
            renderPlaylist();
        }

        function loadSong(index) {
            if (!playlistData[index]) return;
            currentIndex = index;
            player.loadVideoById(playlistData[index].videoId);
            renderPlaylist();
            const activeItem = document.querySelector('.playlist-item.active');
            if(activeItem) {
                activeItem.parentElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function nextSong() {
            loadSong((currentIndex + 1) % playlistData.length);
        }

        function shuffleAndPlay() {
            if (playlistData.length <= 1) return;
            for (let i = playlistData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [playlistData[i], playlistData[j]] = [playlistData[j], playlistData[i]];
            }
            currentIndex = 0;
            loadSong(0);
        }
    </script>
</body>
</html>
