<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hybrid Music Player - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body {
            background-color: #ffffff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            body { flex-direction: row; }
        }

        aside {
            background: #ffffff;
            border-right: 1px solid #e5e5ea;
            display: flex;
            flex-direction: column;
            order: 2;
            transition: all 0.8s cubic-bezier(0.2, 0, 0.2, 1);
            z-index: 40;
            position: relative;
        }
        @media (min-width: 768px) {
            aside { width: 320px; order: 1; }
        }
        @media (min-width: 1024px) {
            aside { width: 384px; }
        }

        main {
            flex: 1;
            background: #000;
            display: flex;
            flex-direction: column;
            order: 1;
            z-index: 30;
            transition: all 0.8s cubic-bezier(0.2, 0, 0.2, 1);
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        @media (min-width: 768px) {
            main { order: 2; }
        }

        /* 擴展模式：隱藏播放器，列表填滿 */
        .mode-expanded main {
            width: 0;
            flex: 0;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
        .mode-expanded aside {
            flex: 1;
            width: 100% !important;
        }

        .player-region {
            width: 100%;
            max-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #youtube-player {
            width: 100%;
            height: 100%;
        }

        .playlist-item-container {
            position: relative;
            border-bottom: 1px solid #f2f2f7;
        }

        .playlist-item {
            position: relative;
            background: white;
            transition: background 0.2s ease;
            cursor: pointer;
            min-height: 56px;
            display: flex;
            align-items: center;
            padding: 12px 16px;
            z-index: 10;
        }
        
        .playlist-item.active {
            background: #f2f2f7;
        }
        .playlist-item.active .song-title {
            color: #007aff;
            font-weight: 700;
        }

        .delete-btn {
            opacity: 0.3;
            transition: all 0.2s ease;
            padding: 8px;
            margin-left: 8px;
            z-index: 20;
        }
        .delete-btn:hover {
            opacity: 1;
            color: #ff3b30;
        }

        #playlist {
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch; 
            flex: 1;
        }
        #playlist::-webkit-scrollbar { width: 4px; }
        #playlist::-webkit-scrollbar-thumb { background: #e5e5ea; border-radius: 10px; }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }

        .mode-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        #done-btn { display: none; }
        .mode-expanded #done-btn { display: flex; width: auto; padding: 0 16px; }
        .mode-expanded #expand-btn { display: none; }

        .sortable-ghost {
            opacity: 0.4;
            background: #c7c7cc !important;
        }
    </style>
</head>
<body id="app-body">

    <div id="loading-overlay">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-blue-500"></div>
        <p id="loading-text" class="text-gray-500 font-medium text-sm">正在同步媒體庫...</p>
    </div>

    <main id="main-container">
        <div class="player-region">
            <div class="video-wrapper">
                <div id="youtube-player"></div>
            </div>
        </div>
    </main>

    <aside id="aside-container">
        <div class="p-5 pb-4">
            <div class="flex items-center justify-between mb-5">
                <div class="flex items-baseline gap-2">
                    <h2 class="text-2xl font-black tracking-tight">媒體庫</h2>
                    <span id="song-count" class="text-gray-400 text-xs font-bold">0</span>
                </div>
                <div class="flex gap-2">
                    <button id="expand-btn" onclick="toggleExpand(true)" class="mode-btn bg-gray-100 text-gray-500 hover:bg-gray-200 active:scale-90">
                        <i class="fa-solid fa-expand text-xs"></i>
                    </button>
                    <button id="done-btn" onclick="toggleExpand(false)" class="mode-btn bg-blue-600 text-white active:scale-95 text-xs font-bold rounded-xl shadow-lg shadow-blue-200">
                        <i class="fa-solid fa-check mr-2"></i>完成編輯
                    </button>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="shuffleAndPlay()" class="flex-1 bg-black text-white py-3 rounded-2xl transition-all flex items-center justify-center gap-2 text-xs font-bold active:scale-95 shadow-xl shadow-gray-200">
                    <i class="fa-solid fa-shuffle"></i> 隨機播放
                </button>
                <button onclick="fetchSheetData()" class="w-12 bg-gray-50 text-gray-700 rounded-2xl flex items-center justify-center active:scale-95 border border-gray-100 hover:bg-white">
                    <i class="fa-solid fa-arrows-rotate text-xs"></i>
                </button>
            </div>
        </div>
        
        <div id="playlist" class="flex-1 overflow-y-auto px-1 md:px-3 pb-20">
            <!-- 動態生成歌曲列表 -->
        </div>
    </aside>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // 更新後的試算表設定 (對應新網址與 music 分頁)
        const SHEET_ID = '1iNsI-_rzcFneBjTN9D7pIf-aTQKXqoyoaHSXM5QMXME';
        const SHEET_NAME = 'music';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&t=${Date.now()}`;

        let playlistData = [];
        let player;
        let currentIndex = 0;
        let sortable;

        const playlistEl = document.getElementById('playlist');
        const bodyEl = document.getElementById('app-body');
        const songCountEl = document.getElementById('song-count');

        function toggleExpand(expand) {
            if (expand) {
                bodyEl.classList.add('mode-expanded');
            } else {
                bodyEl.classList.remove('mode-expanded');
            }
        }

        // 增強型 CSV 解析（處理包含逗號或引號的標題）
        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
            return lines.map(line => {
                const result = [];
                let cell = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (inQuotes && line[i+1] === '"') { // 處理轉義雙引號 ""
                            cell += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        result.push(cell.trim());
                        cell = '';
                    } else {
                        cell += char;
                    }
                }
                result.push(cell.trim());
                return result;
            });
        }

        async function fetchSheetData() {
            const loader = document.getElementById('loading-overlay');
            loader.style.display = 'flex';
            
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error('網絡請求失敗');
                
                const text = await response.text();
                const rows = parseCSV(text);
                
                // 假設結構：A:編號, B:連結, C:歌名, D:歌手
                playlistData = rows.slice(1)
                    .filter(row => row[1]) // 確保連結欄位不為空
                    .map((row) => {
                        const videoId = extractVideoId(row[1]);
                        return videoId ? {
                            id: 'song-' + Math.random().toString(36).substr(2, 9),
                            videoId: videoId,
                            title: (row[2] || '未命名曲目').replace(/^"|"$/g, ''),
                            artist: (row[3] || '未知').replace(/^"|"$/g, '')
                        } : null;
                    })
                    .filter(item => item !== null);

                if (playlistData.length === 0) {
                    document.getElementById('loading-text').innerText = "試算表中無有效音樂資料";
                    return;
                }

                songCountEl.innerText = playlistData.length;
                renderPlaylist();
                initSortable();
                
                // 初次載入或同步後自動載入第一首歌
                if (player && typeof player.loadVideoById === 'function') {
                    loadSong(0, false); // false 代表不自動播放，除非是手動點擊
                }
                
                setTimeout(() => { loader.style.display = 'none'; }, 500);
            } catch (error) {
                console.error(error);
                document.getElementById('loading-text').innerHTML = `<span class="text-red-500">同步失敗</span><br><button onclick="location.reload()" class="mt-2 text-xs underline">重試</button>`;
            }
        }

        function initSortable() {
            if (sortable) sortable.destroy();
            sortable = new Sortable(playlistEl, {
                animation: 250,
                ghostClass: 'sortable-ghost',
                handle: '.playlist-item',
                onEnd: function (evt) {
                    const item = playlistData.splice(evt.oldIndex, 1)[0];
                    playlistData.splice(evt.newIndex, 0, item);
                    
                    // 更新當前索引位置
                    if (evt.oldIndex === currentIndex) {
                        currentIndex = evt.newIndex;
                    } else if (evt.oldIndex < currentIndex && evt.newIndex >= currentIndex) {
                        currentIndex--;
                    } else if (evt.oldIndex > currentIndex && evt.newIndex <= currentIndex) {
                        currentIndex++;
                    }
                    renderPlaylist();
                }
            });
        }

        function extractVideoId(url) {
            if (!url) return null;
            const cleanUrl = url.replace(/"/g, '').trim();
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = cleanUrl.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: '',
                playerVars: { 
                    'autoplay': 0, 
                    'controls': 1, 
                    'rel': 0, 
                    'modestbranding': 1, 
                    'playsinline': 1,
                    'iv_load_policy': 3
                },
                events: {
                    'onReady': () => { fetchSheetData(); },
                    'onStateChange': (e) => { 
                        if (e.data === YT.PlayerState.ENDED) nextSong(); 
                    },
                    'onError': (e) => { 
                        console.error('播放錯誤', e);
                        nextSong(); 
                    }
                }
            });
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            playlistData.forEach((song, index) => {
                const container = document.createElement('div');
                container.className = 'playlist-item-container';
                
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                item.onclick = () => loadSong(index, true);
                
                item.innerHTML = `
                    <div class="flex-1 flex flex-col min-w-0 mr-2">
                        <div class="text-sm font-bold truncate song-title mb-0.5">${song.title}</div>
                        <div class="text-[10px] text-gray-400 truncate font-semibold uppercase tracking-wider">${song.artist}</div>
                    </div>
                `;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '<i class="fa-solid fa-xmark text-sm"></i>';
                delBtn.title = "從本次清單移除";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeSong(index);
                };

                item.appendChild(delBtn);
                container.appendChild(item);
                playlistEl.appendChild(container);
            });
        }

        function removeSong(index) {
            if (playlistData.length <= 1) return;
            const wasCurrent = (index === currentIndex);
            playlistData.splice(index, 1);
            
            if (wasCurrent) {
                if (currentIndex >= playlistData.length) currentIndex = 0;
                loadSong(currentIndex, true);
            } else if (index < currentIndex) {
                currentIndex--;
            }
            songCountEl.innerText = playlistData.length;
            renderPlaylist();
        }

        function loadSong(index, autoPlay = true) {
            if (!playlistData[index]) return;
            currentIndex = index;
            
            if (autoPlay) {
                player.loadVideoById(playlistData[index].videoId);
            } else {
                player.cueVideoById(playlistData[index].videoId);
            }
            
            renderPlaylist();
            
            // 自動捲動到當前曲目
            const activeItem = playlistEl.children[index];
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function nextSong() {
            loadSong((currentIndex + 1) % playlistData.length, true);
        }

        function shuffleAndPlay() {
            if (playlistData.length <= 1) return;
            
            // Fisher-Yates Shuffle
            for (let i = playlistData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [playlistData[i], playlistData[j]] = [playlistData[j], playlistData[i]];
            }
            
            currentIndex = 0;
            loadSong(0, true);
        }
    </script>
</body>
</html>
